[package]
name = "snapdown-slint"
version = "0.1.0"
edition = "2021"
authors = ["Snapdown Contributors"]
license = "MIT"
repository = "https://github.com/wiradigitalid/snapdown"

[[bin]]
name = "SnapdownSlint"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.9"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dependencies]
slint = { version = "1.9", features = ["unstable-fontique-010"] }
snapdown-core = { path = "../../crates/snapdown-core" }
snapdown-store = { path = "../../crates/snapdown-store" }
snapdown-capture = { path = "../../crates/snapdown-capture" }
image = { workspace = true, features = ["png"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading"] }
winreg = { workspace = true }
