[package]
name = "snapdown"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Snapdown"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
snapdown-core = { path = "../../../crates/snapdown-core" }
snapdown-store = { path = "../../../crates/snapdown-store" }
snapdown-capture = { path = "../../../crates/snapdown-capture" }
tauri = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-autostart = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tiny_http = { workspace = true }
ureq = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
ureq = "2.9"
rusqlite = { workspace = true }
