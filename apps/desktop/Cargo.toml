[package]
name = "snapdown-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Snapdown Contributors"]
license = "MIT"
repository = "https://github.com/wiradigitalid/snapdown"

[[bin]]
name = "Snapdown"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.9"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dependencies]
slint = "1.9"
snapdown-core = { path = "../../crates/snapdown-core" }
snapdown-store = { path = "../../crates/snapdown-store" }
snapdown-capture = { path = "../../crates/snapdown-capture" }
image = { workspace = true, features = ["png"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = "0.15"
tray-icon = "0.24.2"
global-hotkey = "0.8.0"

[target.'cfg(windows)'.dependencies]
i-slint-backend-winit = "1.17.1"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Security"] }
clipboard-win = { workspace = true }
winreg = { workspace = true }
