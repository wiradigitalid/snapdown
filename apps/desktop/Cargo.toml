[package]
name = "snapdown-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Snapdown Contributors"]
license = "MIT"
repository = "https://github.com/wiradigitalid/snapdown"

[[bin]]
name = "Snapdown"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.9"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dependencies]
slint = "1.9"
snapdown-core = { path = "../../crates/snapdown-core" }
snapdown-store = { path = "../../crates/snapdown-store" }
snapdown-capture = { path = "../../crates/snapdown-capture" }
image = { workspace = true, features = ["png"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = "0.15"
tray-icon = "0.24.2"
global-hotkey = "0.8.0"

[dev-dependencies]
tempfile = { workspace = true }
# For one test only: a `SqliteBundleStore` built on an UNMIGRATED connection, so `list_bundles`
# fails for real (an actual "no such table" error, not a faked `CoreError`) - the second of the two
# "cannot be read" triggers `AppContext.bundle_store` names on itself (`None`, and a read failing on
# an otherwise-open store). Already a workspace dependency; this only wires it into this crate's
# dev-deps.
rusqlite = { workspace = true }

[target.'cfg(windows)'.dependencies]
i-slint-backend-winit = "1.17.1"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_Com", "Win32_Security"] }
clipboard-win = { workspace = true }
winreg = { workspace = true }
