<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; }
    a { color: #4c8dff; } a:hover { color: #6ba0ff; }
  </style>
</helmet>

<div style="width: 1280px; height: 360px; background: #1c1c1f; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 52px; background: #232326; border-bottom: 1px solid #2a2a2e; display: flex; align-items: center; padding-left: 16px; padding-right: 12px; gap: 10px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#4c8dff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.5h11"/><path d="M4 5.5l.8 7.2a1 1 0 001 .8h4.4a1 1 0 001-.8l.8-7.2"/><path d="M6.2 5.5V3.2a.7.7 0 01.7-.7h2.2a.7.7 0 01.7.7v2.3"/></svg>
      <div style="font-size: 13px; font-weight: 800; color: #f2f2f3;">Reclaim space</div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6b6c70;">0 MB reclaimable</div>
    <div style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 3px;">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#9a9ba0" stroke-width="1.5" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 16px; display: flex; min-height: 0;">
    <div style="flex-grow: 1; background: #232326; border: 1px solid #3a3a3f; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box;">
      <svg width="34" height="34" viewBox="0 0 16 16" fill="none" stroke="#3a3a3f" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.5h11"/><path d="M4 5.5l.8 7.2a1 1 0 001 .8h4.4a1 1 0 001-.8l.8-7.2"/><path d="M6.2 5.5V3.2a.7.7 0 01.7-.7h2.2a.7.7 0 01.7.7v2.3"/></svg>
      <div style="font-size: 13px; color: #f2f2f3; text-align: center;">Nothing to reclaim</div>
      <div style="font-size: 10px; line-height: 1.6; color: #9a9ba0; text-align: center; max-width: 320px; text-wrap: pretty;">No Bundle is holding original captures. Every Bundle here either had its originals discarded already, or has none left to discard.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
