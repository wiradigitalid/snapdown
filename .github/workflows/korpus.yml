name: Korpus Validation

on:
  push:
    branches: [main, master, "kodesh87/*"]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate Corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refuse forbidden content
        shell: bash
        run: |
          set -e
          # The product brief has forbidden this since G1: "This repository is public. Forbids
          # committing a captured screenshot, a token, a client's name, or any test fixture derived
          # from real capture output." NOTHING ENFORCED IT until 2026-08-23, when a UX audit staged
          # five screenshots of the operator's machine and, later, four accessibility-tree dumps
          # embedding their home-directory paths. Both were caught by reading `git status` and
          # `git diff` by hand. That is not a control; this is.
          fail=0

          echo "--- captured images anywhere in the tree ---"
          if git ls-files -- '*.png' '*.jpg' '*.jpeg' '*.webp'                | grep -vE '^apps/desktop/src-tauri/icons/' | grep -q .; then
            echo "::error::A captured image is tracked outside the app icon set."
            git ls-files -- '*.png' '*.jpg' '*.jpeg' '*.webp'               | grep -vE '^apps/desktop/src-tauri/icons/'
            fail=1
          fi

          echo "--- raw accessibility-tree dumps ---"
          if git ls-files -- '.work/**/tree-*.txt' | grep -q .; then
            echo "::error::A raw accessibility-tree dump is tracked. These embed absolute paths."
            git ls-files -- '.work/**/tree-*.txt'
            fail=1
          fi

          echo "--- operator home-directory paths in tracked text ---"
          # <user> is the placeholder a document uses when it must show the SHAPE of a path, and
          # test / user / example / runner / actions are obviously synthetic names that appear in
          # fixtures. Everything else is treated as a real operator's home directory.
          if git grep -nIE 'C:\+Users\+[A-Za-z0-9_]+|/(home|Users)/[a-z][a-z0-9_-]+' --                ':!.github/workflows/korpus.yml' ':!*.lock' ':!*package-lock.json'              | grep -vE '<user>|[Uu]sers[\/]+(test|user|example|runner|actions)[\/]' | grep -q .; then
            echo "::error::A tracked file contains an operator home-directory path."
            git grep -nIE 'C:\+Users\+[A-Za-z0-9_]+|/(home|Users)/[a-z][a-z0-9_-]+' --                ':!.github/workflows/korpus.yml' ':!*.lock' ':!*package-lock.json'               | grep -vE '<user>|[Uu]sers[\/]+(test|user|example|runner|actions)[\/]' | head -20
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Fix the CONTENT. Do not weaken this guard - a failure here is a finding about what"
            echo "is being committed to a public repository, not about the check."
            exit 1
          fi
          echo "No forbidden content tracked."

      - name: Install uv
        # No cache: there is no uv.lock in this repository and there will not be. validate.py is a
        # PEP-723 script with inline dependencies, not a uv project, and `enable-cache: true` fails
        # outright when its dependency glob matches nothing.
        uses: astral-sh/setup-uv@v3

      - name: Run validate.py check against baseline
        shell: bash
        run: |
          set -e
          # Run validate.py and capture findings (lines starting with 2 spaces and V<number>)
          uv run .constitution/method/scripts/validate.py --check > validate_output.txt 2>&1 || true
          # Findings only. Everything after the "Skipped:" heading is a SKIP, not a finding, and a
          # skip appearing or disappearing is not a regression. A skip that becomes a real finding
          # shows up above that line, so it is still caught.
          sed '/^Skipped:/,$d' validate_output.txt | grep -E '^  V[0-9]+' | sort > current_findings.txt || true
          sort .github/validate-baseline.txt > baseline_findings.txt

          echo "=== Current Findings ==="
          cat current_findings.txt
          echo "========================"

          if ! cmp -s current_findings.txt baseline_findings.txt; then
            echo "::error::Validator findings differ from .github/validate-baseline.txt!"
            echo "--- Unexpected findings (new violations) ---"
            comm -23 current_findings.txt baseline_findings.txt || true
            echo "--- Stale baseline entries (fixed findings that must be removed from baseline) ---"
            comm -13 current_findings.txt baseline_findings.txt || true
            exit 1
          fi
          echo "Validator findings match baseline exactly."

