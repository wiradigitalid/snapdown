name: Desktop CI

on:
  push:
    branches: [main, master, "kodesh87/*"]
  pull_request:
    branches: [main, master]

jobs:
  rust-check:
    name: Rust Workspace Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Rust formatting check
        run: cargo fmt --all -- --check

      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Cargo tests
        run: cargo test --workspace

  web-check:
    name: Desktop Frontend Check
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm --prefix web/ui ci
          npm --prefix apps/desktop ci

      - name: Shared UI typecheck
        run: npm --prefix web/ui run typecheck

      - name: Shared UI lint
        run: npm --prefix web/ui run lint

      - name: Shared UI unit tests
        run: npm --prefix web/ui run test

      - name: Desktop Frontend typecheck
        run: npm --prefix apps/desktop run typecheck

      - name: Desktop Frontend lint
        run: npm --prefix apps/desktop run lint

      - name: Desktop Frontend unit tests
        run: npm --prefix apps/desktop run test

      - name: Desktop Frontend build
        run: npm --prefix apps/desktop run build

      - name: Build desktop application
        run: npm --prefix apps/desktop run tauri build -- --no-bundle

      - name: Verify desktop executable
        shell: pwsh
        run: |
          if (-not (Test-Path "target/release/Snapdown.exe")) {
            Write-Error "Snapdown.exe not found at target/release/Snapdown.exe"
            exit 1
          }
          $exeCount = (Get-ChildItem -Path "target/release/*.exe").Count
          if ($exeCount -ne 1) {
            Write-Error "Expected exactly 1 desktop executable in target/release, found $exeCount"
            exit 1
          }

  web-service:
    name: Web Service Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Added 2026-08-23. apps/web-service is a `built: true` container with a test file, and NO
      # workflow touched Go at all - it was never built, vetted, or tested by CI. BUG-3 (published
      # Markdown interpolated into HTML without escaping) shipped into a container with no CI behind
      # it, and DEC-005 freezes `sharing`, which makes regression protection MORE important rather
      # than less: a frozen component is one nobody is watching.
      #
      # Running existing tests is not new work on a frozen component. DEC-005 forbids a new FR, a new
      # use case, a UX pass, or a depth increase; it says in its own text that it does not forbid
      # fixing what already shipped.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/web-service/go.sum

      - name: Build
        working-directory: apps/web-service
        run: go build ./...

      - name: Vet
        working-directory: apps/web-service
        run: go vet ./...

      - name: Test
        working-directory: apps/web-service
        run: go test ./...
