[workspace]
resolver = "2"
members = [
    "crates/snapdown-core",
    "crates/snapdown-store",
    "crates/snapdown-bridge",
    "crates/snapdown-capture",
    "apps/desktop",
]

# apps/desktop was Tauri-based (crate "snapdown", bin "Snapdown") before the full migration to
# Slint; that code is archived at archive/desktop-tauri for reference and is deliberately no
# longer a workspace member, so it is not built or tested by CI.

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Snapdown Contributors"]
license = "MIT"
repository = "https://github.com/wiradigitalid/snapdown"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", default-features = false, features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
tempfile = "3.10"
tiny_http = "0.12"
ureq = "2.9"
base64 = "0.22"
winreg = "0.52"
xcap = "0.9.8"
image = { version = "0.25.10", default-features = false, features = ["png"] }
