<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snapdown Studio — State 3: Interactive Crop Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-surface: #ffffff;
      --color-border: #cbd5e1;
      --color-accent: #0284c7;
      --color-overlay-scrim: rgba(15, 23, 42, 0.75);
      --font-ui: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #0f172a;
      font-family: var(--font-ui);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .ribbon-bar {
      background: #ffffff;
      border-bottom: 1px solid #cbd5e1;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .canvas-viewport {
      flex: 1;
      background: #0b0f19;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-under-crop {
      width: 780px;
      height: 480px;
      background: white;
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .active-crop-box {
      position: absolute;
      top: 60px;
      left: 100px;
      width: 540px;
      height: 320px;
      border: 2px dashed #0284c7;
      box-shadow: 0 0 0 9999px var(--color-overlay-scrim);
    }
    .crop-handle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ffffff;
      border: 2px solid #0284c7;
      border-radius: 2px;
    }
    .handle-nw { top: -6px; left: -6px; cursor: nwse-resize; }
    .handle-ne { top: -6px; right: -6px; cursor: nesw-resize; }
    .handle-sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
    .handle-se { bottom: -6px; right: -6px; cursor: nwse-resize; }
    .handle-n  { top: -6px; left: calc(50% - 5px); cursor: ns-resize; }
    .handle-s  { bottom: -6px; left: calc(50% - 5px); cursor: ns-resize; }
    .handle-w  { top: calc(50% - 5px); left: -6px; cursor: ew-resize; }
    .handle-e  { top: calc(50% - 5px); right: -6px; cursor: ew-resize; }
    .crop-confirm-hud {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-xl);
    }
    .hud-btn {
      height: 30px;
      padding: 0 14px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="ribbon-bar">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 1.1rem;">✂️</span>
      <span style="font-weight: 800; font-size: 0.88rem; color: #0284c7;">Crop Mode Active — Drag handles to adjust bounding area</span>
    </div>
    <div style="font-family: var(--font-mono); font-size: 0.75rem; color: #64748b; font-weight: 600;">
      Area: 540 × 320 px (~380 tokens)
    </div>
  </div>

  <div class="canvas-viewport">
    <div class="image-under-crop">
      <!-- Diagram Content -->
      <div style="padding: 30px; display: flex; flex-direction: column; gap: 20px;">
        <div style="font-weight: 800; font-size: 1.1rem; color: #0f172a;">Application Flowchart View</div>
        <div style="display: flex; gap: 20px;">
          <div style="background: #e2e8f0; padding: 20px; border-radius: 6px; flex: 1; text-align: center; font-weight: 600;">Discovery Phase</div>
          <div style="background: #e2e8f0; padding: 20px; border-radius: 6px; flex: 1; text-align: center; font-weight: 600;">Planning Phase</div>
          <div style="background: #0284c7; color: white; padding: 20px; border-radius: 6px; flex: 1; text-align: center; font-weight: 700;">Design Phase</div>
        </div>
      </div>

      <!-- Active Crop Box with 8 Handles -->
      <div class="active-crop-box">
        <div class="crop-handle handle-nw"></div>
        <div class="crop-handle handle-ne"></div>
        <div class="crop-handle handle-sw"></div>
        <div class="crop-handle handle-se"></div>
        <div class="crop-handle handle-n"></div>
        <div class="crop-handle handle-s"></div>
        <div class="crop-handle handle-w"></div>
        <div class="crop-handle handle-e"></div>

        <!-- Floating Confirmation HUD -->
        <div class="crop-confirm-hud">
          <button class="hud-btn" style="background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white;">Cancel (Esc)</button>
          <button class="hud-btn" style="background: #0284c7; border: none; color: white;">✓ Apply Crop (Enter)</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
