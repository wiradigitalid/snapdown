# components.yaml — SSOT for Product Components, containers, and Logical Components
#
# Three different things, two of which share the word "component":
#   Product Component (PC) — a DOMAIN slice, a surface a user could name
#   Container              — a unit that runs or deploys on its own; owned by C4 L2
#   Logical Component (LC) — one nameable build unit
#
# `mode` — DOCUMENT DEPTH. Written ONLY on a component that genuinely needs to differ from global.
# `risk_accepted` — REVIEW INTENSITY, not depth. low · medium · high
# `owns` — the domain entities this component is AUTHORISED TO WRITE.
# `g4_passed` — only means something on a component at a mode above catalog.
#
# A component is born through wdi-init intent `component` at the tail of G2. This file is born empty.

product_components:
  - id: finding
    title: Finding
    why: One observation — a captured region, the Note about it, the Markers on it — held as one
      object from the hotkey press until it is deleted.
    caps: [CAP-1, CAP-2, CAP-3, CAP-5]
    owns: [Finding, Note, Marker]
    containers: [desktop-app]
    # Raised catalog-of-record depth on 2026-08-23: guarded -> deep. The code already runs, so what
    # G4 produces here is an AS-BUILT RECORD under sdd-guide.md's evidence labels, not a design.
    mode: deep
    risk_accepted: low
    risk_note: A Capture may contain personal data, and deleting a Finding is an irreversible action
      that removes a file from disk. Nothing here touches money and there is no contractual promise
      to an outside party.
    # Reset on 2026-08-23 when the depth moved under it, then re-passed at `deep` the same day:
    # behaviour and design both written, reviewed under structure + prose + edge-case-hunter, findings
    # resolved before stamping.
    g4_passed: true

  - id: bundle
    title: Bundle
    why: The act of turning several Findings into one document that can be handed over, and the
      lifetime of that document afterwards.
    caps: [CAP-4]
    owns: [Bundle, BundleItem]
    containers: [desktop-app]
    # Raised on 2026-08-23: inherited `outline` -> explicit `deep`. As-built record, code already runs.
    mode: deep
    risk_accepted: low
    risk_note: Deleting a Bundle is an irreversible action that removes files from disk, and a
      Bundle carries copies of images that may hold personal data. No money, no third party.
    # Reset on 2026-08-23 for the same reason as `finding`, then re-passed at `deep` the same day.
    # BUG-1 was found during this pass; a defect found is not a gate failed, and it is registered
    # in defects.yaml rather than blocking the gate.
    g4_passed: true

  - id: settings
    title: Settings
    why: The four choices that stop the tool becoming the thing being managed — where files go,
      which keys do what, whether it starts with Windows, and how much image quality is bought.
    caps: [CAP-6]
    owns: [Setting]
    containers: [desktop-app]
    # Raised on 2026-08-23: catalog -> deep. This is the largest change in the pass. At `catalog`
    # this component SKIPPED G4 entirely, which is why the four choices it holds have no flow, no
    # state, and no screen specification behind them — and why the owner's Settings complaints have
    # nowhere in the corpus to be answered. At `deep`, G4 now runs for it.
    mode: deep
    risk_accepted: medium
    risk_note: No money, no personal data, no irreversible action. The worst outcome is a hotkey
      that does not register, which is visible immediately.
    # Was false-and-meaningless while this sat at `catalog`, because catalog skips G4. At `deep` it
    # means something again, and G4 ran for this component for the FIRST time on 2026-08-23.
    g4_passed: true

  - id: agent-access
    title: Agent access
    why: Granting and withdrawing an agent's ability to read Bundles from this machine, which is
      the only reason a key exists at all.
    caps: [CAP-7]
    owns: [AccessKey]
    containers: [desktop-app, mcp-bridge]
    mode: guarded
    risk_accepted: low
    risk_note: The key gates access to images that may contain personal data, across a process
      boundary the product does not control. Revocation is the safety, so getting it wrong is an
      irreversible disclosure. No money, no third party.
    g4_passed: true

  - id: sharing
    title: Sharing
    why: Putting one named Bundle somewhere an agent on another host can read it, and taking it
      back again.
    caps: [CAP-8]
    owns: [Publication]
    containers: [desktop-app, web-api, web-ui]
    mode: guarded
    risk_accepted: low
    risk_note: Publishing puts images that may contain personal data on the public internet, and it
      is irreversible in the sense that matters — an unpublish cannot recall what was already
      fetched. No money moves and there is no contractual promise, but this is the component where a
      mistake cannot be undone.
    g4_passed: true

# An entity no Product Component's promise explains. Empty, and that is the correct state: every
# entity in this product is written by exactly one component's FR.
platform_owns: []

containers:
  - id: desktop-app
    title: Snapdown Desktop
    technology: Rust core, native Slint UI (i-slint-backend-winit on Windows). Was Tauri v2 with a
      React + Vite + TypeScript webview until DEC-007; the previous implementation is archived at
      archive/desktop-tauri
    built: true
    runs: The Reviewer's Windows 11 machine, as one signed-in user process with a tray icon
  - id: mcp-bridge
    title: Snapdown MCP Bridge
    technology: Rust command-line executable, stdio Model Context Protocol
    built: true
    runs: Launched by the agent's MCP client on the same machine as the desktop app
  - id: web-api
    title: Snapdown Web Service
    technology: Go — net/http with chi, embedded SQLite, a blob directory
    built: true
    runs: A single binary on a host the Reviewer controls
  - id: web-ui
    title: Published Bundle Reader
    technology: React + Vite single-page application, served as static assets by web-api
    built: true
    runs: The browser of whoever opens a Publication URL

