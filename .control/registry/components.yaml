# components.yaml — SSOT for Product Components, containers, and Logical Components
#
# Three different things, two of which share the word "component":
#   Product Component (PC) — a DOMAIN slice, a surface a user could name
#   Container              — a unit that runs or deploys on its own; owned by C4 L2
#   Logical Component (LC) — one nameable build unit
#
# `mode` — DOCUMENT DEPTH. Written ONLY on a component that genuinely needs to differ from global.
# `risk_accepted` — REVIEW INTENSITY, not depth. low · medium · high
# `owns` — the domain entities this component is AUTHORISED TO WRITE.
# `g4_passed` — only means something on a component at a mode above catalog.
#
# A component is born through wdi-init intent `component` at the tail of G2. This file is born empty.

product_components:
  - id: finding
    title: Finding
    why: One observation — a captured region, the Note about it, the Markers on it — held as one
      object from the hotkey press until it is deleted.
    caps: [CAP-1, CAP-2, CAP-3, CAP-5, CAP-10, CAP-11]
    # `VisualAnnotation` added 2026-08-28 with migration 8. `owns` is the write authorisation, so a
    # component storing an entity it does not list here is writing outside its own boundary - which
    # is what this field exists to make visible.
    owns: [Finding, Note, Marker, VisualAnnotation]
    containers: [desktop-app]
    # `mode` history, kept because it explains what is on disk. Raised 2026-08-23 guarded -> deep, on the
    # grounds that the code already runs so G4 produces an AS-BUILT RECORD rather than a design. Returned
    # to the global `guarded` on 2026-08-31 by the owner's instruction; the override is gone rather than
    # restated, because components.yaml's own header says `mode` is written ONLY where it must differ from
    # global. Nothing written at `deep` was deleted - it stops being required, which is all.
    # Then set back to an explicit `guarded` on 2026-08-31 when the global moved to `outline`, so this row
    # is an override again - the depth is unchanged, only what it is relative to.
    mode: guarded
    risk_accepted: low
    risk_note: A Capture may contain personal data, and deleting a Finding is an irreversible action
      that removes a file from disk. Nothing here touches money and there is no contractual promise
      to an outside party.
    # `risk_accepted` went low -> medium -> low on 2026-08-31, both moves on the owner's instruction.
    # Back at `low` this is the ONLY component whose code must face the two-reviewer panel. Document
    # lenses were never affected: `low` and `medium` both give structure + prose + edge-case-hunter.
    # Reset on 2026-08-23 when the depth moved under it, then re-passed at `deep` the same day:
    # behaviour and design both written, reviewed under structure + prose + edge-case-hunter, findings
    # resolved before stamping.
    g4_passed: true

  - id: bundle
    title: Bundle
    why: The act of turning several Findings into one document that can be handed over, and the
      lifetime of that document afterwards.
    caps: [CAP-4, CAP-12]
    owns: [Bundle, BundleItem]
    containers: [desktop-app]
    # `mode` history: raised 2026-08-23 from inherited `outline` to explicit `deep` as an as-built record.
    # Returned to the global `guarded` on 2026-08-31 by the owner's instruction, override removed - then
    # written back as an explicit `guarded` the same day when the global moved to `outline`. Depth
    # unchanged throughout; only what it is relative to.
    mode: guarded
    risk_accepted: medium
    risk_note: Deleting a Bundle is an irreversible action that removes files from disk, and a
      Bundle carries copies of images that may hold personal data. No money, no third party. Since
      2026-08-31 it also carries FR-41's companion act - discarding a Bundle's source Findings is
      owned by `finding`, but the Bundle is where the Reviewer stands when they do it.
    # `risk_accepted` low -> medium on 2026-08-31, owner's instruction. Drops the two-reviewer code panel;
    # document lenses unchanged.
    # Reset on 2026-08-23 for the same reason as `finding`, then re-passed at `deep` the same day.
    # BUG-1 was found during this pass; a defect found is not a gate failed, and it is registered
    # in defects.yaml rather than blocking the gate.
    g4_passed: true

  - id: settings
    title: Settings
    why: The four choices that stop the tool becoming the thing being managed — where files go,
      which keys do what, whether it starts with Windows, and how much image quality is bought.
    # CAP-9 added 2026-08-31. It was born at the G2 re-run of 2026-08-23 with
    # `component: settings` in requirements.yaml and never registered here, so the two files
    # disagreed for nine days and no validator reads this field against that one.
    caps: [CAP-6, CAP-9]
    owns: [Setting]
    containers: [desktop-app]
    # `mode` history: raised 2026-08-23 catalog -> deep, the largest change in that pass. At `catalog`
    # this component SKIPPED G4 entirely, which is why the four choices it holds had no flow, no state and
    # no screen specification behind them. Returned to the global `guarded` on 2026-08-31 by the owner's
    # instruction, then to `outline` the same day when the global moved there - no row, so it inherits.
    # `outline` still runs G4; only `catalog` skips it, so what that raise bought is kept. What `outline`
    # drops is design past section Structure: Inherited Constraints and Failure Behaviour stop being
    # required here, and the files already written for them stay on disk.
    risk_accepted: high
    risk_accepted_by: DEC-013
    risk_note: No money and no personal data. One IRREVERSIBLE action - choosing a different Vault
      folder moves every stored file on disk (FR-16 with BR-29, "either moves every existing file or
      moves none"), and a move that completes is not undone by choosing the old folder back when that
      folder sat on a drive since removed. The everyday worst outcome is milder and is what the
      component is usually judged on - a hotkey that does not register, which is visible immediately.
    # `risk_accepted` medium -> high on 2026-08-31, owner's instruction. NOT free, and DEC-013 is the
    # ratification - `applied` since that day. (This comment read "still `draft`" until 2026-09-01, which
    # was already false when written; the file it points at has carried `status: applied` from the start.)
    #
    # The note above was CORRECTED on 2026-09-01, closing OQ-33. It used to deny all five categories -
    # "No money, no personal data, no irreversible action" - and that third denial was wrong. FR-16 plus
    # BR-29 moves every stored file on disk, and all-or-nothing guarantees ATOMICITY, not REVERSIBILITY;
    # the old note conflated the two. DEC-013 is unaffected and stands: `settings` was covered either way,
    # because V23 matches keywords against `risk_note` as PROSE, so a note that DENIES a category trips the
    # same marker as one that admits it - the check discloses rather than judges. What was wrong was only
    # the reason recorded beside the acceptance. Rewording the note to slip past V23 would be gaming the
    # check, and the correction above deliberately moves in the opposite direction.
    # Was false-and-meaningless while this sat at `catalog`, because catalog skips G4. At `deep` it
    # means something again, and G4 ran for this component for the FIRST time on 2026-08-23.
    g4_passed: true

  # A Product Component `agent-access` stood here until 2026-09-04 - registered as `caps: [CAP-7]`,
  # `owns: [AccessKey]`, `containers: [desktop-app, mcp-bridge]`, `risk_accepted: high`. `DEC-016`
  # withdrew it: the running channel it granted and revoked access to is removed in full, and the
  # only way a Bundle reaches an agent now is the Markdown a Reviewer copies or pastes themselves.
  # Retiring a Product Component that already carries an SRS goes through `wdi-decision`, never
  # through this file directly - `corpus-guide.md` §"Product Component - the naming and proposal
  # rule" - and `DEC-016` is that decision. `CAP-7`, `FR-19`..`FR-22`, and `UC-17`..`UC-19` are
  # withdrawn with it in `requirements.yaml` and `usecases.yaml`; none of the four ids is reused.

  - id: sharing
    title: Sharing
    why: Putting one named Bundle somewhere an agent on another host can read it, and taking it
      back again.
    caps: [CAP-8]
    owns: [Publication]
    containers: [desktop-app, web-api]
    # `mode` was an explicit `guarded`, removed when the global became `guarded`, written back as an
    # explicit `guarded` when the global moved to `outline`. Depth unchanged throughout.
    mode: guarded
    risk_accepted: high
    risk_accepted_by: DEC-013
    risk_note: Publishing puts images that may contain personal data on the public internet, and it
      is irreversible in the sense that matters — an unpublish cannot recall what was already
      fetched. No money moves and there is no contractual promise, but this is the component where a
      mistake cannot be undone.
    # `risk_accepted` low -> medium -> high on 2026-08-31, owner's instruction, and of the five this is the
    # one to re-read first. `high` drops BOTH the two-reviewer code panel AND `edge-case-hunter` - the lens
    # that walks branches rather than reading prose - on the component whose own note says a mistake cannot
    # be undone, and whose unhandled branches concern content already on the public internet. It also stops
    # V13 demanding a review trace here. Disclosed before the change and chosen anyway, which is the
    # owner's call; DEC-013 is the ratification and is still `draft`. `sharing` is frozen by DEC-005, so no
    # new work reaches it meanwhile - that is what makes the trade cheap today rather than right.
    g4_passed: true

# An entity no Product Component's promise explains. Empty, and that is the correct state: every
# entity in this product is written by exactly one component's FR.
platform_owns: []

containers:
  - id: desktop-app
    title: Snapdown Desktop
    technology: Rust core, native Slint UI (i-slint-backend-winit on Windows). Was Tauri v2 with a
      React + Vite + TypeScript webview until DEC-007; the previous implementation is archived at
      archive/desktop-tauri
    built: true
    runs: The Reviewer's Windows 11 machine, as one signed-in user process with a tray icon
  # A THIRD container, `mcp-bridge` ("Snapdown MCP Bridge" - Rust command-line executable, stdio
  # Model Context Protocol, launched by the agent's MCP client), stood here until 2026-09-04 and is
  # withdrawn by `DEC-016`: there is no longer a running channel into the Library for an agent to
  # open, so there is nothing left for a bridge process to front. `LC-018 mcp-bridge-cli` is
  # withdrawn with it, and `crates/snapdown-bridge` is removed in the same pass by a separate
  # dispatch this decision unblocked.
  - id: web-api
    title: Snapdown Web Service
    technology: Go — net/http with chi, embedded SQLite, a blob directory
    built: true
    runs: A single binary on a host the Reviewer controls
  # A FOURTH container, `web-ui`, stood here until 2026-09-01 and is withdrawn by DEC-015, closing
  # BUG-8. It read "Published Bundle Reader / React + Vite single-page application, served as static
  # assets by web-api / built: true", and no part of that was ever true: no such application was
  # written, web-api serves no static assets (no FileServer, no embed, no http.Dir anywhere in it),
  # and DEC-007 removed React from the product entirely. The published Bundle page is server-rendered
  # HTML built in Go, so LC-027 `bundle-reader` moved to `web-api` rather than being retired - the
  # reader was never missing, it was in the wrong language in this file. `built: false` was rejected:
  # it means we deploy someone else's implementation, and nobody deploys this one.
  #
  # This does NOT answer OQ-22 (is a bare <pre> sufficient, or are three real screens wanted). If a
  # browser client is ever built, a container is born for it then, and it MUST be named something that
  # cannot be confused with a package path - the collision between `web-ui` the container and `web/ui`
  # the package is what hid BUG-8 for nine days.

# LC are born by the skill that draws them — wdi-component intent `design`, or wdi-ux for a screen.
# Registered here for every component at mode guarded or deep, checked at wave close by V12.
logical_components:
  # --- finding · desktop-app ---------------------------------------------------------
  - id: LC-001
    name: capture-overlay
    lc_type: ui-composite
    container: desktop-app
    component: finding
    area: capture-pipeline
    depends_on: [LC-002, LC-009]
  - id: LC-002
    name: region-capturer
    lc_type: service
    container: desktop-app
    component: finding
    area: capture-pipeline
    depends_on: [LC-003]
  - id: LC-003
    name: image-reducer
    lc_type: service
    container: desktop-app
    component: finding
    area: image-encoding
    depends_on: [LC-005]
  - id: LC-004
    name: finding-store
    lc_type: store
    container: desktop-app
    component: finding
    area: local-db
    depends_on: [LC-005]
  - id: LC-005
    name: vault-blobs
    lc_type: store
    container: desktop-app
    component: finding
    area: vault-fs
    depends_on: []
  - id: LC-006
    name: findings-editor
    lc_type: ui-screen
    container: desktop-app
    component: finding
    area: editor-ui
    depends_on: [LC-004, LC-007]
  - id: LC-007
    name: marker-canvas
    lc_type: ui-composite
    container: desktop-app
    component: finding
    area: marker-canvas
    depends_on: [LC-004]
  # LC-029 and LC-030 born 2026-08-23 by wdi-ux. Both are screens inventory-screen.md already named
  # (rows 2 and 7) that carried no build unit.
  - id: LC-029
    name: capture-note-field
    lc_type: ui-composite
    container: desktop-app
    component: finding
    area: capture-pipeline
    depends_on: [LC-001]
  - id: LC-030
    name: orphan-report
    lc_type: ui-screen
    container: desktop-app
    component: finding
    area: editor-ui
    depends_on: [LC-008]
  - id: LC-008
    name: orphan-sweeper
    lc_type: service
    container: desktop-app
    component: finding
    area: vault-fs
    depends_on: [LC-004, LC-005]
  # --- bundle · desktop-app ---------------------------------------------------------
  - id: LC-010
    name: bundle-composer
    lc_type: service
    container: desktop-app
    component: bundle
    area: bundle-render
    depends_on: [LC-004, LC-011, LC-012, LC-013]
  - id: LC-011
    name: markdown-writer
    lc_type: service
    container: desktop-app
    component: bundle
    area: bundle-render
    depends_on: []
  - id: LC-012
    name: marker-burner
    lc_type: service
    container: desktop-app
    component: bundle
    area: image-encoding
    depends_on: [LC-005]
  - id: LC-013
    name: bundle-store
    lc_type: store
    container: desktop-app
    component: bundle
    area: local-db
    depends_on: [LC-005]
  # LC-031 born 2026-08-23 by wdi-ux. inventory-screen.md row 9 named it; nothing built it.
  - id: LC-031
    name: compose-bundle-dialog
    lc_type: ui-composite
    container: desktop-app
    component: bundle
    area: editor-ui
    depends_on: [LC-010, LC-013]
  - id: LC-014
    name: bundles-editor
    lc_type: ui-screen
    container: desktop-app
    component: bundle
    area: editor-ui
    depends_on: [LC-010, LC-013]
  # --- settings · desktop-app -------------------------------------------------------
  # LC-028 born 2026-08-23 by wdi-ux, landing DESIGN-settings.md. FR-27 and FR-28 are promises about
  # the WINDOW FRAME, and in the shipped build the frame is inline JSX at the top of App.tsx owned by
  # nothing. A promise with no build unit behind it is a promise nobody checks.
  - id: LC-028
    name: editor-shell
    lc_type: ui-screen
    container: desktop-app
    component: settings
    area: editor-ui
    depends_on: []
  - id: LC-015
    name: settings-screen
    lc_type: ui-screen
    container: desktop-app
    component: settings
    area: settings-store
    # LC-009 added 2026-08-23. The Settings screen displays and edits hotkey bindings, so it has always
    # depended on the registrar; the registry said otherwise and SDD-settings.md said the truth.
    depends_on: [LC-025, LC-026, LC-009]
  - id: LC-025
    name: settings-store
    lc_type: store
    container: desktop-app
    component: settings
    area: settings-store
    depends_on: []
  - id: LC-009
    name: hotkey-registrar
    lc_type: gateway
    container: desktop-app
    component: settings
    area: settings-store
    depends_on: [LC-025]
  - id: LC-026
    name: startup-registrar
    lc_type: gateway
    container: desktop-app
    component: settings
    area: settings-store
    depends_on: []
  # LC-016 access-key-manager, LC-017 local-api-server, LC-018 mcp-bridge-cli, and LC-019
  # agent-access-panel stood here, all `component: agent-access`, until 2026-09-04. `DEC-016`
  # withdrew the component they belonged to along with them; none of the four ids is reused.
  # --- sharing · desktop-app + web-api ---------------------------------------------
  - id: LC-020
    name: publish-client
    lc_type: gateway
    container: desktop-app
    component: sharing
    area: publish-client
    depends_on: [LC-013, LC-021, LC-025]
  - id: LC-021
    name: publication-store
    lc_type: store
    container: desktop-app
    component: sharing
    area: local-db
    depends_on: []
  - id: LC-022
    name: publish-dialog
    lc_type: ui-composite
    container: desktop-app
    component: sharing
    area: editor-ui
    depends_on: [LC-020]
  - id: LC-023
    name: publication-router
    lc_type: gateway
    container: web-api
    component: sharing
    area: web-service
    depends_on: [LC-024]
  - id: LC-024
    name: served-publication-store
    lc_type: store
    container: web-api
    component: sharing
    area: web-service
    depends_on: []
  - id: LC-027
    name: bundle-reader
    lc_type: ui-screen
    # `container` was `web-ui` until 2026-09-01. DEC-015 moved it to the container that actually
    # renders the page: web-api builds the HTML inline and serves it as text/html. Still `ui-screen`
    # - it is a screen a person looks at; what changed is that it is drawn on the server.
    container: web-api
    component: sharing
    area: web-service
    depends_on: [LC-023]
  - id: LC-032
    name: desktop-build
    lc_type: service
    container: desktop-app
    component: settings
    area: build-tooling
    depends_on: []
