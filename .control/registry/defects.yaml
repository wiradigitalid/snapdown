  - id: BUG-60
    title: A corrupt library.db now produces a silently empty Library, and the session's work is lost on exit
    found: "2026-08-27"
    found_by: agent, re-reading BUG-12/BUG-16/BUG-17 against the Slint startup path
    component: settings
    severity: high
    contradicts: [BR-118, "AD-11", "DEC-003"]
    root_cause: code
    evidence: |
      `BUG-12`, `BUG-16` and `BUG-17` were all fixed in `apps/desktop/src-tauri/src/lib.rs`, and
      `DEC-007` archived that file. The Slint startup path was written fresh and has none of it.

      `apps/desktop/src/main.rs`, `AppContext::init`:

        - a failed `SqliteFindingStore::open` falls back to `open_in_memory()`, reporting the reason
          with `eprintln!`;
        - the same for `SqliteSettingsStore`;
        - a failed `VaultBlobStore::new` falls back to the default path.

      A release binary on Windows has no console, so all three messages reach nobody. And each
      fallback ends in an `unwrap`:

        main.rs:162  SqliteFindingStore::open_in_memory().unwrap()
        main.rs:173  SqliteSettingsStore::open_in_memory().unwrap()
        main.rs:191  VaultBlobStore::new(&fallback).unwrap()

      There is no error dialog anywhere in the Slint app: `MessageBox`, `MessageDialog`, `show_error`
      and `error_dialog` return nothing across `apps/desktop/src/`.
    impact: |
      Two failures, and the first is worse than what `BUG-12` originally recorded.

      `BUG-12` was "the application vanishes on launch" - visibly broken, and the Reviewer knows
      something is wrong. What happens now is that Snapdown opens normally with an EMPTY Library, says
      nothing, and every Finding captured in that session is written to an in-memory database that is
      discarded on exit. Silent data loss beats a visible crash for damage every time.

      `BR-118` requires the Reviewer to be told. Nothing tells them.

      Second: three `unwrap`s on the startup path, under `AD-11`'s one-process rule, so each takes the
      tray, the hotkeys, the overlay and the Editor with it. `DEC-003` accepted that coupling in
      writing; it did not accept unreported panics on top of it.
    why_undetected: |
      Third time this exact thing has happened, and `AGENTS.md` already names the pattern twice: a
      premise is written into an exclusion, the code the premise described changes, and nobody
      re-reads the exclusion. Here the whole FILE the fixes lived in was deleted, which is the most
      complete version of it.

      No test covers a second launch or a corrupt store on the Slint path. Every store test uses a
      writable temp directory where the open always succeeds - `AGENTS.md` records that too.
    fix: |
      NOT DONE, and deliberately kept out of this cleanup so it is not buried in it. What it needs:

      1. a startup failure the Reviewer can see - a native dialog, owned and foregrounded, which is
         `BUG-17`'s original finding and now has no code at all;
      2. refusing to run on an in-memory fallback rather than accepting work it will discard, or
         labelling the window unmistakably if it does;
      3. the three `unwrap`s replaced with a reported exit, per `BUG-12`'s original sweep.

      The corrupt-store fixture rule from `AGENTS.md` applies: garbage bytes are rejected at
      `Connection::open` before a pragma runs, so the fixture must be a valid header with corrupt
      pages, and the guard must be mutation-verified - `a_failed_open_leaves_no_wal_or_shm_file` is
      already recorded as insensitive to its own defect.
    related: BUG-12, BUG-16, BUG-17
    status: open

