      stalled frame on the first pointer move of EVERY capture, deterministic and repeatable.
    impact: |
      Cosmetic but conspicuous - it is a full-screen flash at the moment the Reviewer starts
      choosing a region, on every capture.
    why_undetected: |
      Nothing here measures frame timing, and a dropped frame is invisible to every test in this
      repository.
    fix: |
      NOT FOUND. Recorded so the ground already covered is not re-trodden.

      Ruled out by experiment, not by reasoning:
        - Window/renderer creation. SLINT_DEBUG_PERFORMANCE=refresh_lazy,console shows exactly
          three renderer initialisations (main window + two overlays) and the count does NOT grow
          across further capture cycles, so the windows and their OpenGL contexts do persist -
          reuse works, and this is not re-creation.
        - The magnifier. Hiding the loupe entirely left the stall unchanged, so its magnified
          source-clip sampling is not the cause.
        - Filtering mode. `image-rendering: pixelated` on the loupe made it measurably WORSE.
        - The window's clear colour. Switching the overlay from transparent to opaque black
          changed only what colour the bad frame showed, not whether it happened.
        - Element-tree churn. Replacing every `if` gate with `visible` (so no subtree is torn down
          and rebuilt) removed the per-monitor-entry blinks but not this one.
        - The software renderer removes the blink entirely, but is not an acceptable fix: it
          cannot repaint a full-screen 8-megapixel overlay per pointer move, so dragging a region
          becomes choppy, and optimising that broke visual correctness (a static scrim plus a
          source-clipped bright cut-out slides against the backdrop, because source-clip is in
          integer SOURCE pixels while the selection sits at fractional logical coordinates).

      Remaining untested suspicion: a fresh snapshot texture is installed on every capture via
      set_snapshot_image, and the first draw that samples it may stall. If so the bad frame would
      show the PREVIOUS capture's screenshot rather than black - not yet confirmed with the owner.

      The structural alternative, which would remove this whole class rather than this instance:
      a single overlay window over the whole virtual desktop, with each monitor's pixels resampled
      in Rust to that one window's scale factor. One window means one surface, one warm-up and no
      cross-window event ordering at all. Cropping would still come from the unresampled originals
      so saved output stays full quality; only the on-screen preview softens on a monitor whose
      scale differs. That is a DEC-, not a patch, and it has not been decided.
    related: BUG-26
    resolved: |
      2026-08-26, commits 9277ecc / 31e391f / 030f886. Not by finding what stalled that one
      frame - that was never identified - but by removing the conditions that made it happen at
      all, in three steps:

        1. Reuse. The overlay is created once and re-shown, not rebuilt per capture. Confirmed by
           measurement: with SLINT_DEBUG_PERFORMANCE=refresh_lazy,console the renderer
           initialisation count does not grow across captures. Took five blinks down to one.
        2. One window instead of one per monitor. Per-window renderer warm-up and per-window
           event-loop turns were the mechanism behind both the residual blink and Escape clearing
           only one screen.
        3. Pre-warming at start-up. A window's renderer surface is built, and its geometry
           corrected, only at creation - and `show()` does not create the native window, the event
           loop does on its next turn. Doing that during start-up means neither is in front of the
           user when they press Capture. Verified: after start-up the overlay already exists
           hidden at pos=(-2160,-838) size=6000x3840, its final geometry.

      Owner confirmed acceptable. The lesson worth keeping is in the ruled-out list above: four
      fixes aimed at the symptom all failed, and what worked was removing the structure that
      produced it.
    residue: |
      2026-08-27, accepted, and recorded here so it is not rediscovered as a defect.

      The owner, after the BUG-53 fix: "overlay pertama sedikit ngezoom transisi (tapi acceptable
      kok)." The FIRST overlay of a session still shows a brief zoom as it settles.

      That is this row's own mechanism, not a new one. `show()` does not create the native window -
      the event loop does, on its next turn - so the attributes hook sizes the window when the loop
      gets to it, and the geometry timer re-asserts it through winit one turn later. Between those
      two moments there is one frame at whatever size the platform chose, and on a 6000x3840 canvas
      that reads as a zoom.

      Removing it needs the window to be born at the right size with no correcting turn at all,
      which means either a platform call before Slint knows the window exists, or Slint growing an
      API for it. Neither is worth the risk against a one-frame transition on the first capture of a
      session that the owner has looked at and accepted. If it ever becomes worth revisiting, the
      thing to change is the hook, not the timer.
    status: resolved
  - id: BUG-28
    title: The capture overlay takes a visible moment to appear
    found: "2026-08-26"
    found_by: kodesh87, manual capture test
    component: capture
    severity: low
    contradicts: [FR-1]
    evidence: |
      Owner: "muncul overlaynya cukup lama", and separately "agak lama, tapi oke". Timed in a
      debug build at grab=1284ms before the grab was parallelised and 805ms after; release is
      substantially faster but still perceptible.

      The cost is preparing the image, not the overlay logic:
        - two monitor grabs at ~8.3 megapixels each (parallelised, so the slower one dominates)
        - a stitched virtual-desktop canvas: on a 6000x3840 desktop that is a ~92MB allocation
          plus a blit per monitor
        - a copy of that into a Slint SharedPixelBuffer, then a texture upload
    impact: |
      A pause between pressing Capture and the screen freezing. The frozen screenshot is taken at
      the moment of the grab, so nothing is lost - it reads as latency, not as a wrong capture.
    why_undetected: |
      Nothing here measures this, and it only becomes obvious at 6000x3840 across two monitors.
    root_cause: code
    fix: |
      PARTLY DONE, 2026-08-26. Note that the single-window architecture MADE THIS WORSE: the
      per-monitor design needed no stitched canvas at all. That was a deliberate trade - see
      BUG-27 - and reverting it to buy latency back would reintroduce the whole multi-window
      defect class. It was not reverted.

      Done - the image preparation now costs one pass instead of three:
        - `VirtualDesktopCapture` no longer owns a canvas. `capture_virtual_desktop` returns the
          per-monitor grabs plus the desktop geometry, and `blit_into` writes them ROW-WISE
          straight into the `SharedPixelBuffer` the overlay presents. That removes the canvas
          allocation, the blend and the copy in one move.
        - The blend was the surprise. `image::imageops::overlay` is a per-pixel
          `get_pixel`/`blend`/`put_pixel` loop, not a blit, and for an opaque source over an
          untouched destination its answer IS the source pixel - 23 million pixels of arithmetic
          for a copy. Measured at 64-75ms of the ~225ms.
        - The whole preparation moved off the event loop. `SharedPixelBuffer<Rgba8Pixel>` is
          `Send`, so the grab AND the blit now happen on the capture thread; the UI thread only
          wraps the finished buffer in an `Image`. It used to pay the 17-20ms `clone_from_slice`.
        - "Skip the stitch when only one monitor exists" turned out to need no separate path. Once
          the blit writes into the presentation buffer, a single monitor already costs exactly one
          memcpy. Measured: a dedicated fast path saved a further 1.2ms on a 33MB monitor, so it is
          implemented as the general case "a monitor as wide as the canvas is one contiguous run"
          rather than as a monitor-count branch.

        - TWO canvases are allocated per desktop layout and written alternately, never reallocated
          per capture. They live on `LiveOverlay`, whose `placement` reuse key is already exactly
          their validity condition, and they are allocated in `prewarm_capture_overlay` - the same
          move that put the renderer warm-up where nobody is looking. This was the largest single
          win and it was invisible until measured: `SharedPixelBuffer::new` is not a `calloc`, it
          fills through `SharedVector`'s per-element `FromIterator` push loop, so allocating a
          6000x3840 buffer costs 33-37ms on its own while a plain 92MB write pass costs 3.6ms.
        - Reusing a canvas means writing UI-thread state, so the blit moved back onto the event
          loop. That is deliberate: 4.5ms there is a third of a frame, and it replaced 92MB of
          memcpy that was not.

      WHY TWO CANVASES, recorded because one was tried first and shipped past a unit test.

      `make_mut_bytes` is copy-on-write, so the canvas being written must be held by nothing. The
      first attempt used ONE canvas and cleared the overlay's `snapshot-image` property immediately
      before the blit, on the reasoning that this was the only clone. A test against the real
      component agreed - and both were wrong about the running application. Slint bindings are
      LAZY: the two elements that bind the image, the backdrop and the loupe, latch their `source`
      when they RENDER and keep it until they render again. A hidden window never renders, so
      between captures they still hold the last image shown, and clearing the root property never
      reaches them. The test passed only because a component constructed in a test harness has
      never rendered, so its bindings had never latched anything - it proved a condition that does
      not occur.

      Nothing about the output was wrong, which is the point: a copy-on-write yields perfectly
      correct pixels and costs ~40ms. It was caught by the canary at the write site, which compares
      the buffer's data pointer across the write; it fired on all 28 captures of an owner session.
      After alternating was introduced the same canary was silent across a full session.

      Alternating does not fight the lazy binding, it sidesteps it: whatever those elements still
      hold is the PREVIOUS capture's canvas, so the one being written is free by construction, with
      no release step and no ordering to get right. The cost is a second 92MB resident.

      Measured in release on the 6000x3840 two-monitor rig, all shapes asserted to produce
      identical bytes, in one process so the figures are comparable:

        | preparation, grab excluded                           | ms      |
        | original: RgbaImage + imageops::overlay + copy        | 83-91   |
        | intermediate: SharedPixelBuffer::new + blit_into      | 35-38   |
        | rejected: Vec + blit_into + clone_from_slice          | 39-47   |
        | NOW: blit into the retained canvas that is off screen | 4.3-5.4 |

      With the grab at 132-167ms, total time to the overlay goes from ~225ms to ~150ms, and the
      preparation this defect's evidence blames is effectively gone - 95% of it.

      Two things besides the alternation hold the line:
        - the completed handler READS the on-screen canvas out of `LIVE_OVERLAYS` instead of
          capturing a clone, which the borrow checker now enforces on its own;
        - the capture path compares the data pointer across the write and reports on stderr if it
          moved. That check is not decoration - it is the only thing that caught the single-canvas
          design, and it is the only symptom this class of bug has.
      `identical_bytes_to_the_stitch_it_replaces` and `identical_to_the_crop_imm_it_replaces`
      hold the two equivalences this rests on; both were verified by mutation, as were the other
      nine guards added with them.

      A correction worth keeping, because it was measured after the fix was written and it
      invalidated the first set of numbers recorded here: **the allocation is not free.**
      `SharedPixelBuffer::new(6000, 3840)` costs 33-37ms by itself, because `SharedVector`'s
      `FromIterator` is a per-element push loop, not a `calloc`; a plain 92MB write pass is 3.6ms
      for comparison. So 33-37 of the 36-38ms above is the buffer, not the blit. An earlier draft
      of this entry claimed 22-27ms, measured with `vec![0u8; n]` - which Rust turns into
      `alloc_zeroed` and Windows serves as lazy zero pages. Benchmarking a stand-in for the
      allocator measured the stand-in.

      One cost was accepted rather than removed: 184MB of canvas is now resident for the life of
      the process (two 6000x3840 buffers) instead of one being allocated and freed per capture.
      That is the price of the alternation, and it is the trade that bought 83-91ms down to
      4.3-5.4ms. For a screenshot tool on a desktop this size it is the right way round, but it is
      a real cost and it scales with the desktop, not with usage.

      STILL OPEN. Everything left is the GRAB, which nothing here touched:
        - A faster grab path than xcap's. It is now 132-167ms of a ~150ms wait, i.e. essentially
          all of it. Worth recording precisely: xcap is compiled WITHOUT its `wgc` feature (it has
          no `default` feature and the workspace asks for none), so the active path is GDI -
          `BitBlt` from the desktop DC, `GetDIBits`, then a scalar BGRA->RGBA swap over 33MB per
          monitor. Enabling `wgc` is one line, NOT a new implementation. But it is not a free win:
          `wgc_capture` builds a fresh frame pool and capture session per call and blocks on
          `recv_timeout(3000ms)` waiting for `FrameArrived`, still does a staging readback and the
          same channel swap, shows a capture border on Windows 10, and excludes the cursor. It has
          to be A/B measured, not assumed.
        - Show the overlay before the image is ready, then fill it in - changes the UX contract
          (the screen would not freeze instantly) and needs the owner's call.

      Left open rather than resolved on purpose. The cost this defect's own evidence names - the
      image preparation - is gone. What remains is a different cost that happens to produce the
      same symptom, and whether ~150ms still reads as "cukup lama" is the owner's eyes to judge,
      not a number.
    related: BUG-27
    measurement_2026_08_27: |
      The remaining latency is now bounded and attributed, measured in a release build on this
      desktop - two 4K monitors, one portrait, 16.59 Mpx and 63.3 MB of pixels in total. Three rounds
      after a warm-up round:

        Monitor::all() enumeration          0.022 - 0.064 ms   negligible
        capture_each_monitor (2 threads)  104 - 137 ms         THE cost
        capture_virtual_desktop           105 - 119 ms
        blit_into a fresh Vec              22 - 24 ms          NOT comparable, see below

      The enumeration being 22 us settles one suspicion outright: `Monitor::all()` is called three
      times per capture - once by `capture_each_monitor` and once inside each per-monitor thread - and
      that costs nothing worth removing.

      The 22-24 ms `blit_into` reading is a measurement artefact and is recorded so it is not quoted
      as a regression. The probe blitted into `vec![0u8; n]`, whose pages are lazy zero pages, so it
      is timing 63 MB of first-touch page faults on top of the copy. BUG-28's own in-process figure
      of 4.3-5.4 ms - into a `SharedPixelBuffer` that has already been touched - is the real one.
      `AGENTS.md` records this exact trap; it caught me again here, one round later.
    dead_end_wgc: |
      2026-08-27. xcap's `wgc` feature - Windows Graphics Capture - was the one idea this row named
      as next. It is REFUTED by measurement, and for a reason nobody had written down.

        GDI (current)   grab_all 137 / 104 / 122 ms    capture_virtual_desktop 119 / 116 / 105 ms
        wgc             grab_all 314 / 181 / 132 ms    capture_virtual_desktop 145 / 168 / 165 ms

      Slower, and much more variable. The first call costs 314 ms. WGC creates a capture session per
      call - a D3D device, a frame pool, an event wait - and for a SINGLE frame that setup dominates.
      WGC is the right API for continuous capture and the wrong one for a one-shot.

      The three risks this row previously recorded against `wgc` all turn out to be handled in 0.9.8
      on this OS, so none of them is the reason: it calls `SetIsBorderRequired(false)` (Windows 11,
      and this machine is build 26200), it calls `SetIsCursorCaptureEnabled(false)` - which is what
      this product WANTS, since it hides the cursor and draws its own crosshair - and the
      `recv_timeout(3000ms)` is a ceiling on failure rather than a cost on success. The old note was
      written without reading the version in the lockfile.
    remaining: |
      The grab is at or near the floor for a one-shot full-desktop capture through this API set. What
      is left inside it, from reading xcap 0.9.8's GDI path:

        BitBlt          desktop DC -> memory DC, a GPU-to-system-memory readback of 63.3 MB
        GetDIBits       into a freshly zeroed Vec, so page faults are included
        bgra_to_rgba    a SCALAR loop over 8.3 Mpx per monitor: `swap(0, 2)` plus a branch on
                        `src[3] == 0 && is_old_version` per pixel, on a machine where
                        `is_old_version` is constantly false

      Only the last of those is ours to remove, and only by owning the GDI capture path: a
      `BITMAPINFOHEADER` with `BI_BITFIELDS` and explicit channel masks makes `GetDIBits` write RGBA
      directly, so the swap disappears rather than being vectorised. Estimated saving is roughly
      15-25 ms per monitor of a ~116 ms grab, and because the monitors are captured on separate
      threads that is 15-25 ms of the wall clock, not double.

      The cost is real and is why this has not been done: roughly 80 lines of unsafe Win32 inside the
      single component every other part of the product depends on, replacing a working third-party
      implementation, to take ~150 ms to ~130 ms. That is a judgement about whether 20 ms is worth
      owning, and it belongs to the owner rather than to the agent that would write it.

      Rejected without measuring, and the reasons are worth keeping: showing the overlay before the
      grab finishes would present the PREVIOUS capture's pixels, which is wrong content rather than
      slow content; and presenting one monitor as soon as it is ready buys nothing here, because both
      monitors are 4K and are captured concurrently, so they finish together.
    status: open
  - id: BUG-29
    title: Enter did nothing unless the note field already had keyboard focus
    found: "2026-08-27"
    found_by: kodesh87, manual capture test
    component: capture
    severity: medium
    contradicts: [FR-2]
    root_cause: code
    evidence: |
      Enter was handled only by the note field's own `accepted` callback. The overlay's FocusScope
      handled Key.Escape and rejected everything else, and the hint text under the field reads
      "Enter to save . Esc to cancel" - so the promise was on screen and half broken.
    impact: |
      Dragging a region moves keyboard focus away from the note field, which is most of the time,
      so the advertised key did nothing until the Reviewer clicked into the field first.
    why_undetected: |
      No test drives the keyboard against the overlay, and the hint text is a literal string that
      nothing compares against a binding - the same gap BUG-25 was filed under for Escape.
    fix: |
      Key.Return on the window's FocusScope, guarded by `has-selection` so it cannot emit a
      zero-sized crop. No double-save: when the field has focus it consumes Enter itself and the
      window handler never sees it.
    resolved: |
      2026-08-27. Guarded by enter_saves_from_the_window_not_only_from_the_note_field, verified by
      mutation.
    status: resolved
  - id: BUG-30
