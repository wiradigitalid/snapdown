      so half of that enforcement is unreachable.
      Lower severity than BUG-4 and BUG-5 because this is a maintenance tool rather than the core
      loop. A Reviewer who never opens it loses nothing until something has already gone wrong.
    why_undetected: |
      The third instance of one pattern in one sweep. See the SYSTEMIC note below.
      RESOLVED by W6-S7 on 2026-08-23 - see the resolved: field above.
    fix: |
      Give it an entry point. .how/finding/01-ux/DESIGN.md places it as LC-030 with a route of
      /findings/orphans, and .how/finding/01-ux/DESIGN.md's Findings surface offers it from the
      image-missing state. Both are in W6-S7's scope.
    related: [BUG-4, BUG-5]
    resolved: |
      W6-S7, 2026-08-23. OrphanReportView is mounted behind a viewMode on FindingsView and reachable
      from the image-missing state. FR-15 and UC-8 are reachable again.
    status: resolved

# SYSTEMIC — the shape shared by BUG-4, BUG-5 and BUG-6, written 2026-08-23
#
# A sweep for `<Component` across the whole tree, excluding each component's own file and its tests,
# found FOUR components that are never mounted anywhere:
#
#   CaptureOverlay     BUG-4, critical  — the capture path
#   MarkerLayer        BUG-5, critical  — marker annotation
#   OrphanReportView   BUG-6, high      — the orphan report
#   EmptyState                          — a base element; W6-S1 and W6-S7/S8 mount it
#
# Every one of them has passing unit tests. Every one of them is CORRECT in isolation. None is
# assembled into anything a Reviewer can reach.
#
# THE FINDING IS NOT THE THREE BUGS. It is that this repository has no composition test of any kind.
# Every suite proves a part; nothing asks whether the parts were wired together. Five waves closed
# green on that basis, and three requirements - FR-1/FR-2, FR-8, FR-15 - are unmet in a build whose
# tests all pass.
#
# The wave-close checklist cannot catch it either: V12 checks that an LC is REGISTERED, not that it
# is REACHED. A screen with an LC, a component, a passing test and no mount point satisfies every
# mechanical check this method has.
#
# W6-S2 and W6-S7 carry the three fixes. The missing test CLASS is the thing to fix beyond them, and
# it is filed as OQ-23 rather than bolted onto a story that has enough to do.
  - id: BUG-7
    title: Twelve screenshots of the running product have been committed to this public repository since W1
    found: "2026-08-23"
    found_by: the new korpus.yml forbidden-content guard, on its first local run
    component: _repo
    severity: high
    contradicts: ["product brief § Constraints"]
    evidence: |
      git ls-files -- '*.png' '*.jpg' '*.jpeg' '*.webp', excluding apps/desktop/src-tauri/icons/,
      returns 12 files. Eleven are in _bmad-output/specs/w1-settings/ui-verify-W1-S1/ and were
      committed in 7abde7b, "docs(w1-s1): UI verification finished". That commit is ON origin/main.
      The brief has said since G1: "This repository is public. Forbids committing a captured
      screenshot, a token, a client's name, or any test fixture derived from real capture output."
    impact: |
      They are screenshots of the product running on the operator's machine. claim6_vault_path_typed
      and claim4_window_rendered_live show the Settings surface, which displays the Vault path - an
      absolute path under a real home directory. Whatever else was on screen is in them too.
      ALREADY PUBLIC. Unlike the accessibility-tree dumps caught earlier the same day, these are not
      on an unpushed branch: they are on main and have been fetchable for as long as main has been.
      Removing them now stops it getting worse and does NOT un-publish them.
    why_undetected: |
      Nothing enforced the constraint. korpus.yml validated the corpus and desktop-ci.yml built the
      code; no workflow ever refused a path. The constraint was written at G1 and read by nobody
      since. The guard that finds it was added on 2026-08-23 and found it on its first run.
    fix: |
      Two parts, and only the first is the agent's.
      1. Remove them from the working tree, which this defect does, and let the new guard prevent
         recurrence. DONE.
         A related cleanup, done 2026-08-23 and worth recording because it is easy to miss: the
         accessibility-tree dumps scrubbed from the wave branch earlier the same day were still
         reachable AFTER the scrub, from `refs/original/refs/heads/wave/w6-gates-rerun` - the backup
         ref `git filter-branch` writes and leaves behind. A scrub that stops at rewriting the branch
         has not finished. The ref was deleted, the reflog expired and `git gc --prune=now` run, and
         the leaked blobs are now unreachable from every ref. That cleanup does NOT apply to these
         twelve screenshots: they are on `main` and published, which is a different problem.
      2. Whether to rewrite main's history - and whether anything visible in them warrants any other
         action - is the REPO OWNER'S CALL. Rewriting published history on a public repository
         affects every clone and fork, and an agent must not do it unilaterally. Recorded here so the
         decision is made rather than inherited.
    status: open
  - id: BUG-8
    title: "The web-ui container is registered built:true and does not exist; a library shares its name"
    found: "2026-08-23"
    found_by: coordinator, checking the container registry against the tree after BUG-2
    component: sharing
    severity: medium
    contradicts: ["C4 L2", "components.yaml containers", "structure-codebase.md"]
    evidence: |
      components.yaml registers:
        - id: web-ui
          title: Published Bundle Reader
          technology: React + Vite single-page application, served as static assets by web-api
          built: true
          runs: The browser of whoever opens a Publication URL
      c4-l2-containers.md:33 draws it, :53 argues explicitly that it IS a container rather than
      "static assets" because it runs in the reader's browser as its own process, and :69 gives it an
      HTTPS arrow to web-api.
      NONE OF IT EXISTS.
        web/ui/ has no index.html and no src/main.tsx. It is @snapdown/ui - a component LIBRARY
        consumed by the desktop webview, with no entry point and nothing to deploy.
        apps/web-service serves no static assets: grep for FileServer, StaticFS, embed, http.Dir and
        ServeFile in server.go and main.go returns nothing. It builds an HTML <pre> block inline.
    impact: |
      Three artifacts describe a deployable container that was never built, while pointing at a
      directory that is a different kind of thing entirely:
        - components.yaml claims a fourth built container
        - the C4 L2 draws it, and argues at length for why it is a container
        - structure-codebase.md has a `### web-ui` heading, which V25 REQUIRES of a built: true
          container - and the heading describes web/ui/ the library, satisfying the validator with
          the wrong artifact
      V25 therefore passes on a container that does not exist. That is the part worth noticing: the
      validator is not wrong, it is answering "does this heading exist" and cannot ask "does this
      heading describe the thing it is named after".
    why_undetected: |
      Same family as BUG-2 and found by pulling on it. The name collision is what hid it: `web-ui`
      the container and `web/ui` the package read as the same thing in every document, and one of
      them is real.
    fix: |
      A DECISION, not a task, and the same decision as OQ-22. If the reader SPA is built, the
      registration becomes true and web/ui needs a name that is not web-ui. If the promise is
      withdrawn, then `web-ui` leaves `containers`, leaves the C4 L2, loses its structure-map heading,
      and LC-027 is retired - and `web/ui` keeps its name because nothing else wants it.
      Withdrawing is the cheaper answer and may be the correct one: Snapdown's reader is a machine.
      Either way it goes through wdi-blueprint intent `platform`, which owns `containers` and the C4.
    related: [BUG-2, OQ-22]
    blocked_by: DEC-005, which freezes `sharing`.
    status: open
  - id: BUG-9
    title: "Bundle composition and deletion swallow every filesystem and unpublish Result"
    found: "2026-08-23"
    found_by: coordinator, sweeping for `let _ =` after the same pattern produced W6-S10
    component: bundle
    severity: high
    contradicts: [AD-2, FR-10, FR-14, BR-20, BR-23, NFR-5]
    evidence: |
      apps/desktop/src-tauri/src/commands/bundle.rs
        :72-74  if let Ok(vault_store) = VaultBlobStore::new(&vault_path) {
                    let _ = vault_store.write_blob(&md_filename, markdown_content.as_bytes());
                }
                ... then the Bundle row is built and stored unconditionally.
        :116        let _ = unpublish_bundle(id.clone(), state.clone());
        :135        let _ = vault_store.delete_blob(&detail.bundle.markdown_path);
        :137            let _ = vault_store.delete_blob(&item.image_path);
      Note :72 also swallows the VaultBlobStore::new failure: if the store cannot be opened the `if
      let Ok` simply does not run, and composition continues as though the file had been written.
    impact: |
      THREE DISTINCT FAILURES, and they are not equally bad.

      1. COMPOSITION (:72-74). FR-10 is all-or-nothing and AD-2 says a record MUST NOT be committed
         before its files exist. If the Markdown write fails - or the Vault cannot be opened at all -
         the Bundle row is created anyway with markdown_path naming a file that does not exist. The
         Reviewer is told the Bundle was composed. bundle.markdown still holds the bytes, so Copy
         Markdown works and only the file on disk is missing, which is precisely the kind of partial
         state AD-2 exists to forbid.

      2. UNPUBLISH ON DELETE (:116). THIS IS THE SERIOUS ONE. BR-23 makes the unpublish part of the
         same action; BR-20 says an unpublish that fails leaves the Bundle marked published, so the
         Reviewer is NEVER told something is private when it may not be. Swallowing the Result does
         the opposite: the unpublish fails, the deletion proceeds, the local record is gone, and the
         published copy STAYS LIVE ON THE PUBLIC INTERNET with nothing left pointing at it. The
         Reviewer believes they deleted it. AD-6 and the brief's personal-data constraint are what
         this reaches.

      3. FILE DELETION (:135, :137). FR-14 promises the image copies go with the Bundle and NFR-5
         says the Vault holds no file the Library does not point at. A swallowed delete leaves
         orphaned files, unreported. Same shape as W6-S10's vault-move swallow, and milder: the
         orphan report (FR-15) can find these - once BUG-6 makes it reachable.
    why_undetected: |
      `let _ =` is invisible to clippy at default levels and reads as deliberate. No test exercises a
      failing filesystem or a failing unpublish, because every store test uses a writable temp dir
      and a live path. This is the third instance today of one habit - vault_migration.rs:141 and
      :180 were the first two - which is why it is registered as its own defect rather than folded
      into W6-S10.
    fix: |
      Composition: propagate the write failure and roll back, so FR-10's all-or-nothing is real.
      Do not swallow VaultBlobStore::new either.
      Unpublish: on failure, ABORT THE DELETE and report it. BR-20 already dictates the behaviour -
      leave it marked published. Never delete a local record whose remote copy may still be live.
      File deletion: report what could not be removed, as W6-S10 does for the Vault move.
    note: |
      Part 2 is `sharing` behaviour reached from a `bundle` command, and DEC-005 freezes `sharing`.
      It is NOT frozen work: the swallow is in bundle.rs, the fix is in bundle.rs, and DEC-005 says
      in its own text that it does not forbid fixing a defect in what already shipped.
    resolved: |
      W6-S9, 2026-08-24. delete_bundle now aborts and reports when unpublish fails, instead of
      deleting the local record while the published copy stays live on the public internet with
      nothing pointing at it. BR-20 was written to forbid exactly that, and the fix follows from the
      rule rather than from taste. The swallows on the composition path and the file-deletion path
      are gone too, including the second one hiding inside the first - the if let Ok(...) on
      VaultBlobStore::new that simply did not run.

      Proving it took three attempts, and the obstacle is worth keeping: the first two produced a
      test binary that could not start at all - STATUS_ENTRYPOINT_NOT_FOUND - because it built a
      tauri::test::mock_app. The resolution was to extract the logic of create_bundle, delete_bundle,
      copy_bundle_to_clipboard, unpublish_bundle and delete_finding into plain _impl functions taking
      &AppState, leaving each #[tauri::command] as a one-line shim. AppState is a plain struct, so
      the tests build it directly and Tauri is not involved.

      One attempt had put tauri's `test` feature on the PRODUCTION dependency in the workspace
      Cargo.toml, which would have shipped the test harness inside the release binary. It is out.

      Verified by the coordinator, exit codes read directly: cargo test --workspace 0, cargo fmt 0,
      cargo clippy --all-targets -D warnings 0. The test that matters now runs and passes:
      deleting_a_published_bundle_whose_unpublish_fails_aborts_and_reports.
    status: resolved
  - id: BUG-10
    title: "The MCP bridge can hand an agent an error with an empty message"
    found: "2026-08-23"
    found_by: coordinator, extending the `let _ =` sweep into snapdown-bridge
    component: agent-access
    severity: low
    contradicts: [AD-7, BR-17]
    evidence: |
      crates/snapdown-bridge/src/client.rs:155-163
        fn parse_error_response(_code: u16, resp: ureq::Response) -> String {
            let mut body = String::new();
            let _ = resp.into_reader().read_to_string(&mut body);
            if let Ok(env) = serde_json::from_str::<ApiErrorEnvelope>(&body) { ... } else { body }
        }
      If the body read fails, `body` stays "", the envelope parse fails, and the function returns the
      empty string as the error message. The caller wraps it in Err() and the MCP tool surfaces an
      error with nothing in it.
    impact: |
      AD-7 exists so one error envelope crosses every process boundary, and BR-17 says a refusal is
      always distinguishable from an empty result. An error whose message is the empty string is a
      refusal that says nothing - the agent learns only that something failed.
      LOW, and honestly so: this is the error path of a call that has ALREADY failed, so it needs a
      second failure to reach. The likely readings are a dropped connection mid-error-body or a
      non-UTF-8 body. Neither is common and neither loses data.
    why_undetected: |
      Same habit as BUG-9 and W6-S10 - `let _ =` on a Result an invariant depends on - which is now a
      pitfall in AGENTS.md. Found by extending that sweep into a component nobody was looking at.
      No test exercises a failing body read; every bridge test uses a live loopback response.
    fix: |
      On a failed read, return a message that says so - the status code plus "the error body could not
      be read" - rather than "". Never return an empty error string.
    note: |
      Also swept and NOT registered: main.rs:21-22 swallows the stdout write and flush in the stdio
      loop. That is defensible - there is nothing useful to do about a failure on the very channel you
      would report it over - and it is recorded here so the next sweep does not re-raise it.
    scheduled: W7-S3
    note_on_the_freeze: |
      NOT blocked, for the same reason as BUG-3: DEC-005 permits a fix and forbids new work.
    resolved_by: W7-S3, commit 362bfad
    resolution: |
      RESOLVED 2026-08-24. parse_error_response now delegates to parse_error_response_reader, which
      takes any std::io::Read, and NO path returns the empty string.

      THREE empty-message paths are closed, not the one BUG-10 named. The story found a second - a
      body that READS SUCCESSFULLY and is empty also produced "" - and a third, a non-UTF-8 body.

      THE REVIEW CHANGED THE REMEDY (finding M8). The first plan returned free-form strings such as
      "HTTP 502: (failed to read error response)". cross-cutting.md forbids exactly that: "The MCP
      Bridge does not invent its own errors. It maps a Local API envelope onto an MCP tool error,
      preserving code and message verbatim." A message with no catalogue code satisfies the letter of
      "not empty" while missing what AD-7 is for - its own rule is that a refusal is distinguishable
      from an empty result BY ITS CODE. The implementation now synthesises `internal`, the catalogue
      code for something the producer did not anticipate.

      Verified by the coordinator: 3 unit + 3 integration tests pass, and by MUTATION - replacing the
      synthesised message with String::new() turns two of the three unit tests red.
    status: resolved
  - id: BUG-11
    title: "There is no reproducible way to build the desktop application"
    found: "2026-08-23"
    found_by: coordinator, after a hand-built binary launched into a webview network error
    component: settings
    severity: high
    contradicts: [FR-27, BR-121, "codebase-stack-guide.md"]
    evidence: |
      The Tauri CLI is absent everywhere:
        `cargo tauri --version`            -> error: no such command: `tauri`
        `npx --no-install tauri --version` -> could not determine executable to run
        apps/desktop/package.json devDependencies -> no tauri package at all
        apps/desktop/package.json scripts -> dev, build, preview, typecheck, lint, test. No tauri.
        Cargo.toml has tauri, tauri-build and three plugins - the LIBRARIES - and no tauri-cli.
