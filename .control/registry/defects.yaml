      guard fails the build if either returns.

      The owner asked for exactly this and it is worth quoting, because it names the principle better
      than the defect did: "Harusnya textbox, textarea punya prilaku yang sama dimanapun di
      aplikasi."

      Guarded by the_product_has_exactly_one_text_entry_component and
      the_observation_summary_is_visible_persistent_and_outside_the_tab_body, verified by mutation.
