  - id: BUG-78
    title: A slider filled from its middle, Explorer opening the Desktop, and a deletion that took
      one Finding when the corpus had always said Findings
    found: "2026-08-28"
    found_by: the owner, fifth pass
    component: finding
    severity: medium
    contradicts: [FR-13, FR-37]
    root_cause: code
    evidence: |
      1. **The slider's filled track grew out of the centre**, symmetrically. An element with no `x`
         inside a plain Slint `Rectangle` is CENTRED, not left-aligned - the same default that made
         the 9999px radius render as a lens in `BUG-76` rather than as a stub. Two symptoms, one
         cause, and the first fix treated only the radius.

      2. **"Open file location" opened the Desktop.** `Command::arg` applies Rust's own quoting, and
         an argument containing a comma comes out wrapped AS A WHOLE, `"/select,C:\Vault\x.png"`.
         Explorer cannot parse that, and its documented response to an unparseable switch is to open
         the default folder. Compounding it, `image_path` is a Vault-relative key with forward
         slashes, so the joined path was `C:\Vault/findings/x.png`, which Explorer rejects too.

      3. **Deleting took one Finding.** And `FR-13` has always read *"Delete Findings"*, with a proof
         of *"Deleting three Findings removes them from the Editor and leaves no trace of their three
         image files"*. The corpus was right and the code was the mismatch - worth recording because
         it is the opposite of this session's usual direction.
    impact: |
      Point 2 made a working feature look broken in the worst way: it opened SOMETHING, so it read as
      pointing at the wrong file rather than as failing.
    why_undetected: |
      1 is rendering. 2 cannot be caught without running Explorer. 3 is the one that should have been
      caught: `FR-13`'s own proof names three Findings, and the implementation was written from the
      menu entry rather than from the requirement.
    fix: |
      DONE, 2026-08-28.

        - `x: 0` on both slider bars, explicit and commented, because the default is not what it
          looks like
        - `raw_arg` with quotes around the PATH only, and `/` replaced with `\`
        - `findings_to_delete` applies the filmstrip's own rule: a right-click ON the selection takes
          all of it, a right-click outside takes only that one. The dialog and the menu entry both
          say how many. A failure part-way through does not stop - it keeps going and reports the
          count, because stopping leaves the Reviewer with half a deletion they confirmed and no way
          to tell which half
        - `FR-13`'s `writes:` gains `VisualAnnotation`, which the cascade has done since migration 8

      The right-click-OUTSIDE-the-selection half is a decision rather than a request: the owner asked
      only that a delete take the selection. It is the convention every file manager uses, and
      without it a right-click on an unselected card would silently take eight others.
    decision: none - no `AD-` was contradicted.
