  - id: BUG-81
    title: The Vault folder could not be changed, and the migration was believed to be missing
    found: "2026-08-28"
    found_by: the owner, asking for the Settings menus to be brought to life
    component: settings
    severity: medium
    contradicts: [FR-16]
    root_cause: code
    evidence: |
      `FR-16` promises the Reviewer can choose where captures are stored. The first Settings build
      refused it, and the reason recorded on screen was that the migration code *"lives only in the
      archived Tauri build"*.

      That was wrong, and wrong in a way worth writing down: there is barely any migration to write.
      `finding.image_path` is a Vault-RELATIVE key, decided when the schema was written and stated in
      the data model - *"Relative to the Vault root, never absolute. A Vault move must not rewrite
      rows."* So moving the files IS the migration. The database is not touched at all.

      A decision made at G3 to keep a Vault move cheap had been forgotten, and the feature was
      refused on the strength of the forgetting.
    impact: |
      `FR-16` was unmet, and the reason given for it being unmet was false.
    why_undetected: |
      The refusal was written the same day, by the same hand, and it read as researched: it named a
      real file in the archive. Nobody checked whether the thing that file did was still needed.
    fix: |
      DONE, 2026-08-28. `migrate_vault` moves `findings/` and `bundles/`, recursing into a Bundle's
      own directory so its Markdown's relative links keep resolving. `rename` first - instant within a
      volume - falling back to copy-then-remove across volumes, and the REMOVE IS CHECKED: `AGENTS.md`
      records the archived version of this swallowing both `fs::remove_file` results with `let _ =`,
      which silently doubled the disk the Vault used.

      Order: move everything, THEN write the setting. A failure part-way leaves the old Vault
      authoritative and the old setting in place, so nothing is lost and nothing is half-pointing.

      One honest limit, stated on screen: it needs a restart. `AppContext` carries the vault path and
      an open `VaultBlobStore` and is cloned into every callback in `main.rs`; swapping it live means
      a lock every one of those closures has to take, which is a larger change than the feature for a
      folder that moves once. Nothing is inconsistent in the meantime - the paths are relative and
      already resolve against the new root.
    decision: none.
    status: fixed

  - id: BUG-82
    title: The hotkey editor could not say why a combination was refused, and the Vault moved without
      asking
    found: "2026-08-28"
    found_by: the owner, pointing at `wira-desk` as the reference
    component: settings
    severity: medium
    contradicts: [FR-16, FR-17, NFR-16]
    root_cause: code
    evidence: |
      The Settings screen shipped with a hotkey field that had one path: compose a string, hand it to
      `validate_and_rebind`, show whatever came back. So three very different situations produced the
      same silence or the same generic refusal:

        holding Ctrl on the way to Ctrl+Shift+S    silently ignored, indistinguishable from broken
        pressing a bare letter                     silently ignored
        picking a chord Windows owns               a raw error, after the OS had been asked

      And `on_vault_browse_clicked` started moving files the moment the picker closed. A hundred
      captures with no moment to change your mind, which is what the owner objected to: *"Artinya
      jangan sampai malah gak bisa jalan lagi setelah new vault."*
    impact: |
      `FR-17` was reachable and unusable - a Reviewer whose chord was refused had nothing to work
      from. `FR-16` was reachable and frightening.
    why_undetected: |
      Both were built the same day and tested by the person who wrote them, who knew which chords
      would work.

      The deeper reason is worth recording: the product this repository should have been reading is in
      the same folder. `wira-desk` at `D:/Developer/wiradigital.id/wira-desk` has solved the hotkey
      problem properly - a seven-case `ShortcutError`, a reserved-chord table naming the OWNER of each
      combination, canonical strings so two presses of one chord cannot store two strings, and a
      `KeyCheckVerdict` that separates "registered" from "actually received". None of it was looked at
      until the owner pointed.
    fix: |
      DONE, 2026-08-28. Taken from `wira-desk`, adapted rather than copied:

        `ShortcutRefusal`     three cases with their own sentences, each saying what to do next.
                              `NoModifier` explains that a bare key would fire while typing;
                              `UnsupportedKey` names the key; `Reserved` names the OWNER
        `reserved_chord`      a short table of combinations Windows or a universal editing shortcut
                              owns, with advice where anything can be done. Deliberately short - a
                              long list of chords nobody would try is a list nobody maintains
        canonical strings     modifiers always in one order, key always upper case, so two presses of
                              one combination cannot store two strings that fail to compare equal
        `Ok(None)`            a third state: the press is INCOMPLETE, not wrong. Telling the Reviewer
                              off for holding Ctrl would make the field impossible to use
        arrival check         the row confirms when the chord ACTUALLY FIRES. Registration only means
                              Windows accepted it; another application's low-level hook can still
                              swallow the keystroke, and this is the only proof available without
                              leaving the screen. `wira-desk`'s `KeyCheckVerdict` makes the same
                              distinction

      A contested chord with advice is BOUND and warned about rather than refused: Snapdown often wins
      the race for it, and refusing outright would be the product deciding something it does not know.

      The Vault move now asks first, names the folder and counts the files, and says plainly that the
      Findings keep working - they refer to their images by a Vault-relative path, so nothing in the
      Library changes.
    decision: none.
    status: fixed

  - id: BUG-83
    title: Resize had one lever where the owner needed two
    found: "2026-08-28"
    found_by: the owner
    component: finding
    severity: low
    contradicts: [FR-4]
    root_cause: requirement
    violates: FR-4
    evidence: |
      The Quality Budget bounded the LONG EDGE and nothing else. That was argued for, in this
      session, and the argument was sound as far as it went: for an agent audience reading cost tracks
      pixel area (`OQ-2`), so a cap is what bounds the bill, and a ratio would shrink captures that
      were already cheap.

      What the argument missed is that the Reviewer may simply want everything smaller. A cap cannot
      express that: a capture already under it is left alone by definition. The owner asked for the
      other tool by name - *"automatic resize, misal ke 80% default, bisa diset sesuai user, bukan
      hanya soal batas atas"*.
    impact: |
      A Reviewer who wanted every capture a fifth smaller had no way to say so.
    why_undetected: |
      It is not a defect in the usual sense - `FR-4` promises reduction under a budget and says
      nothing about which shape the budget takes. Recorded as `requirement` rather than `code` because
      the gap was in what had been specified, and the specification is what changed.
    fix: |
      DONE, 2026-08-28. `ResolvedPair` gains `resize_percent`, defaulting to 100 so nothing already
      stored is affected, with a floor of 25 - below a quarter a capture is a thumbnail and the text
      in it is gone.

      **The ratio applies BEFORE the cap**, and the order is load-bearing: applying the cap first and
      then the ratio would take a fifth off the CAP rather than off the capture, so a 4K screen and a
      2K screen would come out identical and the ratio would silently stop being a ratio.

      One real defect surfaced while wiring it: the reducer decided whether to resize by testing the
      CAP alone, so a ratio would have computed smaller dimensions and then stored the full-size
      pixels under them - a Finding whose recorded width and actual width disagreed. It now tests the
      computed dimensions against the original.

      `FR-4`'s consequences gain the ratio.
    decision: none - `FR-4` is amended rather than contradicted.
    status: fixed

  - id: BUG-84
    title: Every clipboard copy after the first one pasted the FIRST image, because the Bitmap setter never empties the clipboard
    found: "2026-08-30"
    found_by: kodesh87, manual test of the copy-only capture path
    component: desktop
    severity: high
    contradicts: [FR-36]
    root_cause: code
    violates: FR-36
    evidence: |
      `clipboard-win-5.4.1/src/raw.rs:787`, the library's own source and its own comment:

        pub fn set_bitmap(data: &[u8]) -> SysResult<()> {
            //Bitmap format cannot really overlap with much so there is no risk of having non-empty clipboard
            //Also it is backward compatible beahvior.
            //To be changed in 6.x
            set_bitmap_inner(data, options::NoClear::EMPTY_FN)
        }

      `NoClear` means `EmptyClipboard()` is never called. On Windows a `SetClipboardData` with no
      preceding `EmptyClipboard` leaves the existing handle for that format in place, so the SECOND
      write for `CF_BITMAP` is the one that does nothing.

      `apps/desktop/src/main.rs`, before the fix, in `copy_burned_image`:

        // `set_clipboard` opens, empties, writes and closes. Holding a `Clipboard` guard around it
        // would take the lock twice and deadlock.
        clipboard_win::set_clipboard(clipboard_win::formats::Bitmap, &bmp)

      The comment's "empties" is false for this format.
    impact: |
      The Reviewer copies a second image and pastes the first one. Silent: there is no error, the
      overlay closes normally, and the toast says the copy succeeded - because as far as our code can
      see, it did. Both clipboard paths were affected: the new copy-only capture chords, and the
      Editor's Copy button, which is `FR-36` and has shipped this way since it was written.
    why_undetected: |
      Two reasons, and the second is the interesting one.

      A single copy works, which is what a first test does. The defect needs two copies in one
      session to appear at all.

      And the comment quoted above ASSERTED the missing behaviour. It named `empties` explicitly, so
      a reader checking this path would have satisfied themselves it was handled and moved on. A
      comment that states a fact it never verified is worse than no comment: it converts an unchecked
      assumption into apparent evidence. The library's default is the trap, the comment is why nobody
      looked at the trap.

      No automated test could have caught it as written: asserting `EmptyClipboard` requires the real
      Windows clipboard, and a test that takes the clipboard during `cargo test` would clobber
      whatever the developer had copied.
    fix: |
      DONE, 2026-08-30. One `put_bitmap_on_clipboard` helper, used by both paths: takes the
      `Clipboard::new_attempts(10)` guard itself, then `raw::set_bitmap_with(bmp, options::DoClear)`,
      so the empty and the write happen inside ONE open. The old comment's warning about taking the
      lock twice no longer applies, and is replaced by a note recording why it was wrong.

      Verified by the owner: three consecutive copies from three different captures pasted three
      different images, and the Editor's Copy button was checked across two Findings.

      NOT covered by a test, deliberately - see `why_undetected`. An `#[ignore]`d manual test is the
      open option.
    status: fixed

  - id: BUG-85
    title: Filmstrip click delay is back - BUG-41's fix never accounted for the blur BUG-73 added into the same path
    found: "2026-08-30"
    found_by: kodesh87, manual test ("kenapa gak kali membuka gambar dari filmstrip, delaynya cukup lama")
    component: finding
    severity: medium
    contradicts: []
    root_cause: code
    evidence: |
      `BUG-41` fixed this exact symptom on 2026-08-27 by splitting `load_active_detail` out of the
      full filmstrip rebuild, measuring 320.9ms -> 10.5ms per click. Its `measurement` field was never
      re-checked after `BUG-73` (2026-08-28) added `blurred_capture()` into that same function:
      `blurred_capture` runs `MarkerBurner::blur_rect` over the WHOLE image, synchronously, on the UI
      thread, on every first-time click of a Finding - and `blur_rect`'s `box_pass` re-summed the
      entire `2*radius+1` window from scratch for every output pixel, an O(width*height*radius) cost
      that `BUG-73`'s own fix note wrongly described as O(pixels).

      Measured directly (release build, `blur_rect` alone, default radius): 1920x1080 496ms,
      2560x1440 1398ms, 3840x2160 3402ms. This is the delay the owner reported again.
    impact: |
      Same as `BUG-41`: browsing the Library feels slow at the moment the Reviewer is looking for
      something, and it scales with the clicked image's own resolution - worse on a multi-monitor
      capture.
    why_undetected: |
      Same root cause pattern as the `BUG-12`/`BUG-3`/`BUG-10` case AGENTS.md's pitfalls section
      already names: a defect's `status: fixed` measurement is a claim about the code at one moment,
      and it goes stale silently once another change lands in the same path. `BUG-41` was correct when
      written; `BUG-73` invalidated its premise a day later and nothing re-measured it.
    fix: |
      DONE, 2026-08-30. `box_pass` (`crates/snapdown-store/src/image/burner.rs`) rewritten from the
      naive full-window resummation to a sliding-window running sum, O(pixels) per pass instead of
      O(pixels * radius). The vertical direction was further reworked to process one whole row at a
      time (one running sum per column) instead of walking memory in a `width`-stride column order,
      which was the dominant remaining cost after the first fix (cache-unfriendly for a
      screenshot-sized image).

      Measured after (release build, default radius): 1920x1080 78.9ms (was 496ms), 2560x1440 127.3ms
      (was 1398ms), 3840x2160 304.6ms (was 3402ms). Output is unchanged - guarded by
      `box_pass_matches_the_naive_full_window_resummation_it_replaced`, which compares the new
      implementation against the original kept as a test-only reference, across seven size/radius
      combinations including edge cases. A second guard,
      `blur_rect_stays_well_under_the_old_full_window_resummation_cost`, asserts an 800x600
      `blur_rect` call stays under 3000ms and was verified by mutation: temporarily rewiring
      `blur_rect` back to the naive reference implementation made it fail at 3865ms.

      FOLLOW-UP, same day: the owner asked for further optimization. `box_pass` was split across CPU
      cores by row band using `std::thread::scope` (no new dependency, no `unsafe`) once an image
      reaches `PARALLEL_ROW_BAND_PIXEL_THRESHOLD` (1,000,000 pixels; below that, thread-spawn
      overhead was measured to cost more than it saves). Row bands are safe because both directions
      are keyed by row: a horizontal row is independent of every other row, and a vertical row band
      only needs one extra full-window resum at its own first row instead of assuming a sum carried
      over from a row another thread owns.

      Measured after (release build, default radius, 12 logical cores): 1920x1080 57.6ms (was
      78.9ms), 2560x1440 91.4ms (was 127.3ms), 3840x2160 212.8ms (was 304.6ms) - sub-linear in core
      count because this is memory-bandwidth-bound, not compute-bound. Correctness across the
      threaded path specifically is covered by a new `(1400, 901, 16)` case in the same guard test
      (1,261,400px, above the threshold, an uneven row count to force an uneven last band). A second
      mutation-verified performance guard,
      `blur_rect_above_the_parallel_threshold_stays_faster_than_running_sequentially`, catches
      threading silently failing to engage (the first guard's 800x600 case is below the threshold and
      would not notice that regression) - a 1920x1080 call under 1200ms, which failed at 1634ms when
      the sequential branch was forced on, consistent with the ~1668ms this took before threading
      existed.

      SECOND FOLLOW-UP, same day: SIMD was tried, not left un-attempted. A `Vec4` wrapping
      `[f32; 4]` in one SSE2 `__m128` (via `std::arch::x86_64`, no new dependency, no runtime
      feature detection needed - SSE2 is x86_64 baseline) replaced the per-channel loops in both
      band functions. Measured back-to-back on this machine, release build: the explicit-SIMD
      `Vec4` and a plain-array `Vec4` (identical code, intrinsics swapped for elementwise arithmetic
      via a forced `#[cfg]`) were statistically indistinguishable - both ~51-56ms at 1080p,
      ~91-106ms at 1440p, ~201-206ms at 4K. LLVM's autovectorizer was already turning the plain
      fixed-4-element array loop into equivalent SIMD on this release build, so the explicit
      intrinsics bought nothing and were reverted rather than merged for `unsafe` code and an
      architecture-specific path that weren't earning their cost.

      STILL not fully closed at 4K: ~213ms is a 16x cumulative improvement over the original 3402ms
      but still not strictly imperceptible, and the two approaches obviously available (algorithmic,
      threading) are now exhausted along with SIMD. Ticket:
      `.scratch/filmstrip-blur-perf/issues/01-box-pass-no-longer-o-radius-per-pixel.md`.
    status: fixed
  - id: BUG-86
    title: Every image link in every Bundle's Markdown resolved to nothing - the serializer wrote paths relative to the Vault root while the document lived in a per-Bundle folder
    found: "2026-08-31"
    found_by: kodesh87, while charting the Bundle Library map ("export lokal tidak relevan kalau cuma export markdown dan gambar, karena markdown dan gambar sebenarnya sudah di lokal")
    component: bundle
    severity: high
    contradicts: []
    root_cause: code
    evidence: |
      `MarkdownSerializer::serialize_bundle` emitted `format!("./{}", item.image_path)`, and
      `BundleItem.image_path` is Vault-ROOT-relative (`bundles/<id>/finding_N_burned.png`). But the
      document itself is written to `bundles/<id>/bundle.md`, so a CommonMark reader resolving that
      link against the Markdown's own folder landed on
      `<vault>/bundles/<id>/bundles/<id>/finding_N_burned.png` - one duplicated `bundles/<id>/`
      segment past the file, which sits right beside `bundle.md`.

      So NOT ONE image loaded, in any reader: Obsidian, VS Code preview, GitHub preview, or a local
      coding agent handed the path. `NFR-8` states the requirement outright - "every image reference
      resolving relative to the Markdown file's own folder" - and names its enforcement as "a
      rendering test over a composed Bundle". That test did not exist.

      What existed instead were FIVE string-containment assertions that baked the broken form in as
      expected output, so the defect was green everywhere: `markdown.rs:161`,
      `test_markdown_serializer.rs:87` and `:99`, `test_golden_markdown.rs:122`, and
      `main.rs:5734`. Two of those are byte-for-byte golden comparisons, which is exactly the shape
      that looks like the strongest possible guard and here asserted a copy of the bug.

      The layout was presumably once flat - `bundles/<id>.md` beside a `bundles/<id>/` image folder -
      under which `./bundles/<id>/...` read from the Vault root would have worked. `markdown_path`
      later moved into the per-Bundle folder; the serializer's base did not move with it. The
      serializer had no way to notice, because it was never told where the document goes.

      Found by inference, not by a test or a bug report: the owner argued that a local Markdown export
      feature was pointless because the Vault copy is already portable. Checking whether that premise
      held is what surfaced the defect - the premise was right in principle and false in fact.
    fix: |
      `serialize_bundle` now takes `markdown_path` and computes each link through
      `image_reference(markdown_path, image_path)`, which expresses the image relative to the folder
      the document sits in. Emitted links became `./finding_N_burned.png`.

      `markdown_path` is a PARAMETER rather than an assumption specifically so this class of drift
      cannot repeat: in `plan_bundle` one binding now feeds both the serializer and
      `PlannedBundle.markdown_path`, so the document's location and the base its links are written
      against cannot diverge. `recompose_markdown` passes the planned Bundle's own path. When the
      image is not under the document's folder - a layout the function was not told about - it
      returns the Vault-relative path unchanged rather than guessing, and the test below is what
      fails.

      `NFR-8`'s missing enforcement is now
      `crates/snapdown-store/tests/test_nfr8_image_resolution.rs`:
      `every_image_link_in_a_composed_bundle_resolves_from_the_markdown_files_own_folder`. It lays a
      composed three-Finding Bundle out on disk exactly as `write_bundle` does, parses every
      `![...](...)` target out of the document, and resolves each one THE WAY A READER DOES - joined
      to the Markdown file's own folder - asserting the file is there. It is deliberately insensitive
      to how the serializer computes the path, so it catches the next drift whatever shape that takes.

      The five assertions that enshrined the broken form were updated rather than deleted; the one in
      `main.rs` guards `BUG-21` (burned copy, never the clean Finding image) and that invariant is
      preserved, now asserted as `](./finding_1_burned.png)`.
    verified_by: |
      Seen red before the fix, with the defect's own signature in the failure message: `"./bundles/
      b-nfr8/finding_1_burned.png" does not resolve to a file from the Markdown's own folder`,
      naming the doubled segment and the real location of the file.

      Then mutation-verified after the fix rather than trusted: forcing `image_reference`'s successful
      strip to fall back to the Vault-relative form put the test back to FAILED with that identical
      message; restoring it returned it to ok. So the test is sensitive to this specific defect and
      not passing for an unrelated reason.

      `cargo fmt --all -- --check`, `cargo clippy --workspace --all-targets -- -D warnings` and
      `cargo test --workspace` all clean.
    status: fixed
  - id: BUG-87
    title: The parallel-blur regression guard compared against a fixed millisecond figure and was flaky on shared CI runners
    found: "2026-08-31"
    found_by: kodesh87, "kenapa tidak main saja? langsung push" - CI failure comparison against the pre-existing red on main
    component: finding
    severity: low
    contradicts: []
    root_cause: code
    evidence: |
      `blur_rect_above_the_parallel_threshold_stays_faster_than_running_sequentially`
      (`crates/snapdown-store/src/image/burner.rs`) asserted `elapsed.as_millis() < 1200`, a number
      measured once on the author's own machine (~455ms threaded, ~1668ms unthreaded, 1200ms chosen
      between the two). On the `windows-latest` GitHub Actions runner it measured 1427ms and failed -
      not because threading stopped engaging, but because the runner is roughly three times slower
      than the machine the threshold was calibrated against, and `cargo test`'s own parallel test
      execution contends further for the same cores this guard is trying to measure.

      Confirmed pre-existing rather than caused by any code change under review: the identical test,
      with the identical failure message shape, was already red in the immediately prior CI run on
      `main` (`bd694d5`, 2026-08-30), one push before this one.
    fix: |
      Replaced the fixed-millisecond comparison with a self-calibrating one. The test now measures,
      in the same run, on whatever machine it executes on: does splitting this exact 1920x1080 blur
      across `available_parallelism()` bands actually run faster than doing the identical arithmetic
      as one band? Both sides call the same private band functions `box_pass` itself calls - the
      "sequential" side is `box_pass`'s own fallback path, run explicitly rather than reached via its
      size threshold - so there is no second implementation to drift from the real one, and no
      cross-machine assumption left in the assertion. A 90% margin absorbs thread spawn/scheduling
      noise without losing sensitivity to the actual regression: threading silently failing to engage
      leaves the "threaded" side running the identical work the "sequential" side does, plus overhead,
      which is never faster. Skips outright on a single-core runner, where `box_pass` itself never
      takes the parallel branch and there is nothing to compare.
    verified_by: |
      Mutation-verified, not merely re-observed passing: forcing `box_pass`'s threading condition to
      always take the sequential branch (`if threads <= 1 || ...` -> `if true`) turned the test FAILED
      with a message naming the exact comparison ("took 1.309s, not meaningfully faster than ...
      1.329s"); restoring the condition returned it to passing. So the guard is sensitive to the
      specific regression it exists to catch, not passing for an unrelated reason.

      `cargo test -p snapdown-store --lib image::burner::box_pass_regression_guard`: 3 passed.
      `cargo fmt --all -- --check` and `cargo clippy --workspace --all-targets -- -D warnings` clean.
    status: fixed
  - id: BUG-88
    title: Deleting a Bundle is unreachable, so FR-14, BR-20 and BR-23 are unmet
    found: "2026-08-31"
    found_by: wdi-review, tracing BR-5's widened all-or-nothing clause to the delete path it constrains
    component: bundle
    severity: high
    contradicts: [FR-14, BR-5, BR-20, BR-23, AD-2, "UC-12", "CAP-5"]
    root_cause: code
    evidence: |
      `BundleStore` has four methods. Counted call sites in `apps/desktop/src/`, the live Slint app:

        create_bundle            1   main.rs:2579
        list_bundles             1   main.rs:272   - and only to build the filmstrip's filter set
        delete_bundle            0
        update_bundle_markdown   0

      The only callers of `delete_bundle` in the tree are in `archive/desktop-tauri/`
      (`src-tauri/src/commands/bundle.rs:190` and `:253`), the implementation `DEC-007` replaced.

      So a Reviewer running Snapdown cannot delete a Bundle at all. `UC-12` - "I get rid of a review
      and everything in it" - is the ONLY use case in `bundle` marked `critical: yes`, on the grounds
      that it removes files irreversibly and may end a Publication. It cannot be reached.

      `crates/snapdown-store/tests/test_bundle_deletion.rs` exercises `delete_bundle` and passes. This
      is the failure mode AGENTS.md names as this repository's most expensive: a green unit test over a
      component nothing mounts. Four such components were found in one sweep on 2026-08-23; this is a
      fifth instance, and the store method is the reachable half rather than the component.

      There is also no file removal wired to it. `crates/snapdown-store/src/` contains exactly ONE
      `fs::remove_file`, at `vault/mod.rs:152`, a generic blob helper. `delete_bundle` itself runs
      `DELETE FROM bundle WHERE id = ?1` and nothing else (`sqlite/bundle_store.rs:277`), relying on
      the `ON DELETE CASCADE` to `bundle_item`. So even when a caller exists, `AD-2`'s "create or
      remove that record's files in the same unit of work" has nothing implementing the file half.
    fix: |
      Wire a deletion path in the Slint app, and give it the file half. The behaviour is already
      specified and MUST NOT be re-decided here:

      - `AD-2` sets the ordering - the row before its files, prior state intact if any part fails.
      - `BR-5` (widened 2026-08-31) says nothing changes if any part fails, and the Reviewer is told
        which file refused.
      - `BR-23` requires the unpublish first, and `BR-20` forbids reporting a success that did not
        happen - so an unreachable service means the deletion refuses rather than proceeds.
      - `.scratch/bundle-library/` holds the surface: which verb sits on which row, and the four
        confirmation dialogs. `BUG-9` already fixed the `let _ =` swallowing in the archived version;
        do not reintroduce it.

      Note the ordering trap: the map settled files-first and was corrected against `AD-2` on
      2026-08-31. Read the map's correction entry before implementing, not the older line.
    status: open
  - id: BUG-89
    title: "The Editor window does not name its persona, and two of FR-27's three names are unasserted"
    found: "2026-09-01"
    found_by: the experience-bar assessment for DEC-005, ticket 06 of the Bundle Library map
    component: settings
    severity: medium
    contradicts: [FR-27, DEC-003]
    root_cause: code
    evidence: |
      `FR-27`, verbatim: "the tray and the installed executable are Snapdown, and the workspace
      window titles itself Snapdown Editor."

      The shipped window says `Snapdown` in both places it says a name:

        apps/desktop/ui/appwindow.slint:1132   title: "Snapdown";
        apps/desktop/ui/appwindow.slint:1630   text: "Snapdown";   <-- the custom titlebar's label,
                                               which is what a Reviewer actually reads, because the
                                               window is `no-frame: true` and draws its own chrome

      The tray tooltip (`apps/desktop/src/tray.rs:54`) and the executable are `Snapdown`, and both are
      correct. So all three agree - and that IS the failure. `FR-27` asks the Editor to be
      DISTINGUISHABLE from the tray persona, and a Reviewer looking at the window cannot say which
      part of the product they are in.

      This is a REGRESSION and the register already holds the proof. `BUG-11`'s note records the one
      thing verified from the Tauri build before it was retired: "the window title read 'Snapdown
      Editor'. W6-S2's persona naming (DEC-003, FR-27) is correct in a real running window." `DEC-007`
      rewrote the front end in Slint and the name did not travel.

      OBSERVED IN A RUNNING RELEASE BINARY, 2026-09-02. Until now this row rested on reading two
      string literals. `target/release/Snapdown.exe`, rebuilt at 11:38 that day, was launched and
      the running process reported `MainWindowTitle` = `Snapdown`. So the defect is confirmed from
      the outside, by the operating system rather than by the source, which is the one form of
      evidence `BUG-11`'s note had for the OPPOSITE result on the retired Tauri build. The two
      observations together are what make this a regression rather than a thing never done.
    impact: |
      `FR-27` exists because the owner, on their first sustained look at r2, could not name the
      application they had opened. Half of that requirement - the half about which persona is on
      screen - is not delivered, and it is the half a Reviewer meets every time they open the Editor.

      Small in code, and it is one of the two cheapest items standing between the product and
      `DEC-005`'s experience bar. See `.control/reports/ASSESS-EXPERIENCE-BAR-2026-09-01.md`, item B1.
    why_undetected: |
      `FR-27`'s own consequence promises "A test asserts the three against one source." ONE of the
      three is asserted: `apps/desktop/tests/test_executable_identity.rs` reads the crate's `[[bin]]`
      table and requires exactly one binary named `Snapdown`. Nothing asserts the tray tooltip and
      nothing asserts either window label, so a whole front-end rewrite could drop one of them in
      silence - and did.

      The gap is the same shape as `NFR-17`'s was before `DEC-009`: a requirement naming an
      enforcement that covers a third of what it claims to cover.
    fix: |
      Two string literals and one test, and the test is the part that matters:

      - `appwindow.slint:1132` and `:1630` become `Snapdown Editor`. The capture overlay's own title
        (`:99`, "Snapdown Capture Overlay") is correct already and is not touched - it belongs to the
        tray persona and names itself as an overlay, not as the Editor;
      - extend `test_executable_identity.rs` to assert all three of `FR-27`'s names against one
        source, which is what the requirement already promised. Assert the SHIPPED strings, not a
        copy of them: AGENTS.md's "a test that asserts a literal is a test that cannot fail" applies
        directly - read `appwindow.slint` and `tray.rs` and compare, do not restate the names in the
        test.

      Do NOT fold this into a wider naming pass. The executable half is already covered and fixed -
      `BUG-13` corrected the CI guard to count DESKTOP executables rather than every `.exe`, and
      `test_executable_identity.rs` keeps the second-binary confusion from returning. What is missing
      is only the window's own two labels and the assertions over the other two names.
    resolved: |
      2026-09-02, on the owner's decision: the executable and the tray stay `Snapdown`, and the
      main working window is `Snapdown Editor` - which is `FR-27` as already written, so no
      requirement moved.

      `appwindow.slint:1132` (the OS title) and `:1630` (the custom titlebar's own label, which is
      what a Reviewer actually reads, the window being `no-frame`) both say `Snapdown Editor`.
      `:99`, the capture overlay's `Snapdown Capture Overlay`, was deliberately left alone: it
      belongs to the tray persona and already names itself past the product name.

      `test_executable_identity.rs` now delivers what `FR-27`'s consequence promised - the three
      names against ONE source. The source is the crate's `[[bin]]` name; the other two are
      DERIVED from it (`{product}` for the tray, `{product} Editor` for the window), so the
      product's name is never restated in the test and a rename in `Cargo.toml` makes every
      assertion demand the new name rather than passing on a stale copy of its own input.
      A fourth test forbids any label in `appwindow.slint` from being the bare product name,
      which is the assertion that catches a second `:1630`-shaped site being added later.

      SEEN RED FIRST, per the standing rule that a guard never watched failing is a claim rather
      than proof. Against the unfixed file: `the_workspace_window_titles_itself_the_editor`
      failed `left: "Snapdown"` / `right: "Snapdown Editor"`, and
      `no_label_in_the_editor_window_wears_the_bare_product_name` failed `left: 2` / `right: 0`.
      The two names that were already correct - the executable and the tray - stayed green
      throughout, so the guard discriminates rather than failing wholesale. After the fix all
      four pass; `cargo fmt`, `clippy -D warnings` and `cargo test --workspace --no-fail-fast`
      all exit 0 with 41 `test result: ok` lines.
    status: fixed

  - id: BUG-90
    title: "BUG-86's fix never repaired a Bundle composed before it - every pre-fix Bundle's image link still resolves to nothing"
    found: "2026-09-03"
    found_by: 'kodesh87, manually testing the just-merged Bundle Library feature (tickets 10-19) - "kenapa gak ada gambar yang dirender ketika: view bundle, edit bundle?"'
    component: bundle
    severity: high
    contradicts: [NFR-8, FR-12]
    root_cause: code
    evidence: |
      `BUG-86` (2026-08-31) fixed `MarkdownSerializer::serialize_bundle` for every Bundle composed
      FROM THEN ON. Nothing repaired a Bundle's stored document that had already been written with
      the old broken form - `serialize_bundle` only ever runs once, at compose time, so a Bundle's
      `bundle.md` (and its `bundle.markdown` DB column, the same text) keeps whatever the serializer
      produced the day it was composed, forever, unless something else rewrites it later.

      Confirmed against real data: every one of the 10 Bundles in a real Vault, all composed
      2026-08-27/28 (four days before the fix), still carries
      `![Finding 1](./bundles/<id>/finding_1_burned.png)` - the exact doubled-`bundles/<id>/`-segment
      shape `BUG-86`'s own evidence names - while the file actually sits one level up, beside
      `bundle.md`. `resolve_bundle_document_image` (ticket 13, correct per `NFR-8`: resolve against
      the document's own folder) faithfully reproduces `BUG-86`'s exact broken resolution for these
      Bundles, landing on a path that has never existed.

      This was invisible before ticket 13/14 (Review & Update) and ticket 12 (Copy Markdown) existed,
      because nothing previously read a Bundle's OWN stored image link back out - Review & Assemble
      only ever re-derives from live Findings when composing. Ticket 13 is the first consumer that
      reads a Bundle's image the way `BR-11` requires (from the stored document alone, never a
      Finding), which is what finally exposed a defect four days older than the ticket that found it.
      Two symptoms, one cause: Review & Update shows no image for any pre-fix Bundle (view AND edit
      mode - both build the same blocks), and Copy Markdown (`bundle_markdown_for_clipboard`) hands
      an agent or a Markdown reader the identical broken link, since it rebases the SAME stored,
      still-broken document.
    fix: |
      A self-healing repair, `repair_bundle_image_links` (`apps/desktop/src/main.rs`), run once per
      Bundle the first time the Library reads it (`build_library_rows`). For each Finding: if its
      image link as stored resolves to a real file, it is left untouched; only when that resolution
      finds nothing AND stripping one duplicate copy of the document's own folder from the link's
      front DOES resolve to a real file is the link corrected - two-sided confirmation, so a link is
      never rewritten onto a target that also does not exist (a document with no repairable pattern,
      or a genuinely orphaned Bundle, is left exactly as stored rather than guessed at).

      Writes the file first, atomically, then the row (`AD-2`'s order), reusing ticket 14's
      `update_bundle_name_and_markdown` with `updated_at` passed back UNCHANGED - this is a repair,
      not a Reviewer's edit, and ticket 15's "edited" suffix must never appear on a Bundle nobody
      touched. Runs once per Library open; by the time any row is clickable, both Review & Update
      (`open_review_update`) and Copy Markdown (`bundle_markdown_for_clipboard`) already re-read the
      store fresh rather than reusing the Library's own list, so both see the corrected document with
      no separate fix needed at either seam.

      SEEN RED FIRST: a real PNG was written at a Bundle's true image location, never at the doubled
      one, with a hand-built document carrying `BUG-86`'s exact broken link. Before any fix,
      `resolve_bundle_document_image` on the stored link finds no file - asserted directly in the
      test. `repair_bundle_image_links` was then stubbed to an immediate `return` and the full
      regression test re-run: it failed exactly as expected
      (`left: "./bundles/b-legacy/finding_1_burned.png"` / `right: "./finding_1_burned.png"`). Restored,
      re-ran, green. Two further tests prove the two-sided guard: an already-correct document is left
      byte-for-byte alone (no row write), and a link that resolves nowhere either way is left exactly
      as stored rather than corrected onto a guess. `cargo fmt`, `clippy -D warnings` and
      `cargo test --workspace --no-fail-fast` all exit 0.
    status: fixed

  - id: BUG-91
    title: "A Library row's hover icons flickered on and off the moment the cursor moved onto one of them"
    found: "2026-09-03"
    found_by: kodesh87, manually testing the just-merged Bundle Library feature - "suka hilang2 iconnya pas saya gerakkan cursor disini" (a screenshot of the row's icon area, cursor mid-row)
    component: bundle
    severity: medium
    contradicts: []
    root_cause: code
    evidence: |
      `library.slint`'s row: `row-touch` (a `TouchArea`) covers the whole 54px row. A later sibling -
      painted on top, per Slint's declaration-order-is-paint-order rule - holds the thumbnail, the
      name/meta text and, gated by `if row-touch.has-hover : HorizontalLayout { ... }`, the row's
      three hover icons (Copy Markdown, Open file location, overflow), each with its OWN `TouchArea`.

      Confirmed empirically, not by reading Slint's source and guessing: a minimal, self-contained
      reproduction of this exact shape (outer `TouchArea` + a later sibling holding its own
      `TouchArea`s, gated on the outer one's `has-hover`) was driven headless with a
      `slint::platform::WindowEvent::PointerMoved` sweep across the row, 5px at a time, reading
      `row-touch`'s `has-hover` after each step:

        x=  0.0..120.0  probe_hover=true              (over the thumbnail/name area - stable)
        x=125.0         probe_hover=false   <- FLIP    (the icon group's own bounds start here)
        x=130.0         probe_hover=true    <- FLIP
        x=135.0         probe_hover=false   <- FLIP
        x=140.0         probe_hover=true
        x=145.0         probe_hover=true
        x=150.0         probe_hover=false   <- FLIP
        ... (12 flips total across the icon group's ~65px width, alternating almost every 5px step)

      The mechanism: once the cursor sits over one of the icons' own `TouchArea`s (declared later,
      painted on top, geometrically inside `row-touch`'s bounds), Slint's hit-test stops delivering
      hover to `row-touch` for that position. Because the icon group's very EXISTENCE is gated with
      `if` on `row-touch.has-hover` alone, that single frame tears the whole subtree down - which
      removes the icons' `TouchArea`s from the hit path, hands hover back to `row-touch` (nothing else
      occupies that pixel now), which flips `if` back to true and rebuilds the group, which puts the
      icons' `TouchArea`s back in the hit path, which takes hover away from `row-touch` again - a
      feedback loop with no stable state, running once per pointer-move event delivered while the
      cursor sits anywhere over the icon group.

      Confirmed as the ONLY instance of this shape in the whole UI tree
      (`grep -rn "if .*\.has-hover.*:" apps/desktop/ui/` returns exactly one hit, this one) -
      `ticket 12`'s own addition, not a pattern inherited from elsewhere.
    fix: |
      The icon group (`library.slint`) is now a named, ALWAYS-instantiated `HorizontalLayout`
      (`icon-actions`), gated with `visible:` rather than `if`, and its condition ORs in every
      `TouchArea` in the group alongside `row-touch`'s own:
      `row-touch.has-hover || copy-touch.has-hover || reveal-touch.has-hover ||
      overflow-touch.has-hover`. Since Slint DOES correctly set `has-hover` on whichever element
      currently wins the hit-test (the icon itself, once the group exists and the cursor sits over
      it), the OR keeps the group visible continuously across the handoff, instead of the single term
      that dropped to false the instant the icons became the hit target.

      SEEN RED FIRST: the same headless sweep re-run against the fix candidate, checking the icon
      group's own resolved `visible` value (not `row-touch.has-hover` alone, which still fluctuates
      internally and is now irrelevant on its own) - 0 flips across the full sweep, and confirmed to
      correctly resolve back to `false` once the cursor left the row entirely (not just permanently
      stuck on). The regression test
      `the_row_hover_icons_are_gated_by_visible_ored_across_every_touch_area_not_by_an_if_on_row_touch_alone`
      (`test_library_wiring.rs`) was then run against the ORIGINAL `if row-touch.has-hover` source,
      re-created by reverting the file: it failed exactly as expected, naming the anti-pattern.
      Restored, re-ran, green.

      This crate has no `[lib]` target - every existing test in this repo's desktop suite reads
      `.slint`/`.rs` source text rather than driving a live component, because there is no way to link
      a compiled `SdLibrary` instance into an integration test binary. The regression test added here
      keeps that same shape (source-reading, asserting the fix's structure is present) rather than
      faking a live-interaction test that cannot actually exist against this crate's current layout -
      the headless sweep that found and proved the fix was a throwaway probe outside the repository,
      not a shipped test. `cargo fmt`, `clippy -D warnings` and `cargo test --workspace --no-fail-fast`
      all exit 0.
    status: fixed

  - id: BUG-92
    title: "The Library row's overflow-button dots sat pinned to the top of their button, not centred"
    found: "2026-09-03"
    found_by: kodesh87, manually testing the just-merged Bundle Library feature - "di kotak paling kanan, ada titik 3 yang terlalu ke atas, keluar dari layout persegi"
    component: bundle
    severity: low
    contradicts: []
    root_cause: code
    evidence: |
      `library.slint`'s overflow button draws its three dots inside a `HorizontalLayout` with
      `alignment: center` and no explicit height. `alignment` on a `HorizontalLayout` sets only the
      MAIN (horizontal) axis, per its own doc comment in Slint's builtins
      (`in property <LayoutAlignment> alignment;` - "Set the alignment along the main (horizontal)
      axis"); the CROSS (vertical) axis has its own separate property, `cross-axis-alignment`, which
      was never set. Left at its default, three fixed-size 2.3px dots inside the button's full 28px
      height sat at the top rather than centred.

      Easy to miss until now: `BUG-91`'s hover flicker made the whole icon group - dots included -
      hard to look at for more than a fraction of a second at a time, so a static misalignment inside
      it went unnoticed until that flicker was fixed and the button finally held still.
    fix: |
      Added `cross-axis-alignment: center;` beside the existing `alignment: center;` on the dots'
      `HorizontalLayout`. Regression test `the_overflow_buttons_dots_are_centred_on_both_axes`
      (`test_library_wiring.rs`) added and SEEN RED FIRST: run against the file with the new line
      removed, it failed naming exactly this; restored, re-ran, green. `cargo fmt`, `clippy -D
      warnings` and `cargo test --workspace --no-fail-fast` all exit 0.
    status: fixed

  - id: BUG-93
    title: "A toast fired while any full-window overlay was open painted behind it, not over it"
    found: "2026-09-03"
    found_by: kodesh87, manually testing the just-merged Bundle Library feature - "ketika library sedang hidup, notifikasinya malah di jendela snapdown editor (misal soal copied markdown)"
    component: settings
    severity: medium
    contradicts: []
    root_cause: code
    evidence: |
      `appwindow.slint`'s toast `Rectangle` carried its own comment: "RESULT LINE - last declared, so
      it draws over everything." True the day it was written - false the moment the first overlay was
      added below it in the file. By the time this was found, FIVE more had landed after the toast,
      each one now painting on top of a toast that believed it was on top of everything: the Library,
      Review & Update, Settings, Reclaim space, the Vault-move confirmation, the delete-Finding
      confirmation, the canvas/filmstrip context menu, and Assemble & Review. Since Slint paints later
      siblings over earlier ones, a toast fired while ANY of those was open (Copy Markdown's, for
      instance, fired from inside the Library) rendered behind that overlay's own backdrop instead of
      over whatever the Reviewer was actually looking at - functionally invisible in every case where
      the overlay is opaque or has its own scrim.
    fix: |
      The toast `Rectangle` moved to the true end of the component - after every overlay's own mount
      point - so it is genuinely the last thing declared, and its comment corrected to explain why it
      moved rather than merely re-asserting the same claim in a new place (the load-bearing kind of
      staleness `AGENTS.md` itself warns about: a claim that would steer the next reader wrong). Only
      the Rectangle moved; its two clearing `Timer`s stayed where they were, since a `Timer` is not a
      rendered element and its position has no effect on paint order.

      A new regression test, `the_toast_is_declared_after_every_full_window_overlay_so_it_paints_on_top_of_all_of_them`
      (`test_toast_paints_over_every_overlay.rs`), asserts the ORDERING property directly - the toast
      must be declared after every named overlay - rather than re-checking a fixed list that would
      silently stop meaning anything the next time a ninth overlay lands below the eight named here
      instead of below the toast. SEEN RED FIRST: run against the pre-fix file (`git show HEAD:...`,
      since the fix was not yet committed), it failed on the very first overlay checked, naming
      exactly the defect; the fix was restored and it passed. `cargo fmt`, `clippy -D warnings` and
      `cargo test --workspace --no-fail-fast` all exit 0.
    status: fixed
