        _bmad-output/specs/w1-settings/review-W1-S1-reviewer-a.md:46
          "vite build fails, therefore cargo tauri build fails, therefore frontendDist is never
           produced. cargo tauri dev serves http://localhost:5173 with no document."
        _bmad-output/specs/w1-settings/dispatch-briefs/W1-S1-ui-verification-finish.md:65
          "HOW TO RUN IT: cargo tauri dev from apps/desktop, or build and run target/debug/
           desktop.exe WITH THE VITE DEV SERVER UP."
      So the defect is sharper than "nobody documented it". A W1 reviewer diagnosed this exact
      failure mode - frontendDist never produced, the webview falling back to localhost - raised it
      as a must-fix, and the CLI it depends on was still never made a dependency of the repository.
      The knowledge lived in a wave's scratch output, which `_bmad-output/` is explicitly allowed to
      hold and which nothing carries forward.
    impact: |
      `cargo build --release -p snapdown` compiles and links, and the binary it produces is NOT the
      application. Launched, its webview requests the `devUrl` from tauri.conf.json
      (http://localhost:5173), nothing is serving it, and the window shows
      "localhost refused to connect - ERR_CONNECTION_REFUSED". Verified by screenshot on 2026-08-23.
      The bundled `frontendDist` is only wired in by the Tauri CLI, which is not here.
      So: the shipped Snapdown.exe was built by some means nobody wrote down, nobody can reproduce
      it, and CI has never built the product it is testing the parts of.
      BR-121 says a build produces exactly one desktop executable. It is asserted by a unit test that
      reads Cargo.toml and tauri.conf.json - which is the right proxy for the DECLARATION and proves
      nothing about a build, because there is no build to run.
    why_undetected: |
      Everything around it is green and none of it builds the app. cargo test compiles the crates,
      npm run build bundles the frontend, and the two are never joined. The gap is exactly the seam
      between them - the same shape as BUG-4, which was the seam between the Rust window builder's
      URL and the frontend's routing. Seams have no owner here.
      It surfaced only because a UI verification was attempted against a SELF-BUILT BINARY. That
      appears to be the first time in this project: W1's UI verification brief told its worker to run
      `cargo tauri dev` with the Vite dev server up, so every UI claim this project has ever made was
      made against a DEV SERVER, never against a bundled application. A bundled binary has never been
      verified to work by anyone.
    fix: |
      Add the Tauri CLI so the repository can install it - `@tauri-apps/cli` as a devDependency of
      apps/desktop with a `tauri` script, or `cargo install tauri-cli` pinned and documented. Carry
      `cargo tauri build` into codebase-stack-guide.md next to the verification commands, where a
      reader will actually find it rather than in a closed wave's scratch folder. Then have desktop-ci.yml actually build the bundle, which is what makes
      BR-121 checkable against a real build rather than a declaration.
      Until then, treat any locally built Snapdown.exe as NOT the application.
    note: |
      One thing WAS verified from that broken build and it is worth keeping: the window title read
      "Snapdown Editor". W6-S2's persona naming (DEC-003, FR-27) is correct in a real running window,
