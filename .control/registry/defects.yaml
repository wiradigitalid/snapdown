    found_by: systematic never-mounted sweep after BUG-4 and BUG-5
    component: finding
    severity: high
    contradicts: [FR-15, UC-8]
    evidence: |
      apps/desktop/src/components/OrphanReportView.tsx exists and orphan_report.test.tsx is green.
      grep for `<OrphanReportView` across apps/desktop/src and web/ui/src, excluding its own file
      and tests: NO MATCH.
      App.tsx line 23: type NavigationTab = 'findings' | 'bundles' | 'agent-access' | 'settings'.
      There is no orphans route, tab, or entry point of any kind. grep for "orphan" in App.tsx
      returns nothing.
    impact: |
      FR-15 promises the Reviewer can find out what has gone missing or been left behind, and UC-8 is
      how they do it. The Tauri commands scan_orphans and clean_orphans are registered and work; the
      screen that calls them cannot be opened. NFR-5's invariant - the Vault holds no file the Library
