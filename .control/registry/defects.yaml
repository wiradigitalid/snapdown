# defects.yaml — SSOT for defects: ordinary bugs and hotfixes.
#
# A defect is code disagreeing with a requirement that was already `active`. Work that exists because
# a requirement is NEW is planned work, not a defect, and it belongs in a wave — the distinction is
# what keeps this file from becoming a second backlog.

defects:
  - id: BUG-1
    title: Deleting a Finding silently deletes its rows from every Bundle that holds it
    found: "2026-08-23"
    found_by: wdi-component, G4 as-built pass over `bundle` at mode deep
    component: bundle
    severity: high
    contradicts: [FR-13, AD-9]
    evidence: |
      crates/snapdown-store/src/sqlite/migrations.rs, migration v3:
        FOREIGN KEY(finding_id) REFERENCES finding(id) ON DELETE CASCADE
      crates/snapdown-store/src/sqlite/finding_store.rs:29:
        conn.pragma_update(None, "foreign_keys", "ON")
      FR-13, third consequence, has been `active` since G2:
        "A Finding that belongs to a Bundle can still be deleted; the Bundle keeps its own
         copy of the image and stays readable."
    impact: |
      The Bundle's stored Markdown survives, because `bundle.markdown` is a column and AD-9 holds.
      Its item list loses a row. The delivered document and the record of the delivered document
      disagree, and nothing reports it. A Reviewer who deletes tidy-up Findings after a handoff
      corrupts the record of what they handed over.
    why_undetected: |
      finding_store.rs:362 asserts the cascade to `note` and `marker`, which is correct. Nothing
      asserts the ABSENCE of a cascade to `bundle_item`. A test that a cascade does NOT fire is the
      kind nobody writes unless a document says the cascade must not exist — which is what G4 at
      `deep` produced.
    fix: |
      Drop ON DELETE CASCADE from bundle_item.finding_id. Probably drop the foreign key entirely:
      a BundleItem refers to a Finding that MAY no longer exist, which is exactly what a foreign
      key exists to forbid. Requires a migration; existing rows already lost are not recoverable.
    scenario: .what/bundle/05-scenarios/SCN-05-a-finding-deleted-out-from-under-a-bundle.md
    resolved: |
      W6-S9, 2026-08-24. Migration v6 recreates bundle_item without the finding_id foreign key at
      all - not merely without its cascade - and keeps the bundle_id cascade, because deleting a
      Bundle does still delete its items (FR-14). A BundleItem legitimately refers to a Finding that
      may no longer exist, which is the precise condition a foreign key exists to forbid.

      Rows already lost are not reconstructed and the migration does not pretend otherwise.

      Verified by the coordinator: cargo test --workspace exits 0, and both directions are covered by
      tests that did not exist in this repository before -
      deleting_a_finding_leaves_its_bundle_item_in_place is the first test here that asserts a cascade
      does NOT fire, and deleting_a_bundle_still_cascades_to_its_items holds the other side.
    status: fixed
  - id: BUG-2
    title: Three `sharing` screens are recorded as delivered and do not exist in the repository
    found: "2026-08-23"
    found_by: wdi-init intent readers, after derive_screen was rewritten to read real components
    component: sharing
    severity: medium
    contradicts: [FR-24, UC-21, UC-22]
    evidence: |
      HANDOVER.md, W5 section, claims:
        "Web reader SPA (PublishedBundleReader.tsx / Screen 14; PublicationNotFound.tsx / Screen 15)"
        "Publish dialog (Screen 11) with BR-86 confirmation + publication badges + copy URL"
      No such files exist anywhere in the repository. Every .tsx in the tree was enumerated:
        web/ui/src/screens/ holds AgentAccessView.tsx and nothing else.
      inventory-screen.md rows 11, 14 and 15 have no component behind them, and LC-027
      `bundle-reader` is registered in components.yaml with nothing implementing it.
    impact: |
      What the web service actually returns for GET /b/{slug} is the stored Markdown inside a bare
      <pre> block with no stylesheet and no rendered images (server.go:145). For the PRIMARY
      audience — a coding agent fetching the URL — that is arguably sufficient: the text is the
      payload and /b/{slug}/images/{filename} serves the images separately. What is missing is the
      HUMAN reader those three rows promise. Publishing works; reading it as a person does not.
    why_undetected: |
      All three inventories sat at `derived_from: plan` because derive_screen read exactly one
      component. Nothing ever compared the plan to the tree. The rows were written at G3 and
      believed ever since.
    fix: |
      Two honest options, and this is a decision rather than a task. Either build the reader SPA and
      the publish dialog, or withdraw rows 11, 14, 15 and LC-027 and state that the published
      surface is machine-facing only. The second is cheaper and may be correct: Snapdown's reader is
      a machine. It changes a promise, so it goes through wdi-product, not a patch.
    blocked_by: DEC-005, which freezes `sharing`. Registered now, decided when that lifts.
    status: open
  - id: BUG-3
    title: The web service interpolates published Markdown into HTML without escaping it
    found: "2026-08-23"
    found_by: wdi-init intent readers, while reading the routes for derive_api
    component: sharing
    severity: medium
    contradicts: [NFR-15]
    evidence: |
      apps/web-service/internal/server/server.go:148-152
        html := fmt.Sprintf(`<!DOCTYPE html>...<body><pre>%s</pre></body>...`, slug, b.Markdown)
      b.Markdown is the Reviewer's own Note text, published verbatim. `%s` performs no escaping, so
      a Note containing `</pre><script>` breaks out of the block and executes in the browser of
      whoever opens the URL.
    impact: |
      The author and the publisher are the same person, so this is not an injection by a third
      party. The exposure is to whoever the Reviewer hands the URL to, and a Note is free text that
      may be pasted from a page being reviewed - which is exactly where a hostile string would come
      from. It is a public, unauthenticated HTML endpoint.
    why_undetected: |
      The route tests assert the NFR-15 identical-404 and the response codes. Nothing asserts what
      the HTML body does with hostile content, and the endpoint predates any document describing
      what it renders - inventory-screen row 14 describes an SPA that does not exist.
    fix: |
      html/template, or html.EscapeString on b.Markdown before interpolation. Escaping the slug too:
      it is a 160-bit CSPRNG value today and that is a property of the generator, not of this render.
    scheduled: W7-S2
    note_on_the_freeze: |
      NOT blocked. DEC-005 freezes `sharing` against NEW WORK and permits a fix in its own words -
      "This decision does not forbid a fix. It forbids new work." This row read `blocked_by: DEC-005`
      from 2026-08-23 to 2026-08-24, which was a misreading: a public unauthenticated HTML-injection
      path sat unfixed for a day because the register said a freeze forbade it and nobody re-read the
      decision. Scheduled into W7-S2.
    note: |
      Found 2026-08-23 while checking CI coverage, and it makes this defect worse than first written:
      NO WORKFLOW TOUCHED GO AT ALL. apps/web-service was never built, vetted, or tested by CI, so
      this shipped into a container with nothing behind it and a regression would have been equally
      invisible. A `web-service` job was added to desktop-ci.yml the same day - go build, go vet,
      go test. That is regression protection, not a fix; the escaping is still open.
      A frozen component is one nobody is watching, which makes CI on it MORE important, not less.
    resolved_by: W7-S2, commit c6a7e4e
    resolution: |
      RESOLVED 2026-08-24. html.EscapeString is applied to BOTH b.Markdown and the slug before they
      reach the HTML wrapper in handleGetBundle. The RAW paths are deliberately untouched and still
      serve verbatim bytes - GET /b/{slug}/raw.md, and GET /b/{slug} under Accept: text/markdown or
      text/plain - because the primary consumer is an agent that needs pristine Markdown. That
      distinction came from the story planner, not from the brief.

      Verified by the coordinator ON WINDOWS - go build, go vet and go test ./... all exit 0 - and by
      MUTATION: dropping html.EscapeString from the Markdown turns
      a_note_that_closes_the_pre_block_cannot_reach_the_browser_as_markup red, with the live script
      tag visible in the failure output. The tests are live, not literal asserts.

      NFR-15 is pinned rather than assumed: an_unknown_slug_still_returns_the_identical_refusal is
      now a test.

      TWO REVIEW FINDINGS SHAPED THE FIX. M6: the first plan's slug fixture was `test<slug>&42`,
      which store.go joins into a filesystem path and Windows refuses, while the Go CI job runs on
      ubuntu - it would have been green in CI and red on the developer machine. The fixture is now
      hostile to HTML but legal as a path segment. M10: the four registry test names are not legal Go
      identifiers, so they are mapped to t.Run subtests and `go test -run` matches the registry name.

      FOLLOW-UP, not a defect: the four names are implemented TWICE, once as subtests and once as
      standalone Test_<name> functions. Same assertions run twice, and two copies drift.

      NOT FIXED, and named so it is not lost: store.go joins the slug into a filesystem path
      unfiltered, which is a path-traversal seam. Recorded as a non-goal in the W7 SPEC.
    status: fixed
  - id: BUG-4
    title: The capture overlay is never mounted; pressing the capture hotkey shows the Settings shell
    found: "2026-08-23"
    found_by: narrow UI audit (static verification), confirmed by the coordinator against the source
    component: finding
    severity: critical
    contradicts: [FR-1, FR-2, UC-1, UC-2, NFR-1, NFR-2]
    evidence: |
      apps/desktop/src-tauri/src/commands/capture.rs:103-106
        WebviewWindowBuilder::new(..., WebviewUrl::App("index.html?overlay=true".into()), ...)
      apps/desktop/src/main.tsx and apps/desktop/src/App.tsx
        grep for window.location.search, URLSearchParams, or "overlay": NO MATCH.
      apps/desktop has exactly ONE html entry point, index.html. vite.config.ts declares no
      rollupOptions.input, so there is no second bundle to route to.
      Therefore the overlay window mounts <App /> - the full Editor shell, opening on Settings -
      instead of <CaptureOverlay />.
    impact: |
      THE CAPTURE PATH DOES NOT WORK. Pressing the capture hotkey opens an undecorated fullscreen
      window showing Settings. There is no dim, no crosshair, no region drag, no note field, and no
      Finding is ever created from the hotkey. FR-1 and FR-2 are unmet, UC-1 and UC-2 cannot be
      performed, and NFR-1/NFR-2's timing budgets measure a path nobody can reach.
      This is the single most-executed action in the product and the reason the product exists.
    why_undetected: |
      CaptureOverlay.tsx has passing unit tests - capture_overlay_draws_selection_and_dimensions and
      friends. The COMPONENT is correct and tested in isolation; it is simply never mounted. Nothing
      tests the wiring between the Rust window builder's URL and the frontend's routing, because
      that seam has no owner in any document: inventory-screen row 1 names the screen, and no
      contract describes how the overlay window selects what to render.
      The W2 UI verification that would have caught it is recorded in
      _bmad-output/specs/w1-settings/ui-verify-W1-S1/ for W1 only. No wave ever drove the capture
      hotkey end to end.
    fix: |
      Route on the query parameter in main.tsx: read window.location.search and mount
      <CaptureOverlay /> when overlay=true, <App /> otherwise. Then add a test that asserts the
      mount decision from the URL, and an end-to-end check that the hotkey produces a Finding.
      The deeper fix is the missing seam contract - .how/finding/02-contracts/ describes the Tauri
      command surface and says nothing about how a window chooses its root component.
    resolved: |
      W6-S2, 2026-08-23. main.tsx now routes on the query parameter:

        const isOverlay = new URLSearchParams(window.location.search).get('overlay') === 'true';
        return isOverlay ? <CaptureOverlay /> : <App />;

      mount.test.tsx proves the mount decision, and the never-mounted sweep is clean - CaptureOverlay
      is reachable from main.tsx, which it was not for four waves.

      NOT PROVEN IN A RUNNING PRODUCT, and the attempt to prove it failed. AUDIT-4 ran the first
      properly built binary on 2026-08-24 and reported this fixed. Its evidence does not support
      that: shot-4-overlay.png is a blank white 3840x2160 image with nothing drawn in it, and
      shot-4-note.png is a byte-identical copy of it. No region was ever dragged and no Finding was
      created. Whether the overlay fails to paint its scrim or the capture tool cannot photograph a
      transparent fullscreen window is still unknown.

      The deeper fix named below is still outstanding: .how/finding/02-contracts/ still says nothing
      about how a window chooses its root component, so the seam that produced this defect still has
      no owner.
    verified: |
      The verification this row was waiting for could never arrive: it was pending against
      `apps/desktop/src/App.tsx`, and `DEC-007` archived that surface. What replaced it is verified
      instead, and more strongly - the owner has driven the Slint capture overlay live across this
      whole session, and eleven guards in `test_capture_overlay_fullscreen.rs` and
      `test_capture_interaction.rs` cover its reachability, its geometry and its lifetime.

      The reachability question this row asked is now asked mechanically for the WHOLE UI by
      `test_ui_callbacks_reach_rust.rs`, which is what this row's class needed all along.
    status: fixed
  - id: BUG-5
    title: The Editor never renders a Finding's image, and Markers cannot be placed at all
    found: "2026-08-23"
    found_by: narrow UI audit (static verification), confirmed by the coordinator against the source
    component: finding
    severity: critical
    contradicts: [FR-6, FR-8, UC-4, UC-5, AD-1, BG-1]
    evidence: |
      grep for MarkerLayer across apps/desktop/src and web/ui/src, excluding its own file and tests:
        web/ui/src/index.ts:9  export * from './components/MarkerLayer';
      That is the ONLY hit. It is exported and never mounted.
      apps/desktop/src/components/FindingsView.tsx renders <FindingsEditor /> from @snapdown/ui and
      contains no img, no convertFileSrc, no marker anything.
      web/ui/src/components/FindingsEditor.tsx renders metadata and a Note TextArea. Its only
      reference to markers is line 137, which prints `{f.markers.length} markers` as TEXT.
    impact: |
      THE EDITOR NEVER SHOWS THE SCREENSHOT. A Finding's detail pane is metadata and a text box; the
      image the Note describes is not on screen. Markers cannot be placed, moved, or deleted, because
      there is no canvas to place them on.
      FR-6 (see every Finding with its Note) is met only in the degenerate sense that the Note is
      visible. FR-8 and UC-5 are entirely unmet. AD-1 - Markers and Note lines are one sequence - is
      the product's core invariant and has NO user interface.
      BG-1 is "a note is unambiguously attached to the image it describes". The attachment exists in
      the database and is invisible to the Reviewer.
    why_undetected: |
      Identical in shape to BUG-4, and found in the same pass. MarkerLayer.tsx and MarkerBadge.tsx
      have their own passing unit tests - marker_layer.test.tsx is green. The COMPONENTS are correct
      and neither is mounted. W2-S5 "Numbered Marker placement, drag reposition, comment annotation
      and delete" is recorded `status: done`, and it built the components without wiring them in.
      Nothing tested the composition, only the parts.
    fix: |
      Render the Finding's image in the detail pane (Tauri convertFileSrc over the Vault path) and
      mount MarkerLayer over it, per .how/finding/01-ux/DESIGN.md. Then a test that asserts the image
      element and the marker canvas are PRESENT in the mounted Findings surface - a composition test,
      which is the class of test this product has none of.
    related: BUG-4
    resolved: |
      W6-S7, 2026-08-23. FindingsView converts the Vault path with convertFileSrc and passes it as
      imageSrc; FindingsEditor renders the screenshot and mounts MarkerLayer over it. Verified by the
      coordinator: the never-mounted sweep is now clean for all six components, and four composition
      tests assert presence in the MOUNTED surface rather than in isolation.
      Still unproven in a RUNNING application - see BUG-11. jsdom does not fetch images, so the test
      passes on a mocked convertFileSrc either way.
    verified: |
      Pending against `apps/desktop/src/components/FindingsView.tsx`, which no longer exists.
      And the honest reading is worse than a stale row: the React fix was real, the Slint rewrite
      dropped the wiring again, and nothing noticed for a month. The Marker canvas rendered, the
      Marker Notes panel rendered, and `marker-placed` reached no handler.

      That regression is `BUG-55`, and it is fixed with the wiring, six unit tests and six killed
      mutants. This row is closed as history; `BUG-55` is the live record.
    status: fixed
  - id: BUG-6
    title: The orphan report is built, tested, and unreachable — no screen ever mounts it
