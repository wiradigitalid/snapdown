    resolved: |
      W6-S11, 2026-08-23. @tauri-apps/cli@^2.0.0 is a devDependency of apps/desktop with a `tauri`
      script, pinned to the same major as the tauri = "2.0" crates. The build command now sits in
      codebase-stack-guide.md beside the verification commands - the place it was missing from, not
      a wave folder that later closes. desktop-ci.yml builds the bundle on windows-latest and asserts
      exactly one .exe in target/release, so BR-121 is finally checked against a real build.

      Verified by the coordinator on the worktree, exit codes read directly rather than through a
      pipe: `tauri build --no-bundle` exits 0, produces exactly one executable (Snapdown.exe,
      13.3 MB), and the freshly built frontend bundle name (index-BBTULvhi.js) is present INSIDE the
      binary. The assets are embedded, which is precisely what was not happening before. CI is green
      on the head SHA.

      What that does NOT prove: that the window renders. The embedded-asset check is a headless proxy
      for the cause; it is not the manual check. `manual::a_freshly_built_binary_loads_its_bundled_frontend_not_devurl`
      remains unrun, and BUG-4, BUG-5 and BUG-12 stay unproven in a running product until it is.
      What changed is that running it is now possible for the first time.
    status: resolved-pending-product-verification
  - id: BUG-12
    title: "A corrupt or unreadable library.db makes the application vanish on launch"
    found: "2026-08-23"
    found_by: coordinator, sweeping the panic surface that DEC-003's Cost section predicted
    component: settings
    severity: high
    contradicts: [BR-118, AD-11, "SDD-settings.md Failure Behaviour"]
    evidence: |
      apps/desktop/src-tauri/src/lib.rs:109-119 - five store opens, every one .expect():
        SqliteSettingsStore::open(&db_path).expect("Failed to initialize SqliteSettingsStore")
        SqliteFindingStore::open(&db_path).expect("Failed to initialize SqliteFindingStore")
        SqliteBundleStore::open(&db_path).expect("Failed to initialize SqliteBundleStore")
        SqliteAccessKeyStore::open(&db_path).expect("Failed to initialize SqliteAccessKeyStore")
        SqlitePublicationStore::open(&db_path).expect("Failed to initialize SqlitePublicationStore")
      SDD-settings.md Failure Behaviour, the LC-025 -> library.db row, promises the opposite:
        "Reported with the file's path, and NOTHING IS CREATED OVER IT (BR-118). A store recreated
         beside a corrupt one is silent data loss."
    impact: |
      Half the promise is kept and half is not. Nothing IS created over the corrupt store - the panic
      guarantees that much. But nothing is REPORTED either.
      A Tauri release binary on Windows has no console. A panic inside the setup hook unwinds and the
      process exits, so the Reviewer double-clicks Snapdown.exe and NOTHING HAPPENS - no window, no
      tray icon, no message, no file named. The product does not appear to be broken; it appears not
      to be there.
      AD-11 sharpens it: one process owns the tray, the hotkeys, the overlay and the Editor. There is
      no surviving surface to report into, which is exactly the cost DEC-003 accepted and wrote down.
    why_undetected: |
      DEC-003's Cost section PREDICTED this class in writing - "a panic in the editor's Tauri commands
      kills the tray, the hotkeys, and the overlay with it ... this raises the bar on every unwrap in
      the command layer" - and nobody then went and looked at the unwraps. The prediction was recorded
      and never turned into a check.
      No test opens a corrupt database. Every store test uses open_in_memory().
    fix: |
      Do not panic. Open the stores fallibly, and on failure show a window - or a native dialog -
      naming the file that could not be opened and offering to open its folder. That is what the SDD
      already specifies; the code simply does not do it.
      The store must still never be recreated beside a corrupt one. BR-118 is not in question.
    note: |
      Also swept and deliberately NOT registered, so the next sweep does not re-raise them:
        server/handlers.rs - 26 unwraps, ALL Header::from_bytes over compile-time byte constants
          such as b"Content-Type" / b"application/json". These cannot fail.
        lib.rs:226 - .expect("error while running tauri application") on the Tauri run call. If that
          fails there is nothing left to report with.
        bridge mcp.rs:55,81 - serde_json::to_string on a well-formed response struct. Effectively
          infallible, and the bridge has no channel to report a serialisation failure over anyway.

      THE SECOND EXCLUSION ABOVE HAS EXPIRED. Its reason - "there is nothing left to report with" -
      was true while every store open panicked before reaching that line. W6-S5's fallible open made
      it the ROUTINE exit path for a store failure, and the premise stopped holding without anyone
      noticing. Registered as BUG-16. Re-read a sweep's exclusions whenever the code they reasoned
      about changes; this is the second time an exclusion has outlived its reason.
    resolved_by: W6-S5, commit aa30434
    resolution: |
      RESOLVED, AND THE REGISTER WAS WRONG FOR A DAY. Fixed on 2026-08-23 by W6-S5 ("Run at Windows
      startup"), which was not scoped to this defect and closed it as a side effect of needing a
      fallible startup path. Nobody updated this row, so it still read `open` on 2026-08-24 - and
      wave W7 was opened with a whole story, W7-S1, planned against it. The planner was dispatched,
      wrote a full implementation plan, and reported success; the SPEC review caught it by reading
      the code instead of the register.

      What aa30434 actually landed in apps/desktop/src-tauri/src/lib.rs:
        StartupError::DatabaseOpen { path, source }   :51-59
        StoresBundle                                  :61-67
        init_app_stores -> Result<_, StartupError>    :69-102
        format_startup_error_message                  :105-120
        show_native_message_dialog via MessageBoxW    :122-152
        report_startup_error, writes startup-error.log :154-163
        the fallible setup hook returning Err         :226-233
      The five .expect() store opens are gone. `grep -n '\.expect(' lib.rs` returns one hit, :347,
      which is BUG-16.

      THREE THINGS IT DID NOT CLOSE, each now its own row rather than residue hidden here:
        BUG-15  the WAL pragma writes to the file before quick_check runs, so a corrupt store IS
                written to and -wal/-shm ARE created beside it. This is the half of BR-118 the fix
                was supposed to protect, and the byte-identity test passes only because its fixture
                is garbage bytes that SQLite rejects before any pragma runs.
        BUG-16  the exit is still a panic, through the excluded .expect() above.
        BUG-17  the dialog has no owner and no foreground flag, so it can open behind other windows.

      THE LESSON, and it is the same one as the four unreachable components: a register entry is a
      claim about code at a moment, and it goes stale silently. Read the code before planning against
      a defect row. W7-S1 was re-scoped rather than cancelled - BUG-15/16/17 are real and they are
      what it now carries.
    status: resolved

  - id: BUG-13
    title: "The new CI guard counts every .exe, but FR-27 promises one DESKTOP executable"
    found: "2026-08-23"
    found_by: coordinator, rebuilding the app in the main checkout the same day W6-S11 landed
    component: settings
    severity: medium
    contradicts: [FR-27, BR-121]
    evidence: |
      .github/workflows/desktop-ci.yml, the "Verify desktop executable" step added by W6-S11:

        $exeCount = (Get-ChildItem -Path "target/release/*.exe").Count
        if ($exeCount -ne 1) { Write-Error "...found $exeCount"; exit 1 }

      It counts EVERY executable in target/release. This workspace legitimately produces a second
      one: `snapdown-bridge.exe`, from crates/snapdown-bridge, the MCP executable named in AGENTS.md
      and in the C4 set. It is not a desktop executable and FR-27 does not forbid it.

      FR-27's consequence, verbatim:
        "The build produces exactly one desktop executable. A second one left in the output directory
         is a build failure, not clutter - a stale `desktop.exe` beside the correct `Snapdown.exe` is
         precisely what caused the Reviewer to run the wrong binary."

      The promise is about a second DESKTOP executable - the stale-rename case. The guard as written
      also fails on a legitimate workspace binary.

      Reproduced locally: target/release held snapdown-bridge.exe from an earlier `cargo build
      --workspace`, so the guard would have counted 2 and failed a correct build.
    impact: |
      Not a false green - a false RED, which is the kind that gets a guard deleted rather than fixed.
      The first person to run `cargo build --workspace` and `tauri build` against one target
      directory gets a build failure with a message that names no real problem.
    why_undetected: |
      It passes in CI by accident of job layout, not by being right. `web-check` runs `tauri build`
      and never builds the bridge; `rust-check` builds the workspace in a separate job with its own
      target directory. Nothing shares a target directory today, so the two never meet. A cache
      change or a job merge would surface it, and the guard would look wrong rather than the layout.
    fix: |
      Count only the desktop executable's own name against the product name, or exclude the known
      workspace binaries by name rather than counting the directory. The check should answer "is
      there a second executable claiming to BE the desktop app" - which is the stale-rename case
      FR-27 describes - not "how many executables exist".
    note: |
      Found by rebuilding rather than by reading. The first build of W6-S11 ran in a fresh worktree
      where the bridge had never been built, so the guard's blind spot could not show itself there.
    related: BUG-11
    resolved: |
      2026-08-24, by the coordinator. The guard no longer counts the directory. It names the two
      binaries this workspace legitimately produces - Snapdown.exe and snapdown-bridge.exe - and
      fails on anything else, which is the question FR-27 actually asks: is there a second
      executable claiming to BE the desktop app.

      Verified by mutation, both directions, on a real build:
        Snapdown.exe + snapdown-bridge.exe present  -> PASS (the old guard counted 2 and failed)
        a stale desktop.exe planted beside them     -> FAIL, naming desktop.exe

      The second case is the exact scenario FR-27 was written for - a stale desktop.exe beside the
      correct Snapdown.exe is what made the Reviewer run the wrong binary and report four defects
      that did not exist.

      A new workspace binary now requires adding its name to the list in that step, which is the
      right friction: a second executable appearing unannounced is what the guard is for.
    status: resolved

  - id: BUG-14
    title: "Snapdown does not take screenshots. The capture path writes a 17-byte placeholder."
    found: "2026-08-24"
    found_by: coordinator, closing wave W6 — inventory.py flagged a missing Capture note field, and reading the capture path to check it exposed this
    component: finding
    severity: critical
    contradicts: [BG-1, FR-1, FR-2, FR-5, FR-6, FR-8, UC-1, UC-2, AD-2, NFR-18]
    evidence: |
      apps/desktop/src-tauri/src/commands/capture.rs:197 — the whole of what is written to the Vault:

        fn generate_placeholder_image(width: u32, height: u32, encoder_quality: u8) -> Vec<u8> {
            let mut bytes = Vec::new();
            bytes.extend_from_slice(b"\x89PNG\r\n\x1a\n");   // 8-byte signature
            bytes.extend_from_slice(&width.to_be_bytes());   // 4
            bytes.extend_from_slice(&height.to_be_bytes());  // 4
            bytes.push(encoder_quality);                     // 1
            bytes
        }

      Seventeen bytes. No IHDR, no IDAT, no IEND. It is not a PNG and no viewer will open it.

      capture.rs:93-100 calls it and writes the result as the Finding's image. Nothing in the file
      reads the screen.

      NO SCREEN-CAPTURE DEPENDENCY EXISTS IN THE WORKSPACE. Every dependency in Cargo.toml:
        serde serde_json thiserror uuid chrono rusqlite rand tempfile tiny_http ureq base64
        tauri tauri-build tauri-plugin-single-instance tauri-plugin-global-shortcut
        tauri-plugin-autostart winreg
      A case-insensitive search of every .rs and .toml for xcap, screenshots, scrap, captrs,
      win_screenshot, BitBlt and GetDC returns nothing. There is also no `image` crate, so nothing
      can decode or encode a real image either.

      crates/snapdown-store/src/image/pipeline.rs:26-37 says so in its own comment — "downscaled
      payload simulation". reduce_image writes the same fake header and then copies input_bytes[16..]
      through. No decode, no scale, no encode.

      THIRD SIMULATION, found 2026-08-24 while scoping the fix:
      crates/snapdown-store/src/image/burner.rs:20 — burn_markers writes the same fake header and
      never draws a Marker onto anything. Its test asserts only that the first 8 bytes are a PNG
      signature and that dimensions are preserved. FR-8's promise that a handed-over Bundle carries
      its Markers ON the image rests entirely on this, and AD-4 governs it.

      AND THE ARCHITECTURE ALREADY PLANNED FOR ALL OF IT. ARCHITECTURE-SPINE.md:245 lays out a crate
      `snapdown-capture/  # screen capture, overlay geometry, image reduction`, and assigns CAP-1 and
      CAP-2 to it. crates/ contains snapdown-bridge, snapdown-core and snapdown-store. There is no
      snapdown-capture. components.yaml registers LC entries for region-capturer and
      capture-note-field; neither has an implementation.

      This is therefore not a design gap. The design is right and was never built.
    impact: |
      The product does not do the thing it is named for. Everything downstream is built on bytes that
      are not an image: a Finding's screenshot cannot render, Markers annotate nothing, a Bundle
      copies those bytes into its own folder, and the Markdown it hands over references a file no
      reader can open. BG-1 - a note unambiguously attached to the image it describes - has no image.

      NFR-18 and the whole Quality Budget that W6-S4 just built resolve parameters for an encoder
      that does not run. The numbers are correct and they are applied to nothing.

      This is why AUDIT-4 could not create a Finding to test BUG-5 with, and it is the most likely
      reason its overlay screenshot came back blank.
    why_undetected: |
      Every test in this repository asserts DIMENSIONS, never pixels. compute_reduced_dimensions is
      pure arithmetic and is correct; test_image_reduction.rs checks widths and heights; the store
      tests write and read byte arrays without asking what the bytes are. A fake PNG passes all of it
      because none of it ever decodes one.

      The same blind spot that let four components ship mounted nowhere: the unit is right, and
      nothing checks that the unit is connected to reality. Here the unit is right and there is no
      reality behind it at all.

      Six waves, twelve use cases and four UI audits went past it. AUDIT-2 came closest by concluding
      there was nothing to photograph.
    assessment: .control/reports/ASSESS-BUG-14.md
    fix: |
      Add a real screen-capture dependency and a real image codec, then replace
      generate_placeholder_image with an actual grab of the requested region, and
      ImageReducer::reduce_image with a real decode-scale-encode. The dimension arithmetic already
      written is correct and should be kept - it is the only part of this that works.

      This is a wave of its own, not a story. It reaches capture, the image pipeline, the Vault, the
      Markdown serializer's byte-identity guarantee, and every test that currently asserts a
      dimension where it should assert an image.
    note: |
      W6 is not thereby wasted. It fixed the experience around this core - the build, the shell, the
      Settings surface, the swallowed failures, the Bundle cascade - and every one of those was a
      real defect that would still be there. What W6 could not do is notice that the core was hollow,
      because nothing in its scope decoded an image either.
    related: BUG-4
    status: open

  - id: BUG-15
    title: "Opening a store switches it to WAL before checking it, so a corrupt store IS written to"
    found: "2026-08-24"
    found_by: W7 SPEC review, edge-case-hunter lens, dispatched reader
    component: settings
    severity: high
    contradicts: [BR-118, "SDD-settings.md Failure Behaviour"]
    evidence: |
      All FIVE stores share the shape. crates/snapdown-store/src/sqlite/settings_store.rs:22-38,
      and identically in finding_store.rs, bundle_store.rs, access_key_store.rs,
      publication_store.rs (each at :28 and :33):

        let flags = OpenFlags::SQLITE_OPEN_READ_WRITE | OpenFlags::SQLITE_OPEN_CREATE;
        let mut conn = Connection::open_with_flags(path_ref, flags)?;
        conn.pragma_update(None, "journal_mode", "WAL")?;      // <- WRITES to the file
        conn.pragma_update(None, "foreign_keys", "ON")?;
        conn.pragma_update(None, "busy_timeout", 5000)?;
        // only now:
        let mut integrity_stmt = conn.prepare("PRAGMA quick_check;")?;

