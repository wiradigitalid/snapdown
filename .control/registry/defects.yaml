  - id: BUG-45
    title: A typed Note is stored but does not appear in the Editor's Observation Summary
    found: "2026-08-27"
    found_by: kodesh87, manual capture test
    component: finding
    severity: high
    contradicts: [FR-2]
    root_cause: code
    evidence: |
      Reported as "note diketik masih belum simpan". It IS saved. Read straight out of the live
      library with a read-only connection: 10 of 55 note rows carry text, including four written
      during the owner's own test session -
        06:44:36  note='asdfasdf'
        06:42:02  note='asdfhasdklfhkdjlsahflkjdsaf'
        06:41:55  note='Jadi apa ini?a sdakfjasdlkfjsdlakfj...'

      Every Rust step is correct, and that was established by instrumenting the release binary
      rather than by reading it. At start-up the probe reported:
        [probe] active=01a041f6-... note_len=8 note="asdfasdf"
        [probe] readback="asdfasdf"
      So `get_finding` loads the note, `set_observation_summary` receives it, and reading the
      property straight back returns it. The value is on the property and does not reach the screen.

      The remaining suspect is the only structure between the two:
      apps/desktop/ui/appwindow.slint:1382 gates the whole Observation Summary section behind
      `if root.active-tab-index == 0`, and the `TextEdit` inside it carries
      `text <=> root.observation-summary`. A conditional subtree is created and destroyed rather
      than shown and hidden - which is the same class of trap that produced BUG-27's blink and the
      copy-on-write in BUG-28: Slint bindings latch, and an `if` decides when.

      Note also that the property's declared default is placeholder junk -
      "test\n1. Marker 1\n2. Marker 2" - so a broken binding shows that rather than nothing, which
      is a second reason a reader cannot tell "not saved" from "not displayed".
    impact: |
      The Reviewer believes their note was lost. It was not, but they have no way to see it, so
      FR-2 - "the Editor shows exactly the text that was typed at capture time" - is unmet, and the
      product looks like it discards work.
    why_undetected: |
      Nothing here renders a Slint component and asserts what is on screen. Every test in this
      repository checks either Rust state or source text, and this defect is invisible to both -
      the Rust state is correct and the source looks right.
    fix: |
      NOT DIAGNOSED PAST THIS POINT, deliberately. The instrumentation narrowed it to the Slint
      side; confirming WHICH of "the section never re-reads" and "the widget latches its text"
      applies needs one look at the running panel, because the property already holds the right
      value. Two reasonable candidates once that is known: gate the section with `visible` instead
      of `if` (the same fix that removed BUG-27's per-monitor blinks), or drive the TextEdit from a
      one-way binding plus an explicit edited-callback.

      The placeholder default should go with it, whatever the cause: a property whose default looks
      like real content hides exactly this kind of failure.
    note: |
      A FIX HAS LANDED and this row is deliberately still open, because it cannot be confirmed from
      here. 2026-08-27: the TextEdit now reads `observation-summary` one way and pushes edits back
      through `edited`, instead of aliasing it with `<=>` across the tab's conditional subtree; and
      the property's placeholder default is gone, so a failure shows as empty rather than as
      plausible content.

      That follows the measurement - every Rust step was proved correct by instrumenting the release
      binary - but the remaining step was inferred from how Slint behaved twice before in this
      session, not observed. Nothing in this repository renders a Slint component and asserts what is
      on screen, so only the owner can close this. Guarded by
      the_observation_summary_reads_the_note_one_way, verified by mutation.
    resolved: |
      2026-08-27. The note is now shown above the tabs, permanently, and the binding is `<=>` again.

      The previous entry left this row open because its fix was inferred rather than observed, and
      that was the right call: the inference was wrong in a way that mattered. A one-way `text:`
      binding does avoid the rebuild problem, and trades it for a worse one - Slint drops a binding
      the moment anything writes the property, and a text widget writes to itself on every keystroke.
      After the first edit, no newly selected Finding's note would ever have landed again. That
      would have read as a fresh, more confusing defect.

      Neither binding form is safe inside `if active-tab-index == 0`, because an `if` subtree is
      CREATED and DESTROYED rather than shown and hidden. So the widget left the subtree instead. A
      Finding's note is its primary content rather than a tab's detail, which makes hoisting it the
      right shape as well as the fix - and it answers the owner's actual complaint, that there was no
      place on screen where the note could be seen at all.

      It also gained a placeholder, because an empty box could mean "no note" or "the note did not
      arrive" and that ambiguity is what made this defect hard to read from the outside.

      Guarded by the_observation_summary_is_outside_the_conditional_tab_body, verified by mutation.
      2026-08-27, THIRD ATTEMPT, and this one is the cause. The owner retested and reported the
      summary still absent, which made three attempts on one defect - so the rule fired and the next
      step was to go and look rather than to reason again. Looking took one query.

      The running build's accessibility tree contains exactly ONE Edit control. It holds the right
      note - "apa yang terbaik?" - and its bounding rectangle is INFINITE. The label above it reports
      real coordinates, so the section lays out; the widget inside it has no geometry. The value had
      been arriving the whole time and there was nowhere on screen for it to be drawn.

      The cause is a Slint rule neither earlier attempt was about: a `Rectangle` child with no size
      fills its parent, but an imported COMPONENT takes its own preferred size, and a `TextEdit`'s
      resolves to nothing. The fix is four lines of geometry.

      Both earlier attempts were worth keeping and neither could have fixed this:
        - the one-way binding really would have broken on the first edit, and reverting it to `<=>`
          prevented a defect that had not been reported yet;
        - the widget really did belong outside the conditional tab, and hoisting it answered the
          owner's actual complaint - that there was no place on screen where a note could be seen.

      The same construction sits under the marker list and was fixed in the same change. It had never
      been seen because that list has always been empty - which is precisely how the first instance
      survived four rounds of testing.

      The first tab was renamed "Marker Notes" and given the marker icon, because the summary leaving
      it made "Notes" name the wrong thing and `file-text.svg` describe content that was no longer
      there.

      Guarded by a_std_widget_in_a_plain_rectangle_is_given_explicit_geometry - which checks the
      RULE, not this instance, so the marker list's copy and any future one are covered - and by
      the_marker_tab_label_and_icon_agree. Both verified by mutation.
      2026-08-27, FOURTH PASS - and a second, independent cause was hiding behind the first.

      With geometry fixed, the note was drawn and still could not be read: white text on a white
      panel, legible only while focused, and grey while being edited. `std-widgets`' `TextEdit` and
      `LineEdit` paint themselves from Slint's OWN style palette, not from `theme.slint` - so the
      product had three text-entry appearances, none of them its own. That is the same root as
      BUG-37 and it is why NFR-17's "colour lives in one file" was never true here.

      The capture overlay's note field had already been hand-drawn from the tokens after exactly this
