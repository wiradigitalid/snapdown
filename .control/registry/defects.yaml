  - id: BUG-24
    title: Capture overlay opens at the default window size instead of covering the monitor, so selecting a region never produces a screenshot
    found: "2026-08-26"
    found_by: kodesh87, manual capture test after the desktop-slint to apps/desktop migration
    component: capture
    severity: high
    contradicts: [FR-1, FR-2]
    evidence: |
      apps/desktop/ui/appwindow.slint, CaptureOverlayWindow: no-frame, always-on-top, background:
      transparent - but no width/height/full-screen. apps/desktop/src/main.rs:381-501,
      on_capture_clicked: CaptureOverlayWindow::new() is shown with overlay.show().unwrap() and no
      call that sizes or positions it to the captured monitor.

      The React/Tauri predecessor did this explicitly -
      archive/desktop-tauri/src-tauri/src/commands/capture.rs:217: `.fullscreen(true)` on the
      overlay's WebviewWindowBuilder. The Slint port dropped that call and replaced it with nothing.
    impact: |
      Reported symptoms: (a) a brief freeze after clicking Capture, (b) the overlay appears as a
      small non-fullscreen window with the mouse-follow magnifier loupe dominating it, (c) drawing a
      selection and clicking Save Finding does not produce a usable screenshot. (a) is the
      synchronous, blocking RegionCapturer::capture_monitor_image call on the UI thread - expected
      screen-grab latency, not part of this defect. (b) and (c) share one root cause: the overlay's
      TouchArea reports mouse-x/mouse-y in the small default-size window's local coordinate space,
      but on_capture_completed (main.rs:398-401) uses those numbers directly as pixel offsets into
      the full monitor-resolution RgbaImage, so the crop lands on the wrong, tiny region of the
      screenshot.
    why_undetected: |
      No test drives the capture flow through a real window (BUG-4/5/6 already named this class of
      gap: a component compiling and unit-testing does not mean the flow that reaches it was
      exercised). Nothing asserted that the overlay window's geometry matches the captured monitor.
    fix: |
      Add `full-screen: true;` to CaptureOverlayWindow in apps/desktop/ui/appwindow.slint - the
      Slint/winit-native equivalent of the Tauri predecessor's `.fullscreen(true)`. This makes the
      overlay's logical size and origin match the monitor exactly, so the TouchArea's coordinates
      line up with the captured image's pixel space with no extra conversion.
    scenario: N/A - covered by apps/desktop/tests/test_capture_overlay_fullscreen.rs
    resolved: |
      2026-08-26. Failing test written first (capture_overlay_window_declares_full_screen, red for
      the missing `full-screen: true`), then the one-line fix, then green: `cargo test -p
      snapdown-desktop` (16 tests, all pass). Verified live, not just at the property level: built
      and ran Snapdown.exe, confirmed via Orca computer-use that Capture now opens a window whose
      bounds (0,0,3840x2160) exactly match the physical monitor instead of a small default window,
      then drove a real drag-select + Save Finding through the running app and confirmed a new
      Finding (capture_20260826_123020.png) was created and loaded into the filmstrip - the full
      pipeline now completes end to end.

      Not fixed here, filed separately if it surfaces again: the main window is still visible (not
      hidden) while capture_monitor_image grabs the monitor, unlike the Tauri predecessor which hid
      it first - out of scope for the three reported symptoms, which are now all resolved.
    status: resolved
  - id: BUG-25
    title: Escape did nothing while the capture overlay was open
    found: "2026-08-26"
    found_by: kodesh87, manual capture test
    component: capture
    severity: medium
    contradicts: [FR-1]
    evidence: |
      apps/desktop/ui/appwindow.slint, CaptureOverlayWindow had no FocusScope and no key handler
      at all, while the note popup's own hint text read "Enter to save · Esc to cancel".
    impact: |
      The only way out of a full-screen always-on-top overlay was to complete a capture. The
      overlay itself advertised Escape, so the promise was visible and broken.
    why_undetected: |
      No test drives keyboard input against the overlay, and the hint text is a literal string
      that nothing checks against a binding.
    fix: |
      A FocusScope that maps Key.Escape to overlay-cancelled(), and which claims focus itself - a
      top-level window does not hand keyboard focus to a scope for free, so without self.focus()
