        fn generate_placeholder_image(width: u32, height: u32, encoder_quality: u8) -> Vec<u8> {
            let mut bytes = Vec::new();
            bytes.extend_from_slice(b"\x89PNG\r\n\x1a\n");   // 8-byte signature
            bytes.extend_from_slice(&width.to_be_bytes());   // 4
            bytes.extend_from_slice(&height.to_be_bytes());  // 4
            bytes.push(encoder_quality);                     // 1
            bytes
        }

      Seventeen bytes. No IHDR, no IDAT, no IEND. It is not a PNG and no viewer will open it.

      capture.rs:93-100 calls it and writes the result as the Finding's image. Nothing in the file
      reads the screen.

      NO SCREEN-CAPTURE DEPENDENCY EXISTS IN THE WORKSPACE. Every dependency in Cargo.toml:
        serde serde_json thiserror uuid chrono rusqlite rand tempfile tiny_http ureq base64
        tauri tauri-build tauri-plugin-single-instance tauri-plugin-global-shortcut
        tauri-plugin-autostart winreg
      A case-insensitive search of every .rs and .toml for xcap, screenshots, scrap, captrs,
      win_screenshot, BitBlt and GetDC returns nothing. There is also no `image` crate, so nothing
      can decode or encode a real image either.

      crates/snapdown-store/src/image/pipeline.rs:26-37 says so in its own comment — "downscaled
      payload simulation". reduce_image writes the same fake header and then copies input_bytes[16..]
      through. No decode, no scale, no encode.

      THIRD SIMULATION, found 2026-08-24 while scoping the fix:
      crates/snapdown-store/src/image/burner.rs:20 — burn_markers writes the same fake header and
      never draws a Marker onto anything. Its test asserts only that the first 8 bytes are a PNG
      signature and that dimensions are preserved. FR-8's promise that a handed-over Bundle carries
      its Markers ON the image rests entirely on this, and AD-4 governs it.

      AND THE ARCHITECTURE ALREADY PLANNED FOR ALL OF IT. ARCHITECTURE-SPINE.md:245 lays out a crate
      `snapdown-capture/  # screen capture, overlay geometry, image reduction`, and assigns CAP-1 and
      CAP-2 to it. crates/ contains snapdown-bridge, snapdown-core and snapdown-store. There is no
      snapdown-capture. components.yaml registers LC entries for region-capturer and
      capture-note-field; neither has an implementation.

      This is therefore not a design gap. The design is right and was never built.
    impact: |
      The product does not do the thing it is named for. Everything downstream is built on bytes that
      are not an image: a Finding's screenshot cannot render, Markers annotate nothing, a Bundle
      copies those bytes into its own folder, and the Markdown it hands over references a file no
      reader can open. BG-1 - a note unambiguously attached to the image it describes - has no image.

      NFR-18 and the whole Quality Budget that W6-S4 just built resolve parameters for an encoder
      that does not run. The numbers are correct and they are applied to nothing.

      This is why AUDIT-4 could not create a Finding to test BUG-5 with, and it is the most likely
      reason its overlay screenshot came back blank.
    why_undetected: |
      Every test in this repository asserts DIMENSIONS, never pixels. compute_reduced_dimensions is
      pure arithmetic and is correct; test_image_reduction.rs checks widths and heights; the store
      tests write and read byte arrays without asking what the bytes are. A fake PNG passes all of it
      because none of it ever decodes one.

      The same blind spot that let four components ship mounted nowhere: the unit is right, and
      nothing checks that the unit is connected to reality. Here the unit is right and there is no
      reality behind it at all.

      Six waves, twelve use cases and four UI audits went past it. AUDIT-2 came closest by concluding
      there was nothing to photograph.
    assessment: .control/reports/ASSESS-BUG-14.md
    fix: |
      Add a real screen-capture dependency and a real image codec, then replace
      generate_placeholder_image with an actual grab of the requested region, and
      ImageReducer::reduce_image with a real decode-scale-encode. The dimension arithmetic already
      written is correct and should be kept - it is the only part of this that works.

      This is a wave of its own, not a story. It reaches capture, the image pipeline, the Vault, the
      Markdown serializer's byte-identity guarantee, and every test that currently asserts a
      dimension where it should assert an image.
    note: |
      W6 is not thereby wasted. It fixed the experience around this core - the build, the shell, the
      Settings surface, the swallowed failures, the Bundle cascade - and every one of those was a
      real defect that would still be there. What W6 could not do is notice that the core was hollow,
      because nothing in its scope decoded an image either.
    related: BUG-4
    verified: |
      Re-read against the code, not against this row. `generate_placeholder_image` does not exist
      anywhere in the repository - a case-insensitive search for it, and for the 17-byte header's own
      bytes, returns nothing. The capture path is `apps/desktop/src/main.rs`: `xcap` grabs the virtual
      desktop, the region is cropped out of the canvas, `PngEncoder` writes it, `ImageReducer` applies
      the Quality Budget, and `VaultBlobStore::write_blob` stores it. The file this row describes -
      `apps/desktop/src-tauri/src/commands/capture.rs` - was archived by `DEC-007` and is out of the
      Cargo workspace.

      `every_image_producing_path_decodes_its_own_output` is the guard that keeps the fabrication from
      coming back, and it decodes rather than checking a signature and a dimension.
    status: fixed

  - id: BUG-15
    title: "Opening a store switches it to WAL before checking it, so a corrupt store IS written to"
    found: "2026-08-24"
    found_by: W7 SPEC review, edge-case-hunter lens, dispatched reader
    component: settings
    severity: high
    contradicts: [BR-118, "SDD-settings.md Failure Behaviour"]
    evidence: |
      All FIVE stores share the shape. crates/snapdown-store/src/sqlite/settings_store.rs:22-38,
      and identically in finding_store.rs, bundle_store.rs, access_key_store.rs,
      publication_store.rs (each at :28 and :33):

        let flags = OpenFlags::SQLITE_OPEN_READ_WRITE | OpenFlags::SQLITE_OPEN_CREATE;
        let mut conn = Connection::open_with_flags(path_ref, flags)?;
        conn.pragma_update(None, "journal_mode", "WAL")?;      // <- WRITES to the file
        conn.pragma_update(None, "foreign_keys", "ON")?;
        conn.pragma_update(None, "busy_timeout", 5000)?;
        // only now:
        let mut integrity_stmt = conn.prepare("PRAGMA quick_check;")?;

      Switching an existing database to WAL mutates page 1 of the file and creates `library.db-wal`
      and `library.db-shm` beside it. Both happen BEFORE anything has checked whether the file is
      intact.
    impact: |
      BR-118 says the settings store is "opened, never created over", and SDD-settings.md § Failure
      Behaviour says in as many words that "a store recreated beside a corrupt one is silent data
      loss". For a database with a VALID SQLite header and corrupt B-tree pages - the case
      quick_check exists to catch - the file is modified and two files are created next to it before
      the corruption is ever detected.
      The failure is then reported correctly and the Reviewer is told nothing was touched. That
      sentence is false, and it is the one thing they would rely on before taking a backup.
    why_undetected: |
      W6-S5 landed the fallible open, the StartupError, the path-naming report and the byte-identity
      test, and all of it is right. But the ONLY corrupt fixture anyone has ever used is garbage
      bytes, and SQLite rejects those at Connection::open before a single pragma runs - so the test
      that asserts byte-identity passes without ever reaching the code that breaks it.
      The W7-S1 story plan named the dangerous case in its own edge-case matrix, row 2, and then
      specified a fixture that avoids it. The matrix named it; the fixture dodged it.
    fix: |
      Run quick_check BEFORE any writing pragma - open read-only for the check first, then reopen
      read-write and apply pragmas once the file is known to be intact. Add the valid-header /
      corrupt-pages fixture, and assert the absence of `-wal` and `-shm` as well as byte identity.
      SQLITE_OPEN_CREATE is NOT the defect and MUST stay: creating a store that is absent is first
      run, and BR-118 forbids creating one OVER a corrupt file, which the CREATE flag does not do.
    scheduled: W7-S1
    resolved_by: W7-S1, commit ffb5a60
    resolution: |
      RESOLVED 2026-08-24. quick_check now runs on a READ-ONLY connection, opened only if the file
      exists, BEFORE any read-write open or modifying pragma. All five stores carry the same shape.
      SQLITE_OPEN_CREATE is unchanged and deliberately so: creating a store that is ABSENT is first
      run, and BR-118 forbids creating one OVER a corrupt file, which that flag does not do.

      rusqlite is added as a DEV-dependency only, to build the fixture. It does not reach the
      production dependency.

      VERIFIED BY MUTATION, and this is the point of the story. Disabling the read-only pre-check so
      the old ordering returns turns three tests red:
        a_valid_header_with_corrupt_pages_is_not_written_to_before_it_is_checked
        a_corrupt_store_is_never_recreated_beside_itself
        valid_header_with_corrupt_pages_refuses_to_open_and_leaves_file_byte_identical
      The old garbage-bytes fixture could never reach the defect; a valid header with corrupt pages
      does.

      ONE TEST IS WEAKER THAN ITS NAME AND IS RECORDED AS SUCH.
      a_failed_open_leaves_no_wal_or_shm_file_beside_the_database STILL PASSES under that mutation.
      It is accurate to its name and insensitive to the bug: SQLite removes -wal/-shm on a clean
      connection close, so with the defect present the files are created transiently and are gone by
      the time the assertion runs. It is belt-and-braces, NOT a guard. The invariant it appears to
      cover is held by the two tests above. Counting it as protection would be the literal-assert
      mistake wearing a different hat.
    status: fixed

  - id: BUG-16
