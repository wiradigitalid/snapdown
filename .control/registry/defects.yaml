  - id: BUG-37
    title: The capture overlay does not follow the Editor's design system, and does not follow dark mode
    found: "2026-08-27"
    found_by: kodesh87, manual capture test
    component: capture
    severity: medium
    contradicts: [NFR-17, NFR-16]
    root_cause: code
    evidence: |
      CaptureOverlayWindow in apps/desktop/ui/appwindow.slint carries colour literals throughout -
      #ffffff, #475569, #94a3b8, #38bdf8, #000000.with-alpha(...) - while apps/desktop/ui/theme.slint
      defines the product's tokens for both themes. The note popup was converted to tokens on
      2026-08-27; the scrim, the crosshair, the loupe, the dimension badge and the selection frame
      were not.
    impact: |
      Reported as "tidak sesuai desain sistem snapdown editor kita - itulah kenapa look and feelnya
      berbeda". The overlay reads as a different product from the Editor it belongs to, and it
      stays light while the Editor is dark. NFR-17 forbids a colour defined for only one theme.
    why_undetected: |
      NFR-17's stated enforcement is a lint refusing a colour literal outside the token file, and
      that lint covers web/ui/src only. The Slint surfaces have no equivalent.
    fix: |
      Two parts, and the second is the reason this is not a quick pass:
        - mechanical: replace every literal in the overlay with a Theme token, and extend whatever
          lint enforces NFR-17 to cover .slint so it cannot come back;
        - design: the owner asked for a look-and-feel study first, naming Graphite as a reference,
          rather than a token-for-token substitution. That is a design decision, not a defect fix.
    note: |
      PARTIAL, 2026-08-27, and the mechanical half is done. theme.slint gained a group 6, "Capture
      Overlay Tokens": overlay-scrim, overlay-ring, overlay-grid, overlay-canvas, overlay-chrome,
      overlay-chrome-border, overlay-text, overlay-text-muted. Every literal in the overlay now
      resolves through one of them, and the whole overlay's chrome is derived from the token set
      rather than from ad-hoc hex.

      Those eight carry no `is-dark` branch, and that is deliberate rather than an oversight of
      NFR-17. The overlay is drawn over a frozen screenshot of the operator's own desktop, not over
      app chrome: a light scrim over a dark screenshot is invisible, and the loupe grid has to read
      against whatever happens to be underneath it. That is the same argument as the four
      deliberately theme-invariant groups in web/ui/src/styles/tokens.css, and the comment beside
      them says so. The note panel - a document surface rather than furniture - follows bg-card into
      light mode as before.

      Still open, and still the reason this row is open: the owner asked for a look-and-feel STUDY
      first, naming Graphite as a reference, rather than a token substitution. That has not been
      done. Also still open: NFR-17's lint covers web/ui/src only, so nothing mechanically prevents
      a literal returning to a .slint file.
    note_2: |
      2026-08-27, and this row was understating itself. The overlay's literals were the visible half;
      the other half was that `std-widgets`' `LineEdit` and `TextEdit` do not use `theme.slint` AT
      ALL - they paint from Slint's own style palette. That is not a missed literal, it is a whole
      class of widget outside the token system, and it produced a white-on-white Observation Summary
      (see BUG-45's fourth pass).

      Both are now closed off. The overlay carries no colour literal and a guard fails the build if
      one returns; `SdTextField` is the product's only text entry and the two std widgets are not
      imported. The full-screen control was also rebuilt in the Editor's idiom rather than its own
      (BUG-42, third pass).

      What keeps this row OPEN is unchanged: the owner asked for a look-and-feel study first, naming
      Graphite as a reference, and that has not been done. Also still open: nothing mechanically
      prevents a literal returning to a .slint file outside the overlay, since NFR-17's lint covers
      web/ui/src only.
      2026-08-27, and the fourth report on this row is what finally named the pattern. Owner: "kenapa
      desain sistemmu gak konsisten?"

      Every instance had the same shape, and it was never a number chosen badly: a `std-widgets`
      component painting itself from Slint's palette instead of `theme.slint`. `TextEdit` gave the
      Observation Summary white-on-white. `Button` gave the capture panel a Save action at a different
      size, colour and type scale from every action in the Editor - while the Editor's own actions
      (Share, Copy, Assemble) were hand-built from the tokens and agreed with each other. The numbers
      were not ours to adjust.

      Closed off properly now rather than instance by instance:
        - `SdTextField`, `SdActionButton`, `SdSectionLabel`, `SdCaption` carry the Editor's values -
          `radius-sharp`, the accent-primary/hover/pressed triple, `text-on-accent`, 700 weight at
          10-11px, 11px/800 with 0.5px letter-spacing for a heading;
        - `std-widgets` now exports only `ScrollView` into this product, so reaching for `Button`,
          `LineEdit` or `TextEdit` is a compile error rather than something a review has to notice;
        - the capture panel took the inspector's 16px padding and 6px label spacing, replacing 14px
          and 10px chosen for it alone;
        - both section headings are the SAME component, not two Texts that happen to match - matching
          numbers drift the first time one is touched.

      Guarded by the_capture_panel_and_the_inspector_share_one_design_system and
      the_capture_overlay_takes_every_colour_from_the_token_set, both verified by mutation.

      What keeps this row open is unchanged and is not a defect: the owner asked for a look-and-feel
      STUDY, naming Graphite as a reference. Consistency has been achieved WITH THE EXISTING system;
      whether that system is the right one is the question still open. `wdi-ux` is the skill for it.
      2026-08-27, and one more decision the owner delegated: "tentang panel teks, kau aja yg
      mutusin."

      Decided by applying this file's own rule rather than by taste. The capture note panel was 360px
      wide against the inspector's 440px - a number chosen for that panel alone, which is exactly the
      habit the guide forbids. It is now 440px, so a note wraps at the same line length in both
      places and the two panels are the same panel in every respect that can be measured.

      Where they still differ on purpose: the capture field is one line that grows with the text,
      while the Observation Summary is a fixed 120px box. That follows the task rather than the
      styling - a note written during capture is a sentence, and a note being reviewed afterwards is
      read alongside the image.
    status: open
  - id: BUG-38
    title: The note popup is always placed below the selection, so a selection near the bottom of a screen puts it off screen
    found: "2026-08-27"
    found_by: kodesh87, manual capture test
    component: capture
    severity: medium
    contradicts: [FR-2, FR-29]
    root_cause: code
    evidence: |
      The popup is positioned `y: parent.height + 12px` relative to the selection frame, with no
      consideration of the canvas edge or of which monitor the selection sits on.
    impact: |
      Reported as "dia selalu di bawah area pilih, padahal misal di bawah sekali itu sudah mentok,
      makanya hilang dari tampilan". A region dragged near the bottom of a screen cannot be
      annotated at all, so FR-2 is unreachable for that region.
    why_undetected: |
      Every test and every manual pass selected regions near the middle of a screen.
    fix: |
      Flip the popup above the selection when there is not room below, and clamp it horizontally
      into the monitor under the selection rather than into the whole canvas - the monitor
      rectangles the overlay already holds are what that needs.
    resolved: |
      2026-08-27. The popup tests whether it fits below the selection and flips above it when it
      does not, and is clamped horizontally into the canvas with an 8px margin so a selection near a
      side edge cannot push it off that edge either. Guarded by
      the_note_popup_flips_above_a_selection_with_no_room_below, verified by mutation.
      2026-08-27, SECOND ATTEMPT. The first closure above was premature - the owner retested the
      same day and reported "field note masih hilang di tepi bawah layar". The flip test was
      written against `root.height`, and `root.height` is the CANVAS: the bounding box of every
      monitor. On this two-monitor desktop the canvas bottom is below the shorter screen's bottom,
      so a panel that passed the "fits below" test was still off the visible screen. The test was
      answering a question nobody asked.

      Two changes, and neither is a tweak of the first:
        - the bound is now the monitor holding the SELECTION, derived from the selection rather than
          the pointer - the pointer moves onto the panel and may cross to another screen while it
          is open, which would otherwise make the panel jump monitors;
        - both axes are CLAMPED into that monitor, with the flip kept only as a preference. A flip
          alone has nowhere to put the panel when the selection is taller than the screen, so it
          leaves the screen again; clamped, the worst case is overlapping the selection, and a panel
          over the region beats a panel nobody can reach.

      The panel was also lifted out of the selection frame in the same change (see BUG-40), which is
      what made the arithmetic expressible in one coordinate space instead of two.

      Guarded by the_note_panel_is_kept_inside_the_monitor_holding_the_selection, verified by
      mutation - including a mutant that restores the `root.height` comparison.
    status: fixed
