  - id: BUG-9
    title: "Bundle composition and deletion swallow every filesystem and unpublish Result"
    found: "2026-08-23"
    found_by: coordinator, sweeping for `let _ =` after the same pattern produced W6-S10
    component: bundle
    severity: high
    contradicts: [AD-2, FR-10, FR-14, BR-20, BR-23, NFR-5]
    evidence: |
      apps/desktop/src-tauri/src/commands/bundle.rs
        :72-74  if let Ok(vault_store) = VaultBlobStore::new(&vault_path) {
                    let _ = vault_store.write_blob(&md_filename, markdown_content.as_bytes());
                }
                ... then the Bundle row is built and stored unconditionally.
        :116        let _ = unpublish_bundle(id.clone(), state.clone());
        :135        let _ = vault_store.delete_blob(&detail.bundle.markdown_path);
        :137            let _ = vault_store.delete_blob(&item.image_path);
      Note :72 also swallows the VaultBlobStore::new failure: if the store cannot be opened the `if
      let Ok` simply does not run, and composition continues as though the file had been written.
    impact: |
      THREE DISTINCT FAILURES, and they are not equally bad.

      1. COMPOSITION (:72-74). FR-10 is all-or-nothing and AD-2 says a record MUST NOT be committed
         before its files exist. If the Markdown write fails - or the Vault cannot be opened at all -
         the Bundle row is created anyway with markdown_path naming a file that does not exist. The
         Reviewer is told the Bundle was composed. bundle.markdown still holds the bytes, so Copy
         Markdown works and only the file on disk is missing, which is precisely the kind of partial
         state AD-2 exists to forbid.

      2. UNPUBLISH ON DELETE (:116). THIS IS THE SERIOUS ONE. BR-23 makes the unpublish part of the
         same action; BR-20 says an unpublish that fails leaves the Bundle marked published, so the
         Reviewer is NEVER told something is private when it may not be. Swallowing the Result does
         the opposite: the unpublish fails, the deletion proceeds, the local record is gone, and the
         published copy STAYS LIVE ON THE PUBLIC INTERNET with nothing left pointing at it. The
         Reviewer believes they deleted it. AD-6 and the brief's personal-data constraint are what
         this reaches.

      3. FILE DELETION (:135, :137). FR-14 promises the image copies go with the Bundle and NFR-5
         says the Vault holds no file the Library does not point at. A swallowed delete leaves
         orphaned files, unreported. Same shape as W6-S10's vault-move swallow, and milder: the
         orphan report (FR-15) can find these - once BUG-6 makes it reachable.
    why_undetected: |
      `let _ =` is invisible to clippy at default levels and reads as deliberate. No test exercises a
      failing filesystem or a failing unpublish, because every store test uses a writable temp dir
      and a live path. This is the third instance today of one habit - vault_migration.rs:141 and
      :180 were the first two - which is why it is registered as its own defect rather than folded
      into W6-S10.
    fix: |
      Composition: propagate the write failure and roll back, so FR-10's all-or-nothing is real.
      Do not swallow VaultBlobStore::new either.
      Unpublish: on failure, ABORT THE DELETE and report it. BR-20 already dictates the behaviour -
      leave it marked published. Never delete a local record whose remote copy may still be live.
      File deletion: report what could not be removed, as W6-S10 does for the Vault move.
    note: |
      Part 2 is `sharing` behaviour reached from a `bundle` command, and DEC-005 freezes `sharing`.
      It is NOT frozen work: the swallow is in bundle.rs, the fix is in bundle.rs, and DEC-005 says
      in its own text that it does not forbid fixing a defect in what already shipped.
    resolved: |
      W6-S9, 2026-08-24. delete_bundle now aborts and reports when unpublish fails, instead of
      deleting the local record while the published copy stays live on the public internet with
      nothing pointing at it. BR-20 was written to forbid exactly that, and the fix follows from the
      rule rather than from taste. The swallows on the composition path and the file-deletion path
      are gone too, including the second one hiding inside the first - the if let Ok(...) on
      VaultBlobStore::new that simply did not run.

      Proving it took three attempts, and the obstacle is worth keeping: the first two produced a
      test binary that could not start at all - STATUS_ENTRYPOINT_NOT_FOUND - because it built a
      tauri::test::mock_app. The resolution was to extract the logic of create_bundle, delete_bundle,
      copy_bundle_to_clipboard, unpublish_bundle and delete_finding into plain _impl functions taking
      &AppState, leaving each #[tauri::command] as a one-line shim. AppState is a plain struct, so
      the tests build it directly and Tauri is not involved.

      One attempt had put tauri's `test` feature on the PRODUCTION dependency in the workspace
      Cargo.toml, which would have shipped the test harness inside the release binary. It is out.

      Verified by the coordinator, exit codes read directly: cargo test --workspace 0, cargo fmt 0,
      cargo clippy --all-targets -D warnings 0. The test that matters now runs and passes:
      deleting_a_published_bundle_whose_unpublish_fails_aborts_and_reports.
    stale_reference: |
      `apps/desktop/src-tauri/src/commands/bundle.rs` was archived by `DEC-007`. Half of what this
      row was about is answered in the replacement and half has no code to be wrong in:

      - COMPOSITION: `assemble_bundle` in `apps/desktop/src/main.rs` propagates every filesystem
        Result with `?` and puts the failure on screen. `BUG-55` covers the wiring and `BUG-19`,
        `BUG-22` and `BUG-23` cover what it refuses;
      - DELETION and UNPUBLISH: there is no Slint caller at all. `bundle_store.delete_bundle` and the
        Publication path are unreachable from the running application, so `FR-14`, `BR-20` and
        `BR-23` are unmet rather than mishandled. Tracked on `BUG-88`.
        POINTER CORRECTED 2026-08-31 by `wdi-review`: this line said `Tracked on BUG-59`, and BUG-59
        does not track it. That row is `component: agent-access`, its title is the Local API, and its
        `contradicts:` lists FR-20, FR-21, FR-19, FR-22, CAP-7 and BG-3 - `FR-14` appears in none of
        them. So three unmet promises, one of them behind the only `critical: yes` use case in
        `bundle`, were recorded as tracked somewhere that did not track them, from inside a row marked
        `fixed` where nobody would look. `BUG-88` now holds them.
    status: fixed
  - id: BUG-10
    title: "The MCP bridge can hand an agent an error with an empty message"
    found: "2026-08-23"
    found_by: coordinator, extending the `let _ =` sweep into snapdown-bridge
    component: agent-access
    severity: low
    contradicts: [AD-7, BR-17]
    evidence: |
      crates/snapdown-bridge/src/client.rs:155-163
        fn parse_error_response(_code: u16, resp: ureq::Response) -> String {
            let mut body = String::new();
            let _ = resp.into_reader().read_to_string(&mut body);
            if let Ok(env) = serde_json::from_str::<ApiErrorEnvelope>(&body) { ... } else { body }
        }
      If the body read fails, `body` stays "", the envelope parse fails, and the function returns the
      empty string as the error message. The caller wraps it in Err() and the MCP tool surfaces an
      error with nothing in it.
    impact: |
      AD-7 exists so one error envelope crosses every process boundary, and BR-17 says a refusal is
      always distinguishable from an empty result. An error whose message is the empty string is a
      refusal that says nothing - the agent learns only that something failed.
      LOW, and honestly so: this is the error path of a call that has ALREADY failed, so it needs a
      second failure to reach. The likely readings are a dropped connection mid-error-body or a
      non-UTF-8 body. Neither is common and neither loses data.
    why_undetected: |
      Same habit as BUG-9 and W6-S10 - `let _ =` on a Result an invariant depends on - which is now a
      pitfall in AGENTS.md. Found by extending that sweep into a component nobody was looking at.
      No test exercises a failing body read; every bridge test uses a live loopback response.
    fix: |
      On a failed read, return a message that says so - the status code plus "the error body could not
      be read" - rather than "". Never return an empty error string.
    note: |
      Also swept and NOT registered: main.rs:21-22 swallows the stdout write and flush in the stdio
      loop. That is defensible - there is nothing useful to do about a failure on the very channel you
      would report it over - and it is recorded here so the next sweep does not re-raise it.
    scheduled: W7-S3
    note_on_the_freeze: |
      NOT blocked, for the same reason as BUG-3: DEC-005 permits a fix and forbids new work.
    resolved_by: W7-S3, commit 362bfad
    resolution: |
      RESOLVED 2026-08-24. parse_error_response now delegates to parse_error_response_reader, which
      takes any std::io::Read, and NO path returns the empty string.

      THREE empty-message paths are closed, not the one BUG-10 named. The story found a second - a
      body that READS SUCCESSFULLY and is empty also produced "" - and a third, a non-UTF-8 body.

      THE REVIEW CHANGED THE REMEDY (finding M8). The first plan returned free-form strings such as
      "HTTP 502: (failed to read error response)". cross-cutting.md forbids exactly that: "The MCP
      Bridge does not invent its own errors. It maps a Local API envelope onto an MCP tool error,
      preserving code and message verbatim." A message with no catalogue code satisfies the letter of
      "not empty" while missing what AD-7 is for - its own rule is that a refusal is distinguishable
      from an empty result BY ITS CODE. The implementation now synthesises `internal`, the catalogue
      code for something the producer did not anticipate.

      Verified by the coordinator: 3 unit + 3 integration tests pass, and by MUTATION - replacing the
      synthesised message with String::new() turns two of the three unit tests red.
    status: fixed
  - id: BUG-11
    title: "There is no reproducible way to build the desktop application"
    found: "2026-08-23"
    found_by: coordinator, after a hand-built binary launched into a webview network error
    component: settings
    severity: high
    contradicts: [FR-27, BR-121, "codebase-stack-guide.md"]
    evidence: |
      The Tauri CLI is absent everywhere:
        `cargo tauri --version`            -> error: no such command: `tauri`
        `npx --no-install tauri --version` -> could not determine executable to run
        apps/desktop/package.json devDependencies -> no tauri package at all
        apps/desktop/package.json scripts -> dev, build, preview, typecheck, lint, test. No tauri.
        Cargo.toml has tauri, tauri-build and three plugins - the LIBRARIES - and no tauri-cli.
      The CORPUS documents no build command: codebase-stack-guide.md, README.md and the workflows
      contain no `tauri build`, `tauri dev`, `cargo tauri` or `npm run tauri`.
      desktop-ci.yml produces no artifact: no bundle step, no upload, no release.

      CORRECTED 2026-08-23, after this entry was first written. The command is NOT unknown - it is
      `cargo tauri build`, and W1 knew it. It is written down in W1's WORKING OUTPUT and nowhere a
      reader would look:
        _bmad-output/specs/w1-settings/review-W1-S1-reviewer-a.md:46
          "vite build fails, therefore cargo tauri build fails, therefore frontendDist is never
           produced. cargo tauri dev serves http://localhost:5173 with no document."
        _bmad-output/specs/w1-settings/dispatch-briefs/W1-S1-ui-verification-finish.md:65
          "HOW TO RUN IT: cargo tauri dev from apps/desktop, or build and run target/debug/
           desktop.exe WITH THE VITE DEV SERVER UP."
      So the defect is sharper than "nobody documented it". A W1 reviewer diagnosed this exact
      failure mode - frontendDist never produced, the webview falling back to localhost - raised it
      as a must-fix, and the CLI it depends on was still never made a dependency of the repository.
      The knowledge lived in a wave's scratch output, which `_bmad-output/` is explicitly allowed to
      hold and which nothing carries forward.
    impact: |
      `cargo build --release -p snapdown` compiles and links, and the binary it produces is NOT the
      application. Launched, its webview requests the `devUrl` from tauri.conf.json
      (http://localhost:5173), nothing is serving it, and the window shows
      "localhost refused to connect - ERR_CONNECTION_REFUSED". Verified by screenshot on 2026-08-23.
      The bundled `frontendDist` is only wired in by the Tauri CLI, which is not here.
      So: the shipped Snapdown.exe was built by some means nobody wrote down, nobody can reproduce
      it, and CI has never built the product it is testing the parts of.
      BR-121 says a build produces exactly one desktop executable. It is asserted by a unit test that
      reads Cargo.toml and tauri.conf.json - which is the right proxy for the DECLARATION and proves
      nothing about a build, because there is no build to run.
    why_undetected: |
      Everything around it is green and none of it builds the app. cargo test compiles the crates,
      npm run build bundles the frontend, and the two are never joined. The gap is exactly the seam
      between them - the same shape as BUG-4, which was the seam between the Rust window builder's
      URL and the frontend's routing. Seams have no owner here.
      It surfaced only because a UI verification was attempted against a SELF-BUILT BINARY. That
      appears to be the first time in this project: W1's UI verification brief told its worker to run
      `cargo tauri dev` with the Vite dev server up, so every UI claim this project has ever made was
      made against a DEV SERVER, never against a bundled application. A bundled binary has never been
      verified to work by anyone.
    fix: |
      Add the Tauri CLI so the repository can install it - `@tauri-apps/cli` as a devDependency of
      apps/desktop with a `tauri` script, or `cargo install tauri-cli` pinned and documented. Carry
      `cargo tauri build` into codebase-stack-guide.md next to the verification commands, where a
      reader will actually find it rather than in a closed wave's scratch folder. Then have desktop-ci.yml actually build the bundle, which is what makes
      BR-121 checkable against a real build rather than a declaration.
      Until then, treat any locally built Snapdown.exe as NOT the application.
    note: |
      One thing WAS verified from that broken build and it is worth keeping: the window title read
      "Snapdown Editor". W6-S2's persona naming (DEC-003, FR-27) is correct in a real running window,
      which is the first time anything about the product has been confirmed outside jsdom.
    resolved: |
      W6-S11, 2026-08-23. @tauri-apps/cli@^2.0.0 is a devDependency of apps/desktop with a `tauri`
      script, pinned to the same major as the tauri = "2.0" crates. The build command now sits in
      codebase-stack-guide.md beside the verification commands - the place it was missing from, not
      a wave folder that later closes. desktop-ci.yml builds the bundle on windows-latest and asserts
      exactly one .exe in target/release, so BR-121 is finally checked against a real build.

      Verified by the coordinator on the worktree, exit codes read directly rather than through a
      pipe: `tauri build --no-bundle` exits 0, produces exactly one executable (Snapdown.exe,
      13.3 MB), and the freshly built frontend bundle name (index-BBTULvhi.js) is present INSIDE the
      binary. The assets are embedded, which is precisely what was not happening before. CI is green
      on the head SHA.

      What that does NOT prove: that the window renders. The embedded-asset check is a headless proxy
      for the cause; it is not the manual check. `manual::a_freshly_built_binary_loads_its_bundled_frontend_not_devurl`
      remains unrun, and BUG-4, BUG-5 and BUG-12 stay unproven in a running product until it is.
      What changed is that running it is now possible for the first time.
    verified: |
      This row recorded that no bundled `Snapdown.exe` had ever been verified to run - every UI
      claim had been made against a Vite dev server. `DEC-007` retired the premise entirely: there is
      no webview and no dev server, and the release binary is the only thing there is to run.

      The owner has launched and driven `target/release/Snapdown.exe` repeatedly across this session,
      reporting live memory figures from the running process. `desktop_crate_declares_exactly_one_
      binary_named_snapdown` keeps the second-binary confusion (`FR-27`) from returning.
    status: fixed
  - id: BUG-12
    title: "A corrupt or unreadable library.db makes the application vanish on launch"
    found: "2026-08-23"
    found_by: coordinator, sweeping the panic surface that DEC-003's Cost section predicted
    component: settings
    severity: high
    contradicts: [BR-118, AD-11, "SDD-settings.md Failure Behaviour"]
    evidence: |
      apps/desktop/src-tauri/src/lib.rs:109-119 - five store opens, every one .expect():
        SqliteSettingsStore::open(&db_path).expect("Failed to initialize SqliteSettingsStore")
        SqliteFindingStore::open(&db_path).expect("Failed to initialize SqliteFindingStore")
        SqliteBundleStore::open(&db_path).expect("Failed to initialize SqliteBundleStore")
        SqliteAccessKeyStore::open(&db_path).expect("Failed to initialize SqliteAccessKeyStore")
        SqlitePublicationStore::open(&db_path).expect("Failed to initialize SqlitePublicationStore")
      SDD-settings.md Failure Behaviour, the LC-025 -> library.db row, promises the opposite:
        "Reported with the file's path, and NOTHING IS CREATED OVER IT (BR-118). A store recreated
         beside a corrupt one is silent data loss."
    impact: |
      Half the promise is kept and half is not. Nothing IS created over the corrupt store - the panic
      guarantees that much. But nothing is REPORTED either.
      A Tauri release binary on Windows has no console. A panic inside the setup hook unwinds and the
      process exits, so the Reviewer double-clicks Snapdown.exe and NOTHING HAPPENS - no window, no
      tray icon, no message, no file named. The product does not appear to be broken; it appears not
      to be there.
      AD-11 sharpens it: one process owns the tray, the hotkeys, the overlay and the Editor. There is
      no surviving surface to report into, which is exactly the cost DEC-003 accepted and wrote down.
    why_undetected: |
      DEC-003's Cost section PREDICTED this class in writing - "a panic in the editor's Tauri commands
      kills the tray, the hotkeys, and the overlay with it ... this raises the bar on every unwrap in
      the command layer" - and nobody then went and looked at the unwraps. The prediction was recorded
      and never turned into a check.
      No test opens a corrupt database. Every store test uses open_in_memory().
    fix: |
      Do not panic. Open the stores fallibly, and on failure show a window - or a native dialog -
      naming the file that could not be opened and offering to open its folder. That is what the SDD
      already specifies; the code simply does not do it.
      The store must still never be recreated beside a corrupt one. BR-118 is not in question.
    note: |
      Also swept and deliberately NOT registered, so the next sweep does not re-raise them:
        server/handlers.rs - 26 unwraps, ALL Header::from_bytes over compile-time byte constants
          such as b"Content-Type" / b"application/json". These cannot fail.
        lib.rs:226 - .expect("error while running tauri application") on the Tauri run call. If that
          fails there is nothing left to report with.
        bridge mcp.rs:55,81 - serde_json::to_string on a well-formed response struct. Effectively
          infallible, and the bridge has no channel to report a serialisation failure over anyway.

      THE SECOND EXCLUSION ABOVE HAS EXPIRED. Its reason - "there is nothing left to report with" -
      was true while every store open panicked before reaching that line. W6-S5's fallible open made
      it the ROUTINE exit path for a store failure, and the premise stopped holding without anyone
      noticing. Registered as BUG-16. Re-read a sweep's exclusions whenever the code they reasoned
      about changes; this is the second time an exclusion has outlived its reason.
    resolved_by: W6-S5, commit aa30434
    resolution: |
      RESOLVED, AND THE REGISTER WAS WRONG FOR A DAY. Fixed on 2026-08-23 by W6-S5 ("Run at Windows
      startup"), which was not scoped to this defect and closed it as a side effect of needing a
      fallible startup path. Nobody updated this row, so it still read `open` on 2026-08-24 - and
      wave W7 was opened with a whole story, W7-S1, planned against it. The planner was dispatched,
      wrote a full implementation plan, and reported success; the SPEC review caught it by reading
      the code instead of the register.

      What aa30434 actually landed in apps/desktop/src-tauri/src/lib.rs:
        StartupError::DatabaseOpen { path, source }   :51-59
        StoresBundle                                  :61-67
        init_app_stores -> Result<_, StartupError>    :69-102
        format_startup_error_message                  :105-120
        show_native_message_dialog via MessageBoxW    :122-152
        report_startup_error, writes startup-error.log :154-163
        the fallible setup hook returning Err         :226-233
      The five .expect() store opens are gone. `grep -n '\.expect(' lib.rs` returns one hit, :347,
      which is BUG-16.

      THREE THINGS IT DID NOT CLOSE, each now its own row rather than residue hidden here:
        BUG-15  the WAL pragma writes to the file before quick_check runs, so a corrupt store IS
                written to and -wal/-shm ARE created beside it. This is the half of BR-118 the fix
                was supposed to protect, and the byte-identity test passes only because its fixture
                is garbage bytes that SQLite rejects before any pragma runs.
        BUG-16  the exit is still a panic, through the excluded .expect() above.
        BUG-17  the dialog has no owner and no foreground flag, so it can open behind other windows.

      THE LESSON, and it is the same one as the four unreachable components: a register entry is a
      claim about code at a moment, and it goes stale silently. Read the code before planning against
      a defect row. W7-S1 was re-scoped rather than cancelled - BUG-15/16/17 are real and they are
      what it now carries.
    stale_reference: |
      `apps/desktop/src-tauri/src/lib.rs` was archived by `DEC-007`, AND THE FIX WENT WITH IT. This
      row is closed and its behaviour has regressed - see `BUG-60`, which is the live record.

      Re-read against `apps/desktop/src/main.rs`: `AppContext::init` no longer panics, which is the
      half that improved. It falls back to an IN-MEMORY store and reports the reason with
      `eprintln!`, and a release binary on Windows has no console. So a corrupt `library.db` now
      produces an empty Library with no explanation, and every Finding made in that session is lost
      on exit. There is no error dialog anywhere in the Slint app.
    status: fixed

  - id: BUG-13
    title: "The new CI guard counts every .exe, but FR-27 promises one DESKTOP executable"
    found: "2026-08-23"
    found_by: coordinator, rebuilding the app in the main checkout the same day W6-S11 landed
    component: settings
    severity: medium
    contradicts: [FR-27, BR-121]
    evidence: |
      .github/workflows/desktop-ci.yml, the "Verify desktop executable" step added by W6-S11:

        $exeCount = (Get-ChildItem -Path "target/release/*.exe").Count
        if ($exeCount -ne 1) { Write-Error "...found $exeCount"; exit 1 }

      It counts EVERY executable in target/release. This workspace legitimately produces a second
      one: `snapdown-bridge.exe`, from crates/snapdown-bridge, the MCP executable named in AGENTS.md
      and in the C4 set. It is not a desktop executable and FR-27 does not forbid it.

      FR-27's consequence, verbatim:
        "The build produces exactly one desktop executable. A second one left in the output directory
         is a build failure, not clutter - a stale `desktop.exe` beside the correct `Snapdown.exe` is
         precisely what caused the Reviewer to run the wrong binary."

      The promise is about a second DESKTOP executable - the stale-rename case. The guard as written
      also fails on a legitimate workspace binary.

      Reproduced locally: target/release held snapdown-bridge.exe from an earlier `cargo build
      --workspace`, so the guard would have counted 2 and failed a correct build.
    impact: |
      Not a false green - a false RED, which is the kind that gets a guard deleted rather than fixed.
      The first person to run `cargo build --workspace` and `tauri build` against one target
      directory gets a build failure with a message that names no real problem.
    why_undetected: |
      It passes in CI by accident of job layout, not by being right. `web-check` runs `tauri build`
      and never builds the bridge; `rust-check` builds the workspace in a separate job with its own
      target directory. Nothing shares a target directory today, so the two never meet. A cache
      change or a job merge would surface it, and the guard would look wrong rather than the layout.
    fix: |
      Count only the desktop executable's own name against the product name, or exclude the known
      workspace binaries by name rather than counting the directory. The check should answer "is
      there a second executable claiming to BE the desktop app" - which is the stale-rename case
      FR-27 describes - not "how many executables exist".
    note: |
      Found by rebuilding rather than by reading. The first build of W6-S11 ran in a fresh worktree
      where the bridge had never been built, so the guard's blind spot could not show itself there.
    related: BUG-11
    resolved: |
      2026-08-24, by the coordinator. The guard no longer counts the directory. It names the two
      binaries this workspace legitimately produces - Snapdown.exe and snapdown-bridge.exe - and
      fails on anything else, which is the question FR-27 actually asks: is there a second
      executable claiming to BE the desktop app.

      Verified by mutation, both directions, on a real build:
        Snapdown.exe + snapdown-bridge.exe present  -> PASS (the old guard counted 2 and failed)
        a stale desktop.exe planted beside them     -> FAIL, naming desktop.exe

      The second case is the exact scenario FR-27 was written for - a stale desktop.exe beside the
      correct Snapdown.exe is what made the Reviewer run the wrong binary and report four defects
      that did not exist.

      A new workspace binary now requires adding its name to the list in that step, which is the
      right friction: a second executable appearing unannounced is what the guard is for.
    status: fixed

