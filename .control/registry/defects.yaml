  - id: BUG-33
    title: Container suggestions included cloaked windows, off-screen panes, and windows behind other windows
    found: "2026-08-27"
    found_by: kodesh87, manual capture test of 1-click container selection
    component: capture
    severity: medium
    contradicts: [FR-1]
    root_cause: code
    evidence: |
      `detect_capture_targets` filtered on `IsWindowVisible` and a minimum size, and nothing else.
      Three consequences: `IsWindowVisible` is true for a suspended Store/UWP window that DWM draws
      nothing for; a scrolled-out or collapsed UIA pane still reports a valid bounding rectangle;
      and candidates carried no z-order, so a pane belonging to a buried window was offered on top
      of the window covering it.
    impact: |
      Reported as "mensuggest area2 yang gak jelas ... jangan2 window yang hidden juga dideteksi".
      Exactly that.
    why_undetected: |
      The detection was wired the same day. Its bench counted targets and timed them; nothing
      checked whether a target was somewhere the Reviewer could actually see.
    fix: |
      DWMWA_CLOAKED skips undrawn windows, CurrentIsOffscreen skips scrolled-out elements, and
      CaptureTarget carries the window's z-order depth. Targets are sorted depth first and area
      second, so taking the first rectangle containing the pointer yields the tightest container of
      the FRONTMOST window. Measured: 77 targets before, 68 after.
    resolved: |
      2026-08-27, confirmed by the owner. Guarded by detection_ignores_what_is_not_actually_on_screen,
      verified by mutation - including a mutant that swaps the sort keys.
    status: resolved
  - id: BUG-34
    title: Snapdown appeared in its own screenshot, and hiding it could not be timed reliably
    found: "2026-08-27"
    found_by: kodesh87, manual capture test
    component: capture
    severity: medium
    contradicts: [FR-1]
    root_cause: code
    evidence: |
      The Editor stayed on screen while the desktop was grabbed. The Tauri predecessor hid it first
      (archive/desktop-tauri) and the Slint port dropped that. Hiding it was tried first and left
      the owner reporting "ada bayang2nya tidak hilang total di overlay": `hide()` reaches
      `ShowWindow` at once, but the desktop stops containing those pixels only after the compositor
      has presented a frame without them AND whatever was underneath has repainted.
    impact: |
      Snapdown's own window, and its shadow, appeared in the frozen overlay and in any Finding
      overlapping it.
    why_undetected: |
      Nothing inspects the captured pixels for the presence of our own window.
    fix: |
      WDA_EXCLUDEFROMCAPTURE rather than hiding. DWM composes the frame that capture APIs see
      without the window in it, shadow included, from the moment the call returns - so there is no
      timing to get right, no repaint to wait for, and no flicker when the Editor comes back. The
      60ms wait that hiding needed is gone with it.

      It also removes a hazard instead of adding one: with nothing hidden, no failure path can leave
      the Reviewer looking at a product with no visible window. An interim version DID hide, and
      needed a restore call on every early return to avoid exactly that.

      Needs Windows 10 2004 or newer. Where unavailable it logs and degrades to the old behaviour.
    resolved: |
      2026-08-27, confirmed by the owner. Guarded by
      the_editor_is_excluded_from_the_capture_rather_than_hidden, verified by mutation.
    status: resolved
  - id: BUG-35
