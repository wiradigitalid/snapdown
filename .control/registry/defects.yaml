  - id: BUG-62
    title: Every image the product writes used Fast compression and a redundant alpha channel
    found: "2026-08-27"
    found_by: the owner, noticing a 1.5 MB file coming back from an import at 1.9 MB
    component: finding
    severity: medium
    contradicts: ["BG-3", NFR-1]
    root_cause: code
    measurement: |
      Measured in a RELEASE build on three real files out of the owner's own Vault, comparing the
      product's output against the settings it should have been using:

        1460x1042 UI capture     155 KB -> 88 KB   (-43%)   18 ms
        1254x1254 photo import  1951 KB -> 1537 KB (-21%)  381 ms
        486x308 small capture      7 KB ->  2 KB   (-71%)    1 ms

      The middle row is the one reported. 1537 KB is what the file weighed BEFORE the import - so the
      import was not adding information, it was spending 400 KB to store the same pixels worse.

      `CompressionType::Best` was measured too and rejected: 1493 KB against Default's 1537 KB - 3%
      for four times the time (1442 ms against 381 ms).
    evidence: |
      `crates/snapdown-store/src/image/pipeline.rs` called `PngEncoder::new`, which is
      `CompressionType::Fast`, and always wrote `ExtendedColorType::Rgba8`.

      A screen capture is fully opaque, always, so the alpha channel was a quarter of the raw bytes
      carrying one repeated value. `MarkerBurner` did the same, and its output is the copy that
      actually reaches the agent.
    impact: |
      Every Finding and every burned Bundle image in the product is roughly 20-70% larger than it
      needs to be. `BG-3` is "a handoff costs as few agent tokens as it can", and a fetched image is
      the largest thing in a handoff.

      Visible to the owner only on an import, because an import is the one case where there is an
      original to compare against. Every capture had the same overhead and nothing to compare it to.
    why_undetected: |
      `PngEncoder::new` looks like the neutral choice. Nothing in the name says it picks the fastest
      and worst compression, and nothing in the product asserted a size - the image tests check that
      output DECODES, which is the right thing to check and says nothing about this.

      The `encoder_quality` half of the QualityBudget is also inert: PNG is lossless, so the number
      the Reviewer can set has no effect on it at all. That is not this defect, but it is why nobody
      looked here - the budget appeared to be in charge of size.
    fix: |
      fastpath, done. One `encode_png` in `pipeline.rs` now owns how this product writes a PNG:
      `CompressionType::Default` with `FilterType::Adaptive`, and `Rgb8` when every pixel is opaque.
      `MarkerBurner` calls the same function rather than keeping its own encoder.
    verified: |
      `crates/snapdown-store/tests/test_png_encoding.rs`, five tests, four mutants KILLED: always
      write RGBA, always drop alpha, revert to Fast, and a size assertion that the alpha fix alone
      could satisfy.

      Two things that made the tests honest, both worth keeping in mind:

      - the compression test first used a RANDOM fixture and failed by 20 bytes. Random data is
        incompressible, so `Default` spends more effort than `Fast` for slightly more overhead and
        genuinely loses. A screenshot is mostly flat regions, so the fixture is now shaped like one;
      - the first version of the size assertion compared RGBA against RGB output, so a mutant that
        reverted the compression SURVIVED - the alpha fix alone kept it green. Two changes landed
        together and one assertion cannot hold both ends.

      And the first measurement was taken in a DEBUG build, where Default reads 596 ms for what is
      18 ms in release. That is the trap `AGENTS.md` records about this repository, hit again.
    status: fixed

  - id: BUG-63
    title: The Quality Budget's encoder_quality does nothing, because the product writes PNG and the corpus designed for WebP
    found: "2026-08-27"
    found_by: the owner, asking why an imported file was not compressed after BUG-62 was fixed
    component: finding
    severity: medium
    contradicts: [FR-5, FR-6, "BG-3", "CAP-3"]
    root_cause: architecture
    violates: [FR-5, FR-6]
    measurement: |
      Measured in a RELEASE build on the owner's own files, all three fully opaque:

        1254x1254 photographic import
          PNG  Default/Adaptive RGB     1537 KB   389 ms   <-- what the product writes
          WebP lossless (pure Rust)     1468 KB    13 ms
          JPEG q90                       204 KB    26 ms
          JPEG q82                       143 KB    25 ms
          JPEG q75                       119 KB    25 ms

        1460x1042 UI capture
          PNG  Default/Adaptive RGB       88 KB    19 ms   <-- what the product writes
          WebP lossless (pure Rust)      102 KB     6 ms
          JPEG q90                       177 KB    32 ms
          JPEG q82                       139 KB    25 ms

      Read those two blocks together, because they point opposite ways. On PHOTOGRAPHIC content a
      lossless format is 10x worse than a lossy one. On a UI SCREENSHOT - flat panels, hard edges,
      text - PNG beats every JPEG setting, and JPEG would add ringing around the text as well.
    evidence: |
      `QualityBudget` resolves to a `ResolvedPair { max_long_edge, encoder_quality }`. The presets are
      Sharp 90, Balanced 75, Small 50, and `derive_auto_budget` picks 92, 82 or 70 by region size.

      `encoder_quality` is read by NOTHING that encodes. `ImageReducer::reduce_image` takes the pair,
      uses `max_long_edge` to decide the resize, and writes PNG - which is lossless, so a quality
      number has no meaning for it. A grep for `encoder_quality` outside tests finds only the field's
      own definition, the presets, and the column it is stored in.

      The corpus designed for WebP throughout. `.how/settings/01-ux/assets/06d-settings-about.html`
      says "Rust Core + WebP Codec"; `.how/finding/01-ux/assets/02-capture-overlay.html` shows
      "520 x 320 px (WebP ~460 tokens)"; the bundle assembly asset references
      `bundles/item_1_burned.webp`. The archived Tauri paths were `.webp` too. The Slint rewrite
      writes PNG, and nothing recorded that the quality half of the budget went inert with it.
    impact: |
      `FR-5` and `FR-6` are the Quality Budget: the Reviewer picks Sharp, Balanced or Small, and
      three of those four settings differ ONLY in `encoder_quality` once the long edge is the same.
      Balanced and Auto share a 1600px long edge; between them the quality number is the whole
      difference, and it does nothing.

      For UI screenshots - the product's main content - the current PNG is genuinely the right
      choice, and `BUG-62` already took 20-70% off it. So this is not "images are too big" across
      the board. It is that the lever the corpus promises is not connected, and on photographic
      content that costs 10x.
    why_undetected: |
      Nothing asserted a size, and the image tests check that output DECODES - which is the right
      thing to check and says nothing about this. The budget also LOOKS like it is in charge: it
      resolves a quality, stores it on the Finding as `resolved_encoder_quality`, and reports it in
      the Editor. Every part of the chain exists except the one that would use it.

      Eighth instance of this repository's signature shape, and the first one where the missing join
      is a NUMBER rather than a call.
    fix: |
      DONE, 2026-08-28, and the answer is not the one the row assumed.

      The row assumed a format change - WebP lossy, or JPEG. Neither was needed. What `encoder_quality`
      means now is a two-step reduction that keeps PNG:

        1. round every colour channel to N bits, N from the quality number
        2. if the result is opaque and fits in 256 colours, write an INDEXED PNG - one byte per pixel
           plus a palette, instead of three bytes per pixel

      Measured on a 1280x800 fixture with antialiased glyph shoulders and a gradient, which is where a
      real capture's colour count comes from:

        lossless           32117 bytes  100%
        7 bits, RGB        23562 bytes   73%   max channel error 1
        7 bits, INDEXED     8403 bytes   26%   max channel error 1
        6 bits, INDEXED     7756 bytes   24%   max channel error 2

      A 74% reduction for a per-channel error of one. It works because a UI screenshot is flat colour
      and text, and this product exists to capture UI screenshots - so the common case is the one that
      benefits. A capture carrying photographic content exceeds 256 colours, falls through to step 2's
      `else`, and still comes out around 27% smaller.

      Quality 100 stays lossless and skips all of it.

      Three things worth recording beyond the fix:

      - **Quantisation is idempotent**, which is why the burn can re-encode a Finding without
        degrading it a second time. `quantising_twice_changes_nothing` asserts it, because a Bundle
        composed three times would otherwise be visibly worse than one composed once.
      - **The burn uses the FINDING's quality**, not a fresh choice. Encoding the handoff lossless
        while the Finding was quantised would make the copy larger than the original.
      - **An existing test caught the change honestly.**
        `a_reduced_image_decodes_and_its_pixels_are_the_scaled_source` compares pixel-for-pixel
        against a Lanczos3 resize, and went red at +/-1. That is the encoder now being lossy, exactly
        as designed. The test is pinned to quality 100 rather than loosened: its subject is the
        reducer's arithmetic, and the perceptual claims live in `test_png_encoding.rs` where they can
        fail for their own reasons.
    decision: DEC-010
    status: fixed

  - id: BUG-64
    title: A Marker with no note line was never burned onto the Bundle's image, which is the opposite of what SCN-04 requires
    found: "2026-08-27"
    found_by: the owner, noticing Markers missing from the Assemble preview
    component: bundle
    severity: high
    contradicts: ["SCN-04", "AD-1", FR-8]
    root_cause: code
    evidence: |
      `crates/snapdown-store/src/image/burner.rs` filtered before drawing:

        let active_markers: Vec<&Marker> = markers
            .iter()
            .filter(|m| !m.comment.trim().is_empty())
            .collect();

      and drew only those. `SCN-04` says the opposite in its own words:

        1. "Marker 2 stays on the image, at its position, numbered 2."
        4. "The image shows nothing unusual. A badge is a badge."

      and under "Why point 4 is not an oversight": "A 'this marker has no line' ANNOTATION on the
      image would be a permanent artifact of a temporary editing state."

      So the scenario forbids drawing anything EXTRA for such a Marker. It requires the badge. The
      test the scenario names is `a_marker_with_no_line_is_not_annotated_on_the_image`; the test that
      was written is `a_marker_with_no_note_line_is_never_drawn_on_the_image`. One word, and the
      whole behaviour inverted - then asserted, so the misreading was locked in.
    impact: |
      A Marker is placed before it is described. So the Markers most likely to be missing from a
      handoff were the ones just added - which is how the owner found it, looking at the Assemble
      preview and seeing fewer badges than they had placed.

      Worse than a missing badge: the Markdown listed the Marker as `*(No annotation text)*` while
      the image had no badge for it, so the document pointed at something the reader could not find.
      `AD-1` ties a Marker ordinal to a line number, and this broke the tie in the one artifact that
      leaves the machine.
    why_undetected: |
      It was asserted. Two tests encoded the misreading - one in `test_marker_burner.rs`, one in
      `test_bundle_image_copy.rs` with an `SCN-04` comment beside it - so the behaviour was not
      merely wrong, it was protected.

      This is a new failure mode for this register: not a missing join, but a test that reads a
      scenario's title and not its body. Nothing mechanical catches that; a person reading the
      scenario does.
    fix: |
      fastpath, done. The filter is gone and every Marker is drawn. The byte-identity fast path now
      triggers only when there are NO markers and no annotations, which is the case `AD-9` is
      actually about.
    verified: |
      `a_marker_with_no_note_line_is_drawn_as_an_ordinary_badge` - renamed from its inverse - decodes
      the output and asserts a badge at each Marker's centre, INCLUDING one with an empty comment and
      one with whitespace. It also asserts the image corner is untouched, which is the half of
      `SCN-04` point 4 that genuinely forbids something: no extra annotation for a ragged sequence.

      `test_bundle_image_copy.rs` now asserts the Bundle copy DIFFERS from the source for that case,
      and keeps byte identity for the zero-marker case only.

      Two mutants KILLED: restoring the comment filter in the draw loop, and restoring it in the
      fast-path condition.
    related: BUG-19
    status: fixed

  - id: BUG-65
    title: The titlebar could not be dragged while the window was maximized, and the refusal was swallowed
    found: "2026-08-27"
    found_by: the owner, after resizing the Editor to test the Assemble preview
    component: settings
    severity: medium
    contradicts: [FR-26]
    root_cause: code
    evidence: |
      `apps/desktop/src/main.rs`, the titlebar handler:

        win.window().with_winit_window(|winit_win| {
            let _ = winit_win.drag_window();
        });

      Windows refuses `SC_MOVE` for a maximized window, so `drag_window` returns `Err` - into a
      `let _ =`. The titlebar highlighted, took the press, and did nothing, with no trace anywhere.

      The window is frameless (`FR-26`), so this IS the only way to move it. There is no system
      titlebar to fall back on.
    impact: |
      A maximized window could not be un-maximized by dragging, which is how everyone does it. The
      double-click on the titlebar still worked, so the window was not stuck - but the gesture that
      every other application accepts was dead, and nothing said why.
    why_undetected: |
      The `let _ =` class `AGENTS.md` already records, and this is the cleanest example of it yet:
      the swallowed value was not data, it was the ERROR MESSAGE explaining the symptom. Five
      instances of this class were found on 2026-08-23 and this one was not among them.

      No test drove the titlebar - a drag is a UI gesture, and the guard added with the fix asserts
      the code's shape rather than the gesture.
    fix: |
      fastpath, done. The handler restores a maximized window before dragging - which is what every
      window manager does - and reports a refusal instead of discarding it.
    verified: |
      `dragging_a_maximized_window_restores_it_first`. Two mutants KILLED: removing the restore, and
      restoring the `let _ =`.
    status: fixed

  - id: BUG-66
    title: Three of the five scrollbars could not be dragged, because there were five of them
    found: "2026-08-27"
    found_by: the owner - "scroll yang ada di canvas gak bisa di klik and drag"
    component: capture
    severity: medium
    contradicts: [NFR-17, "AD-10"]
    root_cause: code
    evidence: |
      Slint's own scrollbar is a 2px hairline that is invisible against a dark canvas until hovered,
      so this product draws its own. It drew FIVE: two on the canvas, one under the filmstrip, one
      beside the Marker list, one in the Assemble preview - the same twenty lines, copied.

      They had already drifted. The filmstrip's and the Assemble preview's took a pointer because
      they had to (a vertical wheel cannot scroll a horizontal view, and a document is dragged as
      often as rolled). The other three were indicator-only, so the Reviewer could see how far down
      they were and could not do anything about it.
    impact: |
      Two of the three are the canvas's, which is the surface the Reviewer spends the most time on.
      A control that looks like a scrollbar and refuses a drag is worse than no scrollbar: it invites
      the gesture and then ignores it.
    why_undetected: |
      Each copy was correct on its own terms, and no test compared them. A guard existed - it checked
      that the filmstrip's bar and the canvas's shared their geometry - and geometry was exactly the
      half that had NOT drifted.
    fix: |
      fastpath, done. `apps/desktop/ui/components/scrollbar.slint`: one `SdScrollBar`, used by all
      five surfaces. Thickness, radius, colour, the 28px minimum and the drag live in it; the call
      site gives it the extent, the offset, and where to sit - because where a bar belongs depends on
      what it is scrolling.
    verified: |
      `every_scrollbar_in_the_product_is_the_same_component` asserts the geometry is the component's,
      that dragging AND clicking the track both seek, and that no surface draws a `border-radius: 4px`
      bar of its own any more.

      Three mutants KILLED, and the second one matters: the first version of the drag assertion
      checked that `root.seek(` appeared anywhere in the component, and an empty `moved => { }`
      survived it on the strength of the click handler. The two halves of the gesture are now
      asserted separately.
    status: fixed

  - id: BUG-67
    title: A Bundle silently took a different Finding from the one being annotated
    found: "2026-08-28"
    found_by: the owner - "marker notes yang saya isi gak muncul di preview juga code"
    component: bundle
    severity: high
    contradicts: [UC-9, FR-10]
    root_cause: code
    evidence: |
      Read out of the owner's own `library.db`:

        the Finding being annotated  01a043af-f132…  19 Markers
        the Finding the Bundle took  01a04315-e1a9…   3 Markers, none with a note

      The Markers were saved correctly - `update_marker` writes the comment, and 14 of 42 rows carry
      one. They were simply on a different Finding from the one in the Bundle.

      `load_findings_into_window` preserved which Findings were ticked across a capture:

        let already_ticked: Vec<String> = window.get_filmstrip_items()
            .iter().filter(|t| t.is_selected).map(|t| t.id.to_string()).collect();

      So after a capture the NEW Finding is ACTIVE - it is what the canvas shows and what Markers get
      added to - while an OLDER Finding stays TICKED from before. Assemble follows the tick.
    impact: |
      A Bundle can contain a Finding the Reviewer was not looking at, with the annotations they just
      wrote sitting on a different one - and nothing on screen has to be wrong for it to happen. Both
      states are drawn correctly: the accent bar marks the active card, the outline marks the ticked
      ones. They just point at different cards, and only one of them is the one Assemble uses.

      Worse in a long strip, where the ticked card has scrolled out of view.
    why_undetected: |
      The preservation was deliberate - a capture should not discard a half-built Bundle - and it was
      even tested, as "centang filmstrip tidak hilang setelah capture baru". The test was right about
      what it asserted and the behaviour behind it was wrong, which is a shape no test finds: nothing
      compares the tick to the canvas, because until Assemble existed there was nothing that read the
      tick.
    fix: |
      fastpath, done. A capture - and an import - becomes THE selection: the new Finding alone,
      ticked and on the canvas. Pressing the capture hotkey says "this is what I am working on now",
      so it selects the way a plain click does.

      The cost is real and accepted: a half-built Bundle's ticks are cleared by a capture. That is
      recoverable in a few clicks, and the alternative is a Bundle that is silently wrong.
    verified: |
      `a_capture_becomes_the_selection` - a fresh Finding is ticked alone, and the preservation path
      remains for a rebuild that names no new Finding.
    status: fixed

  - id: BUG-68
    title: A Marker's note rendered one character per line in the Assemble preview
    found: "2026-08-28"
    found_by: the owner - "terender memanjang ke bawah tanpa visible teks (sepertinya 1 karakter = 1 new line)"
    component: bundle
    severity: medium
    contradicts: [UC-9]
    root_cause: code
    evidence: |
      The Marker row in the rendered document was a `HorizontalLayout` carrying `alignment: start`
      alongside a note field marked `horizontal-stretch: 1`.

      In Slint those two contradict each other. `alignment: start` gives every child its MINIMUM
      width and distributes nothing, so the stretch factor never applies: the field collapsed to its
      minimum and the text wrapped after every character.

      The Code view was unaffected, because it printed the same text through a plain `Text` that took
      the row's width - which is why it read correctly there and not two inches away.
    impact: |
      A Marker's note was unreadable in the one screen whose job is to show what is being handed
      over, and a Finding with several Markers pushed the rest of the document off the bottom.
    why_undetected: |
      Nothing renders in a test here. The guard added with the fix asserts the layout's shape rather
      than the pixels, which is the honest limit of a source-level check - and it is enough for this
      one, because the defect IS the shape.
    fix: |
      fastpath, done. `alignment: start` removed from the Marker row. The default distribution is
      what lets the ordinal keep its width and the note take the rest.
    verified: |
      `the_marker_note_row_gives_the_note_the_row`. One mutant KILLED: restoring the alignment.
    status: fixed

  - id: BUG-69
