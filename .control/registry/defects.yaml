    scenario: N/A - covered by apps/desktop/tests/test_capture_overlay_escape_cancels.rs
    resolved: |
      2026-08-26, commit 9277ecc. Guarded by capture_overlay_window_binds_escape_to_cancel.
    status: resolved
  - id: BUG-26
    title: One overlay stretched over the whole virtual desktop cannot render a mixed-DPI multi-monitor rig
    found: "2026-08-26"
    found_by: kodesh87, manual capture test on a 150% landscape + 175% portrait pair
    component: capture
    severity: high
    contradicts: [FR-1, FR-2]
    evidence: |
      The overlay was a single window sized to RegionCapturer's stitched virtual canvas. A Win32
      window has exactly one DPI (Microsoft's own high-DPI guidance: a window spanning displays of
      differing scale factors is bitmap-scaled and "appears blurry"), so one window cannot render
      1:1 on a 150% and a 175% display at once.

      The inflation had a second, sharper cause: set_size(PhysicalSize) divides by the window's
      CURRENT scale factor, and before the window exists that is 1.0 - so physical numbers were
      stored as logical ones and then multiplied by the real scale factor once the window was
      created. The 2160x3840 portrait monitor asked for 2160x3840 logical and got a 3780x6720
      window.
    impact: |
      Reported as "two screens full, but like one big zoomed image". The overlay inflated past the
      desktop, the capture preview was unusable, and the crosshair guides spanned both monitors
      instead of the screen the pointer was on.
    why_undetected: |
      Every prior test of this path ran on a single monitor at a single scale factor. Nothing
      asserted the overlay's geometry against the monitor it was meant to cover.
    fix: |
      One overlay window per monitor, each created directly on its target monitor through winit's
      WindowAttributes (via the backend's window-attributes hook) so it is born at that monitor's
      DPI and never fires WM_DPICHANGED, and sized in LOGICAL pixels derived from that monitor's
      own scale factor. RegionCapturer::capture_each_monitor replaces the stitched canvas.

      Flameshot reached the same conclusion for the same reasons - mixed DPI, monitor placement and
      orientation - and abandoned its single stitched canvas in flameshot-org/flameshot#4498, for
      issue #4495.
    scenario: N/A - covered by apps/desktop/tests/test_capture_overlay_fullscreen.rs
    resolved: |
      2026-08-26, commit 9277ecc. Confirmed by the owner: zoom gone, crosshair confined to one
      screen, and a region spanning two monitors is impossible by construction. Guarded by
      one_capture_overlay_is_opened_per_monitor,
      each_overlay_is_placed_and_sized_to_its_monitor_before_being_shown, and
      a_selection_is_clamped_to_the_monitor_it_was_started_on.
    status: resolved
  - id: BUG-27
    title: The capture overlay blinks once per capture on the first pointer move
