  - id: BUG-43
    title: FR-1's "pixel loupe" shows no pixel grid
    found: "2026-08-27"
    found_by: kodesh87, manual capture test
    component: capture
    severity: low
    contradicts: [FR-1]
    root_cause: code
    evidence: |
      FR-1's proof names a "pixel loupe". The magnifier shows magnified pixels with no grid and no
      centre-pixel indicator, so it magnifies without letting the Reviewer count.
    impact: |
      Aligning a selection to an exact pixel boundary is guesswork.
    why_undetected: |
      As BUG-42.
    fix: |
      Grid lines at high magnification with the centre pixel marked. Note the dead end recorded in
      BUG-27: `image-rendering: pixelated` on the loupe made frame timing measurably WORSE, so the
      grid must be drawn rather than obtained by changing the filtering mode.
    resolved: |
      2026-08-27. The loupe's magnification is now expressed in source pixels (16 across its 96px
      face, where it was 32), a grid is drawn per source pixel, and the pixel under the cursor is
      boxed - replacing two 2px crosshair lines that could only say "about here".

      Drawn rather than obtained by changing the sampling mode, per the dead end recorded in BUG-27.
      Guarded by the_loupe_draws_a_pixel_grid, verified by mutation.
      2026-08-27, AMENDED - the grid existed and its cells were not pixels.

      The owner's report reads as a request to move the grid onto the image ("maunya pixelnya itu di
      gambarnya bukan di magnifier ... kotak2 pixel itu mengilustrasikan gambarnya"), and taken
      literally that is not buildable: at 1:1 a source pixel is at most one logical pixel wide and a
      grid line would cover it. Reading the code instead of the request found the real defect, and it
      is the same complaint from the other side.

      `loupe-source-size` was `loupe-pixels * source-scale`. That held the apparent magnification
      constant across DPIs, and in doing so detached the grid from the picture: on a 150% display the
      loupe read out 24 source pixels while the grid drew 16 cells. The boxes lined up with nothing,
      and the image slid continuously underneath a static grid as the pointer moved - so the boxes
      belonged to the FRAME, not to the image. That is exactly what was reported.

      Four changes:
        - `loupe-source-size == loupe-pixels`, so one cell is one source pixel. The DPI-invariant
          magnification loses, because a pixel loupe whose boxes are not pixels is worse than one
          with no boxes;
        - the clip origin is an explicit floored int, so the lattice starts on a whole pixel and the
          view steps pixel by pixel instead of drifting;
        - the boxed cell is derived from the CLAMPED origin rather than assumed to be the middle
          one - at a screen edge the view is pushed off-centre and the middle cell is not the pixel
          under the cursor;
        - the loupe is a square with a 128px face, not a 96px circle. A round mask cuts the outer
          cells into slivers, which is most of the rest of why the grid read as part of the
          magnifier. It also gained a readout of the pixel's desktop coordinates.

      `image-rendering: pixelated` is still not used, and the reason it is not was re-examined rather
      than inherited: the measurement that rejected it was taken while this Image laid out the whole
      screenshot at 3x, and it now clips to 16x16 - so the premise has changed. Filed as OQ-28 rather
      than flipped silently, per the exclusion-expiry rule in AGENTS.md.

      Guarded by the_loupe_grid_is_one_cell_per_source_pixel, verified by mutation with four mutants
      including a restoration of the DPI factor.
      2026-08-27, AMENDED AGAIN - "kotak2 itu menempel di magnifier ... harusnya kotak2 ada di
      kanvas (overlayed screen), sehingga kita bisa memilih pixel yang tepat."

      Taken literally this cannot be built, and that is worth writing down rather than attempting: at
      1:1 a source pixel is at most one screen pixel wide, so a grid line would cover the very cell it
      was drawn to outline. There is no magnification-free way to see an individual pixel.

      What the request is FOR is buildable, and it is where the boxes are, not what they are. The lens
      is now centred on the pointer and drawn on the canvas - a ring, no plate, no caption box - so
      the boxed cell is AT the point of aim and the grid lies over the part of the screen being
      looked at, instead of 24px away in a separate instrument the eye has to travel to. The
      coordinate readout moved outside the lens so it cannot sit under the pointer it describes.

      Deliberately not clamped into the monitor: clamping slides the lens off the pointer, and a lens
      whose centre is not the thing it magnifies is a panel again. At the desktop's outer edge it is
      clipped by the window, and the source clamp keeps the pixels it does show valid.

      Third change to this magnifier, and deliberately a different KIND of change from the first two.
      Those fixed defects - no grid at all, then a grid whose cells were not pixels. This one moves
      where the instrument lives, on a clarified want. If it is still wrong, the next step is a
      decision about the magnifier's shape, not a fourth attempt at the same spot.

      Guarded by the_pixel_lens_is_centred_on_the_pointer, verified by mutation.
      2026-08-27, THIRD PASS, and the owner's clarification is what made it solvable: "pixelnya gak
      bergerak di canvas. Ketika glass magnifier itu bergerak seiring mouse bergerak, maka pixel2
      kotak2 itu yah seperti kita observasi."

      The grid was not supposed to be somewhere else. It was supposed to STAY STILL relative to the
      picture while the lens travelled over it - a magnifier over graph paper. And it did not,
      because of a Slint constraint the previous pass worked WITH rather than around:
      `source-clip-x` is an INTEGER property, so the image can only be clipped on whole source
      pixels. Clipping there and drawing the grid from the lens's own top-left left both of them
      stationary inside the frame, with the image stepping between them - a grid stuck to the glass.

      The fix is to split the view position into a whole part and a fraction. The whole part clips
      the image; the fraction offsets BOTH the image and the grid inside the lens by a sub-pixel
      amount, with one extra source column and row clipped so there is something to reveal. Image
      and grid now share one offset, which is exactly what makes the lattice belong to the picture.

      Three passes, and only this one addresses the thing that was actually reported both times. It
      is a different mechanism rather than a fourth guess at the same spot; the earlier passes fixed
      the cell COUNT and the lens's POSITION, and neither could have made the lattice move.

      Guarded by the_loupe_grid_is_one_cell_per_source_pixel_and_slides_with_the_image, verified by
      mutation - including mutants that remove the offset from the image alone and from the grid
      alone, since sharing it is the whole property.
      2026-08-27, FOURTH PASS - and the first one that changes what the image is MADE OF rather than
      where the lattice is drawn.

      The third pass made this worse and was reverted rather than built on: sliding the image by a
      sub-pixel remainder resamples a magnified picture every frame, so the whole lens shimmered as
      the mouse moved. Owner: "Buruk sekali soal pixel menggeser gambar."

      Their framing is what pointed at the real answer: "anggap aja canvas yang akan di screenshot ini
      punya pixel, semua dipixeling, lalu ketika kita mau berjalan mousenya, disitulah magnifying
      glass melihat menjelajah pixel2 itu." The canvas is pixelated; the glass merely travels over it.

      All three earlier passes drew a lattice over a SMOOTHLY interpolated image - and with smooth
      filtering there are no pixels in the picture for a grid to belong to. The blocks are a blur, the
      only crisp thing is the drawn grid, and so the grid reads as part of the glass no matter where
      it is anchored. `image-rendering: pixelated` makes each source pixel a solid block, and the grid
      becomes a separator between blocks that are already there.

      That sampling mode was excluded on the BUG-27 measurement - taken while this Image laid out the
      whole screenshot at 3x. It now clips to 16x16, the premise expired, and OQ-28 had already
      re-opened it in writing the turn before. OQ-28 is now answered. The residual risk is BUG-27's
      flicker returning; 289 pixels against 75 million makes that unlikely, and it has NOT been
      re-measured, so it is the first place to look if the flicker comes back.

      Four passes on one instrument. Each addressed something real - the cell count, the lens's
      position, the lattice's anchoring, the sampling - and the fourth is a different KIND of change
      rather than another guess at the same spot. If it is still wrong the next step is a decision
      about the magnifier's shape, recorded, not a fifth attempt.

      Guarded by the_loupe_shows_source_pixels_as_pixels, verified by mutation - including a mutant
      that turns `pixelated` back off, since that one line is the whole of this pass.
      2026-08-27, FIFTH PASS - and this one is a specification, not a diagnosis. The owner stopped
      describing the symptom and described the instrument:

        "mouse cursor hilangkan aja ganti jadi cross hair. Lalu ada magnifiying glass di dekat situ,
        dan magnifiying glass itu tengahnya adalah crosshair juga. di snagit magnifiying glass muncul
        kalau mouse kita pelan. ketika cepat dia gak muncul. Magnifiying glassnya bulat, tidak terlalu
        besar seperti sekarang, dan kotak2nya gak sebesar sekarang."

      Built to that, point by point:
        - the OS cursor is hidden and the crosshair IS the pointer - an arrow on top of a 1px
          crosshair covers the pixel it is aiming at;
        - the lens sits BESIDE the pointer again, flipping side near a monitor edge. Centred was the
          fourth pass, on a reading of "the boxes should be on the canvas" that turned out to be
          about the sampling; a lens on top of the target hides the target;
        - it carries a crosshair of its own, crossing on the pixel under the pointer, placed from the
          CLAMPED origin so it still lands on the right pixel at a screen edge;
        - it appears only once the pointer SETTLES. Sampled on a 100ms tick rather than accumulated
          per `moved` event, because event rates differ by device and by how busy the frame is - a
          per-event distance threshold is a different speed on every machine. Roughly 240 px/s. The
          tick stops while the overlay is hidden between captures;
        - round, 96px, 20 source pixels across, so a cell is 4.8px instead of 9px.

      Five passes on one instrument. What that says about this repository is worth recording: four of
      them were the agent inventing a design and the owner correcting it. The absence of a written
      design system is what made that possible, and that is now
      `.constitution/project/design-system-guide.md` rather than another defect row.

      Guarded by the_lens_sits_beside_the_pointer_and_waits_for_it_to_settle and
      the_loupe_shows_source_pixels_as_pixels, both verified by mutation - including two that gate the
      lens and its readout separately, since a single search for the gate passed while the lens itself
      was ungated.
      2026-08-27, SIXTH PASS - the settle detector had no hysteresis, and that is a defect I shipped
      in the fifth.

      Owner: "sekarang magnifiying glassnya terlalu kedap kedip, maunya ada toleransi lambat ... saya
      pelan, tapi kadang hilang, kadang muncul."

      One threshold with a binary flip is a comparator without hysteresis. Hold the pointer anywhere
      near 24px-per-tick and consecutive ticks land on opposite sides of the line, so the lens blinks
      at roughly 5 Hz - and "moving slowly" is precisely the speed that sits near a slow threshold.
      The fault was in the shape of the test, not in the number.

      Now two thresholds with a band between them where nothing changes: below 20px per tick it
      appears, above 70px it goes away, and in between the current state is kept. Hiding also needs
      two consecutive fast ticks, so one jerk of the wrist does not dismiss a lens being read. Roughly
      200 px/s to show and 700 px/s to hide.

      Guarded by the_lens_sits_beside_the_pointer_and_waits_for_it_to_settle, which asserts the two
      thresholds EXIST and that the hide threshold is strictly looser than the show threshold - an
      empty band is a single threshold wearing two names. Verified by mutation, including one that
      collapses them to the same value.
      2026-08-27, SEVENTH PASS - the grid lines were blurred on some rows, and it was a
      physical-pixel alignment fault rather than anything about the grid.

      Owner: "garis2 pixel di magnifying glass itu kayak ada yang kabur di beberapa baris."

      A cell was `96px / 20 = 4.8px` LOGICAL, and this display runs at scale 1.5 - so lines fell at
      7.2, 14.4, 21.6 PHYSICAL pixels and the renderer antialiased each one across two of them. Rows
      that happened to land near a boundary read sharp; the rest read blurred, which is exactly what
      "some rows" means. The 1px lines had the same fault by construction: one logical pixel is 1.5
      physical, so every line was a 50% smear whatever its position.

      Three changes, all the same idea:
        - the cell is chosen as a whole number of PHYSICAL pixels and converted back, and the face is
          derived FROM the cell rather than the other way round - a round face over a pixel count
          gives a fractional cell;
        - a grid line is exactly ONE physical pixel: `1px / source-scale`;
        - the lens's own origin is snapped, via a `snap()` function. That one matters most: the
          pointer arrives at fractional logical coordinates, so an unsnapped lens shifts its entire
          content by a fraction of a physical pixel and blurs every line inside it at once, no matter
          how carefully the cells are computed. The desktop crosshair got the same treatment.

      Seven passes on one instrument, and the shape of them is worth keeping: four were the agent
      inventing a design, two were defects in the agent's own previous pass, and one - this - was a
      rendering fault that no amount of design discussion would have found. Only the owner's eye
      caught any of them, because nothing here renders a Slint component and looks at it.

      Guarded by the_loupe_shows_source_pixels_as_pixels and
      the_lens_sits_beside_the_pointer_and_waits_for_it_to_settle, verified by mutation - including
      one that restores the fractional cell and one that returns the line to a logical pixel.
    status: fixed
