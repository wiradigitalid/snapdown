      stalled frame on the first pointer move of EVERY capture, deterministic and repeatable.
    impact: |
      Cosmetic but conspicuous - it is a full-screen flash at the moment the Reviewer starts
      choosing a region, on every capture.
    why_undetected: |
      Nothing here measures frame timing, and a dropped frame is invisible to every test in this
      repository.
    fix: |
      NOT FOUND. Recorded so the ground already covered is not re-trodden.

      Ruled out by experiment, not by reasoning:
        - Window/renderer creation. SLINT_DEBUG_PERFORMANCE=refresh_lazy,console shows exactly
          three renderer initialisations (main window + two overlays) and the count does NOT grow
          across further capture cycles, so the windows and their OpenGL contexts do persist -
          reuse works, and this is not re-creation.
        - The magnifier. Hiding the loupe entirely left the stall unchanged, so its magnified
          source-clip sampling is not the cause.
        - Filtering mode. `image-rendering: pixelated` on the loupe made it measurably WORSE.
        - The window's clear colour. Switching the overlay from transparent to opaque black
          changed only what colour the bad frame showed, not whether it happened.
        - Element-tree churn. Replacing every `if` gate with `visible` (so no subtree is torn down
          and rebuilt) removed the per-monitor-entry blinks but not this one.
        - The software renderer removes the blink entirely, but is not an acceptable fix: it
          cannot repaint a full-screen 8-megapixel overlay per pointer move, so dragging a region
          becomes choppy, and optimising that broke visual correctness (a static scrim plus a
          source-clipped bright cut-out slides against the backdrop, because source-clip is in
          integer SOURCE pixels while the selection sits at fractional logical coordinates).

      Remaining untested suspicion: a fresh snapshot texture is installed on every capture via
      set_snapshot_image, and the first draw that samples it may stall. If so the bad frame would
      show the PREVIOUS capture's screenshot rather than black - not yet confirmed with the owner.

      The structural alternative, which would remove this whole class rather than this instance:
      a single overlay window over the whole virtual desktop, with each monitor's pixels resampled
      in Rust to that one window's scale factor. One window means one surface, one warm-up and no
      cross-window event ordering at all. Cropping would still come from the unresampled originals
      so saved output stays full quality; only the on-screen preview softens on a monitor whose
      scale differs. That is a DEC-, not a patch, and it has not been decided.
    related: BUG-26
    status: open
