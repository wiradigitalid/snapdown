  - id: BUG-46
    title: The capture note field is single-line, so a longer note scrolls out of sight as it is typed
    found: "2026-08-27"
    found_by: kodesh87, manual capture test
    component: capture
    severity: medium
    contradicts: [FR-2]
    root_cause: code
    evidence: |
      The field is a `TextInput` with `single-line: true`. Text runs off to the right and the
      Reviewer cannot see what they have written.
    impact: |
      Reported as "dia bukan text area, dan malah membuat dia panjang ke kanan, sampe gak bisa
      dilihat apa yang diketik". A Note is prose about what is wrong; a field that hides its own
      contents is not usable for that.
    why_undetected: |
      Every test typed nothing, and every manual check typed a few characters.
    fix: |
      `single-line: true` is not an oversight - it is the ONLY way `accepted` fires, and `accepted`
      is what makes Enter save. Slint's TextInput consumes Return itself when multi-line, so the
      window's FocusScope never sees it and there is no capture phase to intercept it in.

      So this is a trade, and the owner has to know which side they are on:
        - wrapping text area, Enter inserts a newline, Ctrl+Enter saves (the Slack/GitHub
          convention), hint text updated to match;
        - or stay single-line and keep Enter.
      Recommendation is the first: the owner has now asked for a text area twice, and Ctrl+Enter is
      the convention every comment box they already use follows.
    resolved: |
      2026-08-27. `wrap: word-wrap` with `single-line: true`, and the field's box takes its height
      from the input's preferred height so a wrapped note is shown rather than clipped.

      The owner's clarification is what unlocked this - "single line, tapi wrapping ke bawah" - and
      it turned out not to be a trade at all: `TextInput::layout_info` in i-slint-core consults
      `wrap()` without regard for `single_line()`, so the text wraps AND Return still reaches
      `accepted`. The Ctrl+Enter alternative this row recommended is not needed.

      Guarded by the_note_field_wraps_while_staying_single_line, verified by mutation.
    status: fixed
