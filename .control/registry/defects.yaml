  - id: BUG-49
    title: The overlay reports region and screen sizes in logical pixels while everything downstream is physical
    found: "2026-08-27"
    found_by: kodesh87, manual test
    component: capture
    severity: medium
    contradicts: [FR-1]
    root_cause: code
    evidence: |
      The selection badge read `round(sel-w / 1px)` and the full-screen control read
      `round(root.crosshair-w / 1px)` - both LOGICAL pixels of the overlay window. The crop, the
      stored file and the Editor's readout are all in physical pixels. On the owner's 175% display
      that is a 1.75x understatement of what is being taken.

      A second, separate reason the two numbers differ: the saved image is reduced by the active
      QualityBudget in `persist_finding`, so a 2560x1440 screen capture is stored at 1600x900. That
      is correct behaviour, invisibly applied.
    impact: |
      Owner: "preview resolusi kok beda antara yang di capture mode dengan snapdown editor? di
      snapdown editor tertulis 1600 x 900px, tapi di capture mode 2194 x 1234 px?" Two parts of the
      product appeared to disagree about the same image, and one of them was in fact wrong.
    why_undetected: |
      Both numbers are plausible on their own, and nothing compared them. The overlay's own tests
      assert placement and behaviour, never the arithmetic of what it displays.
    fix: |
      2026-08-27. Two changes, one per cause.

      The overlay now reports SOURCE pixels: the selection badge multiplies by `source-scale`, and
      the full-screen readout comes straight out of the monitor rectangle, which is already in
      snapshot pixels - so nothing is converted and nothing can drift.

      The Editor now says what the budget did: `1600 x 900 px  ·  from 2560 x 1440`, shown only when
      the two differ, read from the `region` already recorded on the Finding. The difference was
      always legitimate; with one number visible there was no way to tell a reduction from a bug.

      Guarded by the_overlay_reports_dimensions_in_source_pixels and
      the_editor_shows_what_the_quality_budget_reduced, both verified by mutation.
    correction: |
      The first version of the Editor half of this fix DID NOTHING, and it is recorded because the
      way it was caught was luck rather than method.

      It read the region with serde_json::from_str::<Region>. The column does not hold JSON: it holds
      "419,344,1020,885", written by persist_finding as a bare comma-separated string. So the parse
      returned None for every row and the readout never changed - and the guard written beside it
      asserted that the CODE called a parser, which it did. Green test, no behaviour.

      Found by opening the live database to check something unrelated. AGENTS.md records four earlier
      cases of code that compiled, tested green and was reached by nobody; this is the same shape with
      a different surface, and the lesson is the narrower one: a parser must be tested against a
      string taken from the real store, not against the type it is hoped to be.

      Now parsed by parse_region_field, unit-tested in main.rs against that exact string plus the JSON
      form the first attempt assumed - which must NOT parse, or the caller is guessing again. Both
      verified by mutation.
    status: resolved
  - id: BUG-50
    title: A whole window cannot be selected, because the tightest container under the pointer always wins
    found: "2026-08-27"
    found_by: kodesh87, manual capture test
    component: capture
    severity: medium
    contradicts: [FR-1]
    root_cause: code
    evidence: |
      `detect_capture_targets` sorts candidates by z-order and then by ascending area, and
      `on_target_at` took the FIRST match. That ordering is deliberate and correct for occlusion - the
      tightest container of the frontmost window is what a click should take - but it also means a
      panel inside an application always wins, and there is no way to ask for the application.
    impact: |
      Owner: "agak sulit ke window, ada case dimana karena dia mendeteksi panel per panel, saya jadi
      kesulitan untuk mendeteksi 1 window penuh." FR-1 promises 1-click container selection; the
      container people most often want - a whole window - was the one container unreachable. The only
      workaround was to drag it by hand, which is what the feature exists to avoid.
    why_undetected: |
      The detection's tests assert that it FINDS containers and orders them correctly, and it does
      both. Nothing asserted that every candidate it finds can be reached, which is a different
      question - and the same shape as the four "built but reachable by nobody" cases in AGENTS.md,
      one level down: reachable in principle, not in practice.
    fix: |
      2026-08-27. The hit test takes a LEVEL and indexes the candidates under the pointer with `.nth`
      instead of `.find`. The wheel walks it outward and back in, clamped rather than wrapped -
      wrapping means one notch too many silently returns to the panel being escaped, which is
      indistinguishable from the wheel not working. Moving the pointer resets it to 0, because the
      candidates under a new point are a different list and level 2 there means something unrelated.

      A hint - "Scroll to widen · 2 / 5" - appears only while there is somewhere to widen to. Without
      it the affordance is invisible, and an invisible affordance is not one: the detection walks
      panels before windows, so a Reviewer wanting the window has no reason to try the wheel.

      Guarded by the_reviewer_can_walk_outward_to_a_whole_window, verified by mutation.
    status: resolved
  - id: BUG-51
    title: The capture overlay retains two full-desktop canvases for the life of the process
    found: "2026-08-27"
    found_by: kodesh87, manual test
    component: capture
    severity: high
    contradicts: []
    root_cause: code
    no_requirement: |
      Deliberately empty, and that is a finding of its own: NO requirement in this corpus mentions
      memory footprint. NFR-6 covers start-up TIME (3 s to a usable tray icon), NFR-7 covers not
      needing administrator rights; there is nothing about how much memory the product may hold at
      rest. So nothing was violated, and nothing could have flagged this - it took the owner opening
      Task Manager.

      Classified `code` rather than `architecture` for the same kind of reason: the retained pair of
      buffers was an implementation choice recorded in BUG-28's resolution, not a decision in
      `.how/`. No `AD-N` prescribed it, so changing it contradicts nothing and needs no `DEC-`.
    measurement: |
      2026-08-27, instrumented in the release build, on a desktop of two 4K monitors (one portrait):

        canvas 6000x3840 = 23.04 Mpx = 87.9 MB, TWO retained  ->  175.8 MB, from start-up onwards
        monitors occupy 16.59 Mpx of that canvas               ->  28% of it is desktop gap

      After the fix, idle before any capture:

        private working set   69.7 MB     (was ~390 MB as the owner read it in Task Manager)
        working set          102.5 MB     (was 280.1 MB)
        private bytes        458.0 MB     (commit charge, largely GPU reservation, not resident)
    evidence: |
      `LiveOverlay` held `snapshots: [SharedPixelBuffer; 2]`, allocated at start-up and never
      released. That was the accepted trade recorded in BUG-28's resolution: allocation is 33-37 ms
      because `SharedPixelBuffer::new` fills through `SharedVector`'s per-element `FromIterator`
      rather than calling `calloc`, so it was moved off the capture path entirely.

      Two buffers rather than one because `make_mut_bytes` is copy-on-write and Slint's bindings are
      lazy: the backdrop and the lens latch their `source` when they RENDER, a hidden window never
      renders, and clearing the overlay's `snapshot-image` property therefore releases nothing.
    impact: |
      Owner, three times: "yang fatal adalah size 400mb". They then went and measured Snagit, which
      is the observation that reframed the problem - its capture process idles at 60 MB and balloons
      to 1 GB only while capturing, its editor sits at ~200 MB, its RPC helper at 1 MB. Snapdown was
      holding capture-time memory at rest, in one process, and losing to a three-process design on
      idle footprint for no benefit the Reviewer could see.
    why_undetected: |
      Nothing here measures memory, and the trade was recorded as accepted in BUG-28's resolution
      rather than as an open question - so it read as settled. It was also invisible on a small vault
      and on a single-monitor desktop.
    fix: |
      2026-08-27. ONE canvas, allocated fresh per capture, on its own thread beside the grab.

      A freshly allocated buffer has a refcount of one by construction, so there is nothing to
      alternate away from and the copy-on-write hazard disappears rather than being worked around.
      The 33-37 ms did not go away - it moved onto a thread that runs concurrently with the 132-167 ms
      grab, where it costs no wall clock. `virtual_desktop_bounds` is cheap enough to call before the
      grab to learn the size; if the desktop changes shape mid-capture the size will not match and the
      event loop allocates instead, which is the right price for a display being plugged in.

      Start-up now allocates nothing, so a session that never captures holds nothing. The peak during
      a capture is the old canvas plus the new one, which is the profile Snagit has: low at rest, a
      spike while in use.

      Considered and rejected: splitting the process, which the owner raised. It would not have freed
      the 175.8 MB, because that memory belongs to the capture side and the capture side must stay
      resident for the hotkey. It would have added a second process, IPC, and a contradiction of
      AD-11 to reclaim the Editor's renderer alone.

      Still not measured: the effect on time-to-overlay. The instrumentation for it is in the build
      the owner is testing, deliberately, because a capture has to happen for the number to exist.

      Guarded by the_capture_canvas_is_allocated_per_capture_off_the_event_loop, verified by mutation
      - including one that moves the allocation after the grab, which is the whole of the latency
      argument.
    measurement_after: |
      2026-08-27, measured by the owner from Task Manager on the shipped build. Private working set:

        editor open, before any capture        64.4 MB
        first capture mode, cancelled         176 MB
        again                                 190 MB -> cancel -> 171 MB
        again                                 199 MB -> cancel -> 175 MB
        capture and save                     ~220 MB -> after  -> 190 MB
        capture and save                      199 MB ->          186 MB
        capture and save                     ~220 MB ->          189 MB
        window closed                                            185 MB

      It PLATEAUS. Three post-capture readings of 190, 186 and 189 MB is the same number three
      times, not a climb - so nothing accumulates per capture, which is the question these figures
      were taken to answer.

      Latency, from the same session's instrumented log:

        grab=163.07ms  alloc_join_wait=8.5us
        grab=183.69ms  alloc_join_wait=2.0us

      The join waited MICROSECONDS. The 33-37 ms allocation finished long before the grab did, so it
      costs nothing in wall clock - which was the whole claim, now measured rather than argued. The
      owner confirms the overlay appears as quickly as before.

      The remaining ~120 MB above idle is structural, and worth naming precisely rather than treating
      as slack:
        - 87.9 MB is the ONE canvas still on screen in the hidden overlay. It cannot be released at
          close, because Slint's lazy bindings mean the backdrop and the lens hold the `source` they
          latched at their last render and a hidden window never renders again. It IS released - at
          the start of the next capture, when the overlay renders the new one, which is exactly why
          the peak is ~220 MB (old plus new) and settles back to ~190 MB;
        - the rest is the overlay window's own renderer surface for a 6000x3840 window, retained
          deliberately because rebuilding it is BUG-27's black blink.

      Going lower means giving one of those up. Destroying the overlay window when idle brings the
      blink back. Destroying the EDITOR window on close - which is why 185 MB survives closing it -
      is `OQ-19` and `DEC-003`'s own named reversal trigger, and it is the owner's decision, not a
      defect. For scale: Snagit idles at ~261 MB across three processes; this is 64 MB before use and
      185 MB after, in one.
    status: resolved
  - id: BUG-52
    title: The mouse cursor disappears once a region is selected, because it is hidden unconditionally
    found: "2026-08-27"
    found_by: kodesh87, manual capture test
    component: capture
    severity: medium
    contradicts: [FR-2]
    root_cause: code
    evidence: |
      `mouse-cursor: none` was set on the catch-all TouchArea with no condition, so the OS pointer was
      hidden for the whole of capture mode. The crosshair that replaces it is drawn only while
      `!is-narrating`, so between selecting a region and saving there was no pointer on screen at all
      - it reappeared over the note panel and nowhere else, because that panel's own TouchArea
      restores the default.
    impact: |
      Owner: "ketika sudah menyorot, masih di capture mode, mouse cursor saya hilang, hanya muncul di
      area catatan." The Reviewer was aiming at a Save button they could not see. FR-2 is about the
      note surviving the capture; a control you cannot point at is a control you cannot use.
    why_undetected: |
      Introduced in the same change that hid the cursor, and the guard written alongside it asserted
      that the cursor WAS hidden - which was the requirement as understood at the time. The
      requirement was incomplete, not the code, and the test encoded the incomplete version. A guard
      is only ever as good as the sentence behind it.
    fix: |
      2026-08-27. `mouse-cursor: root.is-narrating ? MouseCursor.default : MouseCursor.none;` - and
      deliberately the crosshair's OWN visibility condition rather than a separately reasoned one, so
      the two cannot drift apart again.

      Guarded by the_lens_sits_beside_the_pointer_and_waits_for_it_to_settle, which now asserts both
      halves: hidden while the crosshair stands in for it, and restored once it does not. Verified by
      mutation, including one that hides it unconditionally again.
    status: resolved
  - id: BUG-53
    title: Changing the display resolution takes the process to 363 MB
    found: "2026-08-27"
    found_by: kodesh87, manual test
    component: capture
    severity: medium
    contradicts: []
    root_cause: code
    evidence: |
      NOT DIAGNOSED, and it MUST NOT be fixed before it is. Owner: "Ketika ubah resolusi 2x. saya
      lihat ram membengkak ke 363mb", against a steady state of 185-190 MB after ordinary captures.

      A resolution change is the one path that takes the `!layout_unchanged` branch: `live.clear()`
      drops the outgoing `LiveOverlay`, a new `CaptureOverlayWindow` is created, and a new canvas is
      allocated at the new size. Two changes therefore mean three windows created and two dropped, so
      roughly 363 - 185 = 178 MB is about two canvases' worth - which is suggestive and is NOT
      evidence.

      At least three mechanisms could produce it and they need telling apart:
        - the outgoing `LiveOverlay` is not dropped at all, because something still holds a strong
          handle to the window;
        - it IS dropped, but Slint routes window destruction through the event loop and this drop
          happens inside an event-loop callback, so the native window and its 6000x3840 renderer
          surface are released later than the owner measured;
        - the canvas pre-allocated on the grab thread is sized from `virtual_desktop_bounds()` taken
          BEFORE the grab. A resolution change mid-capture makes that size wrong, so an 87.9 MB
          buffer is allocated and discarded - transient, but it is transient at exactly the moment
          being measured.
    impact: |
      Only reachable by changing display configuration, which a Reviewer does rarely - so this is
      severity medium rather than high. But it is the one path that CREATES windows rather than
      reusing them, which makes it the path where a handle leak would hide, and a leak there would
      grow without bound over a long session on a laptop that docks and undocks.
    why_undetected: |
      Nothing measures memory, and nothing here exercises a display-configuration change - it cannot
      be done from a test. This was found the only way it could be: the owner changed their
      resolution and looked.
    fix: |
      NOT YET. Instrumentation first, in the build the owner is testing:
        - `LiveOverlay` now has a `Drop` impl that logs the drop with the canvas size, so whether the
          outgoing entry is released at all stops being a guess;
        - window creation logs a running count of creations against drops, so the number of live
          overlay windows is readable rather than inferred;
        - the discarded pre-allocation logs its planned and actual sizes.

      That `Drop` impl also hides the outgoing window, which is a correctness improvement independent
      of this defect: it takes the window off screen immediately rather than whenever the scheduled
      destruction runs.

      The three-fix rule applies from here. If the first hypothesis the log supports does not hold,
      the second attempt gets a new hypothesis rather than a second patch.
    diagnosis: |
      2026-08-27. Measured, and two of the three candidate mechanisms were refuted outright.

      The owner's sequence, private working set, changing both monitors one level each time:

        capture 1  (native)      173 MB
        capture 2  (lower)       189 MB
        capture 3  (native)      370 MB
        capture 4  (lower)       210 MB
        capture 5  (native)      400 -> 384 MB

      At the SAME resolution: 173 -> 370 -> 384 MB. It accumulates. The instrumented log for the
      same session:

        LiveOverlay dropped (#1), canvas 6000x3840
        overlay window created (#1), placement (-1600, -157, 4160, 2560), dropped so far 1
        LiveOverlay dropped (#2), canvas 4160x2560
        overlay window created (#2), placement (-2160, -1376, 6000, 3840), dropped so far 2
        LiveOverlay dropped (#3), canvas 6000x3840
        overlay window created (#3), placement (-1600, -1376, 4160, 2976), dropped so far 3
        LiveOverlay dropped (#4), canvas 4160x2976
        overlay window created (#4), placement (-2160, -815, 6000, 3840), dropped so far 4

      Four creations, four drops, and NOT ONE "pre-allocated canvas discarded" line. So:
        - the hypothesis that a strong handle was outstanding is REFUTED - every `LiveOverlay` was
          dropped, and its canvas with it;
        - the hypothesis that the pre-allocated buffer was being thrown away is REFUTED - the
          planned size matched the captured size on every single capture, because
          `virtual_desktop_bounds()` is read at capture time and therefore already reflects the new
          resolution.

      What remains is the third: dropping a Slint `ComponentHandle` does not free the native
      window's renderer resources. The per-cycle jumps were +181 MB and +174 MB, which is two 87.9 MB
      allocations - a 6000x3840 framebuffer and its snapshot texture - so the surface of every
      overlay window ever created is still alive.
    fix: |
      2026-08-27. Stop creating a second window. One overlay window per process: a layout change now
      records the new `placement` on the existing entry and releases the old canvas, and that is all
      it does.

      There is no resize call, and reaching for one was the wrong instinct - caught within the minute
      by BUG-26's own guard. The geometry timer further down already re-asserts each capture's
      placement through winit in DEVICE pixels, on every capture, precisely because that path takes
      no scale factor and so cannot be wrong. A Slint-level resize would have needed
      `scale_factor()`, which is the call BUG-26 exists about. The rebuild was not merely leaky, it
      was unnecessary: the code that makes it unnecessary was already there.

      The construction path survives for exactly one case - there is no window yet, because the
      start-up pre-warm failed - and the guard asserts it sits behind that question rather than
      behind "has the layout changed".

      This also gives back a cost the previous code accepted in writing: a layout change no longer
      pays the renderer warm-up, so it no longer risks BUG-27's blink either.

      `LiveOverlay` keeps its `Drop` impl, which hides the outgoing window. It is now reached only
      when the whole overlay is torn down, and it is a correctness improvement independent of this
      defect.

      NOT verified by the agent: this cannot be tested here - changing display configuration is not
      something a test can do, which is how the defect survived in the first place. The
      instrumentation is left in the owner's build so the next resolution change answers it in one
      line: a RESIZED entry and no new creation.

      Guarded by the_capture_overlay_is_reused_across_captures_not_rebuilt, verified by mutation -
      including one that throws the outgoing window away again and one that moves the creation out
      from behind the existence check.
    verified: |
      2026-08-27, by the owner, repeating the exact sequence that found it - capture, drop both
      monitors one level, capture, raise them again, capture, and so on. Private working set:

                              before        after
        idle                  64 MB         76 MB
        capture 1 (native)   173 MB        178 MB
        capture 2 (lower)    189 MB        128 MB
        capture 3 (native)   370 MB        184 MB
        capture 4 (lower)    210 MB        129 MB
        capture 5 (native)   384 MB        182 MB

      At native resolution: 178, 184, 182 MB. At the lower one: 128, 129 MB. The same number each
      time it returns to a resolution, where before it climbed 173 -> 370 -> 384. The lower
      resolution now costs LESS than the higher one, which is what a canvas sized to the desktop
      should do and what the leak was masking.

      The log confirms it by silence: no `overlay window created (#2)`, no `LiveOverlay dropped`, and
      no discarded pre-allocation. One window, reused, for the whole session.

      The instrumentation has been removed. `LiveOverlay`'s `Drop` impl stays, without the counter:
      hiding the outgoing window is a correctness improvement in its own right.
    status: resolved
  - id: BUG-54
    title: theme.slint fails WCAG AA on six pairings, including every primary button label in dark mode
    found: "2026-08-27"
    found_by: agent, the contrast gate required by DEC-009
    component: capture
    severity: high
    contradicts: [NFR-17]
    root_cause: code
    measurement: |
      Measured over `theme.slint`, both themes, WCAG 2.1 relative contrast:

        DARK   text-on-accent  on accent-primary   3.20   needs 4.5   <-- every primary button label
        DARK   text-on-accent  on accent-hover     2.59   needs 4.5   <-- ...under the pointer
        LIGHT  text-muted      on bg-app           4.34   needs 4.5
        LIGHT  text-dim        on bg-app           2.34   needs 3.0
        DARK   text-dim        on bg-card          2.99   needs 3.0
        LIGHT  text-dim        on bg-card          2.56   needs 3.0

      Everything else passes, most of it comfortably: `text-primary` runs 14-18, `text-secondary`
      9-10, the focus ring 3.7-6.2.

      `accent-pressed` is NOT on this list: white on the dark theme's `#3a72e0` measures 4.50 and
      clears AA by a hair. It was listed on the first draft of the gate and the gate's own release
      check rejected it immediately.
    evidence: |
      `text-on-accent` is `#ffffff` and the dark theme's `accent-primary` is `#4c8dff` - white on a
      light blue. That pairing is Save Finding, Assemble, Copy, Share, and the capture overlay's Full
      Screen control: every primary action in the product, in dark mode.

      `theme.slint`'s own section heading reads "4. Accent & Active State Tokens (WCAG AA Compliant)".
      That claim is false for the dark column and has been since the palette was written.
    impact: |
      Reduced legibility on every primary action in dark mode, worst at 2.59 on hover - the moment
      the Reviewer is looking at the button. `text-dim` is placeholder text, so a field's prompt is
      the hardest thing on the panel to read, which is the opposite of what a placeholder is for.

      No user has reported it. That is not evidence it does not matter; it is evidence that nobody
      was checking, which is the point of the gate.
    why_undetected: |
      `NFR-17`'s stated enforcement is a lint plus `contrast.test.ts`, and both cover
      `web/ui/src/styles/tokens.css`. `web/ui` builds nothing in the active workspace (`OQ-27`), so
      the file being checked is not the file that ships. `theme.slint` had no check at all until
      `DEC-009`'s study went looking for one.

      The palette also ASSERTS its own compliance in a comment, which is the most effective way to
      stop anyone verifying it.
    fix: |
      NOT DONE, deliberately, and the reason is scope rather than difficulty.

      The gate is built: `apps/desktop/tests/test_theme_contrast.rs` parses `theme.slint`, checks
      seventeen pairings in both themes, and lists these six as EXCEPTIONS with their measured ratio
      and this defect id. It therefore passes today, fails if any of them gets worse, and fails when
      this defect is closed without the list being updated. Five mutants killed, including one that
      breaks the parser so every assertion would pass by vacuity.

      What is left is a visible change to the product's colour, and the options are costed rather
      than chosen:

        (a) Darken the dark theme's accents so white keeps working:
            #2563eb / #1d4ed8 / #1e40af gives 5.17 / 6.70 / 8.72. Deeper buttons in dark mode;
            hover and pressed get darker rather than lighter, which several systems do.
        (b) Keep the light accents and make `text-on-accent` theme-aware - near-black in dark mode:
            #0f172a gives 5.58 on primary and 6.88 on hover, but only 3.96 on pressed, so
            `accent-pressed` would have to lighten too. This is Material 3's shape.
        (c) text-dim: dark #8e8f95 (5.27 / 4.86), light #6f7c91 (3.86 / 4.23).
            text-muted light: #5d6d84 (4.81 on bg-app, 5.27 on bg-card).

      (c) is small and hard to object to. (a) and (b) both repaint every primary button in dark mode,
      and choosing between them is a design decision the owner has corrected the agent on five times
      in this component already. It is put here with numbers rather than taken.
    status: open
