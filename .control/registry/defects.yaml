      and `library.db-shm` beside it. Both happen BEFORE anything has checked whether the file is
      intact.
    impact: |
      BR-118 says the settings store is "opened, never created over", and SDD-settings.md § Failure
      Behaviour says in as many words that "a store recreated beside a corrupt one is silent data
      loss". For a database with a VALID SQLite header and corrupt B-tree pages - the case
      quick_check exists to catch - the file is modified and two files are created next to it before
      the corruption is ever detected.
      The failure is then reported correctly and the Reviewer is told nothing was touched. That
      sentence is false, and it is the one thing they would rely on before taking a backup.
    why_undetected: |
      W6-S5 landed the fallible open, the StartupError, the path-naming report and the byte-identity
      test, and all of it is right. But the ONLY corrupt fixture anyone has ever used is garbage
      bytes, and SQLite rejects those at Connection::open before a single pragma runs - so the test
      that asserts byte-identity passes without ever reaching the code that breaks it.
      The W7-S1 story plan named the dangerous case in its own edge-case matrix, row 2, and then
      specified a fixture that avoids it. The matrix named it; the fixture dodged it.
    fix: |
      Run quick_check BEFORE any writing pragma - open read-only for the check first, then reopen
      read-write and apply pragmas once the file is known to be intact. Add the valid-header /
      corrupt-pages fixture, and assert the absence of `-wal` and `-shm` as well as byte identity.
      SQLITE_OPEN_CREATE is NOT the defect and MUST stay: creating a store that is absent is first
      run, and BR-118 forbids creating one OVER a corrupt file, which the CREATE flag does not do.
    scheduled: W7-S1
    resolved_by: W7-S1, commit ffb5a60
    resolution: |
      RESOLVED 2026-08-24. quick_check now runs on a READ-ONLY connection, opened only if the file
      exists, BEFORE any read-write open or modifying pragma. All five stores carry the same shape.
      SQLITE_OPEN_CREATE is unchanged and deliberately so: creating a store that is ABSENT is first
      run, and BR-118 forbids creating one OVER a corrupt file, which that flag does not do.

      rusqlite is added as a DEV-dependency only, to build the fixture. It does not reach the
      production dependency.

      VERIFIED BY MUTATION, and this is the point of the story. Disabling the read-only pre-check so
      the old ordering returns turns three tests red:
        a_valid_header_with_corrupt_pages_is_not_written_to_before_it_is_checked
        a_corrupt_store_is_never_recreated_beside_itself
        valid_header_with_corrupt_pages_refuses_to_open_and_leaves_file_byte_identical
      The old garbage-bytes fixture could never reach the defect; a valid header with corrupt pages
      does.

      ONE TEST IS WEAKER THAN ITS NAME AND IS RECORDED AS SUCH.
      a_failed_open_leaves_no_wal_or_shm_file_beside_the_database STILL PASSES under that mutation.
      It is accurate to its name and insensitive to the bug: SQLite removes -wal/-shm on a clean
      connection close, so with the defect present the files are created transiently and are gone by
      the time the assertion runs. It is belt-and-braces, NOT a guard. The invariant it appears to
      cover is held by the two tests above. Counting it as protection would be the literal-assert
      mistake wearing a different hat.
    status: resolved

