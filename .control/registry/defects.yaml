  - id: BUG-80
    title: The sixth report of design-system inconsistency, and the first one with a component to fix
      it rather than an instance
    found: "2026-08-28"
    found_by: the owner, on the Settings screen the same day it shipped
    component: settings
    severity: medium
    contradicts: [NFR-16]
    root_cause: code
    evidence: |
      `design-system-guide.md` opens by counting five reports of this in one week and naming what they
      had in common: *"Every time, the agent fixed the instance and left the cause."* This is the
      sixth, and the guide's own rule predicted it - *"Two places showing the same kind of thing MUST
      reference the same component, not the same numbers."*

      Four disagreements, all with a modal that had shipped days earlier:

        header    Assemble & Review: 52px, 15px accent icon, 13px/800 title, drawn ✕.
                  Settings: 52px, no icon, 15px/700 title, a "Done" BUTTON where the ✕ goes.
        toggles   pill-shaped switches. The guide: "`radius-sharp` for every control. `radius-pill`
                  only for a status chip, never a button." The G3 design specifies a 14px checkbox.
        presets   four cards with wrapping two-line descriptions, so no two were the same height.
                  The design specifies a segmented control - `.segmented-btn` in the asset.
        tabs      a left sidebar. The design and the Editor's own inspector both use a horizontal row.

      And a fifth, reported separately in the same message: the sticky Assemble tile put an 11px
      `text-primary` count at the same weight as the button label under it, so two things of
      different kinds read as two badly-spaced halves of one. The design has the count as a small
      coloured STATUS line - 0.65rem, weight 800.
    impact: |
      Cosmetic per instance and cumulative in aggregate: this is the sixth report, and each previous
      fix left the next screen free to drift the same way.
    why_undetected: |
      The guide existed and was followed for COLOUR, which is mechanically guarded, and not for
      structure, which was not. `colour_lives_only_in_theme_slint` is why no colour literal appeared;
      nothing played the same role for a header, a control shape or a segmented row.
    fix: |
      DONE, 2026-08-28, and the fix is components rather than corrections.

        `components/modal.slint`          `SdModalHeader` (icon, title, `@children`, drawn ✕) and
                                         `SdCard`. Both modals use the header now
        `components/form-controls.slint`  `SdSegmented` and `SdCheckbox`. The segmented treatment had
                                         been hand-drawn FOUR times - Edit/Preview, the budget
                                         presets, the font pair, the alignment triple - and the four
                                         had drifted in height, radius and label size
        `components/icon-label.slint`     from `BUG-70`, same session

      The Assemble tile is rebuilt on `SdActionButton` rather than a hand-drawn Rectangle with its own
      hover and disabled logic.

      `test_design_system.rs` is the part that makes this the last time: it fails when a SECOND copy
      of a treatment appears, which is the moment drift becomes possible rather than the moment it is
      noticed. Five guards - one header, one segmented set, the pill rule, the drawn tick, and the
