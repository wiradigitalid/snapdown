  - id: BUG-50
    title: A whole window cannot be selected, because the tightest container under the pointer always wins
    found: "2026-08-27"
    found_by: kodesh87, manual capture test
    component: capture
    severity: medium
    contradicts: [FR-1]
    root_cause: code
    evidence: |
      `detect_capture_targets` sorts candidates by z-order and then by ascending area, and
      `on_target_at` took the FIRST match. That ordering is deliberate and correct for occlusion - the
      tightest container of the frontmost window is what a click should take - but it also means a
      panel inside an application always wins, and there is no way to ask for the application.
    impact: |
      Owner: "agak sulit ke window, ada case dimana karena dia mendeteksi panel per panel, saya jadi
      kesulitan untuk mendeteksi 1 window penuh." FR-1 promises 1-click container selection; the
      container people most often want - a whole window - was the one container unreachable. The only
      workaround was to drag it by hand, which is what the feature exists to avoid.
    why_undetected: |
      The detection's tests assert that it FINDS containers and orders them correctly, and it does
      both. Nothing asserted that every candidate it finds can be reached, which is a different
      question - and the same shape as the four "built but reachable by nobody" cases in AGENTS.md,
      one level down: reachable in principle, not in practice.
    fix: |
      2026-08-27. The hit test takes a LEVEL and indexes the candidates under the pointer with `.nth`
      instead of `.find`. The wheel walks it outward and back in, clamped rather than wrapped -
      wrapping means one notch too many silently returns to the panel being escaped, which is
      indistinguishable from the wheel not working. Moving the pointer resets it to 0, because the
      candidates under a new point are a different list and level 2 there means something unrelated.

      A hint - "Scroll to widen · 2 / 5" - appears only while there is somewhere to widen to. Without
      it the affordance is invisible, and an invisible affordance is not one: the detection walks
      panels before windows, so a Reviewer wanting the window has no reason to try the wheel.

      Guarded by the_reviewer_can_walk_outward_to_a_whole_window, verified by mutation.
    status: fixed
  - id: BUG-51
    title: The capture overlay retains two full-desktop canvases for the life of the process
    found: "2026-08-27"
    found_by: kodesh87, manual test
    component: capture
    severity: high
    contradicts: []
    root_cause: code
    no_requirement: |
      Deliberately empty, and that is a finding of its own: NO requirement in this corpus mentions
      memory footprint. NFR-6 covers start-up TIME (3 s to a usable tray icon), NFR-7 covers not
      needing administrator rights; there is nothing about how much memory the product may hold at
      rest. So nothing was violated, and nothing could have flagged this - it took the owner opening
      Task Manager.

      Classified `code` rather than `architecture` for the same kind of reason: the retained pair of
      buffers was an implementation choice recorded in BUG-28's resolution, not a decision in
      `.how/`. No `AD-N` prescribed it, so changing it contradicts nothing and needs no `DEC-`.
    measurement: |
      2026-08-27, instrumented in the release build, on a desktop of two 4K monitors (one portrait):

        canvas 6000x3840 = 23.04 Mpx = 87.9 MB, TWO retained  ->  175.8 MB, from start-up onwards
        monitors occupy 16.59 Mpx of that canvas               ->  28% of it is desktop gap

      After the fix, idle before any capture:

        private working set   69.7 MB     (was ~390 MB as the owner read it in Task Manager)
        working set          102.5 MB     (was 280.1 MB)
        private bytes        458.0 MB     (commit charge, largely GPU reservation, not resident)
    evidence: |
      `LiveOverlay` held `snapshots: [SharedPixelBuffer; 2]`, allocated at start-up and never
      released. That was the accepted trade recorded in BUG-28's resolution: allocation is 33-37 ms
      because `SharedPixelBuffer::new` fills through `SharedVector`'s per-element `FromIterator`
      rather than calling `calloc`, so it was moved off the capture path entirely.

      Two buffers rather than one because `make_mut_bytes` is copy-on-write and Slint's bindings are
      lazy: the backdrop and the lens latch their `source` when they RENDER, a hidden window never
      renders, and clearing the overlay's `snapshot-image` property therefore releases nothing.
    impact: |
      Owner, three times: "yang fatal adalah size 400mb". They then went and measured Snagit, which
      is the observation that reframed the problem - its capture process idles at 60 MB and balloons
      to 1 GB only while capturing, its editor sits at ~200 MB, its RPC helper at 1 MB. Snapdown was
      holding capture-time memory at rest, in one process, and losing to a three-process design on
      idle footprint for no benefit the Reviewer could see.
    why_undetected: |
      Nothing here measures memory, and the trade was recorded as accepted in BUG-28's resolution
      rather than as an open question - so it read as settled. It was also invisible on a small vault
      and on a single-monitor desktop.
    fix: |
      2026-08-27. ONE canvas, allocated fresh per capture, on its own thread beside the grab.

      A freshly allocated buffer has a refcount of one by construction, so there is nothing to
      alternate away from and the copy-on-write hazard disappears rather than being worked around.
      The 33-37 ms did not go away - it moved onto a thread that runs concurrently with the 132-167 ms
      grab, where it costs no wall clock. `virtual_desktop_bounds` is cheap enough to call before the
      grab to learn the size; if the desktop changes shape mid-capture the size will not match and the
      event loop allocates instead, which is the right price for a display being plugged in.

      Start-up now allocates nothing, so a session that never captures holds nothing. The peak during
      a capture is the old canvas plus the new one, which is the profile Snagit has: low at rest, a
      spike while in use.

      Considered and rejected: splitting the process, which the owner raised. It would not have freed
      the 175.8 MB, because that memory belongs to the capture side and the capture side must stay
      resident for the hotkey. It would have added a second process, IPC, and a contradiction of
      AD-11 to reclaim the Editor's renderer alone.

      Still not measured: the effect on time-to-overlay. The instrumentation for it is in the build
      the owner is testing, deliberately, because a capture has to happen for the number to exist.

      Guarded by the_capture_canvas_is_allocated_per_capture_off_the_event_loop, verified by mutation
      - including one that moves the allocation after the grab, which is the whole of the latency
      argument.
    measurement_after: |
      2026-08-27, measured by the owner from Task Manager on the shipped build. Private working set:

        editor open, before any capture        64.4 MB
        first capture mode, cancelled         176 MB
        again                                 190 MB -> cancel -> 171 MB
        again                                 199 MB -> cancel -> 175 MB
        capture and save                     ~220 MB -> after  -> 190 MB
        capture and save                      199 MB ->          186 MB
        capture and save                     ~220 MB ->          189 MB
        window closed                                            185 MB

      It PLATEAUS. Three post-capture readings of 190, 186 and 189 MB is the same number three
      times, not a climb - so nothing accumulates per capture, which is the question these figures
      were taken to answer.

      Latency, from the same session's instrumented log:

        grab=163.07ms  alloc_join_wait=8.5us
        grab=183.69ms  alloc_join_wait=2.0us

      The join waited MICROSECONDS. The 33-37 ms allocation finished long before the grab did, so it
      costs nothing in wall clock - which was the whole claim, now measured rather than argued. The
      owner confirms the overlay appears as quickly as before.

      The remaining ~120 MB above idle is structural, and worth naming precisely rather than treating
      as slack:
        - 87.9 MB is the ONE canvas still on screen in the hidden overlay. It cannot be released at
          close, because Slint's lazy bindings mean the backdrop and the lens hold the `source` they
          latched at their last render and a hidden window never renders again. It IS released - at
          the start of the next capture, when the overlay renders the new one, which is exactly why
          the peak is ~220 MB (old plus new) and settles back to ~190 MB;
        - the rest is the overlay window's own renderer surface for a 6000x3840 window, retained
          deliberately because rebuilding it is BUG-27's black blink.

      Going lower means giving one of those up. Destroying the overlay window when idle brings the
      blink back. Destroying the EDITOR window on close - which is why 185 MB survives closing it -
      is `OQ-19` and `DEC-003`'s own named reversal trigger, and it is the owner's decision, not a
      defect. For scale: Snagit idles at ~261 MB across three processes; this is 64 MB before use and
      185 MB after, in one.
    status: fixed
