# defects.yaml — SSOT for defects: ordinary bugs and hotfixes.
#
# A defect is code disagreeing with a requirement that was already `active`. Work that exists because
# a requirement is NEW is planned work, not a defect, and it belongs in a wave — the distinction is
# what keeps this file from becoming a second backlog.

defects:
  - id: BUG-1
    title: Deleting a Finding silently deletes its rows from every Bundle that holds it
    found: "2026-08-23"
    found_by: wdi-component, G4 as-built pass over `bundle` at mode deep
    component: bundle
    severity: high
    contradicts: [FR-13, AD-9]
    evidence: |
      crates/snapdown-store/src/sqlite/migrations.rs, migration v3:
        FOREIGN KEY(finding_id) REFERENCES finding(id) ON DELETE CASCADE
      crates/snapdown-store/src/sqlite/finding_store.rs:29:
        conn.pragma_update(None, "foreign_keys", "ON")
      FR-13, third consequence, has been `active` since G2:
        "A Finding that belongs to a Bundle can still be deleted; the Bundle keeps its own
         copy of the image and stays readable."
    impact: |
      The Bundle's stored Markdown survives, because `bundle.markdown` is a column and AD-9 holds.
      Its item list loses a row. The delivered document and the record of the delivered document
      disagree, and nothing reports it. A Reviewer who deletes tidy-up Findings after a handoff
      corrupts the record of what they handed over.
    why_undetected: |
      finding_store.rs:362 asserts the cascade to `note` and `marker`, which is correct. Nothing
      asserts the ABSENCE of a cascade to `bundle_item`. A test that a cascade does NOT fire is the
      kind nobody writes unless a document says the cascade must not exist — which is what G4 at
      `deep` produced.
    fix: |
      Drop ON DELETE CASCADE from bundle_item.finding_id. Probably drop the foreign key entirely:
      a BundleItem refers to a Finding that MAY no longer exist, which is exactly what a foreign
      key exists to forbid. Requires a migration; existing rows already lost are not recoverable.
    scenario: .what/bundle/05-scenarios/SCN-05-a-finding-deleted-out-from-under-a-bundle.md
    status: open
  - id: BUG-2
    title: Three `sharing` screens are recorded as delivered and do not exist in the repository
    found: "2026-08-23"
    found_by: wdi-init intent readers, after derive_screen was rewritten to read real components
    component: sharing
    severity: medium
    contradicts: [FR-24, UC-21, UC-22]
    evidence: |
      HANDOVER.md, W5 section, claims:
        "Web reader SPA (PublishedBundleReader.tsx / Screen 14; PublicationNotFound.tsx / Screen 15)"
        "Publish dialog (Screen 11) with BR-86 confirmation + publication badges + copy URL"
      No such files exist anywhere in the repository. Every .tsx in the tree was enumerated:
        web/ui/src/screens/ holds AgentAccessView.tsx and nothing else.
      inventory-screen.md rows 11, 14 and 15 have no component behind them, and LC-027
      `bundle-reader` is registered in components.yaml with nothing implementing it.
    impact: |
      What the web service actually returns for GET /b/{slug} is the stored Markdown inside a bare
      <pre> block with no stylesheet and no rendered images (server.go:145). For the PRIMARY
      audience — a coding agent fetching the URL — that is arguably sufficient: the text is the
      payload and /b/{slug}/images/{filename} serves the images separately. What is missing is the
      HUMAN reader those three rows promise. Publishing works; reading it as a person does not.
    why_undetected: |
      All three inventories sat at `derived_from: plan` because derive_screen read exactly one
      component. Nothing ever compared the plan to the tree. The rows were written at G3 and
      believed ever since.
    fix: |
      Two honest options, and this is a decision rather than a task. Either build the reader SPA and
      the publish dialog, or withdraw rows 11, 14, 15 and LC-027 and state that the published
      surface is machine-facing only. The second is cheaper and may be correct: Snapdown's reader is
      a machine. It changes a promise, so it goes through wdi-product, not a patch.
    blocked_by: DEC-005, which freezes `sharing`. Registered now, decided when that lifts.
    status: open
  - id: BUG-3
    title: The web service interpolates published Markdown into HTML without escaping it
    found: "2026-08-23"
    found_by: wdi-init intent readers, while reading the routes for derive_api
    component: sharing
    severity: medium
    contradicts: [NFR-15]
    evidence: |
      apps/web-service/internal/server/server.go:145
        html := fmt.Sprintf(`<!DOCTYPE html>...<body><pre>%s</pre></body>...`, slug, b.Markdown)
      b.Markdown is the Reviewer's own Note text, published verbatim. `%s` performs no escaping, so
      a Note containing `</pre><script>` breaks out of the block and executes in the browser of
      whoever opens the URL.
    impact: |
      The author and the publisher are the same person, so this is not an injection by a third
      party. The exposure is to whoever the Reviewer hands the URL to, and a Note is free text that
      may be pasted from a page being reviewed - which is exactly where a hostile string would come
      from. It is a public, unauthenticated HTML endpoint.
    why_undetected: |
      The route tests assert the NFR-15 identical-404 and the response codes. Nothing asserts what
      the HTML body does with hostile content, and the endpoint predates any document describing
      what it renders - inventory-screen row 14 describes an SPA that does not exist.
    fix: |
      html/template, or html.EscapeString on b.Markdown before interpolation. Escaping the slug too:
      it is a 160-bit CSPRNG value today and that is a property of the generator, not of this render.
    blocked_by: DEC-005, which freezes `sharing`. Registered now, fixed when that lifts.
    note: |
      Found 2026-08-23 while checking CI coverage, and it makes this defect worse than first written:
      NO WORKFLOW TOUCHED GO AT ALL. apps/web-service was never built, vetted, or tested by CI, so
      this shipped into a container with nothing behind it and a regression would have been equally
      invisible. A `web-service` job was added to desktop-ci.yml the same day - go build, go vet,
      go test. That is regression protection, not a fix; the escaping is still open.
      A frozen component is one nobody is watching, which makes CI on it MORE important, not less.
    status: open
  - id: BUG-4
    title: The capture overlay is never mounted; pressing the capture hotkey shows the Settings shell
    found: "2026-08-23"
    found_by: narrow UI audit (static verification), confirmed by the coordinator against the source
    component: finding
    severity: critical
    contradicts: [FR-1, FR-2, UC-1, UC-2, NFR-1, NFR-2]
    evidence: |
      apps/desktop/src-tauri/src/commands/capture.rs:103-106
        WebviewWindowBuilder::new(..., WebviewUrl::App("index.html?overlay=true".into()), ...)
      apps/desktop/src/main.tsx and apps/desktop/src/App.tsx
        grep for window.location.search, URLSearchParams, or "overlay": NO MATCH.
      apps/desktop has exactly ONE html entry point, index.html. vite.config.ts declares no
      rollupOptions.input, so there is no second bundle to route to.
      Therefore the overlay window mounts <App /> - the full Editor shell, opening on Settings -
      instead of <CaptureOverlay />.
    impact: |
      THE CAPTURE PATH DOES NOT WORK. Pressing the capture hotkey opens an undecorated fullscreen
      window showing Settings. There is no dim, no crosshair, no region drag, no note field, and no
      Finding is ever created from the hotkey. FR-1 and FR-2 are unmet, UC-1 and UC-2 cannot be
      performed, and NFR-1/NFR-2's timing budgets measure a path nobody can reach.
      This is the single most-executed action in the product and the reason the product exists.
    why_undetected: |
      CaptureOverlay.tsx has passing unit tests - capture_overlay_draws_selection_and_dimensions and
      friends. The COMPONENT is correct and tested in isolation; it is simply never mounted. Nothing
      tests the wiring between the Rust window builder's URL and the frontend's routing, because
      that seam has no owner in any document: inventory-screen row 1 names the screen, and no
      contract describes how the overlay window selects what to render.
      The W2 UI verification that would have caught it is recorded in
      _bmad-output/specs/w1-settings/ui-verify-W1-S1/ for W1 only. No wave ever drove the capture
      hotkey end to end.
    fix: |
      Route on the query parameter in main.tsx: read window.location.search and mount
      <CaptureOverlay /> when overlay=true, <App /> otherwise. Then add a test that asserts the
      mount decision from the URL, and an end-to-end check that the hotkey produces a Finding.
      The deeper fix is the missing seam contract - .how/finding/02-contracts/ describes the Tauri
      command surface and says nothing about how a window chooses its root component.
    status: open
  - id: BUG-5
    title: The Editor never renders a Finding's image, and Markers cannot be placed at all
    found: "2026-08-23"
    found_by: narrow UI audit (static verification), confirmed by the coordinator against the source
    component: finding
    severity: critical
    contradicts: [FR-6, FR-8, UC-4, UC-5, AD-1, BG-1]
    evidence: |
      grep for MarkerLayer across apps/desktop/src and web/ui/src, excluding its own file and tests:
        web/ui/src/index.ts:9  export * from './components/MarkerLayer';
      That is the ONLY hit. It is exported and never mounted.
      apps/desktop/src/components/FindingsView.tsx renders <FindingsEditor /> from @snapdown/ui and
      contains no img, no convertFileSrc, no marker anything.
      web/ui/src/components/FindingsEditor.tsx renders metadata and a Note TextArea. Its only
      reference to markers is line 137, which prints `{f.markers.length} markers` as TEXT.
    impact: |
      THE EDITOR NEVER SHOWS THE SCREENSHOT. A Finding's detail pane is metadata and a text box; the
      image the Note describes is not on screen. Markers cannot be placed, moved, or deleted, because
      there is no canvas to place them on.
      FR-6 (see every Finding with its Note) is met only in the degenerate sense that the Note is
      visible. FR-8 and UC-5 are entirely unmet. AD-1 - Markers and Note lines are one sequence - is
      the product's core invariant and has NO user interface.
      BG-1 is "a note is unambiguously attached to the image it describes". The attachment exists in
      the database and is invisible to the Reviewer.
    why_undetected: |
      Identical in shape to BUG-4, and found in the same pass. MarkerLayer.tsx and MarkerBadge.tsx
      have their own passing unit tests - marker_layer.test.tsx is green. The COMPONENTS are correct
      and neither is mounted. W2-S5 "Numbered Marker placement, drag reposition, comment annotation
      and delete" is recorded `status: done`, and it built the components without wiring them in.
      Nothing tested the composition, only the parts.
    fix: |
      Render the Finding's image in the detail pane (Tauri convertFileSrc over the Vault path) and
      mount MarkerLayer over it, per .how/finding/01-ux/DESIGN.md. Then a test that asserts the image
      element and the marker canvas are PRESENT in the mounted Findings surface - a composition test,
      which is the class of test this product has none of.
    related: BUG-4
    status: open
  - id: BUG-6
    title: The orphan report is built, tested, and unreachable — no screen ever mounts it
    found: "2026-08-23"
    found_by: systematic never-mounted sweep after BUG-4 and BUG-5
    component: finding
    severity: high
    contradicts: [FR-15, UC-8]
    evidence: |
      apps/desktop/src/components/OrphanReportView.tsx exists and orphan_report.test.tsx is green.
      grep for `<OrphanReportView` across apps/desktop/src and web/ui/src, excluding its own file
      and tests: NO MATCH.
      App.tsx line 23: type NavigationTab = 'findings' | 'bundles' | 'agent-access' | 'settings'.
      There is no orphans route, tab, or entry point of any kind. grep for "orphan" in App.tsx
      returns nothing.
    impact: |
      FR-15 promises the Reviewer can find out what has gone missing or been left behind, and UC-8 is
      how they do it. The Tauri commands scan_orphans and clean_orphans are registered and work; the
      screen that calls them cannot be opened. NFR-5's invariant - the Vault holds no file the Library
      does not point at - names the orphan report of FR-15 as one of its two enforcement mechanisms,
      so half of that enforcement is unreachable.
      Lower severity than BUG-4 and BUG-5 because this is a maintenance tool rather than the core
      loop. A Reviewer who never opens it loses nothing until something has already gone wrong.
    why_undetected: |
      The third instance of one pattern in one sweep. See the SYSTEMIC note below.
    fix: |
      Give it an entry point. .how/finding/01-ux/DESIGN.md places it as LC-030 with a route of
      /findings/orphans, and .how/finding/01-ux/DESIGN.md's Findings surface offers it from the
      image-missing state. Both are in W6-S7's scope.
    related: [BUG-4, BUG-5]
    status: open

# SYSTEMIC — the shape shared by BUG-4, BUG-5 and BUG-6, written 2026-08-23
#
# A sweep for `<Component` across the whole tree, excluding each component's own file and its tests,
# found FOUR components that are never mounted anywhere:
#
#   CaptureOverlay     BUG-4, critical  — the capture path
#   MarkerLayer        BUG-5, critical  — marker annotation
#   OrphanReportView   BUG-6, high      — the orphan report
#   EmptyState                          — a base element; W6-S1 and W6-S7/S8 mount it
#
# Every one of them has passing unit tests. Every one of them is CORRECT in isolation. None is
# assembled into anything a Reviewer can reach.
#
# THE FINDING IS NOT THE THREE BUGS. It is that this repository has no composition test of any kind.
# Every suite proves a part; nothing asks whether the parts were wired together. Five waves closed
# green on that basis, and three requirements - FR-1/FR-2, FR-8, FR-15 - are unmet in a build whose
# tests all pass.
#
# The wave-close checklist cannot catch it either: V12 checks that an LC is REGISTERED, not that it
# is REACHED. A screen with an LC, a component, a passing test and no mount point satisfies every
# mechanical check this method has.
#
# W6-S2 and W6-S7 carry the three fixes. The missing test CLASS is the thing to fix beyond them, and
# it is filed as OQ-23 rather than bolted onto a story that has enough to do.
  - id: BUG-7
    title: Twelve screenshots of the running product have been committed to this public repository since W1
    found: "2026-08-23"
    found_by: the new korpus.yml forbidden-content guard, on its first local run
    component: _repo
    severity: high
    contradicts: ["product brief § Constraints"]
    evidence: |
      git ls-files -- '*.png' '*.jpg' '*.jpeg' '*.webp', excluding apps/desktop/src-tauri/icons/,
      returns 12 files. Eleven are in _bmad-output/specs/w1-settings/ui-verify-W1-S1/ and were
      committed in 7abde7b, "docs(w1-s1): UI verification finished". That commit is ON origin/main.
      The brief has said since G1: "This repository is public. Forbids committing a captured
      screenshot, a token, a client's name, or any test fixture derived from real capture output."
    impact: |
      They are screenshots of the product running on the operator's machine. claim6_vault_path_typed
      and claim4_window_rendered_live show the Settings surface, which displays the Vault path - an
      absolute path under a real home directory. Whatever else was on screen is in them too.
      ALREADY PUBLIC. Unlike the accessibility-tree dumps caught earlier the same day, these are not
      on an unpushed branch: they are on main and have been fetchable for as long as main has been.
      Removing them now stops it getting worse and does NOT un-publish them.
    why_undetected: |
      Nothing enforced the constraint. korpus.yml validated the corpus and desktop-ci.yml built the
      code; no workflow ever refused a path. The constraint was written at G1 and read by nobody
      since. The guard that finds it was added on 2026-08-23 and found it on its first run.
    fix: |
      Two parts, and only the first is the agent's.
      1. Remove them from the working tree, which this defect does, and let the new guard prevent
         recurrence. DONE.
         A related cleanup, done 2026-08-23 and worth recording because it is easy to miss: the
         accessibility-tree dumps scrubbed from the wave branch earlier the same day were still
         reachable AFTER the scrub, from `refs/original/refs/heads/wave/w6-gates-rerun` - the backup
         ref `git filter-branch` writes and leaves behind. A scrub that stops at rewriting the branch
         has not finished. The ref was deleted, the reflog expired and `git gc --prune=now` run, and
         the leaked blobs are now unreachable from every ref. That cleanup does NOT apply to these
         twelve screenshots: they are on `main` and published, which is a different problem.
      2. Whether to rewrite main's history - and whether anything visible in them warrants any other
         action - is the REPO OWNER'S CALL. Rewriting published history on a public repository
         affects every clone and fork, and an agent must not do it unilaterally. Recorded here so the
         decision is made rather than inherited.
    status: open
  - id: BUG-8
    title: "The web-ui container is registered built:true and does not exist; a library shares its name"
    found: "2026-08-23"
    found_by: coordinator, checking the container registry against the tree after BUG-2
    component: sharing
    severity: medium
    contradicts: ["C4 L2", "components.yaml containers", "structure-codebase.md"]
    evidence: |
      components.yaml registers:
        - id: web-ui
          title: Published Bundle Reader
          technology: React + Vite single-page application, served as static assets by web-api
          built: true
          runs: The browser of whoever opens a Publication URL
      c4-l2-containers.md:33 draws it, :53 argues explicitly that it IS a container rather than
      "static assets" because it runs in the reader's browser as its own process, and :69 gives it an
      HTTPS arrow to web-api.
      NONE OF IT EXISTS.
        web/ui/ has no index.html and no src/main.tsx. It is @snapdown/ui - a component LIBRARY
        consumed by the desktop webview, with no entry point and nothing to deploy.
        apps/web-service serves no static assets: grep for FileServer, StaticFS, embed, http.Dir and
        ServeFile in server.go and main.go returns nothing. It builds an HTML <pre> block inline.
    impact: |
      Three artifacts describe a deployable container that was never built, while pointing at a
      directory that is a different kind of thing entirely:
        - components.yaml claims a fourth built container
        - the C4 L2 draws it, and argues at length for why it is a container
        - structure-codebase.md has a `### web-ui` heading, which V25 REQUIRES of a built: true
          container - and the heading describes web/ui/ the library, satisfying the validator with
          the wrong artifact
      V25 therefore passes on a container that does not exist. That is the part worth noticing: the
      validator is not wrong, it is answering "does this heading exist" and cannot ask "does this
      heading describe the thing it is named after".
    why_undetected: |
      Same family as BUG-2 and found by pulling on it. The name collision is what hid it: `web-ui`
      the container and `web/ui` the package read as the same thing in every document, and one of
      them is real.
    fix: |
      A DECISION, not a task, and the same decision as OQ-22. If the reader SPA is built, the
      registration becomes true and web/ui needs a name that is not web-ui. If the promise is
      withdrawn, then `web-ui` leaves `containers`, leaves the C4 L2, loses its structure-map heading,
      and LC-027 is retired - and `web/ui` keeps its name because nothing else wants it.
      Withdrawing is the cheaper answer and may be the correct one: Snapdown's reader is a machine.
      Either way it goes through wdi-blueprint intent `platform`, which owns `containers` and the C4.
    related: [BUG-2, OQ-22]
    blocked_by: DEC-005, which freezes `sharing`.
    status: open
  - id: BUG-9
    title: "Bundle composition and deletion swallow every filesystem and unpublish Result"
    found: "2026-08-23"
    found_by: coordinator, sweeping for `let _ =` after the same pattern produced W6-S10
    component: bundle
    severity: high
    contradicts: [AD-2, FR-10, FR-14, BR-20, BR-23, NFR-5]
    evidence: |
      apps/desktop/src-tauri/src/commands/bundle.rs
        :72-74  if let Ok(vault_store) = VaultBlobStore::new(&vault_path) {
                    let _ = vault_store.write_blob(&md_filename, markdown_content.as_bytes());
                }
                ... then the Bundle row is built and stored unconditionally.
        :116        let _ = unpublish_bundle(id.clone(), state.clone());
        :135        let _ = vault_store.delete_blob(&detail.bundle.markdown_path);
        :137            let _ = vault_store.delete_blob(&item.image_path);
      Note :72 also swallows the VaultBlobStore::new failure: if the store cannot be opened the `if
      let Ok` simply does not run, and composition continues as though the file had been written.
    impact: |
      THREE DISTINCT FAILURES, and they are not equally bad.

      1. COMPOSITION (:72-74). FR-10 is all-or-nothing and AD-2 says a record MUST NOT be committed
         before its files exist. If the Markdown write fails - or the Vault cannot be opened at all -
         the Bundle row is created anyway with markdown_path naming a file that does not exist. The
         Reviewer is told the Bundle was composed. bundle.markdown still holds the bytes, so Copy
         Markdown works and only the file on disk is missing, which is precisely the kind of partial
         state AD-2 exists to forbid.

      2. UNPUBLISH ON DELETE (:116). THIS IS THE SERIOUS ONE. BR-23 makes the unpublish part of the
         same action; BR-20 says an unpublish that fails leaves the Bundle marked published, so the
         Reviewer is NEVER told something is private when it may not be. Swallowing the Result does
         the opposite: the unpublish fails, the deletion proceeds, the local record is gone, and the
         published copy STAYS LIVE ON THE PUBLIC INTERNET with nothing left pointing at it. The
         Reviewer believes they deleted it. AD-6 and the brief's personal-data constraint are what
         this reaches.

      3. FILE DELETION (:135, :137). FR-14 promises the image copies go with the Bundle and NFR-5
         says the Vault holds no file the Library does not point at. A swallowed delete leaves
         orphaned files, unreported. Same shape as W6-S10's vault-move swallow, and milder: the
         orphan report (FR-15) can find these - once BUG-6 makes it reachable.
    why_undetected: |
      `let _ =` is invisible to clippy at default levels and reads as deliberate. No test exercises a
      failing filesystem or a failing unpublish, because every store test uses a writable temp dir
      and a live path. This is the third instance today of one habit - vault_migration.rs:141 and
      :180 were the first two - which is why it is registered as its own defect rather than folded
      into W6-S10.
    fix: |
      Composition: propagate the write failure and roll back, so FR-10's all-or-nothing is real.
      Do not swallow VaultBlobStore::new either.
      Unpublish: on failure, ABORT THE DELETE and report it. BR-20 already dictates the behaviour -
      leave it marked published. Never delete a local record whose remote copy may still be live.
      File deletion: report what could not be removed, as W6-S10 does for the Vault move.
    note: |
      Part 2 is `sharing` behaviour reached from a `bundle` command, and DEC-005 freezes `sharing`.
      It is NOT frozen work: the swallow is in bundle.rs, the fix is in bundle.rs, and DEC-005 says
      in its own text that it does not forbid fixing a defect in what already shipped.
    status: open
