  - id: BUG-58
    title: The theme choice was thrown away on every restart
    found: "2026-08-27"
    found_by: agent, reading on_theme_toggle_clicked while classifying the println stubs
    component: settings
    severity: low
    contradicts: [FR-21]
    root_cause: code
    evidence: |
      `appwindow.slint` flips `is-dark-theme` itself, so the repaint always worked and the toggle
      looked complete. The Rust handler's whole body was:

        let cur = win.get_is_dark_theme();
        println!("Theme toggled. Dark mode is now: {}", !cur);

      It printed the value it was about to lose. Nothing read a stored theme at startup because
      nothing had stored one.
    impact: |
      The Editor reopened in light mode every time, however many times the Reviewer had switched. Also
      why `BUG-54`'s dark-mode contrast failures were easy to miss: reaching dark mode took a click
      every session, so most sessions never saw it.
    why_undetected: |
      The visible half of the feature - the repaint - is in the UI and works. Persistence is the
      invisible half, and no test drove a second launch.
