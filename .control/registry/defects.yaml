  - id: BUG-18
    title: "The capture overlay never asks for a Note, so half of UC-1 does not exist"
    found: "2026-08-24"
    found_by: coordinator, surveying the capture path before opening the BUG-14 wave
    component: finding
    severity: high
    contradicts: [FR-2, UC-1, "LC-029"]
    root_cause: code
    evidence: |
      apps/desktop/src/components/CaptureOverlay.tsx:76-100 - handleMouseUp measures the region and
      calls captureScreenRegion IMMEDIATELY. There is no Note field anywhere in the file: a grep for
      `note` across it returns ZERO hits.

      apps/desktop/src-tauri/src/commands/capture.rs:13-19 - CaptureRegionInput carries x, y, width,
      height and source_monitor. There is no `note` field, so the command could not receive one even
      if the overlay asked.

      LC-029 `capture-note-field` is registered in components.yaml with area capture-pipeline and
      has no implementation. inventory.py reports it as UNREAD - "no component at
      apps\desktop\src\components\CaptureNoteField.tsx".
    impact: |
      FR-2 is "Write the Note at capture time" and it is entirely unmet. UC-1 reads "I press a key,
      box the thing that is wrong, AND SAY WHAT IS WRONG WITH IT" - the second half does not exist.
      The Reviewer boxes a region and it is saved with no Note at all.

      This matters more than a missing field usually would, because BG-1 - the goal the whole product
      is built on - is that a note is unambiguously attached to the image it describes. A Finding with
      no Note is an image with nothing said about it, which is the thing Snapdown exists to prevent.
    why_undetected: |
      Same shape as BUG-4, BUG-5 and BUG-6: the surrounding parts are all present and green. The
      overlay mounts (BUG-4 fixed that), the capture command works, the Finding is stored, and the
      Note column exists in the schema and is written from the Editor later. Nothing in the chain is
      broken - one step is simply absent, and no test asserts that the overlay collects a Note
      because no test drives the overlay at all.

      W6 recorded LC-029 as a known_gap when the wave closed ("no W6 story creates it: the capture
      path is not in this wave's scope"), so it was seen and correctly deferred. It was never
      registered as a defect, so it did not appear in any defect count.
    fix: |
      Build LC-029 as the design already specifies: a note field anchored to the selected region,
      shown after the drag and before the Finding is written. Enter saves, Esc cancels the whole
      capture leaving no Finding. Add `note` to CaptureRegionInput and write it with the Finding.
    scheduled: W8-S4
    related: BUG-14
    verified: |
      The capture overlay asks for the Note before the Finding is written, and has since the Slint
      overlay was built. `persist_finding` takes `note_body` and stores it on the Note record in the
      same call that creates the Finding.

      Six guards in `apps/desktop/tests/test_capture_interaction.rs` cover it, including
      `the_note_field_takes_focus_when_the_popup_opens`,
      `enter_saves_from_the_window_not_only_from_the_note_field` and
      `the_note_field_wraps_while_staying_single_line`. The file this row cites -
      `apps/desktop/src/components/CaptureOverlay.tsx` - no longer exists.
    status: fixed

  - id: BUG-19
    title: "Bundle export records a burned image path and never writes the file; MarkerBurner is called from nowhere"
    found: "2026-08-24"
    found_by: coordinator, reading the bundle export path while writing the W8-S5 brief
    component: bundle
    severity: high
    contradicts: [FR-8, "AD-2", "LC-013"]
    root_cause: code
    evidence: |
      apps/desktop/src-tauri/src/commands/bundle.rs:41-48 builds a path for every item -
      `bundles/{bundle_id}/finding_{pos}_burned.webp` - and stores it as BundleItem.image_path.
      Nothing ever writes a file there. The only write_blob calls in the whole desktop crate are
      bundle.rs:75 (the Markdown) and capture.rs:107 (the reduced capture).

      A repo-wide grep for MarkerBurner outside its own file and its tests returns exactly two hits,
      and both are re-exports:
        crates/snapdown-store/src/image/mod.rs:4  pub use burner::MarkerBurner;
        crates/snapdown-store/src/lib.rs:8        pub use image::{ImageReducer, MarkerBurner, ...};

      So the burn W8-S3 just built is unreachable from the running application, and the path recorded
      in the database points at a file that has never existed.
    impact: |
      FR-8 promises a handed-over Bundle carries its Markers on the image. The Bundle records that it
      does and does not. A Reviewer exporting a Bundle gets Markdown plus a set of dangling image
      references.

      It also reaches the deletion path: bundle.rs:171-175 checks blob_exists before deleting each
      item image, so the miss is silent there too - the guard that would have surfaced it is the same
      guard that hides it.

      W8-S3's five tests are all green and all honest. They prove the burner draws correctly. They
      cannot prove anybody calls it.
    why_undetected: |
      THE FIFTH TIME THIS EXACT SHAPE HAS LANDED, after BUG-4, BUG-5, BUG-6 and the EmptyState sweep.
      A unit is built, unit-tested, and mounted nowhere. There is still no composition test class
      (OQ-23), and V12 does not help: it checks that an LC is REGISTERED, not that it is REACHED.

      This one is worse than its predecessors in one respect: the caller writes a path that implies
      the call happened. A dangling path reads as a wiring bug in the reader, not a missing call in
      the writer.
    fix: |
      Call MarkerBurner on each Finding's stored image during bundle export and write the result to
      the recorded path, before the BundleItem row is committed. AD-4 still governs: the burn takes
      the ALREADY-REDUCED bytes and MUST NOT re-reduce them. The test must assert that the file at
      BundleItem.image_path exists and decodes - not that the path string was constructed.

      Note the extension: the recorded path says .webp while the burner emits PNG. Whichever is
      right, the two currently disagree and the corpus has to be read before choosing.
    related: BUG-14
    verified: |
      The caller this row describes was deleted with the Tauri app (`DEC-007`), and the Slint caller
      that replaces it cannot reproduce the defect by construction: `plan_bundle` returns
      `(path, bytes)` PAIRS, so a recorded `BundleItem.image_path` and the bytes that belong at it are
      produced by the same line and cannot be separated. `MarkerBurner::burn_markers` is called from
      it, so the burn is no longer unreachable from the running application.

      `a_planned_bundle_carries_bytes_for_every_path_it_records` asserts the pairing, DECODES every
      burned copy at the Finding's own recorded dimensions, and - the part that matters - asserts a
      Finding WITH an active Marker differs from its source while one with none is byte-identical.
      A copy that decodes at the right size is not proof the Markers were drawn, which is this
      repository's own recorded trap wearing a different hat. Mutation: replacing the burn with a
      passthrough of the source bytes is KILLED.
    status: fixed

  - id: BUG-20
    title: "The marker burn's no-markers fast path returns a corrupt source as success, having never decoded it"
    found: "2026-08-24"
    found_by: W8-S5 planner, auditing the image test surface
    component: bundle
    severity: medium
    contradicts: ["AD-4"]
    root_cause: code
    evidence: |
      crates/snapdown-store/src/image/burner.rs:48-50 - burn_markers returns before any decode when
      no Marker carries a Note line:

        if active_markers.is_empty() {
            return Ok(input_bytes.to_vec());
        }

      image::load_from_memory is only reached on the line AFTER this branch, so a corrupt, truncated
      or non-image blob is returned as Ok and the caller has no way to know. The dimension check
      immediately below is skipped for the same reason, so a blob whose recorded dimensions do not
      match its content also passes.
    impact: |
      AD-4 says "A Bundle's image is a copy of the Finding's image with Markers drawn on it, at the
      same dimensions." The fast path can satisfy neither clause for a corrupt source: it cannot know
      the dimensions and it has not read the image.

      Reach is currently ZERO, and this is the honest part: BUG-19 means burn_markers is called from
      nowhere at all. It becomes reachable the moment W8-S6 wires the export call, and at that point
      a corrupt Finding blob propagates silently into a Bundle that reports success. SCN-04 makes the
      path routine rather than exotic - a Finding whose Markers all lack Note lines takes it every
      time, and so does a Finding with no Markers.
    why_undetected: |
      The fast path is CORRECT for its intended case and that is what makes it easy to read past: for
      a valid image with nothing to draw, returning the bytes unchanged is exactly what AD-9's
      byte-identity promise requires, and burning_no_markers_returns_the_source_bytes_unchanged
      proves that half honestly.

      The same shape as the sweep-exclusion pitfall already recorded in AGENTS.md: a branch is
      justified by a premise - here, that the caller has already validated the blob - and the premise
      is never written down, so nobody re-checks it when the caller changes. W8-S6 is the change.
    fix: |
      Decide first whether the burner is the right place to validate. It may not be: the alternative
      is that the export path validates the stored blob before calling, which keeps the burner a pure
      draw. Whichever is chosen, the fast path MUST NOT report success for bytes it has not read.

      A test for this must use a VALID PNG HEADER WITH CORRUPT PAYLOAD, not garbage bytes. W7 proved
      garbage never reaches the code under test - it is rejected at the decoder's front door.
    related: BUG-19
    scheduled: W8-S6
    verified: |
      Already fixed in the live crate, and this row went stale without anyone noticing - the same
      failure mode `AGENTS.md` records about `BUG-12`. `crates/snapdown-store/src/image/burner.rs`
      now runs `image::load_from_memory` and the dimension check BEFORE the no-markers fast path, so
      a corrupt or mis-sized blob is refused rather than returned as `Ok`.

      Covered end to end by `a_planned_bundle_refuses_an_image_whose_recorded_dimensions_are_wrong`,
      which drives it through the new Bundle caller rather than the burner alone.
    status: fixed

  - id: BUG-21
    title: "The composed Markdown references the Finding's clean image, not the Bundle's burned copy"
    found: "2026-08-24"
    found_by: W8-S6 planner, tracing FR-8 end to end rather than to the file write
    component: bundle
    severity: high
    contradicts: [FR-8, "AD-4"]
    root_cause: code
    evidence: |
      crates/snapdown-core/src/domain/markdown.rs:30:

        let img_rel = format!("./{}", item.finding.image_path.trim_start_matches('/'));
        out.push_str(&format!("![Finding {}]({})\n\n", position, img_rel));

      `item.finding.image_path` is the FINDING's stored image. `BundleItem.image_path` - the Bundle's
      own burned copy, which data-model.md:63 calls "The Bundle's own copy, relative to the Vault
      root. Not the Finding's" - is never read here.
    impact: |
      FR-8 promises a handed-over Bundle carries its Markers ON THE IMAGE. BUG-19 stops the burned
      file from being written at all; this stops it from being REFERENCED even once it is. Fixing
      BUG-19 alone leaves FR-8 unmet, because a reader following the Markdown still lands on the
      clean image.

      The two defects are one promise broken in two places, which is why W8-S6 carries both. Closing
      BUG-19 and calling FR-8 restored would be the exact error this wave exists to end: a green test
      beside an unmet requirement.
    why_undetected: |
      Sixth instance of this repository's signature failure - every piece correct, the join absent.
      It survived W8-S5's test-surface conversion because the golden asserts the Markdown is
      byte-exact against a literal, and the literal was regenerated from the same wrong path. A
      golden pins whatever it is shown; it cannot know the path it pins is the wrong one.
    fix: |
      Read BundleItem.image_path for the image reference. The serializer currently takes
      &[FindingDetail] and has no BundleItem in hand, so the signature has to carry it - that is the
      real work, and it is why this is not a one-line change.

      TWO GOLDENS W8-S5 JUST PINNED WILL MOVE. That is correct and expected: they were pinned against
      the wrong reference. Regenerate them deliberately, and RE-RUN THE MUTATION so the moved golden
      is proven to still fail when it should.
    related: BUG-19
    scheduled: W8-S6
    verified: |
      `crates/snapdown-core/src/domain/markdown.rs` reads `item.image_path` - the Bundle's own burned
