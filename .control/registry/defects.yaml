    fix: |
      DONE, 2026-08-28. `components/settings.slint`, four tabs, following the G3 design.

        General & Quality  run at startup (with the registry read failure reported rather than shown
                           as `false`, which would be a toggle that lies); open-Editor-after-capture
                           with `BG-6`'s reason next to it; the Vault path, read-only, with Explorer;
                           the four Quality Budget presets with a live readout; and the advanced pair
                           behind a disclosure, exactly as designed
        Hotkeys            both actions, click-then-press, Escape to cancel, with the OS registration
                           state and `BR-27`'s conflict message shown per row
        Local Agent Bridge states plainly that it is blocked by `BUG-59` rather than showing a panel
                           that cannot work
        About             version, MIT, and `NTL-1`'s Slint attribution plus IBM Plex's OFL

      Two honest refusals on the screen itself:

        - **Encoder quality is shown and disabled**, with `BUG-63`'s reason written next to it. Hiding
