  - id: BUG-40
    title: A selection cannot be replaced by clicking elsewhere; it takes Escape and a fresh capture
    found: "2026-08-27"
    found_by: kodesh87, manual capture test
    component: capture
    severity: medium
    contradicts: [FR-3]
    root_cause: code
    evidence: |
      The catch-all TouchArea carries `enabled: !root.is-narrating`, because it otherwise sits above
      the note popup in z-order and swallows every click meant for the note field or the Save
      button. So once a selection is being annotated, no click anywhere reaches the overlay.
    impact: |
      Owner: "saya bisa membatalkan sorot dengan mengklik sorot daerah lain tanpa harus ESC dan
      start capture lagi". Correcting a mis-selection costs a cancel and a whole new capture, which
      is the loop FR-3 exists to protect.
    why_undetected: |
      The `enabled` gate was added to fix a real defect - the popup being unclickable - and nothing
      recorded the behaviour it traded away.
    fix: |
      Ordering, not gating: the popup must sit above the catch-all in z-order so both can be live at
      once. The popup is currently nested inside the selection frame, which is declared before the
      catch-all, so this is a restructure rather than a property change.
    resolved: |
      2026-08-27. Ordering, as the fix field predicted, and the restructure was the whole of it: the
      note panel is now declared at the END of the overlay - after the catch-all TouchArea and after
      the full-screen control - instead of nested inside the selection frame. With the panel above
      the catch-all in z-order, the catch-all no longer has to be disabled to keep the note field
      clickable, so a press anywhere outside the panel clears the selection and starts a new one.

      One consequence had to be handled rather than discovered later: a click landing on the panel's
      own padding would now fall through to the still-live catch-all and clear the very selection the
      panel is about. The panel absorbs those with a TouchArea of its own.

      Lifting it out also fixed BUG-38's second attempt, because the panel's position stopped being
      expressed in two coordinate spaces at once.

      Guarded by clicking_elsewhere_starts_a_new_selection_without_escape, verified by mutation.
    status: fixed
