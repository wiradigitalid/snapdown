      fastpath, done. The handler stores `SettingValue::Boolean` under `SettingKey::Custom("theme_dark")`,
      and startup reads it before the window is shown so it does not repaint in front of the Reviewer.
      `Custom` rather than a new enum variant deliberately: a variant reaches the domain, the store and
      a migration, which is a lot of surface for one boolean.

      One `theme_setting_key()` function rather than the string at two call sites - a typo in one of
      them would store the choice, never read it back, and fail nothing.
