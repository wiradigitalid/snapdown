      Browsing the Library feels slow at the one moment the Reviewer is looking for something.
    why_undetected: |
      Nothing here measures it, and it only shows once the filmstrip holds enough Findings to
      browse.
    fix: |
      NOT DIAGNOSED. Read the blob, decode the PNG and upload the texture on the UI thread are the
      candidates; `rgba_to_slint_image` also does a full `clone_from_slice`, which BUG-28 measured
      at 19ms per 92MB. Measure first.
    measurement: |
      2026-08-27, on the owner's library of 58 Findings, instrumented in the release build:

        load_findings_into_window  n=58  list=1.3ms  thumbs=310.0ms  total=320.9ms

      The database query is 1.3 ms. The 310 ms is `image::open` plus `clone_from_slice` for EVERY
      thumbnail in the library, run on the UI thread, on every click - and none of that work changes
      when the selection changes. It also grows with each capture taken, so the defect gets worse the
      more the product is used.

      None of the three candidates named in the `fix` field above was the cost. The full-size decode
      of the selected image - the obvious suspect - measures 10.5 ms.
    resolved: |
      2026-08-27. The loader was split. `load_active_detail` loads one Finding; `select_active_finding`
      calls it and moves the `is_active` flag by writing the two affected rows in place, leaving the
      filmstrip model alone. `load_findings_into_window` still rebuilds everything, and is still what
      a completed capture calls, because a new Finding does change the set.

      Measured after: 10.5 ms per selection, against 320.9 ms before, and it no longer scales with the
      library.

      The in-place path downcasts the model to `VecModel`; if that ever fails it falls back to the
      full rebuild rather than doing nothing, because slow is a defect and silent is a mystery.

      Guarded by selecting_a_finding_does_not_rebuild_the_filmstrip, verified by mutation.
