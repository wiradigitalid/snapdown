# waves.yaml — rencana kerja.
#
# `release` MUST disebut tiap wave. STATUS STORY MUST NOT DISALIN KE SINI.
#
# One wave completes one Product Component. That is not a rule of the method — a wave MAY cross
# components — it is this product's plan, chosen so that V3 is green after every wave rather than
# only at the end. The cost is that W2 is a wave `L`.

# ---------------------------------------------------------------------------------------------
# RECOVERY NOTE — W2, W3, W4, W5 · written 2026-08-23, answering OQ-21
#
# Those four waves are `closed` and hold NO `epics`/`stories` here. W1 and W6 do. The gap was found
# when W6 put `finding` and `bundle` into the touched set and V3 began reporting six shipped use
# cases — UC-1, UC-2, UC-7, UC-8, UC-9, UC-12 — as scheduled to no story.
#
# WHAT THE EVIDENCE SUPPORTS. Story FILES exist on disk and were read:
#   _bmad-output/specs/w2-finding/stories/   W2-S1 .. W2-S6   (6 files)
#   _bmad-output/specs/w3-bundle/stories/    W3-S1 .. W3-S6   (6 files)
#   _bmad-output/specs/w4-agent-access/stories/  W4-S5 only   (1 file)
#   _bmad-output/specs/w5-sharing/stories/       W5-S3 only   (1 file)
# `.work/` additionally holds build briefs for w4-s1..s4 and w5-s1..s2, so those stories were
# dispatched and their code shipped — but their story files are gone.
#
# WHY THE ROWS ARE NOT RECONSTRUCTED HERE, and this is the answer to OQ-21:
# not one of the fourteen surviving story files contains a single `UC-` reference. The traceability
# was never written, not lost. Ids, titles, components and status are recoverable; `satisfies:` is
# not, and inventing it would produce a registry that reads complete and is fiction. OQ-21 said in
# advance that this was the branch to take.
#
# V3 WILL KEEP REPORTING THOSE SIX USE CASES, and that is the correct state. The link genuinely does
# not exist. A green validator here would mean somebody had guessed.
#
# TWO FURTHER FINDINGS FROM THE SAME READ:
#  - W2-S6 (finding deletion + orphan sweeper) still carries `status: ready-for-dev` in its story
#    file, and W2 is `closed`. Its CODE SHIPPED — OrphanReportView.tsx exists, scan_orphans and
#    clean_orphans are registered commands — so this is a bookkeeping failure, not missing work.
#    A wave was closed over a story that never reached `done`.
#  - Six story files (W4-S1..S4, W5-S1..S2) are absent while their code is in the tree.
#
# NOT FIXED BY HAND. Reopening a closed wave to add scope is forbidden; this is a record gap, and
# the record now states it.
# ---------------------------------------------------------------------------------------------

waves:
  - id: W1
    title: Workspace, the two stores, and Settings complete
    status: closed
    release: r1
    prd: [capture-to-markdown]
    fr: [FR-5, FR-16, FR-17, FR-18]
    components: [settings]
    size: L
    depends_on: []
    spec_folder: _bmad-output/specs/w1-settings/
    opened: "2026-08-22"
    spec_reviewed:
      date: "2026-08-23"
      sha: 6a470fd
      lenses: [structure, prose, edge-case-hunter]
    epics:
      - id: EP-settings
        component: settings
        title: Settings
        stories:
          - id: W1-S1
            title: Cargo workspace, Tauri v2 shell, React webview, tray, and CI
            component: settings
            satisfies: []
            depends_on: []
            touches: [settings-store]
            spec_folder: _bmad-output/specs/w1-settings/
            tests:
              - cargo::workspace_builds
              - cargo::snapdown_core_has_no_io_dependency
              - vitest::app_renders_shell
              - ci::korpus_workflow_runs_validate
          - id: W1-S2
            title: library.db with migrations, the setting table, and the Vault blob adapter
            component: settings
            satisfies: []
            depends_on: [W1-S1]
            touches: [settings-store, local-db, vault-fs]
            spec_folder: _bmad-output/specs/w1-settings/
            tests:
              - cargo::migrations_apply_to_an_empty_database
              - cargo::migrations_are_idempotent
              - cargo::setting_read_falls_back_to_its_shipped_default
              - cargo::vault_refuses_a_path_that_escapes_its_root
              - cargo::corrupt_library_refuses_to_open_and_does_not_recreate
          - id: W1-S3
            title: Settings screen — the Vault folder and the Quality Budget
            component: settings
            satisfies: [UC-13, UC-14]
            depends_on: [W1-S2]
            touches: [settings-store, editor-ui]
            spec_folder: _bmad-output/specs/w1-settings/
            tests:
              - cargo::unwritable_vault_folder_is_refused_at_choosing
              - cargo::changing_the_vault_moves_every_file_or_none
              - cargo::quality_budget_outside_range_is_refused_on_entry
              - vitest::settings_shows_the_stored_size_of_the_latest_finding
          - id: W1-S4
            title: Hotkey binding, OS registration, and honest conflict reporting
            component: settings
            satisfies: [UC-15]
            depends_on: [W1-S3]
            touches: [settings-store, capture-pipeline]
            spec_folder: _bmad-output/specs/w1-settings/
            tests:
              - cargo::a_combination_held_elsewhere_is_refused_at_binding
              - cargo::two_actions_cannot_share_one_combination
              - cargo::a_cleared_hotkey_disables_its_action
              - cargo::rebinding_takes_effect_without_a_restart
              - cargo::a_failed_startup_registration_is_reported_not_swallowed
          - id: W1-S5
            title: Run at Windows startup, reflecting the real registration
            component: settings
            satisfies: [UC-16]
            depends_on: [W1-S4]
            touches: [settings-store]
            spec_folder: _bmad-output/specs/w1-settings/
            tests:
              - cargo::startup_registration_needs_no_administrator_rights
              - cargo::the_setting_is_read_back_from_the_os_not_remembered
              - cargo::disabling_removes_the_registration

  - id: W2
    title: Finding complete — the capture loop, the Editor, Markers, deletion
    status: closed
    release: r1
    prd: [capture-to-markdown]
    fr: [FR-1, FR-2, FR-3, FR-4, FR-6, FR-7, FR-8, FR-9, FR-13, FR-15]
    components: [finding]
    size: L
    depends_on: [W1]
    spec_folder: _bmad-output/specs/w2-finding/
    scope: >-
      Per-monitor Capture Overlay, region selection at each monitor's own scale factor, the note
      field at the region, image reduction under the Quality Budget, the Editor's Finding list and
      detail view, Note editing, the Marker canvas, multi-select, hard deletion with its files, and
      the orphan report. Carries RISK-1 through RISK-4, which is why it is a wave L.

  - id: W3
    title: Bundle complete — compose, list, copy, delete
    status: closed
    release: r1
    prd: [capture-to-markdown]
    fr: [FR-10, FR-11, FR-12, FR-14]
    components: [bundle]
    size: M
    depends_on: [W2]
    spec_folder: _bmad-output/specs/w3-bundle/
    scope: >-
      The composer, the pure Markdown writer, the Marker burner, the Bundle store with its
      delete-with-files transaction, and the Bundle list. The golden-file test that AD-9 rests on is
      born here, covering the clipboard path; the other two paths join it in W4 and W5.

  - id: W4
    title: Agent access complete — the key, the Local API, the MCP bridge
    status: closed
    release: r2
    prd: [agent-handoff]
    fr: [FR-19, FR-20, FR-21, FR-22]
    components: [agent-access]
    size: M
    depends_on: [W3]
    spec_folder: _bmad-output/specs/w4-agent-access/
    opened: "2026-08-23"
    scope: >-
      Access Key issue, re-copy, state, and revoke; the loopback-only read-only API; the stateless
      stdio MCP bridge. The refusal-versus-empty-result behaviour is tested from an agent's position,
      not the API's, because that is where RISK-6 actually happens.

  - id: W5
    title: Sharing complete — publish, the web service, the reader
    status: closed
    release: r2
    prd: [agent-handoff]
    fr: [FR-23, FR-24, FR-25, FR-26]
    components: [sharing]
    size: L
    depends_on: [W3]
    spec_folder: _bmad-output/specs/w5-sharing/
    opened: "2026-08-23"
    scope: >-
      The staged publish client, the Publication record with its sticky failure, the Go service with
      its embedded store and identical refusals, and the React reader. Three containers and two
      languages, carrying RISK-8, RISK-9, and RISK-10. Depends on W3 rather than W4 — the two r2
      waves are independent and MAY run in parallel.

  - id: W6
    title: The desktop experience rework
    status: open
    release: r3
    prd: [capture-to-markdown]
    fr: [FR-5, FR-18, FR-27, FR-28, FR-29]
    components: [settings, finding, bundle]
    size: L
    depends_on: []
    spec_folder: _bmad-output/specs/w6-desktop-experience/
    opened: "2026-08-23"
    spec_reviewed:
      date: "2026-08-23"
      sha: 24452d6
      lenses: [structure, prose, edge-case-hunter]
    known_gaps:
      # Named here rather than discovered at wave close. Neither blocks W6; both would otherwise
      # look like the wave forgot them.
      - "LC-029 capture-note-field is registered and has no component. No W6 story creates it: the
         capture path is not in this wave's scope. inventory-screen row 2 will keep reading UNREAD
         until a wave touches capture."
      - "LC-027 bundle-reader, and rows 11, 14, 15, are BUG-2 — recorded as delivered in W5 and
         absent from the tree. Frozen by DEC-005; whether to build or withdraw is OQ-22."
    why: |
      r1 and r2 shipped every promised capability. The owner's first sustained use produced a list of
      EXPERIENCE defects, not missing features: they could not name the application they had opened,
      could not find the Editor, could not read a label against its background, and were asked for two
      numbers nobody can judge. BG-7 and CAP-9 now carry that, and this wave is where it is paid for.
      DEC-005 freezes `sharing` and `agent-access` for the duration; their surfaces stay reachable
      (BR-120) and gain no behaviour.
    epics:
      - id: EP-foundation
        component: settings
        title: One colour authority, and a frame that owns itself
        stories:
          - id: W6-S1
            title: Every colour through tokens, both themes, enforced by a lint rule
            component: settings
            satisfies: []
            depends_on: []
            touches: [editor-ui, settings-store]
            spec_folder: _bmad-output/specs/w6-desktop-experience/
            why: |
              The biggest blocker, run alone first so its shape decisions land before anything fans
              out. 23 hex literals live outside the token file; the meaning pairs, the sunken surface,
              --space-0 and --radius-full do not exist yet. Every later story in this wave writes UI
              and would otherwise each invent its own colours again.
            tests:
              - vitest::no_component_contains_a_colour_literal
              - vitest::every_token_is_defined_in_both_themes
              - vitest::every_text_element_meets_wcag_aa_in_the_light_theme
              - vitest::every_text_element_meets_wcag_aa_in_the_dark_theme
              - vitest::a_theme_change_while_running_repaints_every_surface
              - vitest::a_theme_invariant_token_is_declared_as_one_in_the_token_file
          - id: W6-S2
            title: The editor shell — persona naming, the navigation rail, one executable
            component: settings
            satisfies: [UC-24, UC-25]
            depends_on: [W6-S1]
            touches: [editor-ui]
            spec_folder: _bmad-output/specs/w6-desktop-experience/
            why: |
              LC-028. The frame is inline JSX in App.tsx today, owned by no component and tested by
              nothing, which is how FR-27 and FR-28 came to be unmet with no document being wrong.
            tests:
              - cargo::the_build_produces_exactly_one_desktop_executable
              - cargo::the_executable_name_the_tray_tooltip_and_the_window_title_share_one_source
              - vitest::the_workspace_window_titles_itself_snapdown_editor
              - vitest::the_window_title_does_not_change_between_surfaces
              - vitest::every_primary_surface_is_reachable_from_every_other
              - vitest::a_frozen_components_surface_is_still_listed
              - vitest::the_active_surface_is_distinguished_by_more_than_colour
              - vitest::the_rail_still_renders_when_a_surface_fails_to_load
      - id: EP-settings-surface
        component: settings
        title: A Settings screen that fits, and controls that can be answered
        stories:
          - id: W6-S3
            title: Two columns packed by content height, four groups visible at 1024x720
            component: settings
            satisfies: [UC-26]
            depends_on: [W6-S2]
            touches: [editor-ui, settings-store]
            spec_folder: _bmad-output/specs/w6-desktop-experience/
            tests:
              - vitest::all_four_settings_groups_are_visible_at_the_minimum_window_size
              - vitest::no_group_is_stretched_to_match_a_neighbours_height
              - vitest::agent_access_is_a_primary_surface_and_not_a_settings_group
          - id: W6-S4
            title: The Quality Budget as a named intent, with Auto deriving per capture
            component: settings
            satisfies: [UC-13]
            depends_on: [W6-S3]
            touches: [settings-store, image-encoding, local-db]
            spec_folder: _bmad-output/specs/w6-desktop-experience/
            why: |
              DEC-004. Carries the migration adding quality_budget.named, and the three columns
              NFR-18 needs on `finding`. SCN-03's one assertion is the only one a constant cannot pass.
            tests:
              - cargo::auto_resolves_a_different_pair_for_a_small_region_than_for_a_full_screen
              - cargo::auto_resolves_a_higher_encoder_quality_when_no_downscale_applies
              - cargo::every_stored_finding_carries_the_pair_that_was_applied_to_it
              - cargo::the_named_state_and_its_resolved_pair_are_written_together
              - cargo::an_advanced_value_outside_its_range_is_refused_and_does_not_enter_custom
              - vitest::editing_an_advanced_value_moves_the_control_to_custom_visibly
              - vitest::the_readout_names_the_budget_that_produced_the_latest_finding
              - vitest::a_reviewer_who_never_opens_advanced_never_sees_a_raw_number
          - id: W6-S5
            title: Run at Windows startup — on by first-run default, and never assumed
            component: settings
            satisfies: [UC-16]
            depends_on: [W6-S4]
            touches: [settings-store]
            spec_folder: _bmad-output/specs/w6-desktop-experience/
            why: |
              SCN-02's five runs. Needs the startup.registered key so that "nothing was ever
              configured" and "the Reviewer turned it off" stop being indistinguishable.
            tests:
              - cargo::a_first_run_with_nothing_configured_registers_at_startup
              - cargo::a_run_after_the_reviewer_disabled_it_does_not_re_register
              - cargo::a_registration_removed_outside_snapdown_shows_off_and_is_not_restored
              - vitest::the_startup_toggle_renders_unknown_until_the_os_has_answered
              - vitest::the_startup_toggle_never_renders_a_definite_state_before_the_read_resolves
          - id: W6-S6
            title: Hotkey rows — chip states, honest conflicts, and readable badges
            component: settings
            satisfies: [UC-15]
            depends_on: [W6-S5]
            touches: [settings-store, capture-pipeline, editor-ui]
            spec_folder: _bmad-output/specs/w6-desktop-experience/
            tests:
              - vitest::a_listening_chip_stops_listening_when_focus_leaves_it
              - vitest::a_snapdown_internal_conflict_is_worded_differently_from_an_os_conflict
              - vitest::a_cleared_hotkey_reads_disabled_rather_than_empty
              - vitest::a_startup_registration_failure_carries_a_badge_before_the_reviewer_acts
              - vitest::the_active_and_disabled_badges_carry_a_word_not_only_a_colour
      - id: EP-library-surfaces
        component: finding
        title: Findings and Bundles as real workspaces
        stories:
          - id: W6-S7
            title: Findings — capture rail, canvas, note pane, and every state
            component: finding
            satisfies: [UC-3, UC-4, UC-5, UC-6]
            depends_on: [W6-S6]
            touches: [editor-ui, marker-canvas]
            spec_folder: _bmad-output/specs/w6-desktop-experience/
            why: |
              The surface the owner saw as white-on-white. Also lands the keyboard path to every
              Marker through the note pane, which is what makes the accessibility floor real.
            tests:
              - vitest::findings_renders_correctly_in_both_windows_themes
              - vitest::the_empty_state_teaches_the_bound_capture_combination
              - vitest::nothing_selected_is_visually_distinct_from_empty
              - vitest::every_marker_is_reachable_and_movable_from_the_keyboard
              - vitest::a_marker_with_no_note_line_is_reported_in_the_note_pane
              - vitest::a_marker_with_no_note_line_is_not_annotated_on_the_image
              - vitest::panels_take_the_height_available_rather_than_a_fixed_height
          - id: W6-S8
            title: Bundles — preview as the centre, and a read-only region not a disabled input
            component: bundle
            satisfies: [UC-10, UC-11]
            depends_on: [W6-S7]
            touches: [editor-ui, bundle-render]
            spec_folder: _bmad-output/specs/w6-desktop-experience/
            tests:
              - vitest::bundles_renders_correctly_in_both_windows_themes
              - vitest::the_preview_is_a_read_only_region_and_not_a_disabled_input
              - vitest::the_empty_state_offers_no_button_that_only_navigates_away
              - vitest::copy_markdown_announces_its_result
              - vitest::an_item_whose_image_copy_is_missing_is_flagged_and_the_bundle_still_opens
      - id: EP-defects
        component: bundle
        title: BUG-1 and the swallowed file errors
        stories:
          - id: W6-S9
            title: A Bundle survives the deletion of a Finding it holds
            component: bundle
            satisfies: []
            depends_on: [W6-S4]
            touches: [local-db]
            spec_folder: _bmad-output/specs/w6-desktop-experience/
            why: |
              BUG-1. bundle_item.finding_id carries ON DELETE CASCADE and foreign_keys is ON, so
              deleting a Finding silently removes the Bundle's record of that item while its Markdown
              and image copy survive. FR-13's third consequence has been active since G2 and says the
              opposite. Migration; rows already lost are not recoverable.
            tests:
              - cargo::deleting_a_finding_leaves_its_bundle_item_in_place
              - cargo::deleting_a_finding_leaves_the_bundle_markdown_byte_identical
              - cargo::deleting_a_finding_leaves_the_bundles_own_image_copy_in_the_vault
              - cargo::a_bundle_whose_source_finding_is_gone_still_copies_the_same_bytes
              - cargo::deleting_a_bundle_still_cascades_to_its_items
          - id: W6-S10
            title: The Vault move reports a file it could not remove
            component: settings
            satisfies: []
            depends_on: [W6-S6]
            touches: [vault-fs, settings-store]
            spec_folder: _bmad-output/specs/w6-desktop-experience/
            why: |
              vault_migration.rs swallows both fs::remove_file results (:141 success path, :180
              rollback). A source file that will not delete leaves an unreported duplicate of an image
              that may hold personal data, and the move still reports success.
            tests:
              - cargo::vault_move_reports_a_source_file_it_could_not_remove
              - cargo::vault_move_reports_a_destination_copy_it_could_not_clean_up
              - cargo::vault_move_failing_at_file_n_leaves_every_source_file_in_place
