              - cargo::vault_move_reports_a_destination_copy_it_could_not_clean_up
              - cargo::vault_move_failing_at_file_n_leaves_every_source_file_in_place

  - id: W7
    title: The panic surface, and the two fixes the freeze allows
    status: closed
    release: r3
    prd: [capture-to-markdown, agent-handoff]
    # No FR. Every story here is a DEFECT FIX against a promise that already exists, and this wave
    # deliberately adds no promise. What each story contradicts is named in its own `why`.
    fr: []
    components: [settings, sharing, agent-access]
    size: M
    depends_on: [W6]
    spec_folder: _bmad-output/specs/w7-failure-paths/
    opened: "2026-08-24"
    scope: >-
      Three defects that share one habit: a failure the code declines to report. BUG-12 panics on a
      store it cannot open, in a process with no console, so the product appears not to exist. BUG-3
      interpolates the Reviewer's own Note into HTML unescaped. BUG-10 can hand an agent an error
      whose message is the empty string. None of the three needs a decision from the owner and none
      of them adds behaviour.

      TWO OF THE THREE COMPONENTS ARE FROZEN, and this wave is allowed under that freeze by its own
      terms. DEC-005 says it plainly - "This decision does not forbid a fix. It forbids new work."
      Its Cost section already named the awkwardness - "a defect in the frozen components has an
      awkward home ... it lands as a defect row and a patch release, and that path is thinner than a
      wave's". A wave is used here rather than a fastpath because BUG-3 contradicts NFR-15, and
      fastpath work that turns out to touch a requirement MUST stop and be raised to a wave anyway.

      NOTHING NEW IS PROMISED to `sharing` or `agent-access` - no FR, no use case, no UX pass, and no
      depth above the `guarded` they already carry. Both keep the code they have; two paths in it
      start telling the truth.
    known_gaps:
      # Named at OPENING rather than discovered at close, because opening this wave is what causes
      # them and a reader should not have to work that out from a validator.
      - "V3 gains SEVEN new findings the moment this wave opens - UC-17, UC-18, UC-19 (agent-access)
         and UC-20, UC-21, UC-22, UC-23 (sharing). None of them is new drift. V3's touched set is
         built from STORY `component` fields, and W4 and W5 hold no stories here at all: the RECOVERY
         NOTE at the top of this file records that their story files are gone or carry no `UC-`
         reference, and OQ-21 decided in advance not to reconstruct a traceability that was never
         written. W7-S2 and W7-S3 are the first stories those two components have ever had in this
         registry, which is the whole cause. The correct state is RED, exactly as it already is for
         `finding` and `bundle`, and a green V3 here would mean somebody had guessed."
      - "These three stories `satisfies: []` and that is deliberate, not an omission. A defect fix
         restores a promise that already exists; it schedules no use case. Writing a `UC-` here to
         quiet V3 would be the guess the recovery note refuses."
      - "THE `depends_on` CHAIN IS NOT A TECHNICAL DEPENDENCY AND MUST NOT BE READ AS ONE. The SPEC
         review raised this (finding M7) and it is upheld. The three stories touch entirely disjoint
         trees - apps/desktop/src-tauri (Rust), apps/web-service (Go), crates/snapdown-bridge (Rust)
         - and share no file, symbol, schema, or fixture. The chain exists because V11 demands that
         every PAIR of stories in a wave either share a `touches` value or sit on a `depends_on`
         path, and these three share neither. Declaring `depends_on: []` on all three, which is what
         M7 asks for, makes V11 fail on all three pairs. The chain is therefore a V11 artifact
         recording INTENDED ORDER, not a build gate, and all three MAY be dispatched in parallel -
         their Step 1 planners were, in three isolated worktrees. Filed as OQ-25: V11 makes a wave of
         unrelated defect fixes express a dependency that does not exist, and naming it here is
         better than letting the next reader believe it."
    spec_reviewed:
      date: "2026-08-24"
      sha: 7c67dfb
      lenses: [structure, prose, edge-case-hunter]
      # 3 high, 10 medium, 9 low; report at _bmad-output/specs/w7-failure-paths/review-W7-spec.md.
      # H1 found that W7-S1's defect was already fixed (see that story's `why`), and H3 found BUG-15,
      # a live BR-118 violation in all five stores that no existing test can reach. Every high and
      # every medium was upheld; findings were resolved into the SPEC, this registry, three new
      # defect rows, and OQ-25 before this trace was written.
    closed: "2026-08-24"
    close_record: |
      PHASE 4, walked in order.

      1. REGISTRY CATCH-UP. Every `touches` value resolves to a registered `area` -
         local-db, settings-store, web-service, mcp-bridge. No new LC was created: all three stories
         changed existing components rather than adding boundaries. V12 green.

      2. INVENTORIES REFRESHED FROM CODE. inventory.py reports 4 plan-versus-code gaps in
         inventory-screen, and ALL FOUR ARE ALREADY REGISTERED - three are BUG-2's `sharing` screens
         (PublishDialog, PublishedBundleReader, PublicationNotFound), one is the capture note field
         under BUG-14/LC-029. Reported, not patched: the gap is a finding routed to the skill that
         owns its side.

      3. STRUCTURE MAPS. Not re-derived, and that is correct rather than skipped: no base folder was
         born or removed and no key file moved. Three source files and two test files changed inside
         folders the maps already describe.

      4. DISTILLATION. Nothing durable is left in the spec folder. The review's findings left it as
         they were resolved - three new defect rows (BUG-15/16/17), BUG-12 corrected to resolved,
         OQ-25 filed, and the SPEC and story files amended in place. review-W7-spec.md stays in the
         spec folder as the working record of a run, which is what _bmad-output is for.

      5. RETROSPECTIVE. SKIPPED, and stated rather than silent, as V19 requires: this is a wave `M`,
         where the retrospective is advisory. The wave's one durable lesson is already recorded where
         it will be read - BUG-12's resolution block, and a new pitfall in AGENTS.md: a register entry
         is a claim about code at a moment, and it goes stale silently.

      6. RTM. No FR is claimed by this wave (`fr: []`) and no UC is scheduled, so there is no
         traceability row to turn green. That is the correct shape for a wave of defect fixes and it
         is why V3 stays red here - see known_gaps.

      7. VERIFICATION RUN BY THE COORDINATOR on the merged branch, not taken from any worker report:
           cargo fmt --all -- --check                                   exit 0
           cargo clippy --workspace --all-targets -- -D warnings        exit 0
           cargo test --workspace                                       exit 0, 31 suites
           go build ./... && go vet ./... && go test ./...  (Windows)    exit 0
           web/ui   typecheck + lint + test                             exit 0, 69 tests
           apps/desktop typecheck + lint + test + build                 exit 0
         All three fixes were additionally verified BY MUTATION; one test was found insensitive to
         the defect it names and is recorded as belt-and-braces rather than counted as protection.
         See BUG-15's resolution.

      ONE TRANSIENT FAILURE, recorded so it is not mistaken for a defect next time: the first
      `cargo test --workspace` died with LNK1201 writing test_no_io's PDB. 176 GB free, so not disk
      space - a stale locked PDB. Deleting it and re-running was clean. Infrastructure, retried once,
      not patched around.
    epics:
      - id: EP-startup
        component: settings
        title: The application says what went wrong instead of vanishing
        stories:
          - id: W7-S1
            title: Close the three defects W6-S5's startup path left open, and name the tests
            component: settings
            satisfies: []
            depends_on: []
            touches: [local-db, settings-store]
            spec_folder: _bmad-output/specs/w7-failure-paths/
            why: |
              RE-SCOPED 2026-08-24, after the SPEC review. This story was opened against BUG-12 and
              BUG-12 WAS ALREADY FIXED - by W6-S5 (commit aa30434), which was not scoped to it and
              closed it as a side effect of needing a fallible startup path. The register row still
              read `open`, a planner was dispatched against it, and it wrote a full implementation
              plan for code that already existed. The review caught it by reading the code instead of
              the register. defects.yaml BUG-12 now carries that history in full.

              What W6-S5 did NOT close is real, and it is what this story now carries:

              BUG-15, HIGH. All five stores switch the database to WAL BEFORE running quick_check
              (settings_store.rs:28 then :33, identically in the four siblings). Switching an existing
              database to WAL mutates page 1 and creates `-wal` and `-shm` beside it, so for a file
              with a VALID header and corrupt B-tree pages the store IS written to and files ARE
              created next to it - and the Reviewer is then told nothing was touched. That sentence
              is false, and it is the one thing they would rely on before taking a backup. BR-118 and
              the SDD's "a store recreated beside a corrupt one is silent data loss" are both broken
              by the code path that reports them.

              THE TEST CANNOT SEE IT, and that is the part worth carrying: the only corrupt fixture
              anyone has used is garbage bytes, which SQLite rejects at Connection::open before a
              single pragma runs. The byte-identity assertion passes without ever reaching the code
              that breaks it. The W7-S1 plan named this exact case in its own edge-case matrix and
              then specified a fixture that avoids it.

              BUG-16, medium. The exit is still a panic, through the `.expect()` at lib.rs:347 that
              BUG-12 deliberately excluded from its sweep. That exclusion's reason - "there is nothing
              left to report with" - was true when every store open panicked before reaching it, and
              W6-S5 made it the routine exit path without anyone re-reading the premise.

              BUG-17, medium. MessageBoxW is called with a NULL owner and none of MB_SETFOREGROUND,
              MB_TOPMOST or MB_SYSTEMMODAL, so it can open behind other windows - which is the
              "nothing happens at all" symptom BUG-12 existed to end. Whether it is then actually
              visible is a MANUAL check and MUST NOT be claimed by a cargo test (OQ-24).
            tests:
              # The four names below are the ones this wave promised. Two already exist under
              # different names and are RENAMED, not rewritten, so the registry and the suite agree:
              #   an_unreadable_library_db_is_reported_with_its_path_and_not_recreated
              #   a_corrupt_library_db_does_not_panic_the_setup_hook
              # a_readable_store_still_starts_normally has no coverage today.
              - cargo::a_store_that_cannot_be_opened_yields_an_error_not_a_panic
              - cargo::the_startup_error_names_the_path_of_the_file_that_failed
              - cargo::a_corrupt_store_is_never_recreated_beside_itself
              - cargo::a_readable_store_still_starts_normally
              # BUG-15. The first is the fixture that makes the third name above mean something.
              - cargo::a_valid_header_with_corrupt_pages_is_not_written_to_before_it_is_checked
              - cargo::a_failed_open_leaves_no_wal_or_shm_file_beside_the_database
              # BUG-16.
              - cargo::a_store_failure_exits_without_panicking
            tests_deliberately_not_written:
              - name: the_startup_dialog_reaches_the_foreground
                why: |
                  BUG-17's fix is MB_SETFOREGROUND | MB_TOPMOST, and no unit test can observe whether
                  a native dialog actually reached the foreground. Asserting the flag constants were
                  passed would test a copy of the input, which is the literal-assert failure this
                  repository has landed three times. It is a manual check, it is recorded as one, and
                  OQ-24 says this project currently has no working way to run one.
      - id: EP-frozen-fixes
        component: sharing
        title: Two frozen components stop lying about failure
        stories:
          - id: W7-S2
            title: Escape the published Markdown before it reaches the page
            component: sharing
            satisfies: []
            depends_on: [W7-S1]
            touches: [web-service]
            spec_folder: _bmad-output/specs/w7-failure-paths/
            why: |
              BUG-3, medium, contradicting NFR-15.

              apps/web-service/internal/server/server.go:145 builds the page with fmt.Sprintf and a
              raw `%s` for b.Markdown. `%s` escapes nothing, so a Note containing a closing pre tag
              followed by a script tag leaves the block and executes in the browser of whoever opens
              the URL. The endpoint is public and unauthenticated.

              The author and the publisher are the same person, so this is not third-party injection.
              The exposure is to WHOEVER THE REVIEWER HANDS THE URL TO - and a Note is free text that
              may be pasted out of the page being reviewed, which is precisely where a hostile string
              would come from.

              Escape the slug too. It is a 160-bit CSPRNG value today, and that is a property of the
              generator rather than of this render; a renderer that is only safe because of what its
              caller happens to pass is one refactor away from not being safe.

              WHY NO TEST CAUGHT IT - the route tests assert the NFR-15 identical-404 and the
              response codes. Nothing asserts what the HTML BODY does with hostile content. Note also
              that no workflow touched Go at all until 2026-08-23, so this shipped into a container CI
              never built. A `web-service` job exists now, which is regression protection and not a
              fix.
            tests:
              - go::a_note_containing_markup_is_escaped_in_the_rendered_page
              - go::a_note_that_closes_the_pre_block_cannot_reach_the_browser_as_markup
              - go::the_slug_is_escaped_in_the_rendered_page
              - go::an_unknown_slug_still_returns_the_identical_refusal
          - id: W7-S3
            title: Never hand an agent an error with no message in it
            component: agent-access
            satisfies: []
            depends_on: [W7-S2]
            touches: [mcp-bridge]
            spec_folder: _bmad-output/specs/w7-failure-paths/
            why: |
              BUG-10, low, contradicting AD-7 and BR-17. Last because it is genuinely the smallest,
              and it is in the wave because it is the third instance of one habit - fixing two of
              three leaves the pattern alive.

              crates/snapdown-bridge/src/client.rs:155-163 - parse_error_response reads the body with
              `let _ =`. If that read fails, `body` stays empty, the envelope parse fails, and the
              empty string is returned as the error message. The caller wraps it in Err() and the MCP
              tool surfaces an error with nothing in it.

              AD-7 exists so that ONE error envelope crosses every process boundary, and BR-17 says a
              refusal is always distinguishable from an empty result. An error whose message is the
              empty string is a refusal that says nothing: the agent learns only that something
              failed.

              Honestly low - this is the error path of a call that has ALREADY failed, so it needs a
              second failure to reach. The likely readings are a dropped connection mid-error-body or
              a non-UTF-8 body. Neither is common and neither loses data. On a failed read, say so:
              the status code plus that the error body could not be read.
            tests:
              - cargo::a_failed_error_body_read_never_yields_an_empty_message
              - cargo::the_status_code_survives_a_failed_error_body_read
              - cargo::a_readable_error_envelope_is_still_parsed_as_before

  - id: W8
    title: Capture becomes real
    # Corrected 2026-09-04 by wdi-autopilot: this row read `status: open` while all six stories below
    # (W8-S1 through W8-S6) carry their own merge commits in git history - the last, `1e84c86` "Merge
    # W8-S6: FR-8 is met end to end, and the burn is reachable", closed the wave in substance without
    # this row ever being updated. crates/snapdown-capture exists, generate_placeholder_image is gone,
    # and burn_markers/reduce_image no longer write fake headers - verified against code, not assumed.
    status: closed
    release: r3
    prd: [capture-to-markdown]
    fr: [FR-1, FR-2, FR-4, FR-8]
    components: [finding]
    size: L
    depends_on: [W7]
    spec_folder: _bmad-output/specs/w8-capture-becomes-real/
    opened: "2026-08-24"
    scope: >-
      BUG-14, critical: Snapdown does not take screenshots. Three separate functions write a
      seventeen-byte fake PNG header and call it an image, and a fourth promise - the Note at capture
      time - was never built at all.

      THIS IS NOT A DESIGN GAP. ARCHITECTURE-SPINE.md:245 already lays out a `snapdown-capture` crate
      and assigns CAP-1 and CAP-2 to it; components.yaml already registers LC-002 region-capturer,
      LC-003 image-reducer, LC-012 marker-burner and LC-029 capture-note-field. Every one of those is
      a design that was written and never built. The crate does not exist; `crates/` holds only
      snapdown-bridge, snapdown-core and snapdown-store. The wave builds what the architecture
      already decided, where it already said to put it.

      WHY IT SURVIVED FIVE WAVES AND THREE AUDITS: nothing ever decoded an image. Every test in this
      repository asserts DIMENSIONS, and a fake header carries correct dimensions. That is also why
      the expensive half of this wave is the test surface rather than the three implementations -
      writing a real capture path is ordinary work; converting a suite that measures dimensions into
      one that measures images, without landing on assertions that cannot fail, is the part that
      needs care. This project has landed that mistake three times, most recently in W7 where one
      test still passed with its own defect reinstated.

      THE DIMENSION ARITHMETIC ALREADY WRITTEN IS CORRECT AND MUST BE KEPT.
      compute_reduced_dimensions_for_pair, the Auto resolution W6-S4 built, and the fixed presets are
      right. They are the only part of this that works, and they are what the new code plugs into.
    known_gaps:
      - "This wave adds the first third-party dependencies since the workspace was created - a screen
         capture crate and an image codec. Both are unavoidable: neither capability can be written
         from scratch responsibly. The choice of crate is a decision the first story makes and
         records, not one this registry pre-empts."
      - "NFR-1 (overlay visible within 200 ms with three monitors attached) and NFR-2 (saving returns
         focus within 500 ms, reduction not blocking) become measurable for the first time once
         capture is real. Neither is scheduled here: they need an instrument this project does not
         have, and OQ-24 records that its UI verification has failed four times out of four. Named so
         the absence is a decision."
    epics:
      - id: EP-capture
        component: finding
        title: The picture becomes a picture
        stories:
          - id: W8-S1
            title: The snapdown-capture crate, and a real grab of the requested region
            component: finding
            satisfies: [UC-2]
            depends_on: []
            touches: [capture-pipeline, image-encoding]
            spec_folder: _bmad-output/specs/w8-capture-becomes-real/
            why: |
              First, because the other two implementations are useless without it - there is nothing
              to scale and nothing to draw on until a real grab exists.

              apps/desktop/src-tauri/src/commands/capture.rs:197 generate_placeholder_image writes
              SEVENTEEN BYTES: the PNG signature, the width, the height, and the encoder quality. No
              IHDR, no IDAT, no IEND. It is not a PNG; it is a label that says PNG.

              The crate goes where the spine already put it. ARCHITECTURE-SPINE.md:245 -
              `snapdown-capture/  # screen capture, overlay geometry, image reduction` - with CAP-1
              and CAP-2 assigned to it. Building it there costs nothing extra and closes the gap
              between the document and the tree. LC-002 region-capturer is already registered against
              area capture-pipeline with no implementation.

              THE CRATE CHOICE IS THIS STORY'S DECISION AND MUST BE RECORDED. It is the first
              third-party dependency added since the workspace was created.
            tests:
              - cargo::a_captured_region_decodes_as_a_real_image
              - cargo::a_captured_region_has_the_dimensions_that_were_requested
              - cargo::a_captured_image_is_not_uniformly_one_colour
              - cargo::a_region_larger_than_the_monitor_is_refused_not_clamped_silently
          - id: W8-S2
            title: A real decode, scale and encode, keeping the arithmetic that already works
            component: finding
            satisfies: []
            depends_on: [W8-S1]
            touches: [image-encoding]
            spec_folder: _bmad-output/specs/w8-capture-becomes-real/
            why: |
              crates/snapdown-store/src/image/pipeline.rs:26-37. reduce_image writes the same fake
              header and then copies input_bytes[16..] through unchanged. Its own comment says
              "downscaled payload simulation" - it was never meant to be mistaken for real, and it
              was.

              So NO IMAGE HAS EVER BEEN REDUCED. FR-4 promises every captured image is reduced
              automatically and NFR-3 promises every stored image fits the Quality Budget's long
              edge. Both have been reported as met since W2 on the strength of a number in a fake
              header.

              KEEP compute_reduced_dimensions_for_pair, the Auto resolution from W6-S4, and the fixed
              presets exactly as they are. They are correct. This story replaces the bytes between
              them, not the arithmetic.

              The thumbnail path is the same lie twice: it writes a second fake header with thumbnail
              dimensions.
            tests:
              - cargo::a_reduced_image_decodes_and_its_pixels_are_the_scaled_source
              - cargo::a_reduced_image_honours_the_resolved_long_edge
              - cargo::an_image_already_under_the_long_edge_is_not_upscaled
              - cargo::a_thumbnail_decodes_and_is_smaller_than_its_source
              - cargo::the_resolved_pair_arithmetic_is_unchanged_by_this_story
          - id: W8-S3
            title: Markers drawn onto the image, not described beside it
            component: bundle
            satisfies: []
            depends_on: [W8-S2]
            touches: [image-encoding, marker-canvas]
            spec_folder: _bmad-output/specs/w8-capture-becomes-real/
            why: |
              crates/snapdown-store/src/image/burner.rs:20. burn_markers writes the same fake header,
              appends marker ordinals and pixel coordinates as raw bytes, and NEVER DRAWS ANYTHING.
              Its test asserts only that the first eight bytes are a PNG signature and that the
              dimensions are preserved.

              This is the third simulation and it was found while writing the assessment, not when
              BUG-14 was registered - which is itself the lesson: nobody had decoded an image, so
              nobody found the third one either.

              FR-8's promise is that a handed-over Bundle carries its Markers ON THE IMAGE. AD-4
              governs the burn - an image is reduced exactly once, at capture, and no original is
              kept - so the burn happens on the already-reduced bytes and MUST NOT re-reduce them.

              SCN-04's asymmetry binds what gets drawn: a Marker with no Note line is reported in the
              note pane and NEVER annotated on the image. An app-only state must not be burned into an
              artifact that is read on another machine under another theme.
            tests:
              - cargo::a_burned_image_decodes_and_differs_from_its_source_in_pixels
              - cargo::a_burned_marker_changes_pixels_at_its_own_coordinates
              - cargo::a_burned_image_keeps_the_dimensions_of_its_source
              - cargo::a_marker_with_no_note_line_is_never_drawn_on_the_image
              - cargo::burning_no_markers_returns_the_source_bytes_unchanged
          - id: W8-S4
            title: The Note at capture time — the second half of UC-1
            component: finding
            satisfies: [UC-1]
            depends_on: [W8-S3]
            touches: [capture-pipeline, editor-ui]
            spec_folder: _bmad-output/specs/w8-capture-becomes-real/
            why: |
              BUG-18, registered 2026-08-24 while surveying the capture path for this wave.

              CaptureOverlay.tsx:76-100 measures the region on mouse-up and calls captureScreenRegion
              IMMEDIATELY. A grep for `note` across that file returns ZERO hits, and
              CaptureRegionInput in capture.rs:13-19 has no `note` field, so the command could not
              receive one even if the overlay asked.

              FR-2 - "Write the Note at capture time" - is entirely unmet, and UC-1 reads "I press a
              key, box the thing that is wrong, AND SAY WHAT IS WRONG WITH IT". The second half does
              not exist. LC-029 capture-note-field is registered with no implementation and
              inventory.py has been reporting it UNREAD.

              It matters more than a missing input usually would: BG-1, the goal the product is built
              on, is that a note is unambiguously attached to the image it describes. A Finding with
              no Note is an image with nothing said about it.

              W6 saw this and deferred it correctly as a known_gap - "the capture path is not in this
              wave's scope". It belongs to this wave, which is that path.
            tests:
              - vitest::the_overlay_asks_for_a_note_before_it_writes_a_finding
              - vitest::enter_saves_the_note_with_the_finding
              - vitest::esc_cancels_the_capture_and_writes_no_finding
              - cargo::a_capture_carries_its_note_through_to_the_stored_finding
          - id: W8-S5
            title: The golden test stops proving byte-identity of a fabrication
            component: bundle
            satisfies: []
            depends_on: [W8-S4]
            touches: [image-encoding, bundle-render]
            spec_folder: _bmad-output/specs/w8-capture-becomes-real/
            why: |
              THE EXPENSIVE HALF OF THIS WAVE, and the reason it is a story rather than a chore
              folded into the other four.

              Every test in this repository asserts DIMENSIONS, never pixels, so a fake PNG passes
              all of them. When real bytes arrive a large number of assertions become wrong or
              meaningless - and the dangerous outcome is not that they fail. It is that they KEEP
              PASSING while proving nothing.

              test_golden_markdown.rs is the sharpest case. AD-9 promises a Bundle copies the SAME
              BYTES, and a golden test over fabricated bytes proves byte-identity of a fabrication.
              The golden file has to be regenerated from real output and the test has to be shown to
              fail when the bytes change.

              Files asserting on image bytes or dimensions today, all of which need reading:
                core/src/domain/{finding,image,markdown,setting}.rs
                core/tests/test_markdown_serializer.rs
                store/src/image/{burner,pipeline}.rs
                store/src/sqlite/{finding_store,migrations,settings_store}.rs
                store/src/vault/sweeper.rs
                store/tests/{test_bundle_deletion,test_golden_markdown,test_image_reduction,
                             test_orphan_sweeper}.rs

              MUTATION IS THE ACCEPTANCE CRITERION HERE, not a nicety. W7 proved why: a test that
              read correctly and asserted the right-sounding thing still passed with its own defect
              reinstated, and only mutation revealed it.
            tests:
              - cargo::the_golden_bundle_markdown_is_regenerated_from_real_image_output
              - cargo::a_bundle_copies_the_same_bytes_as_the_finding_it_came_from
              - cargo::changing_one_pixel_of_a_source_image_changes_the_bundle_copy
              # RENAMED 2026-08-24 by the coordinator, adjudicating W8-S5's planning report.
              # The original name was `no_image_test_asserts_only_a_signature_and_a_dimension`.
              # It cannot be written as an honest cargo test: its only mechanical form scans the
              # test sources for a magic-byte comparison, so its subject is source text and it
              # asserts a copy of its own input - the exact failure this story exists to clean up.
              # It is also blind to the real defect, which is the ABSENCE OF A DECODE rather than
              # the presence of a signature check, and it passes by construction the moment the
              # offending line is deleted. The replacement is a positive obligation over all three
              # image producers, and it is mutation-sensitive against production code. The
              # prohibition survives as a pitfall line in AGENTS.md instead.
              - cargo::every_image_producing_path_decodes_its_own_output
          - id: W8-S6
            title: The burn is actually called, and the recorded path holds a file
            component: bundle
            satisfies: []
            depends_on: [W8-S5]
            touches: [image-encoding, bundle-render]
            spec_folder: _bmad-output/specs/w8-capture-becomes-real/
            why: |
              BUG-19, found 2026-08-24 while writing the W8-S5 brief - by reading the export path
              rather than the register.

              bundle.rs:41-48 records `bundles/{id}/finding_{pos}_burned.webp` for every item and
              NOTHING EVER WRITES THAT FILE. A repo-wide grep for MarkerBurner outside its own file
              and tests returns two hits and both are re-exports, so the burn W8-S3 built is
              unreachable from the running application.

              THIS IS THE FIFTH TIME THIS SHAPE HAS LANDED - after BUG-4, BUG-5, BUG-6 and the
              EmptyState sweep. A unit built, unit-tested, and mounted nowhere. W8-S3's five tests
              are green and honest; they prove the burner draws correctly and cannot prove anybody
              calls it.

              It is worse than its predecessors in one way: the caller writes a path that IMPLIES
              the call happened, so a dangling reference reads as a bug in whoever reads it.

              The story is opened separately rather than folded into W8-S5 because S5 converts a
              test surface and this wires a call - different work, different failure modes, and
              folding them would let one hide behind the other.
            tests:
              - cargo::a_bundle_item_image_path_holds_a_file_that_decodes
              - cargo::an_exported_bundle_image_carries_the_markers_of_its_finding
              - cargo::a_bundle_export_does_not_re_reduce_the_stored_image
              # ADDED 2026-08-24 by the coordinator, adjudicating W8-S6's planning report.
              # The three tests above ALL PASS with BUG-20 present, so the story could close with a
              # corrupt blob still reported as success. BUG-20 is scheduled to this story, so it
              # needs a name here - a story does not edit a registry.
              # The fixture MUST be a valid PNG header with a corrupt payload: W7 proved garbage
              # bytes never reach such a path, the decoder rejects them at its front door.
              - cargo::a_corrupt_source_is_refused_even_when_no_marker_is_drawn
              # ADDED 2026-08-24, same adjudication, for BUG-21. The W8-S6 planner traced FR-8 end to
              # end instead of to the file write and found the promise breaks TWICE: markdown.rs:30
              # references item.finding.image_path - the Finding's clean image - and never reads
              # BundleItem.image_path. Writing the burned file without referencing it leaves FR-8
              # unmet, which is the green-test-beside-unmet-requirement failure this wave exists to
              # end. Two goldens W8-S5 pinned will move; that is correct, they were pinned against
              # the wrong reference.
              - cargo::the_composed_markdown_references_the_bundles_burned_copy
