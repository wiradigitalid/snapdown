# index.yaml — the control map
#
# Holds what has no home in another registry: product identity, global depth, roles, gate time
# budgets, the open-question budget, and the `touches` vocabulary.

# PRODUCT IDENTITY. The one structured place for it. Filled at G1.
# constitution.md Article 1 and the brief's title quote this value — they MUST NOT become a second source.
product:
  name: "Snapdown"
  client: "Wira Digital Indonesia"

policy:
  doc_language: "English"
  doc_filename_language: "English"

# GLOBAL DEPTH. The only document-depth knob, and it MUST NOT also govern review intensity —
# that is `risk_accepted` per component in components.yaml.
#   catalog  UC list + three inventories + C4; zero extra files per component. G4 is skipped
#   outline  + full flows for at most 3 UC, local business rules, Decision Summary, LC list
#   guarded  + Failure Behaviour for every boundary, Inherited Constraints, integration documents
#   deep     + ABCE, a contract spec per endpoint, data dictionary, flow, state machine, scenarios
# Defaults to `catalog` when this line is absent. A component's own row in components.yaml WINS over this.
# There is no third scope: `mode` MUST NOT be overridden per wave or per SPEC.md.
#
# 2026-08-31, twice on the owner's instruction. First `outline` -> `guarded` with every per-component
# override removed; then `guarded` -> `outline` with per-component values set again, three of five
# differing. `settings` and `agent-access` inherit this line; `finding`, `bundle` and `sharing` override
# it to `guarded`, and only those three carry a `mode` row, per this registry's rule that `mode` is
# written ONLY where it must differ from global.
# Lowering `mode` deletes no file - what was written at `deep` stays and simply stops being required.
mode: outline

# GATES ALREADY PASSED. Written only by the repo owner's own decision at their own gate, and MUST NOT
# be filled by an agent to clear its own way forward.
gates_passed: [G1, G2, G3, G4]
# G1 through G4 RE-RUN on 2026-08-23 at greater depth, on the owner's instruction after their first
# sustained use of the shipped r1/r2 product produced a list of experience defects rather than missing
# features. G1 gained BG-7; G2 gained CAP-9, FR-27..FR-29, NFR-16..NFR-18 and a rewritten FR-5; the UX
# gate ran for the first time in this product's life; G3 was reopened over the delta; G4 ran at `deep`
# for `finding`, `bundle`, and — for the first time ever — `settings`.
# Filled 2026-08-22. The repo owner authorised, in writing and in advance, the agent to write and
# approve G1 through G5 in one pass without further questions. That authorisation is what stands in
# for the owner's presence at each gate, and it is recorded here rather than assumed — the rule this
# line otherwise breaks exists to stop an agent clearing its own way forward unasked.

roles: []
  # - role: Product Owner
  #   files: []

gates:
  G1: { name: Problem,   stage: 1, budget_minutes: 20 }
  G2: { name: Product,   stage: 2, budget_minutes: 45 }
  G3: { name: Blueprint, stage: 3, budget_minutes: 45 }
  G4: { name: Component, stage: 4, budget_minutes: 30 }
  G5: { name: Release,   stage: 5, budget_minutes: 10 }

question_budget:
  blocking_per_component: 3
  assumptions_per_gate: 15

wave_sizes:
  S: { stories: "<=3", note: "no new FR; G4 and G5 merge into one 20-minute session" }
  M: { stories: "4-12", note: "as usual" }
  L: { stories: ">12",  note: "or a new container; a retrospective runs" }

touches_vocabulary:
  - capture-pipeline      # hotkey registration, overlay windows, region selection
  - image-encoding        # downscale, re-encode, quality budget
  - vault-fs              # the screenshot folder on disk, file create and delete
  - local-db              # the SQLite store and its migrations
  - editor-ui             # the Snapdown Editor window
  - marker-canvas         # numbered markers drawn over an image
  - bundle-render         # Markdown composition
  - local-api             # the loopback HTTP API and its token
  - mcp-bridge            # the stdio MCP binary
  - publish-client        # the desktop side of web publishing
  - web-service           # the Go + chi service that serves published bundles. It was written here
                          # as "the Axum service" until 2026-08-23 - a leftover from before the
                          # language was settled. Nothing read it, which is why it survived.
  - settings-store        # persisted preferences, autostart registration
  - build-tooling         # how the desktop application is actually built and packaged. Added
                          # 2026-08-23 for BUG-11: the vocabulary had no word for it, which is a
                          # fair reflection of the fact that nobody owned it.
