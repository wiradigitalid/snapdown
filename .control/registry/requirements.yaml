# requirements.yaml — SSOT for BG · CAP · FR · NFR · UJ
#
# Keys are English; prose values follow the product's chosen `doc_language`.
# Numbers are allocated FROM HERE and MUST NOT restart per document, per component, or per release.
# The sequence is global to one product.

goals:
  - id: BG-1
    title: A note is unambiguously attached to the image it describes
    measure: Zero notes attached to the wrong image, on every handoff
  - id: BG-2
    title: Capture to handoff happens in one pass, with no file management
    measure: Median handoff time for a five-Finding review under 120 seconds
  - id: BG-3
    title: A handoff costs as few agent tokens as it can while staying legible
    measure: Stored bytes per Finding a small fraction of the unreduced capture, at a quality the
      Reviewer does not override
  - id: BG-4
    title: The same review reaches an agent that is not on the capture machine
    measure: Every published Bundle is fetchable by the remote agent on the first try
  - id: BG-5
    title: A review is disposable — findings and their files leave together
    measure: Zero files in the Vault that nothing points at, and zero records pointing at a file
      that is gone
  - id: BG-6
    title: The tool never becomes the thing being managed
    measure: Cold start to a usable tray icon under 3 seconds, and no setting touched after the
      first run
  - id: BG-7
    title: Snapdown's own surface costs the Reviewer no attention
    measure: A Reviewer who has never seen Snapdown reaches their first handed-over Bundle without
      being told how; every text element meets WCAG AA contrast in both Windows themes; no primary
      surface requires scrolling to discover that a control exists
  # BG-8 born 2026-09-01, closing OQ-31. CAP-12 (Export PDF) hung off BG-2 and the misfit was recorded
  # as known: BG-2's measure is a handoff TIME, which cannot report on an exporter, and BG-2 promises
  # "no file management" while an export exists precisely to produce a file a person manages - so the
  # capability was serving a goal whose own words it contradicts. Stretching that phrase to admit an
  # exporter would have weakened a promise the product holds elsewhere. A different audience earns its
  # own goal. NOT numbered BG-6: that id has been taken since G1, and so has BG-7 - the OQ-31 row said
  # "a sixth goal" and was already wrong when written, which is recorded in answered.md.
  - id: BG-8
    title: A review is readable by someone who does not have Snapdown
    measure: Zero Findings lost, reordered, or stripped of their image or note between a Bundle's
      stored Markdown and the document exported from it

capabilities:
  - id: CAP-1
    title: Capture a screen region with a Note, from a hotkey
    goal: BG-2
    component: finding
    target_release: r1
    prd: capture-to-markdown
  - id: CAP-2
    title: Reduce every captured image under a budget the Reviewer sets
    goal: BG-3
    component: finding
    target_release: r1
    prd: capture-to-markdown
  - id: CAP-3
    title: Hold Findings with their Notes and Markers, and work on them in the Editor
    goal: BG-1
    component: finding
    target_release: r1
    prd: capture-to-markdown
  - id: CAP-4
    title: Compose selected Findings into a named Markdown Bundle
    goal: BG-1
    component: bundle
    target_release: r1
    prd: capture-to-markdown
    depends_on: [CAP-3]
  - id: CAP-5
    title: Remove a Finding together with its file, and know when something is orphaned
    goal: BG-5
    component: finding
    target_release: r1
    prd: capture-to-markdown
  - id: CAP-6
    title: Keep the tool out of the way — folder, hotkeys, startup
    goal: BG-6
    component: settings
    target_release: r1
    prd: capture-to-markdown
  - id: CAP-7
    title: Let an agent on this machine read a Bundle, after the Reviewer hands it a key
    goal: BG-2
    component: agent-access
    target_release: r2
    prd: agent-handoff
    depends_on: [CAP-4]
  - id: CAP-8
    title: Let an agent on another host read a Bundle over HTTPS
    goal: BG-4
    component: sharing
    target_release: r2
    prd: agent-handoff
    depends_on: [CAP-4]
  - id: CAP-9
    title: The surface itself — name it, reach it, fit it, read it
    goal: BG-7
    component: settings
    target_release: r3
    prd: capture-to-markdown
  - id: CAP-10
    title: Precision crosshair guides, magnifying loupe, and intelligent window/panel auto-detection
    goal: BG-7
    component: finding
    target_release: r3
    prd: capture-to-markdown
  - id: CAP-11
    title: Rich visual canvas annotations and privacy redactions
    goal: BG-1
    component: finding
    target_release: r3
    prd: capture-to-markdown

  # CAP-12 born 2026-08-31. Export is deliberately NOT folded into CAP-4. That capability reads
  # "into a named Markdown Bundle" and names Markdown on purpose, because AD-9 is built on it;
  # widening CAP-4 would blur exactly the distinction the clipboard path was disputing.
  #
  # This comment said "AD-9's one-set-of-bytes invariant" until 2026-08-31, when wdi-review caught it.
  # DEC-012 retired that reading the same day: AD-9 guarantees one authored DOCUMENT, not one set of
  # bytes. The point the comment was making survives - CAP-4 names Markdown on purpose - and the
  # reason it gave for the point did not.
  #
  # OQ-34 is open against this capability and matters more than the naming: AD-9 forbids a surface
  # re-rendering a Bundle on the way out, and a PDF is a re-rendering. Whether AD-9 reaches a
  # human-only artifact at all is unsettled, and FR-39 MUST NOT be specced before it is.
  - id: CAP-12
    title: Render a composed Bundle as a document a person reads away from Snapdown
    # `goal:` was BG-2 from this capability's birth on 2026-08-31 until 2026-09-01, under a comment
    # that admitted the fit was KNOWN TO BE IMPERFECT and pointed at OQ-31. The owner answered OQ-31
    # by birthing BG-8 rather than amending BG-2's measure, and BG-8 is this capability's own goal.
    goal: BG-8
    component: bundle
    target_release: r3
    prd: capture-to-markdown
    depends_on: [CAP-4]

functional:
  # --- CAP-1 & CAP-10 Capture --------------------------------------------------------
  - id: FR-1
    title: Capture a screen region from a global hotkey with precision guides and auto-detection
    capability: CAP-1
    component: finding
    writes: [Finding]
    proof: From a maximised third-party window, pressing the hotkey dims all screens, shows full-screen
      crosshair guides and pixel loupe, auto-detects window/panel boundaries with dynamic cutout preview,
      and allows 1-click container selection or drag selection.
  - id: FR-2
    title: Write the Note at capture time
    capability: CAP-1
    component: finding
    writes: [Finding, Note]
    proof: A Finding saved this way shows, in the Editor, exactly the text that was typed at capture
      time against exactly the region that was dragged.
  - id: FR-3
    title: Capture repeatedly without leaving the loop
    capability: CAP-1
    component: finding
    writes: [Finding]
    proof: Six Captures in succession, each started by the hotkey from the application under review,
      produce six Findings, and at no point does a Snapdown window need to be closed or dismissed.
  # --- CAP-2 Image reduction ---------------------------------------------------------
  - id: FR-4
    title: Reduce every captured image automatically
    capability: CAP-2
    component: finding
    writes: [Finding]
    no_uc: Reduction has no actor and no initiating step. It is a property of UC-1 and UC-2 rather
      than a use case of its own, and it is asserted by NFR-3 rather than by a flow.
    proof: A capture of a full 4K screen is stored as a file whose long edge matches the configured
      maximum and whose size is a small fraction of the unreduced capture, and it is still legible
      enough to read the UI text in it.
  - id: FR-5
    title: Choose a Quality Budget by naming the intent
    capability: CAP-2
    component: settings
    writes: [Setting]
    proof: A Reviewer who has never opened Advanced gets a legible, small stored image from both a
      300x120 tooltip capture and a full 4K screen capture, and Settings can state in one word which
      budget produced each.
  # --- CAP-3 Library and Editor ------------------------------------------------------
  - id: FR-6
    title: See every Finding with its Note
    capability: CAP-3
    component: finding
    proof: After six Captures, the Editor lists exactly those six Findings with the six Notes that
      were typed, each against the right image.
  - id: FR-7
    title: Edit a Note
    capability: CAP-3
    component: finding
    writes: [Note]
    proof: Editing a Note, closing the Editor, and reopening it shows the edited text.
  - id: FR-8
    title: Place numbered Markers bound to numbered Note lines
    capability: CAP-3
    component: finding
    writes: [Marker, Note]
    proof: Placing three Markers on one image produces lines 1., 2., and 3. in that Finding's Note,
      and the badge numbers on the image match the line numbers exactly.
  - id: FR-9
    title: Select several Findings at once
    capability: CAP-3
    component: finding
    proof: Selecting four of eleven Findings and choosing an action applies it to exactly those four.
  # --- CAP-4 Bundles -----------------------------------------------------------------
  - id: FR-10
    title: Compose selected Findings into a named Bundle
    capability: CAP-4
    component: bundle
    writes: [Bundle, BundleItem]
    proof: Composing five selected Findings under a chosen name produces one Markdown file where the
      five Notes appear under their own five images, in the order the Reviewer selected.
  - id: FR-11
    title: List and reopen Bundles
    capability: CAP-4
    component: bundle
    proof: After composing two Bundles, both appear in the Bundle list with the right names and
      counts, and opening either shows the Findings it holds.
  - id: FR-12
    title: Copy a Bundle's Markdown
    capability: CAP-4
    component: bundle
    # Amended 2026-08-31. This row's proof used to end "yields the Bundle's complete Markdown,
    # unchanged", and prd.md carried the consequence "the image references in the copied text are
    # the same relative paths as in the file". Together those fixed the clipboard to relative links,
    # which resolve for no reader outside the Bundle's own folder. The clipboard MAY now render
    # image links as absolute paths.
    # Deliberately NOT settled here, and still open on the Bundle Library map's ticket 03: which
    # encoding is emitted, whether the Reviewer is told images do not travel on a text clipboard,
    # and whether `Open file location` is thereby redundant.
    # This amendment RESTS ON the reading that a composer taking a base-path parameter satisfies
    # AD-9 rather than contradicting it. If that reading fails, AD-9 is contradicted and a DEC- is
    # mandatory. Owed to wdi-decision; not assumed silently.
    # Encoding settled 2026-08-31 by TEST, not argument: forward slashes wrapped in `<>`. Six forms
    # were run through a CommonMark reference implementation over three real Vault paths - one with a
    # space, one with a space and parentheses, one with a space and an apostrophe. Raw backslashes and
    # bare forward slashes produce no image at all. Percent-encoding also works but obliges the
    # consumer to decode. BOTH `file:///` forms fail, and not on syntax - their syntax is valid,
    # verified by re-running with the renderer's link validator disabled - but on markdown-it's default
    # security blocklist for the `file:` scheme, which a consumer cannot turn off. `<>` wins because a
    # conforming parser strips the brackets and hands the consumer the path with its space intact,
    # needing no step on the other side.
    proof: Copying a Bundle and pasting into a plain text editor yields the Bundle's complete
      document, with every image link naming a location the reader of the pasted text can open, and
      the Reviewer is told that what was copied carries absolute image paths.
  - id: FR-14
    title: Delete a Bundle with its images
    capability: CAP-4
    component: bundle
    writes: [Bundle, BundleItem, Publication]
    defers_to: [FR-25]
    # Amended 2026-08-31. prd.md carried the consequence "The Reviewer can choose, in the same
    # confirmation, to delete the Bundle's source Findings too". That is removed: destroying a
    # Bundle and destroying its originals are now two deliberate acts, because one click is the
    # wrong price for the most destructive operation in this product. FR-41 carries the other half.
    # The removed consequence also claimed a `Finding` write this row never authorised - `bundle`
    # owns only [Bundle, BundleItem] - so the prose had been promising past its own boundary.
    proof: Deleting a Bundle removes it from the Bundle list and leaves neither its Markdown nor its
      images in the Vault folder.
  - id: FR-43
    title: Open a Bundle's folder in the file manager
    capability: CAP-4
    component: bundle
    writes: []
    # Born 2026-08-31, and deliberately the thinnest promise in this registry. Ticket 01 of the Bundle
    # Library map had already put this action on the Library row while nothing promised it, which the
    # map's own rule forbids: an unbacked button repeats the mistake of the toolbar's fake 1-6 shortcut
    # badges. `/to-spec` must cite every requirement by id, so a row action with no `FR-` cannot be
    # specced at all.
    no_uc: The Reviewer does not open Snapdown to look at a folder. This is a power user's way out to
      the filesystem, and the owner's decision of 2026-08-31 was that WHY someone reaches for it is
      deliberately not traced - so writing a use case here would be inventing a goal nobody stated.
      The thin promise exists to record that the affordance is intentional AND intentionally
      unexplained; without it the next reader takes it for a button somebody forgot to delete.
    proof: Choosing it on a Bundle's row opens that Bundle's own folder in the operating system's file
      manager, with the Bundle's Markdown and its images visible in it.
  - id: FR-40
    title: Edit a composed Bundle's title and notes
    capability: CAP-4
    component: bundle
    writes: [Bundle]
    # BR-11 ("A Bundle is never edited in place. A change means composing a new Bundle", status
    # active) still forbids this requirement as written. BR-11 is a CROSS-COMPONENT rule, so
    # narrowing it to the handoff path is wdi-blueprint's act, not wdi-product's. G2 MUST NOT open
    # on this requirement until that amendment lands. BR-10 and BR-65 both stay true under it and
    # MUST NOT be amended: this path edits the Bundle's own stored copy and never reads a Finding.
    proof: Reopening a composed Bundle, changing its title and one of its notes, and saving produces
      a document whose heading and that note both read the new text, while its images and the
      Findings it was composed from are untouched.
  # --- CAP-5 Removal -----------------------------------------------------------------
  - id: FR-13
    title: Delete Findings, and their image files with them
    capability: CAP-5
    component: finding
    # `VisualAnnotation` added 2026-08-28: deleting a Finding cascades to its annotations, so this
    # requirement writes them too. The schema has done it since migration 8; the row had not caught up.
    writes: [Finding, Note, Marker, VisualAnnotation]
    proof: Deleting three Findings removes them from the Editor and leaves no trace of their three
      image files in the Vault folder.
  - id: FR-15
    title: Report orphans
    capability: CAP-5
    component: finding
    proof: After a file is deleted from the Vault outside Snapdown, the Reviewer is shown that the
      Finding is now broken and offered to delete the Finding.
  # FR-41 and FR-42 born 2026-08-31. Both are reached from a Bundle, and both sit under CAP-5 with
  # `component: finding` rather than under CAP-4 with `component: bundle`, because the act destroys
  # Findings and `bundle` owns only [Bundle, BundleItem]. Filing them under `bundle` would be the
  # exact collision V21 exists to catch. FR-14's `defers_to: [FR-25]` is the same problem solved the
  # other way round; either shape is legitimate, and this one is simpler.
  - id: FR-41
    title: Discard the source Findings behind a Bundle, keeping the Bundle
    capability: CAP-5
    component: finding
    writes: [Finding, Note, Marker, VisualAnnotation]
    # BR-59 ("Composing does not remove the Findings it used from the Library") stays TRUE and MUST
    # NOT be amended for this. It governs COMPOSING; this is a separate, later, explicit act.
    proof: Discarding the originals behind a Bundle leaves the Bundle readable with its own images
      while its source Findings and their image files are gone from the Library and the Vault, and
      the Bundle can no longer be disassembled.
  - id: FR-42
    title: See which Bundles still hold original captures, and reclaim their disk in bulk
    capability: CAP-5
    component: finding
    writes: [Finding, Note, Marker, VisualAnnotation]
    # The surface has no screen-registry entry yet. That is wdi-ux's slot, not this one.
    proof: The reclaim surface lists every Bundle still holding source Findings with the disk each
      one holds and a running total, and discarding a chosen set reduces the reported total by the
      sum of what was discarded.
  # --- CAP-6 Settings ----------------------------------------------------------------
  - id: FR-16
    title: Choose the Vault folder
    capability: CAP-6
    component: settings
    writes: [Setting]
    proof: Choosing a folder and taking a Capture puts the image file in that folder; choosing a
      different folder and taking another Capture puts the new image in the new folder.
  - id: FR-17
    title: Edit the hotkeys
    capability: CAP-6
    component: settings
    writes: [Setting]
    proof: Changing the Capture hotkey makes the new combination work and the old one stop working,
      without restarting Snapdown.
  - id: FR-18
    title: Run at Windows startup, on by default after first run
    capability: CAP-6
    component: settings
    writes: [Setting]
    proof: With the setting on, signing in to Windows leaves Snapdown running in the tray with its
      hotkeys registered; with it off, it does not start. After a first run nobody configured, it
      is on.
  # --- CAP-9 The surface itself -------------------------------------------------------
  - id: FR-27
    title: Name the surface the Reviewer is looking at
    capability: CAP-9
    component: settings
    writes: []
    proof: A Reviewer with the workspace window open and no prior knowledge can say what the
      application is called and which part of it they are in, from the window alone.
  - id: FR-28
    title: Reach every surface from every surface
    capability: CAP-9
    component: settings
    writes: []
    proof: From a cold open on any one surface, a Reviewer who has never used Snapdown reaches each
      of the other three without being told how.
  - id: FR-29
    title: A primary surface fits the window it opens in
    capability: CAP-9
    component: settings
    writes: []
    proof: At the window's minimum supported size, every control on every primary surface is either
      visible or visibly indicated; nothing is discovered only by scrolling.
  # --- CAP-11 Rich visual annotations ------------------------------------------------
  - id: FR-30
    title: Draw transparent outlined shapes and directional arrows on canvas
    capability: CAP-11
    component: finding
    writes: [Finding]
    proof: Selecting the shape tool and dragging creates a transparent rectangular box with an outline;
      selecting arrow tool and dragging creates a directional arrow with movable start and end handles.
      These elements can be moved, resized, and deleted, but do not produce lines in Markdown notes.
  - id: FR-31
    title: Draw blur redaction boxes over sensitive image regions
    capability: CAP-11
    component: finding
    writes: [Finding]
    proof: Selecting the blur tool and dragging over an area blurs the underlying screenshot pixels;
      the blur box can be moved, resized, and deleted; burnt image output contains redacted pixels.
  - id: FR-32
    title: Place floating text and callout bubbles with font and tail controls
    capability: CAP-11
    component: finding
    writes: [Finding]
    proof: Floating text elements and callout bubbles can be placed, their text content edited inline,
      font family and font size adjusted, callout tail pointer dragged to point at target spots, and
      remain excluded from the Markdown note lines.
  - id: FR-33
    title: Transform and manipulate canvas annotation elements with interactive handles
    capability: CAP-11
    component: finding
    writes: [Finding]
    proof: Clicking any visual annotation or marker displays its interactive control points (8-point
      resizing handles for boxes, start/end points for arrows, tail handle for callouts); pressing
      Delete or Backspace removes the active element.
  - id: FR-38
    title: Change the front-to-back order of canvas annotations
    capability: CAP-11
    component: finding
    writes: [Finding]
    no_uc: A property of the annotations already placed under UC-27, not a goal of its own. The
      Reviewer does not open Snapdown to reorder something; they reorder because a Callout landed on
      top of the Shape it was describing.
    proof: With two overlapping annotations, sending the upper one to the back puts the other in
      front of it on the canvas AND in the burned image; the four movements are reachable from the
      element's own panel and from its right-click menu.

  # --- Behaviours the owner asked for, promised after the fact (OQ-29) ----------------
  #
  # These four arrived as requests rather than as requirements, which is the wrong order and is
  # recorded as such. `OQ-29` opened when seven behaviours were asked for with no `FR-` anywhere;
  # three of the seven turned out not to need one. `undo`/`redo` was already promised inside FR-33's
  # consequences, and `crop` and destructive `resize` are NAMED NON-GOALS - see the note under
  # `## Not promised` at the foot of this file.
  - id: FR-34
    title: Zoom the canvas to inspect a capture at more or less than natural size
    capability: CAP-3
    component: finding
    writes: []
    no_uc: Zoom has no goal of its own. It is how the Reviewer looks at a Finding inside UC-2 and
      UC-27, and it stores nothing - a use case whose success condition is "the image is bigger on
      screen now" describes a control, not a reason to open the product.
    proof: The canvas can be zoomed in and out and returned to natural size; Markers and annotations
      stay on the pixels they were placed on at every zoom level, and nothing about the stored image
      changes.
  - id: FR-35
    title: Paste an image from the clipboard as a new Finding
    capability: CAP-1
    component: finding
    writes: [Finding]
    no_uc: A second entry point into UC-1, not a second use case. It replaces one step - where the
      pixels come from - and from the reduction onward the flow, the Finding and every failure it can
      hit are UC-1's own. Giving it a use case of its own would duplicate that flow and the two would
      drift. If pasting ever grows behaviour UC-1 does not have, that is when it earns one.
    proof: With an image on the Windows clipboard, Paste creates a Finding carrying those pixels,
      reduced under the same Quality Budget a Capture would use, and it appears in the filmstrip.
  - id: FR-36
    title: Copy a Finding's burned image to the clipboard
    capability: CAP-3
    component: finding
    writes: []
    no_uc: The one-Finding shortcut through UC-9's own door. The goal - hand this to an agent - is
      UC-9's, and this is that goal without a Bundle around it. It writes nothing, so there is no
      state for a flow to describe.
    proof: Copy puts the image on the clipboard WITH its Markers and annotations burned in - the same
      bytes a Bundle would carry - so pasting it into a chat shows what the Reviewer marked up.
  - id: FR-37
    title: Reach a canvas or filmstrip action from a right-click context menu
    capability: CAP-9
    component: finding
    writes: []
    no_uc: A second route to actions that already have use cases, and deliberately never a first one -
      the requirement itself forbids an entry with no other route. A use case here would be a copy of
      whichever one the Reviewer happened to reach through the menu.
    proof: Right-clicking the canvas offers the actions that apply to what is under the pointer, and
      right-clicking a filmstrip card offers that Finding's own; every entry does what the toolbar
      button of the same name does, and no entry exists that has no other route.

  # --- CAP-7 Local agent access ------------------------------------------------------
  - id: FR-19
    title: Issue and copy an Access Key
    capability: CAP-7
    component: agent-access
    writes: [AccessKey]
    proof: Clicking Copy access key puts a key on the clipboard, and an agent given that key can read
      the Library while an agent given no key cannot.
  - id: FR-20
    title: Serve the Library over the Local API
    capability: CAP-7
    component: agent-access
    proof: With a valid Access Key, a request from this machine returns a Bundle's Markdown; the same
      request without the key, or from another machine, is refused.
  - id: FR-21
    title: Read a Bundle through MCP
    capability: CAP-7
    component: agent-access
    proof: A coding agent with the Bridge configured and the key pasted can name the Findings in a
      Bundle and describe what is in their images, without the Reviewer pasting any content.
  - id: FR-22
    title: Revoke access
    capability: CAP-7
    component: agent-access
    writes: [AccessKey]
    proof: After a revoke, an agent that had been reading Bundles a moment earlier is refused on its
      next call.
  # --- CAP-8 Web sharing -------------------------------------------------------------
  - id: FR-23
    title: Publish a Bundle
    capability: CAP-8
    component: sharing
    writes: [Publication]
    proof: Publishing a Bundle yields a URL that, fetched from another machine, returns that Bundle's
      Markdown with working image links.
  - id: FR-24
    title: Serve a published Bundle
    capability: CAP-8
    component: sharing
    proof: A plain HTTP client given the URL retrieves the Markdown, and every image reference in it
      retrieves an image.
  - id: FR-25
    title: Unpublish a Bundle
    capability: CAP-8
    component: sharing
    writes: [Publication]
    proof: After unpublishing, fetching the previously working URL from another machine returns
      nothing, and the Bundle is still intact in the Library.
  - id: FR-26
    title: See and copy a Bundle's Publication
    capability: CAP-8
    component: sharing
    proof: The Bundle list distinguishes published from unpublished Bundles at a glance, and copying
      the URL of a published one puts a working URL on the clipboard.

  # --- CAP-12 Export -----------------------------------------------------------------
  - id: FR-39
    title: Export a Bundle as a PDF
    capability: CAP-12
    component: bundle
    writes: []
    # Implementation is deliberately absent from this row and from prd.md. Engine, licences, measured
    # disk and memory costs, escaping and tall-image handling are all established on the Bundle
    # Library map's ticket 07, and the packaging question is deferred to the Export PDF effort by
    # that ticket's own conclusion.
    proof: Exporting a Bundle produces one A4 PDF a person can read without Snapdown, in which each
      Finding appears as its own section with its image whole on a single page, the pages are
      numbered, and the text can be selected and searched rather than being a picture of text.

nonfunctional:
  - id: NFR-1
    title: The Capture Overlay is visible within 200 ms of the hotkey press, with three monitors
      attached
    goal: BG-2
    component: finding
    enforced_by: A timed test around overlay creation in the capture path
  - id: NFR-2
    title: Saving a Finding dismisses the overlay and returns focus within 500 ms, with image
      reduction not blocking that
    goal: BG-2
    component: finding
    enforced_by: A timed test around the save path, asserting reduction runs off it
  - id: NFR-3
    title: Every stored Finding image fits the Quality Budget's long edge, and the shipped default
      keeps a full-screen 4K capture under 250 KB
    goal: BG-3
    component: finding
    enforced_by: An assertion over the stored file in the image-reduction tests
  - id: NFR-4
    title: No part of the capture path performs a network call, and capture works with networking
      disabled
    goal: BG-2
    component: finding
    enforced_by: A test that runs the capture path with outbound calls failing and asserts none was
      attempted
  - id: NFR-5
    title: After any deletion the Vault holds no unreferenced file, and the Library points at no
      absent file
    goal: BG-5
    component: finding
    enforced_by: An invariant check in the deletion tests, plus the orphan report of FR-15
  - id: NFR-6
    title: Cold start reaches a usable tray icon with hotkeys registered within 3 seconds, and idles
      under 150 MB working set with the Editor closed
    goal: BG-6
    component: settings
    enforced_by: A startup timing test and a measured idle check
  - id: NFR-7
    title: Every hotkey and startup registration succeeds without administrator rights
    goal: BG-6
    component: settings
    enforced_by: Running the integration suite as a standard user
  - id: NFR-8
    title: A Bundle's Markdown renders in a plain CommonMark reader, with every image reference
      resolving relative to the Markdown file's own folder
    goal: BG-1
    component: bundle
    enforced_by: A rendering test over a composed Bundle
  - id: NFR-9
    title: The Local API binds 127.0.0.1 only and refuses every request without a currently valid
      Access Key, comparing keys in constant time
    goal: BG-4
    component: agent-access
    enforced_by: Tests attempting the interface from a non-loopback address and with absent, wrong,
      and revoked keys
  - id: NFR-10
    title: A Publication's URL slug carries at least 128 bits of entropy from a cryptographically
      secure source
    goal: BG-4
    component: sharing
    enforced_by: An assertion on slug generation
  - id: NFR-11
    title: No Finding, Note, or Bundle leaves this machine except through a publish the Reviewer
      confirmed on a named Bundle
    goal: BG-4
    component: sharing
    enforced_by: A test exercising capture, composition, and idle operation with outbound calls
      failing, asserting none was attempted
  - id: NFR-12
    title: Only reduced images are ever transmitted or published; an unreduced capture never leaves
      the machine
    goal: BG-3
    component: sharing
    enforced_by: An assertion on the publish payload
  - id: NFR-13
    title: A revoke and an unpublish each take effect on the next request, with no cache or grace
      period
    goal: BG-5
    component: sharing
    enforced_by: Tests calling immediately after each
  - id: NFR-14
    title: The web service runs as one executable with one configuration file, needs no database
      server, and its whole state is one directory
    goal: BG-6
    component: sharing
    enforced_by: An integration test starting it from a clean directory and serving a published
      Bundle
  - id: NFR-15
    title: The web service exposes no route that lists, searches, or enumerates Publications, and
      returns the same refusal for an unknown slug as for a revoked one
    goal: BG-4
    component: sharing
    enforced_by: A route-inventory test and a response-equality test
  - id: NFR-16
    title: Every text element meets WCAG AA contrast against its own background, in both the Windows
      light and the Windows dark theme
    goal: BG-7
    component: settings
    enforced_by: An automated contrast assertion run over every screen in both themes
  - id: NFR-17
    title: No colour is defined for only one theme; every surface renders correctly under either
      Windows theme and under a change of it while running
    goal: BG-7
    component: settings
    # `enforced_by` read "a lint rule refusing a literal colour outside the token file" until
    # 2026-09-01. That lint only ever covered `web/ui/src`, which was deleted under OQ-27, and it never
    # covered the Slint surfaces that are the whole shipped UI - which is how nine colour literals
    # accumulated across them undetected until DEC-009's study found them on 2026-08-27. The promise in
    # `title` is unchanged; only the mechanism named beneath it is corrected to the one that exists.
    enforced_by: Two Rust guards over `apps/desktop/ui/theme.slint`, the palette that actually ships -
      `test_theme_contrast.rs` measures WCAG contrast over every token in both themes, and
      `test_capture_interaction.rs` refuses a colour literal in the overlay
  - id: NFR-18
    title: The parameters Auto resolved for a Capture are stored with that Finding
    goal: BG-3
    component: finding
    enforced_by: An assertion that every stored Finding carries its resolved budget
  - id: NFR-19
    title: An exported PDF carries a real text layer, and no image in it is broken across a page
      boundary except by the deliberate slicing a very tall image requires
    # Corrected 2026-08-31, the same day it was written. It first read "and no image in it is split
    # across a page break", which forbade the one thing ticket 07's measured solution does: above
    # aspect 3 a screenshot is drawn at full text width and cut per page, embedded once. The
    # requirement contradicted the research it was written from. What it was protecting is the
    # ACCIDENTAL split - an image landing half on one page because it happened to fall near the
    # boundary - and that is still forbidden.
    goal: BG-2
    component: bundle
    # Asserting a `%PDF-` signature and a page count does NOT satisfy this. A fabricated header
    # passes that, which is the mistake a 17-byte fake PNG made for five waves in this repository
    # before test_nfr8_image_resolution.rs was written. The output has to be read back.
    enforced_by: A test that extracts the text out of the produced PDF and asserts the Notes it
      contains, plus a placement check read from the PDF's own image matrices

journeys:
  - id: UJ-1
    title: The Reviewer files five findings during one pass over a running app
    prd: capture-to-markdown
  - id: UJ-2
    title: The Reviewer points at three specific spots inside one screenshot
    prd: capture-to-markdown
  - id: UJ-3
    title: The Reviewer composes and hands over one Bundle
    prd: capture-to-markdown
  - id: UJ-4
    title: First run
    prd: capture-to-markdown
  - id: UJ-5
    title: The Reviewer hands a Bundle to the agent in the next window
    prd: agent-handoff
  - id: UJ-6
    title: The Reviewer hands a Bundle to an agent on a server
    prd: agent-handoff

# NOT PROMISED, and deliberately.
#
# Recorded here rather than in a defect row, because the next reader's question is "why is there no
# FR for crop" and the answer has to be findable from the requirements themselves.
#
# `crop` and user-controlled destructive `resize` of a stored capture were both asked for on
# 2026-08-28 and both are NAMED NON-GOALS in two places written earlier:
#
#   .what/finding/SRS-finding.md      "Editing captured pixels. No crop, rotate, or resize
#                                      after capture."
#   .what/_product-brief/brief.md     "Editing the captured pixels after the fact - crop, rotate,
#                                      resize."
#
# The corpus wins here and the code does not get written. Reversing it is a `DEC-`, not an `FR-`:
# the non-goal is load-bearing - `AD-9` promises a Bundle's copy is byte-identical to the Finding
# when nothing is drawn on it, and a destructive edit to the stored pixels is the one operation that
# cannot be taken back from a Vault with no second copy.
#
# The toolbar's Crop button therefore stays inert. It is a stub with a reason, not a gap.
