# usecases.yaml — SSOT for UC
#
# `critical: true` when the UC touches MONEY, PERSONAL DATA, or an IRREVERSIBLE ACTION.
# This label decides something ONLY at `mode: deep`.

usecases:
  # --- finding ----------------------------------------------------------------------
  - id: UC-1
    title: I press a key, use precision crosshair/loupe or 1-click window/panel auto-detect, and say what is wrong with it
    actor: Reviewer
    component: finding
    satisfies: [FR-1, FR-2]
    critical: false
  - id: UC-2
    title: I take five of these in a row without stopping
    actor: Reviewer
    component: finding
    satisfies: [FR-3]
    critical: false
  - id: UC-3
    title: I look at everything I have captured so far
    actor: Reviewer
    component: finding
    satisfies: [FR-6]
    critical: false
  - id: UC-4
    title: I reword a note now that I have read it back
    actor: Reviewer
    component: finding
    satisfies: [FR-7]
    critical: false
  - id: UC-5
    title: I point at three separate spots inside one screenshot
    actor: Reviewer
    component: finding
    satisfies: [FR-8]
    critical: false
  - id: UC-6
    title: I pick out several findings at once
    actor: Reviewer
    component: finding
    satisfies: [FR-9]
    critical: false
  - id: UC-7
    title: I throw away the findings I am done with
    actor: Reviewer
    component: finding
    satisfies: [FR-13]
    critical: true
  - id: UC-8
    title: I find out what has gone missing or been left behind
    actor: Reviewer
    component: finding
    satisfies: [FR-15]
    critical: false
  - id: UC-27
    title: I annotate a screenshot with visual shapes, arrows, callouts, text, or blur redaction
    actor: Reviewer
    component: finding
    satisfies: [FR-30, FR-31, FR-32, FR-33]
    critical: false
  # UC-30 and UC-31 born 2026-08-31. Both are reached from a Bundle and both belong to `finding`,
  # because what they destroy is a Finding and `bundle` owns only [Bundle, BundleItem].
  - id: UC-30
    title: I get rid of the screenshots behind a review I am finished with, but keep the review
    actor: Reviewer
    component: finding
    satisfies: [FR-41]
    critical: true
  - id: UC-31
    title: I find out which reviews are still holding my screenshots, and get that disk back
    actor: Reviewer
    component: finding
    satisfies: [FR-42]
    critical: true
  # --- bundle -----------------------------------------------------------------------
  - id: UC-9
    title: I turn the findings I picked into one review document
    actor: Reviewer
    component: bundle
    satisfies: [FR-10]
    critical: false
  - id: UC-10
    title: I look back at the reviews I have already put together
    actor: Reviewer
    component: bundle
    satisfies: [FR-11]
    critical: false
  - id: UC-11
    title: I drop a whole review straight into the conversation I am having with my agent
    actor: Reviewer
    component: bundle
    satisfies: [FR-12]
    critical: false
  - id: UC-12
    title: I get rid of a review and everything in it
    actor: Reviewer
    component: bundle
    # FR-44 added 2026-09-05, ticket 05 of `post-testing-polish` (wdi-autopilot mandate DEC-023):
    # the bulk form of FR-14, over several reviews at once from the reclaim-space surface - the
    # same intent this use case already names ("a review and everything in it"), just for more than
    # one review in a single act.
    satisfies: [FR-14, FR-44]
    critical: true
  # UC-28 and UC-29 born 2026-08-31. Neither is `critical`, and the derivation is stated because both
  # look like candidates. UC-28 writes a file but destroys nothing and sends nothing anywhere; its
  # closest sibling is UC-11, the clipboard handoff, which is also `false`. UC-29 overwrites stored
  # text with no revision history, which is irreversible in the same weak sense as UC-4, rewording a
  # Note - and UC-4 is `false`. Marking either one true would put three of six of this component's use
  # cases over the label, which delivery-flow-guide.md says to re-derive rather than accept.
  - id: UC-28
    title: I turn a review into something I can send to a person who does not have Snapdown
    actor: Reviewer
    component: bundle
    satisfies: [FR-39]
    critical: false
  - id: UC-29
    title: I fix a typo in a review I have already put together
    actor: Reviewer
    component: bundle
    satisfies: [FR-40]
    critical: false
  # --- settings ---------------------------------------------------------------------
  - id: UC-13
    title: I decide how much picture quality a screenshot is worth
    actor: Reviewer
    component: settings
    satisfies: [FR-5]
    critical: false
  - id: UC-14
    title: I decide where my screenshots are kept
    actor: Reviewer
    component: settings
    satisfies: [FR-16]
    critical: false
  - id: UC-15
    title: I change the keys that set Snapdown off, because one of them clashes
    actor: Reviewer
    component: settings
    satisfies: [FR-17]
    critical: false
  - id: UC-16
    title: I have Snapdown ready the moment I sign in
    actor: Reviewer
    component: settings
    satisfies: [FR-18]
    critical: false
  # UC-24..UC-26 added 2026-08-23 for CAP-9. None is `critical`: the surface itself touches no money,
  # no personal data, and nothing irreversible. `critical` is not a synonym for `important` — these
  # three are the reason every other use case is reachable, and they are still not critical.
  - id: UC-24
    title: I can tell what I have opened and which part of it I am in
    actor: Reviewer
    component: settings
    satisfies: [FR-27]
    critical: false
  - id: UC-25
    title: I can get to any part of Snapdown from wherever I happen to be
    actor: Reviewer
    component: settings
    satisfies: [FR-28]
    critical: false
  - id: UC-26
    title: I can see everything a screen offers me without hunting for it
    actor: Reviewer
    component: settings
    satisfies: [FR-29]
    critical: false
  # --- agent-access (withdrawn) -------------------------------------------------------
  # UC-17 "I let the agent in front of me read my reviews" (satisfies FR-19), UC-18 "I read a
  # review from inside my agent instead of pasting it in" (satisfies FR-20, FR-21), and UC-19 "I
  # take the agent's access away again" (satisfies FR-22) stood here, all `component: agent-access`,
  # until 2026-09-04. `DEC-016` withdrew all three along with the component and the FRs they
  # satisfied. None of the three ids is reused.
  # --- sharing ----------------------------------------------------------------------
  - id: UC-20
    title: I put a review somewhere the agent on my server can reach it
    actor: Reviewer
    component: sharing
    satisfies: [FR-23]
    critical: true
  - id: UC-21
    title: I read a review that was put up for me, from a machine that has nothing else on it
    actor: Remote coding agent
    component: sharing
    satisfies: [FR-24]
    critical: false
  - id: UC-22
    title: I take a published review back off the internet
    actor: Reviewer
    component: sharing
    satisfies: [FR-25]
    critical: false
  - id: UC-23
    title: I check whether a review of mine is still readable from outside
    actor: Reviewer
    component: sharing
    satisfies: [FR-26]
    critical: false
