[package]
name = "snapdown-capture"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
snapdown-core = { path = "../snapdown-core" }
xcap = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
image = { workspace = true, features = ["png"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_System_Com"] }
